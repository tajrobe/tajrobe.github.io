description: "من مشاور یکی از چندین [تقریب: ۲۰۰] کارگر کارخانه‌ی سام یراق صنعت (گروه مصلحی) هستم که بعلت نبود برنامه، درآمد و متعاقباً عدم پرداخت حقوق، مجبور به تسویه‌ حساب شدند. صندوق پیشنهاد و انتقاد کارخانه پر از نامه‌های شکایت ایشان از مدیرهای ارشد به رئیس/صاحب شرکت بود. اخیراً یکی از پسران حاجی به ایران بازگشته‌ است و برای مدیریت امور و گرفتن اختیار تلاش می‌کند. از کارمندان قدیم دفتر پرس‌وجو شد گفتند پسر دوم -دومین آ از 3A- هم نامه‌ها را بررسی نکرده است و به نظر می‌رسد در وضع حالِ مجموعه به‌زودی تغییر اتفاق نیفتد چون آ. م. شدیداً گرفتار قدرت‌گیری از حاجی پدرش است. گفته شده است که بعلت رفتارهای نسنجیده و خلق‌وخوی تند، پدرشان به او اعتماد کافی ندارد. \r\nمخلص کلام شرکت‌هایی که خانوادگی اداره شوند و کار و روابط را مخلوط کنند پایدار نیستند. "
