description: "به‌عنوان کسی که چهار سال به‌عنوان کارشناس فروش در واحد خیلی سبز فعالیت کرده‌ام، اگر بخواهم صادقانه صحبت کنم، می‌توان ساعت‌ها، روزها و ماه‌ها درباره ضعف‌های این مجموعه نوشت. اما مسئله اصلی چیزی فراتر از ضعف‌های معمول یک سازمان است: بی‌فرهنگی مطلق در مجموعه‌ای که خود را متعلق به یک محیط فرهنگی می‌داند.\r\nآنچه بیش از هر چیز به چشم می‌آید، ضعف جدی و غیرقابل‌انکار در مدیریت واحد است. وقتی سرپرست یک واحد به خود اجازه فحاشی می‌دهد و در عین حال به‌صورت سیستماتیک از حمایت رفاقتی مدیر واحد برخوردار است، دیگر نمی‌توان اسم آن را صرفاً «اشتباه مدیریتی» گذاشت؛ این یعنی ساختار مدیریتی اساساً در ایجاد یک محیط سالم و حرفه‌ای ناتوان است.\r\nشایسته‌سالاری نیز عملاً جای خود را به روابط، چاپلوسی و بله‌چشم‌گویی داده است. در چنین سیستمی هرچه توانایی، مهارت و عملکرد واقعی شما بیشتر باشد، لزوماً شانس بیشتری برای پیشرفت ندارید؛ گاهی حتی برعکس است. ظاهراً کسانی که بیشتر تأیید می‌کنند، کمتر سؤال می‌پرسند و همیشه «بله» می‌گویند، مسیر ساده‌تری برای گرفتن ترفیع دارند.\r\n\r\nفضای مسموم میان مدیر و کارمند، و به تبع آن میان خود کارکنان، یکی دیگر از مشکلات جدی این مجموعه است. در چنین محیطی، به جای اینکه افراد برای رشد مجموعه کنار یکدیگر باشند، زیرآب‌زدن و تخریب یکدیگر تبدیل به بخشی از فرهنگ کاری می‌شود.\r\nاینجا یک سؤال بسیار ساده اما جدی مطرح است:\r\nچرا یک واحد مشخص باید در طول تنها یک سال حداقل ۱۵ نفر از کارکنان خود را از دست بدهد؟\r\nوقتی تعداد قابل توجهی از نیروها در یک بازه زمانی کوتاه از یک واحد خارج می‌شوند، شاید بهتر باشد به جای اینکه همیشه از «نیروی انسانی ناکارآمد» صحبت کنیم، یک‌بار هم عملکرد مدیران و ساختار مدیریتی را زیر سؤال ببریم. خروج گسترده نیروها می‌تواند نشانه‌ای جدی از وجود یک مشکل عمیق در محیط کار باشد، نه صرفاً نارضایتی چند کارمند.\r\n\r\nو البته ماجرا به اینجا ختم نمی‌شود.\r\nآپارتاید سازمانی همچنان برقرار است. از کارکنان انتظار اضافه‌کاری وجود دارد، اما خبری از پرداخت واقعی و منصفانه اضافه‌کاری نیست. پنجشنبه‌ها که تعطیل‌کاری محسوب می‌شود، گویی قرار است کارکنان صرفاً «در راه رضای خدا» مشغول به کار باشند. مأموریت شهرستان هم بخشی از وظایف کاری محسوب می‌شود، اما ظاهراً پرداخت متناسب با آن چندان اهمیتی ندارد.\r\nتمام این موارد وقتی در کنار یکدیگر قرار می‌گیرند، تصویری کاملاً متفاوت از یک «مجموعه فرهنگی» ارائه می‌دهند؛ تصویری از محیطی که در آن احترام به نیروی انسانی، شایسته‌سالاری، امنیت روانی و حتی ابتدایی‌ترین اصول یک محیط کاری سالم، قربانی روابط و ضعف مدیریتی شده است.\r\n\r\nچهار سال حضور در این مجموعه به من نشان داد که اسم و اعتبار یک برند، لزوماً به معنای حرفه‌ای بودن فضای کاری آن نیست. ممکن است یک مجموعه در ظاهر فرهنگی و معتبر باشد، اما در درون خود با مشکلات جدی مدیریتی و فرهنگی دست‌وپنجه نرم کند.\r\nو در نهایت، مهم‌ترین چیزی که می‌توانم به کسی که قصد ورود به چنین محیطی را دارد بگویم این است:\r\nهیچ عنوان شغلی، هیچ حقوقی و هیچ اسم بزرگی ارزش این را ندارد که برای حفظ آن، کرامت انسانی خودتان را نادیده بگیرید.\r\nحفظ عزت، احترام و کرامت انسانی، بسیار باارزش‌تر از کار کردن در محیطی است که افراد نالایق می‌توانند به واسطه روابط و چاپلوسی پیشرفت کنند و نیروهای توانمند، صرفاً به دلیل شایسته بودن، مسیر دشوارتری پیش روی خود ببینند."
