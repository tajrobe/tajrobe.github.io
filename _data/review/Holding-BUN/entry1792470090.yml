description: "تجربه دو سال همکاری با هلدینگ بان؛ نقاط قوت، چالش‌ها و چیزهایی که یاد گرفتم\r\n\r\nتجربه من از هلدینگ بان به حدود دو سال همکاری با این مجموعه برمی‌گرده. مثل هر سازمان دیگه‌ای، بان هم نقاط قوت و ضعف خودش رو داشت؛ تجربه‌ای که هم فرصت رشد زیادی برام ایجاد کرد و هم باعث شد از نزدیک با بعضی از چالش‌های ساختاری سازمان‌ها آشنا بشم.\r\n\r\nتصمیم گرفتم تجربه‌م رو صادقانه به اشتراک بذارم؛ نه با هدف تعریف مطلق از یک مجموعه و نه برای تخریبش، بلکه برای اینکه شاید بتونه به افرادی که قصد همکاری با این هلدینگ رو دارن، دید بهتری بده.\r\n\r\nنقاط قوت هلدینگ بان\r\n\r\n۱. رشد و توجه به بازخورد نیروها\r\n\r\nیکی از نکات مثبت برای من، روند رو به رشد واحد منابع انسانی در طول این دو سال بود. این واحد در موارد مختلف به بازخوردهای کارکنان توجه می‌کرد و در حد اختیارات و امکاناتش برای بهبود شرایط تلاش داشت.\r\n\r\nبرای مثال، در موضوع ایونت‌ها و پک‌هایی که از قبل درباره‌شون توافق شده بود، گاهی کیفیت بعضی از موارد در سطح انتظار نبود؛ اما وقتی بازخوردها منتقل می‌شد، تغییراتی در روند اجرا ایجاد می‌شد.\r\n\r\nالبته به نظرم سرعت رشد و تغییر این واحد، با وجود حضور مدیری باتجربه، می‌تونست بیشتر باشه؛ اما در مجموع، مسیر رو به رشدی رو تجربه کردم.\r\n\r\n۲. نظم در پرداخت‌ها و تسویه‌حساب\r\n\r\nبا وجود شرایط اقتصادی و محدودیت‌های کشور، در بعضی مقاطع پرداخت‌ها به‌صورت دو مرحله‌ای انجام می‌شد، اما در تجربه من، پرداخت‌ها به شکل معوقه‌های طولانی‌مدت درنمی‌اومد. حتی تسویه‌حساب نهایی من هم در زمان مقرر انجام شد.\r\n\r\nبرای من، این موضوع یکی از نقاط قوت مجموعه بود.\r\n\r\n۳. محیطی برای رشد واقعی\r\n\r\nبه نظرم هلدینگ بان از اون مجموعه‌هایی بود که می‌تونه آدم‌ها رو در حین کار رشد بده؛ هم از نظر مهارت‌های تخصصی و هم از نظر تعاملات کاری و اجتماعی.\r\n\r\nالبته تجربه افراد تا حد زیادی به واحدی که در اون فعالیت می‌کنن بستگی داره. من در طول همکاری با این مجموعه، رشد قابل‌توجهی رو تجربه کردم و بخش مهمی از یادگیری‌هام رو مدیون این مسیر هستم.\r\n\r\n۴. درک شرایط شخصی کارکنان\r\n\r\nدر تجربه من، مدیران در بسیاری از مواقع نسبت به شرایط جسمی نامناسب، مسائل رفت‌وآمد و درخواست‌های مرخصی انعطاف نشون می‌دادن. این موضوع می‌تونست به ایجاد فضای کاری انسانی‌تر کمک کنه.\r\n\r\n۵. امکان یادگیری و توسعه فردی\r\n\r\nفرصت شرکت در دوره‌های آموزشی موردنیاز، در کنار کار کردن با افرادی که هرکدوم در حوزه خودشون تجربه و وزن حرفه‌ای داشتن، از بخش‌های ارزشمند این تجربه بود.\r\n\r\nچالش‌ها و نقاط قابل بهبود\r\n\r\n۱. پررنگ بودن روابط در بعضی تصمیم‌ها\r\n\r\nیکی از چالش‌هایی که در تجربه من وجود داشت، این بود که در بعضی موقعیت‌ها روابط بر ضوابط اولویت پیدا می‌کرد. از طرف دیگه، ارتقای رسمی جایگاه شغلی مسیر ساده‌ای نداشت.\r\n\r\nمواردی رو می‌دیدم که افراد با عنوان کارشناس، مسئولیت‌هایی در سطح مدیران میانی بر عهده داشتن؛ اما عنوان شغلی و جایگاه رسمی‌شون با سطح مسئولیت‌هاشون هم‌خوانی نداشت.\r\n\r\n۲. نبود مذاکره فردی در تعیین افزایش حقوق\r\n\r\nدر تجربه من، افزایش حقوق ابتدای سال بیشتر بر اساس سیاست‌های داخلی سازمان تعیین می‌شد و فضای مشخصی برای مذاکره فردی درباره میزان افزایش حقوق وجود نداشت.\r\n\r\nبه نظرم توجه بیشتر به عملکرد، سطح مسئولیت و ارزش‌آفرینی هر فرد می‌تونه به ایجاد احساس عدالت و انگیزه بیشتر کمک کنه.\r\n\r\n۳. جابه‌جایی نیروها بین برندها\r\n\r\nیکی دیگه از چالش‌ها، جابه‌جایی افراد بین برندهای مختلف بدون مشارکت کافی خود فرد در تصمیم‌گیری بود.\r\n\r\nبه نظرم در چنین تصمیم‌هایی، علاوه بر نیاز سازمان، علاقه، تخصص و مسیر رشد شغلی فرد هم باید در نظر گرفته بشه.\r\n\r\n۴. فاصله حقوقی نامتوازن بین سطوح سازمانی\r\n\r\nیکی از مواردی که برای من قابل‌توجه بود، اختلاف زیاد حقوق بین مدیران و مدیران میانی و در مقابل، فاصله نسبتاً کم حقوق نیروهای سینیور با مدیران میانی بود.\r\n\r\nالبته تفاوت حقوق بر اساس مسئولیت و سطح تصمیم‌گیری طبیعیه؛ اما به نظرم این ساختار باید به شکلی باشه که رشد تخصصی و پذیرش مسئولیت‌های بیشتر هم از نظر مالی ارزشمند باقی بمونه.\r\n\r\nدر نهایت، هلدینگ بان برای چه افرادی مناسبه؟\r\n\r\nاگر بخوام بر اساس تجربه شخصی خودم جمع‌بندی کنم، فکر می‌کنم این مجموعه برای سه گروه می‌تونه انتخاب مناسبی باشه:\r\n\r\n۱. افرادی که به دنبال رشد هستند.\r\n\r\nاگر می‌خواید در یک محیط نسبتاً باثبات، مهارت‌های تخصصی‌تون رو تقویت کنید، مهارت‌های نرم رو توسعه بدید و در کنار افراد باتجربه یاد بگیرید، بان می‌تونه فرصت‌های ارزشمندی براتون ایجاد کنه.\r\n\r\n۲. افراد متخصصی که در مذاکره دست بالاتری دارند.\r\n\r\nاگر تخصص یا مهارت‌هایی دارید که برای مجموعه ارزشمند و موردنیازه، بهتره در زمان مذاکره برای همکاری، از این مزیت استفاده کنید و درباره حقوق، امکانات، مزایا و سایر شرایط مالی، با اعتمادبه‌نفس بیشتری مذاکره کنید. سعی کنید پیشنهاد نهایی تا حد امکان متناسب با تخصص، تجربه و ارزشی باشه که ایجاد می‌کنید.\r\n\r\n۳. افرادی که ارتباطات خوبی در مجموعه دارند! 😂\r\n\r\nخب، بیایید تعارف رو کنار بذاریم؛ در خیلی از سازمان‌ها، ارتباطات می‌تونه مسیرها رو هموارتر کنه. بان هم از این قاعده کاملاً مستثنا نیست؛ هرچند به نظرم بهتره این ارتباطات در کنار شایستگی و عملکرد معنا پیدا کنن، نه جایگزین اون‌ها.\r\n\r\nجمع‌بندی\r\n\r\nهلدینگ بان برای من تجربه‌ای با نقاط قوت و ضعف بود. جایی که در اون یاد گرفتم، رشد کردم و با آدم‌های ارزشمندی کار کردم؛ اما در عین حال، با چالش‌هایی در زمینه مسیر ارتقای شغلی، نظام جبران خدمات و مشارکت کارکنان در تصمیم‌های مرتبط با خودشون هم مواجه شدم.\r\n\r\nطبیعتاً تجربه شخصی من لزوماً تجربه تمام افرادی نیست که در واحدها و برندهای مختلف این هلدینگ فعالیت می‌کنن.\r\n\r\nبه نظرم هیچ سازمانی رو نمی‌شه صرفاً خوب یا بد دونست؛ مهم اینه که بدونیم اون سازمان، با شرایط و اهداف حرفه‌ای ما تناسب داره یا نه."
