description: "من فقط تا مرحله مصاحبه پیش رفتم اما چیزی که برام خیلی جالب بود برخورد فوق العاده خوب و صمیمی خانمی بود که منابع انسانی بودن.پشت تلفن مثل مجریهای تلویزیونی حرف میزدن و تو جلسه مصاحبه و بعد از اون خیلی خوب برخورد کردن.\r\nراستش حیفم اومد که اینقدر از منابع انسانی بد گفتن.به نظرم اچ آر هم یه واحد توی سازمانها هست که مثل بقیه واحدها سیاست گذاریهاش توسط هیئت مدیره انجام میشه.من بیش از دوازده ساله توی شرکتها کار میکنم و واقعا چنین برخورد خوب و حرفه ای هیچ جا ندیدم.برای این خانم و همکارانشون موفقیت آرزو میکنم‌.شماها فضای کار رو قابل تحمل و دوست داشتنی میکنین."
