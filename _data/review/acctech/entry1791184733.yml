description: "\r\nمن تا حالا با اک تک کار نکردم و فقط فرآیند مصاحبه رو طی کردم،اول از همه اینکه خیلی زودتر از انتظارم بهم زنگ زدن،وقتی رفتم اونجا قشنگ حس می کردم مهمونم اینقدر بهم احترام گذاشتن و نهایتا هم خانمی که از روز اول از تیم منابع انسانی با من در ارتباط بود بهم پیشنهاد داد که اگه دوست دارم باهاشون کار کنم مطالعه کنم و دوباره بیام مصاحبه.این خیلی حس خوبی بهم داد و دوست داشتم تشکر کنم."
