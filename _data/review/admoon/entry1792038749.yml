description: "\r\nمن تا حالا همچین حیات وحشی رو ندیدم تو زندگیم که در ادمون دیدم . بشدت پلشت ،کدی و لو لول بودن . فوق العاده بیتربیت و بی شخصیت .در حدی که معمولا مجبور بودن دوست و رفیقاشونو که شبیهشون باشن بیارن داخله قبیله بدویشون. انسان نرمال سر چند روز فرار میکرد. با کسایی که جزو قبیلشون نبودن رفتارهایی میکردن که غیر قابل باوره …. مشکلاته بهداشتیه خیلی شدید داشتن …من بازش نمیکنم که حالتونو بهم نزنم و‌از عمد هم میکردن!\r\nاز نظر سواد هم همه بشدت ازشون تو مارکت بد میگن و مسخرشون میکنن یه سرچ کنید دستتون میاد .هیچ تخصصی ندارن .من‌ اونجا یدونه متخصص ندیدم. اگر تجربه الان رو داشتم منم مث بقیه یک‌ روزه ازین قبیله فرار میکردم ."
