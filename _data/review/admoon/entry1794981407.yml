description: "با اینکه مدت زیادی گذشته،هنوزم وقتی یادم می‌افته کنار این موجودات کار کردم، واقعا حالم به هم می‌خوره . واقعاً هنوزم نمی‌فهمم چطور یه محیط کاری می‌تونه تا این حد چندش‌آور و مسموم باشه.\r\n\r\nتوالت همیشه غرق در کثافت بود. نه نظافتی، نه رعایتی، نه حتی شعور اینکه بعد استفاده باید از آب استفاده بکنی ! ولی شاهکارشون فقط این نبود. تو مدتی که اونجا بودم، عمداً شلنگ رو تا ته می‌زدن تو مدفو…ون و بعد با قیافه حق‌به‌جانب می‌اومدن بیرون و پشت سر میگفتن کار نیروی خارج باندشونه. یه نمایش کثیف و احمقانه که تا زمانه فرارکردنه نیرو ادامه داشت. تصور کنید آدم‌هایی که باید حواسشون به کارشون باشه چقدر بیکار و بی‌خاصیت و گرفتار عقده‌های خودشونن که برای حذف یه همکار به چنین کثافت‌کاری‌هایی متوسل می‌شن!\r\n\r\nیه یارو هم اونجا بود که هنوزم معلوم نیست دقیقاً چه غلطی تو اون شرکت می‌کرد و اصلاً وظیفه‌اش چی بود. از وقتی من به تعارض تو این شرکت خورده بودم و قصد خروج داشتم نه تنها هر روز توهین می‌کرد و  کلا به هر کسی که جزو باند نبود بی احترامی میکرد که جلوی من از عمد دست تو دماغ و خشتکش می‌کرد!\r\n\r\nیه سرپرست جونیورم گذاشته بودن اونجا با یکسال سابقه تو زمینه کاریش که واقعاً نمونه کامل وقاحت، عقده‌ای بودن و سوءاستفاده از موقعیتش بود. نه‌تنها کارهای مربوط به سایت شخصیش رو هم من انجام می‌دادم تو خونه، بلکه با نهایت پرویی و اعتمادبه‌نفس می‌گفت: «حق نداری از این شرکت بری، وگرنه دیگه نمی‌تونی هیچ‌جا سر کار بری!» انگار خودشون رو صاحب اختیار زندگی و آینده شغلی دیگران هم می‌دونستن\r\n\r\nمدیر شرکت هم یک پخمه واقعی که خودش از همین جنس بود و اونجا هر رفتار و اتفاقی بیفته با این سبک مدیریت عجیب نیست قانون نانوشته مجموعه این بود که اگه از یه نفر خوشتون نمیاد یا دچار تعارض شدید، به‌جای اینکه مثل آدم برخورد کنید، اون‌قدر براش جهنم بسازید تا خودش خسته بشه !\r\n\r\nو نکته اینجاست که این فقط تجربه من نبود. نیروهای مختلف، در زمان‌های مختلف، تجربه‌های مشابهی از این مجموعه داشتن. پس این وضعیت اختلاف شخصی یا چند تا برخورد اتفاقی نیست. وقتی یه رفتار بارها و بارها از طرف آدم‌های مختلف و در دوره‌های زمانی متفاوت تکرار می‌شه، دیگه اسمش اتفاق نیست؛ یه الگوی کثیف و ریشه‌دار تو فرهنگ اون مجموعه‌ست \r\n\r\nهنوزم فکر کردن به اینکه یه مدت از عمرم رو تو چنین محیطی و کنار چنین آدمایی گذروندم و باهاشون معاشرت کردم !! حالم رو به هم می‌زنه"
