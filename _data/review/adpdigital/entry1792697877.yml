description: "اگه می‌خواید کار نکنید این شرکت بهترین جا برای این کاره اگه رابطه داشته باشید با مدیرهای شرکت که تا آخر عمر حقوق مفت میگیرید. انقد شرکت مزخرفیه که نگم براتون.\r\nتقریبا هیچ پیشرفتی وجود نداره کلا منابع انسانی نداره، یکی هست اونجا هر جا مدیر نباشه اون رو میذارن مدیر. مدیر تیم فنی و مدیر امنیت حتی دانشگاه نرفتن انقد اونجا روابط مهمه. شاید بگید تحصیلات مهمه و سابقه کاری خفنی دارن ولی اونم ندارن. تنها جایی که پیشرفت شغلی داشتن اینجاست.\r\n\r\nهمه چیز به غیر حرفه‌ ای ترین حالت ممکن داره اداره میشه من حتی پیشنهاد نمیکنم از این شرکت برای ارسال پیامک استفاده کنید. رسما دارن به صورت غیرقانونی از اطلاعات مردم تو پیامک ها استفاده میکنن تا پیامک تبلیغاتی رو به صورت گرونتر بفروشن توسط شرکت زیر مجموعه شون.\r\n\r\nتنها خوبی که اینجا داره جای پارکه و بیمه و بیمه بیکاری. همینطور امکان داره بتونید دورکاری بگیرید. به جز اینا هیچ ویژگی مثبت دیگه ای نداره، اگه یکی از مدیرها بخواد چکت کنه به صورت خیلی زیرپوستی چک میکنن شما رو با دوربین و میکروفون و حتی دسترسی به سیستم.\r\nمن آتیه داده پرداز رو به دشمنم هم پیشنهاد نمیکنم"
