description: "«حدود ۲۰ نفر، نزدیک به چهار ماه، دنبال حقوق و مطالباتشان بودند.\r\n\r\nهر هفته یک جواب تکراری می‌شنیدند:\r\n«این هفته پرداخت میشه.»\r\n«فقط یکم دیگه صبر کنید.»\r\n\r\nاما هفته بعد می‌رسید و خبری از پول نبود.\r\n\r\nاین پایان همکاری من و خیلی از همکارانم با AInfluencer بود.\r\n\r\nالبته داستان از اینجا شروع نشد.\r\n\r\nمن وقتی وارد شرکت شدم، مثل هر آدم دیگری که یک موقعیت شغلی جدید را شروع می‌کند، فکر می‌کردم قرار است در یک محیط حرفه‌ای کار کنم؛ جایی که بتوانم رشد کنم و حداقل بابت حقوق و امنیت شغلی نگرانی نداشته باشم.\r\n\r\nاما کم‌کم همه‌چیز تغییر کرد.\r\n\r\nاز همان ابتدا، نحوه مدیریت شرکت برای من عجیب بود. در تجربه من، مدیرعامل، سایرس، در تصمیم‌های تخصصی مارکتینگ و توسعه نرم‌افزار دخالت زیادی داشت؛ تصمیم‌هایی که گاهی مرتب تغییر می‌کردند و نتیجه‌شان بیشتر بی‌نظمی و فشار روانی بود.\r\n\r\nصحبت از اخراج کارکنان آن‌قدر زیاد شده بود که به مرور، تقریباً هیچ‌کس احساس امنیت شغلی نمی‌کرد.\r\n\r\nبعد، شرایط کشور بحرانی شد و جنگ و قطعی گسترده اینترنت شروع شد.\r\n\r\nحتی در آن شرایط هم از کارکنان انتظار می‌رفت کار را ادامه دهند.\r\n\r\nاما بعد از این دوره، تعداد زیادی از کارکنان کنار گذاشته شدند؛ در حالی که حقوق معوقه، عیدی، سنوات و سایر مطالباتشان هنوز پرداخت نشده بود.\r\n\r\nبرای خیلی‌ها، ماجرا فقط از دست دادن شغل نبود؛ ماه‌ها جنگیدن برای پولی بود که بابت کاری که انجام داده بودند باید دریافت می‌کردند.\r\n\r\nیکی دیگر از چیزهایی که برای من بسیار عجیب بود، استفاده اجباری از TopTracker روی لپ‌تاپ شخصی بود. لپ‌تاپ کاری در اختیار کارکنان قرار نمی‌گرفت و هزینه‌ای هم بابت استفاده از سیستم شخصی پرداخت نمی‌شد، اما نرم‌افزار به‌صورت دوره‌ای از صفحه نمایش اسکرین‌شات می‌گرفت.\r\n\r\nحتی گفته می‌شد تعداد اسکرین‌شات‌ها یا درست کار نکردن برنامه می‌تواند روی میزان پرداختی تأثیر بگذارد.\r\n\r\nبرای من، این دیگر حس یک محیط کاری حرفه‌ای را نداشت؛ بیشتر شبیه محیطی بود که باید دائماً ثابت می‌کردی واقعاً داری کار می‌کنی.\r\n\r\nو شاید تلخ‌ترین قسمت، پایان ماجرا بود.\r\n\r\nبه جای اینکه مدیران مستقیماً پاسخگوی کارکنانی باشند که ماه‌ها منتظر مطالباتشان بودند، ارتباطات عمدتاً از طریق افراد دیگر انجام می‌شد و در نهایت ارتباط برخی کارکنان قطع و حتی شماره‌هایشان توسط شخصی که استخدام شده بودند که خواهر زاده خود سایرس باشه (پرور) بلاک شد. در اخر متوسط به شخصی که مثلا مدیر مارکتینگ  (س.ف) اونجا بود ولی هیچی از مارکتینگ بلد نبود متوسل می‌شدند برای رد و دل کردن پیام.\r\n\r\nدر پایان، اکثر اعضای تیم شرکت را ترک کردند؛ بسیاری در حالی که هنوز بخشی از مطالباتشان را دریافت نکرده بودند.\r\n\r\nبه همین دلیل اگر امروز کسی از من بپرسد «آیا همکاری با AInfluencer را پیشنهاد می‌کنی؟»، بر اساس تجربه شخصی خودم جوابم نه است."
