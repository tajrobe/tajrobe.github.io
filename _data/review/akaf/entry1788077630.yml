description: "من تجربه همکاری به‌صورت ریموت با این مجموعه رو داشتم و در مجموع، شرایط برای کار ریموت حداقل مناسب بود. تسک‌ها از طریق Linear ثبت و پیگیری می‌شدن و تایم‌شیت روزانه هم بررسی می‌شد. ساعت‌ها با Time Doctor ثبت می‌شد، ولی حساسیت خیلی زیادی روی ثبت دقیق ساعت‌ها وجود نداشت.\r\n\r\nاگر تسک‌های روزانه طبق تایم‌شیت به‌موقع تحویل داده می‌شدن و حداقل حدود ۶ ساعت کار ثبت شده بود، ۸ ساعت کامل در نظر گرفته می‌شد. اما اگر تسک‌ها به نتیجه نمی‌رسیدن، فقط همان میزان ساعتی که ثبت شده بود محاسبه می‌شد و در صورت نیاز، باید کم‌کاری روزهای قبل در روزهای بعد جبران می‌شد.\r\n\r\nمدل کاری به این شکل بود که هر روز باید خروجی مشخصی تحویل می‌دادی و تقریباً هر روز هم با مدیر فنی در مورد کارها سؤال و جواب داشتی."
