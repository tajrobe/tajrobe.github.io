description: "چند سال در این مجموعه کار کردم؛ از زمانی که برند «زپ اکسپرس» بود تا دوره‌ای که با «الوپیک» ادغام شد. بنابراین چیزی که می‌نویسم صرفاً یک برداشت کوتاه‌مدت نیست و بر اساس تجربه مستقیم از بخش‌های مختلف این سازمان است.\r\n\r\nمتأسفانه یکی از بزرگ‌ترین مشکلات مجموعه، ضعف جدی در ساختار منابع انسانی است. از همان روز اول، فرآیند ورود و معرفی نیروی جدید بسیار غیرحرفه‌ای است و در بسیاری از موارد فرد عملاً بدون آموزش و برنامه مشخص وارد واحد می‌شود. بخشی از مواردی که در آگهی‌های استخدامی اعلام می‌شود نیز در عمل با چیزی که تجربه می‌کنید تفاوت دارد؛ از شرایط رفاهی گرفته تا نحوه محاسبه حضور و غیاب، کسرکار و سایر موارد.\r\n\r\nمشکل فقط HR نیست. در بخش قابل توجهی از مدیریت، چیزی که بیشتر از تخصص و شایستگی به چشم می‌آید، روابط، رفاقت و نزدیکی به افراد خاص است. متأسفانه گاهی این تصور ایجاد می‌شود که مسیر پیشرفت بیشتر از آنکه به عملکرد، دانش و نتیجه کار وابسته باشد، به ارتباطات وابسته است.\r\n\r\nجلسات متعدد برگزار می‌شود، اما بسیاری از آنها خروجی مشخصی ندارند و تصمیم‌ها و ایده‌هایی مطرح می‌شود که نشان می‌دهد فاصله‌ای جدی بین جایگاه مدیریتی و دانش و تجربه واقعی وجود دارد. گاهی اعتمادبه‌نفس افراد بسیار بیشتر از دانش و توانایی مدیریتی آنهاست.\r\n\r\nاز طرف دیگر، در بعضی واحدها نوع برخورد با کارکنان به شکلی است که به جای ایجاد انگیزه، باعث فرسودگی و کاهش اعتمادبه‌نفس افراد می‌شود. حتی ایده‌ها و پیشنهادهای خوب هم همیشه فرصت واقعی برای اجرا یا دیده‌شدن پیدا نمی‌کنند.\r\n\r\nنکته عجیب اینجاست که نیروهای توانمندی در این مجموعه حضور داشته‌اند که بعد از خروج، در شرکت‌ها و برندهای معتبر به جایگاه‌های بسیار خوبی رسیده‌اند؛ موضوعی که شاید نشان دهد مشکل همیشه از خود نیروی انسانی نیست، بلکه گاهی ساختار سازمانی توان استفاده درست از افراد توانمند را ندارد.\r\n\r\nدر شرایط فعلی نیز با توجه به وضعیت مالی مجموعه، کاهش یا حذف برخی خدمات و مزایا و همچنین تأخیر در پرداخت‌ها، فشار بیشتری به کارکنان وارد شده است. وقتی یک سازمان از کارکنانش انتظار عملکرد بالا دارد، طبیعی است که در مقابل باید ثبات، احترام، شفافیت و امنیت شغلی هم ایجاد کند.\r\n\r\nدر مجموع، تجربه من از این مجموعه این بود که اگر به دنبال محیطی برای رشد واقعی، یادگیری، شنیده‌شدن و پیشرفت بر اساس شایستگی هستید، بهتر است قبل از ورود، حتماً درباره فرهنگ سازمانی و تجربه کارکنان فعلی و سابق تحقیق کنید.\r\n\r\nاین نقد از روی کینه یا عصبانیت نوشته نشده؛ اتفاقاً حاصل چند سال تجربه است. امیدوارم روزی این مجموعه به جایی برسد که همان اندازه که برای برند و اعداد و KPI اهمیت قائل است، برای آدم‌هایی که این اعداد را می‌سازند هم ارزش قائل باشد.\r\n"
