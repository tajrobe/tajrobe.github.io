description: "به عنوان کسی که چندین سال در این شرکت به عنوان برنامه نویس مشغول به کار بودم بنظرم یکی از کثافت ترین جاهایی که میتونید مشغول به کار شید اینجاست. مهمترین مشکل اون مدیر عامل خودشیفته و کنترل گرشه. این شرکت (یا همون مدیر عامل) برای پرسنل و کارکنانش کوچکترین ارزش و احترامی قائل نیست و بر خلاف خوش زبانی های ابتدای قرارداد نوشتن، در عمل به هیچ قول و صحبتی وفادار نیست. بارها با نیروهای متخصصش شب تماس گرفته شده و اعلام شده که از فردا سرکار نیایند، با افرادی که از شرکت رفتند و چند سال از رفتنشان میگذره تسویه حساب نشده، تمام کارکنان تمام تایم از طریق دوربین دنبال میشوند. هیچ چیز این شرکتی اصولی نیست و ورود به آن به منزله خداحافظی با اعصاب و روان شخص است. حقوق ها بر خلاف وعده ی ابتدایی ممکنه هر زمانی واریز بشه، ممکنه بنا به صلاح دید مدیرعامل مشمول جریمه و کسری کار بشید، چندین نیرو به بهانه یادگرفتن کار نه بیمه میشوند و نه حقوقی دریافت میکنند. جلسات طولانی و به تعداد زیاد با مدیرعامل خواهید داشت که صرفا یه صحبت یک طرفه و بی سوادانه و تحمیل حرفه. حقوق های بسیار اندک با مسئولیت های بسیار زیاد، به طوری که با حقوق نزدیک به وزارت کار، توسعه دهنده ها باید مدیر محصول باشند، داخل جلسات برای عقد قرارداد ارائه دهنده باشند و صفر تا صد همه پروژه رو پوشش دهند. ایام جنگ و شرایط غیرعادی شرکت نه تنها کوچکترین پشتیبانی نخواهد کرد بلکه حقوق اون ماه و حتی ماهای قبل و بعد را هم نخواهد داد. بارها از شرق تهران به غرب تهران فرستاده خواهید شد که نه مشمول حق ماموریت و نه اضافه کاری خواهید شد. این شرکت با هر جایی که قرارداد بسته به دلیل مشکلات مدیریتی و دخالت های بیجا و اشتباه نتوانسته تحویل پروژه درستی بده و با رانت مدیرعامل وارد پروژه های جدید خواهد شد و  یه پروژه جدید به لیست پروژهای نا تمام شما اضافه خواهد کرد.\r\nیکی از بهترین تصمیمات زندگیم همین خروج از شرکت و شروع جلسات تراپی برای برگردوندن سلامت جسم و روانم است. توی این شرکت نه کاری یاد میگیرید و نه براتون رزومه میشه و نه درآمدی خواهد داشت. "
