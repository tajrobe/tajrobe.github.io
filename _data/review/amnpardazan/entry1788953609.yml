description: "سلام. نظر من از همکاری با امن پردازان کویر این هست که این شرکت محل مناسبی برای کار کردن نیست. مدیریت رسما خودش به مدیرها میگه حقوق بچه ها را بالا ببندین که به خاطر پول مجبور بشن اینجا بمونن. \r\nولی اگر بخواهم دلسوزانه از تجربه کاری خودم بگم، اونجا نظم و برنامه ریزی وجود نداره در نتیجه از لحاظ فنی نسبت به سایر شرکت ها، واقعا رشد کمتری میکنی.\r\nاز لحاظ حواشی، خبرچینی، غیبت، شایعه و خاله زنکی که در حد خیلی افتضاحی هست و اصلا به بدترین وجه ممکن مریض میشی.\r\nاکثر افراد این شرکت فقط تجربه کار توی همین شرکت رو دارن و جای دیگه ای کار نکردند و تجربه ای ندارند و به همین دلیل خودشون رو سنیور و مدیر میبینند.\r\nمحیط عمق نداره و فرسایش در کار بالاست.\r\nاین تجدبه من بود و شاید برای کسی مفید باشه."
cons: 
 - محیط غیر حرفه‌ای
