description: "من مدتی توی این شرکت کار کردم و متأسفانه تجربه‌ ی خوبی ندارم.\r\n\r\nمشکل اصلی از نظر من فقط خود کار یا حجم کار نبود، بیشتر نحوه مدیریت و بی‌نظمی‌هایی بود که کم‌کم آدم رو خسته می‌کرد. خیلی وقت‌ها مشخص نبود دقیقاً مسئولیت هر نفر چیه و بعضی کارها بدون برنامه و در لحظه به آدم محول می‌شد. اولویت‌ها هم مرتب تغییر می‌کرد و ممکن بود روی یک کار وقت بذاری و بعد یکدفعه گفته بشه فعلاً انجامش نده و برو سراغ یه چیز دیگه.\r\n\r\nیکی از چیزهایی که در این مجموعه کاملاً احساس می‌کردم، خانوادگی بودن فضای کاری شرکت بود. بخشی از تصمیم‌ها و روابط کاری تحت تأثیر همین ساختار قرار داشت و از دید من همیشه این حس وجود داشت که همه افراد در یک موقعیت برابر قرار ندارند یا تصمیم‌ها صرفاً بر اساس عملکرد افرا و چارچوب‌های حرفه‌ای گرفته نمی‌شوند. اگر کسی با محیط‌های خانوادگی در شرکت‌ها راحت نیست، به نظرم بهتره قبل از شروع همکاری درباره ساختار مدیریت و نحوه تصمیم‌گیری بیشتر تحقیق کنه.\r\n\r\nاز طرف دیگه، کار واقعاً فرسایشی هست زیرا تغییر مداوم اولویت‌ها، فشار کاری و مشخص نبودن بعضی فرایندها باعث می‌شد بعد از مدتی احساس خستگی دائمی داشته باشی. مسئله برای من صرفاً زیاد کار کردن نبود؛ بیشتر این بود که انرژی زیادی صرف کارهایی می‌شد که می‌شد با برنامه‌ریزی و مدیریت بهتر خیلی ساده‌تر انجامشون داد.\r\n\r\nچیزی که بیشتر من رو اذیت کرد این بود که بین حرف‌هایی که اول همکاری زده می‌شد و چیزی که در عمل اتفاق می‌افتاد فاصله وجود داشت. انتظار زیادی از نیرو وجود دارد ولی در مقابل، وقتی مسئله یا انتقادی مطرح می‌کردی لزوماً احساس نمی‌کردی کسی واقعاً دنبال حل کردنش باشه و بدتر باعث میشد که ازت کینه به دل بگیرند.\r\n\r\nفضای کاری هم خیلی وابسته به تصمیم افراد بود تا یک روند مشخص. بعضی وقت‌ها یک موضوع برای یک نفر مشکلی نداشت ولی برای شخص دیگه تبدیل به مسئله می‌شد و همین باعث می‌شد آدم ندونه دقیقاً باید بر اساس چه قاعده‌ای کار کنه.\r\n\r\nدر مجموع اگر کسی قصد داره اینجا شروع به کار کنه، پیشنهاد می‌کنم قبل از قبول پیشنهاد حتماً درباره شرح وظایف، ساعت کاری، اضافه‌کاری، شرایط قرارداد، حقوق و مزایا، ساختار مدیریتی و اینکه تصمیم‌ها در شرکت چطور گرفته می‌شن خیلی شفاف سؤال کنه و فقط به توضیحات کلی جلسه مصاحبه اکتفا نکنه.\r\n\r\nاین تجربه شخصی من از مدتی بود که در این مجموعه کار کردم و طبیعتاً ممکنه تجربه بقیه متفاوت باشه."
