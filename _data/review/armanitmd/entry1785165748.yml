description: "در مدت بسیار کوتاهی که در شرکت آرمان بود چیزایی دیدم که تا حالا توی عمرم ندیده بودم و میتونم بگم بدترین تجربه کاریم بود.\r\nشخصی مدیرعامل این شرکت شده که همونطور که خودش با رابطه اومده یه سری پادو و گماشته رو هم با خودش آورده که در میزان شعور و فهم از خودش بدترن.\r\nجالبه که این شرکت هیچگونه پروژه فعالی نداره و مدیرعاملش از روی بیکاری پروژه های من درآوردی تعریف میکنه و همش هم میگه این پروژه در دنیا تکه ، ما نباید اطلاعاتی به کسی بدیم و همه رو هم توی فشار میزاره که سریع انجام بدن و پروژه من درآوردی رو برسونن.جالبه در نهایت همه زحمت میکشن و پروژه فیل میشه  \r\nاین ادم متوهم در همه چیز دخالت میکنه از طراحی و پیاده سازی ، کد و فرانت، یه اکانت چت جی پی تی خریده داره پاااااره میکنه باهاش همه رو.\r\nاین ادم هرجایی بوده انداختنش بیرون و هر جا رفته نسبت به جای قبلی بدتر بوده از پردازشگران سامان تا خدمات تا نگاه بانک کارآفرین و الان هم گویا با اتوبوس مدیرعامل فعلی توسعه صاردات میرن بانک صادرات و یه تپه جدید هم اونجا به رنگ قهوه ای مزین کنن.\r\nاز اقای مدیر عامل هم یه سوال داشتم چرا یه سری در شرکت نیستن و حقوق خیلی عالی هم میگیرن از جمله ***** …. ، *****  \r\nاز دیگر اعجوبه های این شرکت سرکار **** هستن سراسر عقده و یک روان پریش حاد\r\nمن آدمی نمیشناسم که این باهاش دعوا نکرده باشه ، سر مسخره ترین چیزا. توی لینکدین پست میزاره بعد به بچه ها پیام میده و دستور میده که برید لایک کنید و کامنت مثبت و حرفه ای بزارید.\r\nاز سطح سواد و تخصص همینقدر که با کامپیوتر به سختی کار میکنه دیگه چه برسه بخواد کار تخصصی انجام بده .\r\nمن به بو خیلی حساس هستم و این کلا دو تا مانتو داشت یه مشکی و یدونه سرمه ای ،قشنگ بودن و معلوم بود گرون بودن ولی چون متاسفانه اونا رو نمیشست همیشه بوی عرق میداد.\r\nاز همکارا میخواست آمار همکار های دیگه شون بهش بدن ، خیلی وقت ها میاد پشت در فالگوش وامیسته که ببیته کی چی میگه،کلا توهم توطئه داره ، فکر میکنه یکی از غول ها و ستون های صنعت بانکداری در ایرانه ولی یادش میره که هرجا رفته با پارتی رفته و نهایتا یا اخراج شده یا باهاش قطع همکاری کردن.\r\n"
