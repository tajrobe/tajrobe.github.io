description: "من قبل از اینکه دکتر هاشمی‌نژاد به شرکت بیان، اینجا مشغول به کار بودم و شرایط قبل و بعد رو از نزدیک دیدم.\r\n\r\nواقعیت اینه که مشکلات مدیران قبلی به مراتب بیشتر بود. حقوق‌ها در سطح پایینی قرار داشت، پرداخت‌ها با تأخیر و بدون نظم انجام می‌شد، فضای کاری هم به هیچ وجه حرفه‌ای نبود؛ از رفتار نامناسب بعضی از افراد گرفته تا مدیرانی که از نظر اخلاق و برخورد مشکلات جدی داشتن.\r\n\r\nبعد از تغییر مدیریت، بخش قابل توجهی از این مسائل برطرف شد. حداقل تا همین چند ماه اخیر، پرداخت حقوق‌ها منظم بود و کسی دغدغه دیرکرد حقوق نداشت. تأخیر دو سه روزه این مدت هم با توجه به شرایط اقتصادی و وضعیت کشور، موضوعی نیست که فقط مختص این شرکت باشد.\r\n\r\nاز طرف دیگر، الان در خیلی از شرکت‌ها تیم‌های توسعه با کاهش فعالیت یا توقف پروژه‌ها مواجه شده‌اند و تمرکز بیشتر روی پروژه‌های عملیاتی است. بنابراین اگر منصفانه و با نگاه کلی قضاوت کنیم، این شرایط تا حد زیادی قابل درک است.\r\n\r\nالبته این به معنی بی‌نقص بودن مجموعه نیست. از چیزی که خودم دیدم، بدنه بروکراسی بانک در بسیاری از موارد مقاومت زیادی در برابر اجرای پروژه‌های جدید داشت و همین موضوع باعث کند شدن روند پیشرفت می‌شد. از طرف دیگر، به نظر من بعضی از مدیران میانی شرکت هم واقعاً تناسب لازم با جایگاه مدیریتی‌شان را نداشتند و بیشتر از اینکه ارزش افزوده ایجاد کنند، صرفاً هزینه اضافی برای مجموعه بودند.\r\n\r\nبه نظرم بعضی از نقدهایی که اینجا مطرح می‌شود، بیش از حد یک‌طرفه است. انتقاد کردن حق هر کسی است، اما بهتر است منصفانه باشد و همه ابعاد دیده شود، نه فقط نقاط منفی.\r\n\r\nدر نهایت هم بد نیست هر کسی قبل از قضاوت دیگران، از خودش بپرسد آیا نسبت به مسئولیتی که داشته و حقوقی که دریافت کرده، وظایفش را به بهترین شکل انجام داده است یا نه. اگر پاسخ این سؤال مثبت بود، آن وقت انتقادش هم ارزش و اعتبار بیشتری خواهد داشت؛ نه اینکه صرفاً از روی ناراحتی، حسادت یا با مطرح کردن اتهام، دیگران را قضاوت کند.\r\n\r\nپ.ن: این متن صرفاً از نظر نگارشی و ادبی با کمک هوش مصنوعی ویرایش و بازنویسی شده است و محتوای آن کاملاً بیانگر نظر، تجربه و دیدگاه شخصی نویسنده است."
