description: "باز به یکی گفتن حقایق رو زیاد گفتن پاشو برو یه کامنت مثبت بذار \r\n\r\nاولا اون خراب شده دو آپس نداره که این یارو گفته من دو اپس ام، دو آپس تعریف داره \r\nتو دو آپس بودی بالای چهار سال تو اون خراب شده نمی موندی در واقع هیچ جایی راه ات نمی دن که موندی \r\nدوما ببین اوضاع چقدر خراب هست که حقوق به موقع دادن شده آپشنشون که به عنوان یکی از مزیت ها بهش اشاره کرده مهندس دو آپس شرکت، که تا جایی که اطلاع دارم دیگه اون نظم هم تو پرداخت ندارن در واقع هیچ چیز مثبتی ندارن ( اگه بیمه رو حساب کنید بله بیمه می دن ) \r\n\r\nسوما  این مدیر عامل تو کل جلسات حرف های شما رو می زد مهندس دواپس شرکت رو به سود هست رو من نجات دادم و تو مدیر عامل قبلی داغون بود شرکت حالا یه سوال این سود دقیقا از کدام پروژه ای که مدیر عامل فعلا آورده بالا سود کرده دوما این همه تو سود بود تو سود بود پس این تعدیلی ها و عدم سود در پروژه های جدید پس چیه \r\n\r\nچهارما : پاسخ به یه سری جمله ها ( که پاسخ به همش خارج از حوصله این دل نوشته هست )\r\nاز طرف دیگر، الان در خیلی از شرکت‌ها تیم‌های توسعه با کاهش فعالیت یا توقف پروژه‌ها مواجه شده‌اند.\r\nاگه می گی اوضاع بد بوده برای همه بوده خوب چرا ادم هایی که هیچ کارایی ندارن هستن مثل سرکار خانم عنکبوت یا واحدی مثلا پی ام او الان کارایی اینها و یه سری ها هیچ توجیهی نداره ( تستر و فرانت اند و بک اندن و یو آی یو ایکس و کل واحد توسعه محصول تعدیل کرده ولی واحد مدیریت اشون با مدیر هاشون هستن ) البته حتما لازمه ما نمی دونیم\r\nیا نگه داری اون مدیری که اوپن تو ورک شد و بعد یهو حرکت رونالدونیویی می زنه و برمی گرده قطعا که نظرش رو جلب کردن حالا با چرب تر کردن حقوق اش\r\n\r\nالبته این به معنی بی‌نقص بودن مجموعه نیست.\r\nاین جمله رو شنیدید یعنی می خواد کل ایرادات رو با این جمله دور بزنه.\r\n\r\nبدنه بروکراسی بانک در بسیاری از موارد مقاومت زیادی در برابر اجرای پروژه‌های جدید داشت.\r\nخوب این و مدیر عامل نمی دونست پروژه رو می زنن چند سال بعد می فهمن بروکراسی سخت بانک مقاومت زیادی داره\r\n از طرف دیگر، به نظر من بعضی از مدیران میانی شرکت هم واقعاً تناسب لازم با جایگاه مدیریتی‌شان را نداشتند و بیشتر از اینکه ارزش افزوده ایجاد کنند، صرفاً هزینه اضافی برای مجموعه بودند.\r\nخوب مدیر میانی رو کی گذاشته؟ آفرین مدیر عامل ( که اتوبوسی آورده اینها رو ) بعد مدیر عامل چند سال نمی بینه خوب مدیر میانی اینجوری هست چرا عوض  نمی کنه این عوضی ها رو پس یاد اون جمله افتادم مسوولین از مردم ناراضی هستن\r\n\r\nبه نظرم بعضی از نقدهایی که اینجا مطرح می‌شود، بیش از حد یک‌طرفه است. انتقاد کردن حق هر کسی است، اما بهتر است منصفانه باشد و همه ابعاد دیده شود، نه فقط نقاط منفی.\r\nاین جمله هم مثل جمله اول هست، اول سفسطه بعد با یک تعریف غیر مستقیم و مثلا گرفتن طرف مخاطب های منتقد ( کاملا بر حق ) نشان می ده که آره ما خوبیم\r\nبه غیر بیمه و حقوق به موقع ( که الان دیگه نیست ) چی داره\r\n اصلا شرکت دیگه رفتی مهندس دوآپس اصلا یه شرکت واقعی رو از نزدیک دیدی اصلا یه شرکت نیمه داغون رو از ۱۰ کیلومتری اش رد شدی\r\n\r\nپس آقایی که می گی برات کامنت بذارن  نذار دهن بچها باز بشه و حقایقی هایی که نباید رو بزنن  رو بزنن\r\nخلاصه آینه رو نشکن تصحیح کن خودت رو برادر تصحیح\r\n\r\nمهندس دوآپس جامانده از مدیر عامل قبلی و وفادار به مدیر عامل فعلی انقدر فاصله بین جملات نذار یه ذره ادبیات نوشتاری بخون برات خوبه از اون مهم تر انقدر چیز هم نباش دیگه خوب نیست مهندس دو آپس\r\n\r\nحالا بذارید به ذره هم به  سایر جنبه های شرکت برسیم\r\nدر اون خانم مدیر رو هم بگم که سم ترین مدیری هست که تو کل عمرتون می بینید\r\nمنابع انسانی یدونه داشت خانم الف ح که معرف حضور همه هستن شبیه همه چی بود جز منابع انسانی \r\n\r\nانقدر حرف زیاده که اگه ساعت ها بشینم و تایپ کنم تمام نمی شه که نمی شه \r\n"
