description: "تجربه من از همکاری با این مجموعه شبیه فیلمی بود که ژانر آن را اشتباه گرفته بودند؛ فکر می‌کردم دارم توی یک شرکت حرفه‌ای کار می‌کنم، بعد دیدم دارم توی یک تئاتر خانوادگی بازی می‌کنم که مدیر اولشون، هم کارگردان است، هم فیلمبردار، هم بازیگر نقش اول و حتی فروشنده بلیت!\r\n\r\nجالب‌ترین بخشش، مدیران میانی بودند که به نظر می‌رسید سابقه استخدامشان نه از روی رزومه، که از روی دفترچه تلفن مدیر اولشون پر شده بود. هرکدام سواد مدیریتی‌شان به اندازه یک پیامک بود، اما قدرت تصمیم‌گیری‌شان به اندازه یک اخطار رسمی!\r\n\r\nمدیر اولشون آنقدر توی کارهای ریز و درشت دخالت می‌کند که آدم شک می‌کند مگر برای مدیران میانی حقوق تماشا می‌دهند؟!\r\n\r\nخلاصه اگر به دنبال محیطی هستید که مدیریت علمی در آن جایی داشته باشد، اینجا را رد کنید. ولی اگر دوست دارید تجربه کنید که یک تیم چطور با اتکا به رابطه، بدون دانش و تجربه جلو می‌رود، خوش آمدید!"
