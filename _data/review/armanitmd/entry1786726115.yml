description: "***** مدیر محصولی که حتی الفبای محصول رو هم بلد نیست. سالهاست تو این نقش نشسته ولی هنوز فرق بین roadmap و wishlist رو نمیفهمه. هیچوقت نتونسته یه استراتژی محصول واقعی بنویسه فقط بلده تسک بده جلسه الکی بذاره و بعد ادعا کنه من تصمیم گیرنده هستم. دانش محصولش دقیقا همونقدر هست که هر پیام کاری رو اول میده به چت جی پی تی تا بپرسه این داره تخریبم میکنه یا نه. صفر و یکی فکر میکنه یا سیاه یا سفید. وسطی براش وجود نداره. یه جور روان پریشی داره که همه چیز رو تهدید میبینه.\r\nبه جای اینکه از سیستم مدیریت تسک استفاده کنه کارها رو تلفنی پخش میکنه. بعد میگه کاراتون رو هفته به هفته تو اکسل برام بفرستید!\r\n وقتی اکسل میرسید معلوم میشد یکی مثلا دوشنبه تسکی نداشته کلی بحث و دعوا راه مینداخت که چرا دوشنبه بیکار بودی. انگار کارمندا رو کارگر معدن میبینه نه نیروی متخصص.\r\nتوسعه دهندگان و طراحها همه کار رو جلو میبرن ولی ایشون فقط دنبال اینه که بینشون تفرقه بندازه یکی رو علیه دیگری تحریک کنه و بعد خودش رو مدیر دانا نشون بده. عاشق دستوردادنه و اینکه همه خانم مدیر صداش کنن. اگه این خانم تو تیم نبود روند توسعه هم سریعتر بود هم باکیفیتتر. تمام هنر مدیریتیش خلاصه میشه تو این که تو مخ کارمندا باشه و کنترل گری کنه.\r\nپستهای لینکدینش هم که دیگه داستان جداست صددرصد تولید هوش مصنوعی. چون هیچکس توجهی نمیکنه مستقیم میاد سراغ کارمندا و چندبار پشت سر هم میگه آقا خانم منو لایک و کامنت کنید. بعدش هم با حقوق ۱۲۰ تومنی میشینه و به کارمندای کاربلد و حرفه ای که زیر ۳۰ میگیرن نگاه میکنه. عقده ای بدبو از اون آدمایی که هنوز نفهمیده تو محیط حرفه ای بعضی رفتارها و بوها رو باید کنترل کرد و کاملا بیسواد تو حوزه محصول. کار ما و خودش هم تو آرمان تموم شده. امیدوارم تو هیچ شرکت فناوری نره که اونجارو هم به گند نکشه."
