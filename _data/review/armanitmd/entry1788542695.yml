description: "بچه‌ها بیاید یه خاطره بگم از خاطرات مثلا دکتر ( استاد همه چی دون )\r\n\r\n\r\nیه روز این دکتر که تسویه یه خانمی که قبلاً تو BI بود رو نمی داد و هی بهش زور می‌گفت یعنی می کشوند تو اتاق اش و می‌گفت این کامنت ها رو کی می نویسه تا از طریق فشار از طریق مالی ازش استفاده کنه و اون خانومه هم دمش گرم کلاً به مثلاً دکتر یا استاد همه چی دون (سرچ کنید استاد همه چی دون )\r\nتوجه نمی‌کرد خلاص بین دکتر قصه ی ما و خانم . . . . نماینده ی BI درگیری لفظی پیش میاد و دکتر بهش می گه برو بیرون سسسسننندههههه و صداش می ره بیرون و همه می شنون (سطح حرف زدن مدیر عامل شرکت و داشته باش )\r\nحالا این خانم چیکار می کنه نگو داداش داره در حد تیم ملی زنگ می زنه بهش رو داداش هاش می یان شرکت ( اینجا رو مثل ورود داداش های این خانم رو مثل لحظه ی ورود فرمان به دعوا ها تو فیلم قیصر در نظر بگیرید ) ببین یعنی داداشه اومد یه دادی می‌زد و از حق خواهرش دفاع می‌کرد که باید می‌دیدید خلاصه آقای مدیر عامل شانس آورد در اتاق اش قفل بود وگرنه . . . . حالا این وسط چنان داد می‌زد این آقای س ن چنان ترسید که فشار اش افتاده بود( یه ذره مرد باش نترس نمی خوردن ات کوچولو ) همون جا و دکتر و دار و دست اش از ترس شلوارشون رو بله . . . و خلاصه دکتر سریع پول خانم رو که حق مسلم اش بود می ده و خانم هم می ره حالا این وسط چیکار کنن خوبه\r\n\r\nخروج کارمندان حداکثر تا ۸ شب\r\nاخراج دو هفته‌ای نگهبانان شیفت\r\nجمع‌آوری اطلاعات کارمندان گرفتن تعهد نامه‌های کاری و گرفتن آزمایش عدم اعتیاد و گرفتن عدم سو پیشینه ( از کارمندانی که بالای سه سال اونجا بودن ) و کلی کار این تیپی که آقای دکتر تصمیم می گیرن انجام بدن تا از وقوع دوباره ی این کار جلوگیری کنن\r\nاین عکس‌العمل آقای دکتر و دوستان اش در حد کل تصمیماتی بود که همیشه می گیرن\r\n\r\n\r\nپ ن\r\nخلاصه به قول لر ها طرف بعد گو.ی.ن ۴ زانو می شینه\r\n\r\nاین نوشته با کمی چاشنی طنز نوشته شده ولی کاملاً بر اساس واقعیت هست اسم‌های مخفف هم تشابه اسمی اصلاً نیست و کاملاً مخفف هست.\r\n\r\nو در آخر از طراح کاراکتر استاد همه چی دون معذرت می خوام که به این دکتر قلابی نسبت دادم.\r\n\r\n\r\n\r\n"
