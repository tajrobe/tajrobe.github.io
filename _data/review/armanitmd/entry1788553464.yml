description: "یه عده ای قبل دکتر اینجا بودن، زدن شرکت رو داغون کردن، دیگه مونده بود آجرهای شرکت رو هم بخورن منفی پنجاه و سه میلیارد تومان زیان !!!\r\nتا اینکه دکتر اومد و سعی کرد با باقیمونده همونا کارو جلو ببره از سمتی هم تیم های جدیدی برای راه اندازی بانکداری دیجیتال راه انداخت\r\nپروژه بانکداری باز که مدیریت قبلی کل کار رو برون سپاری کرده بود و کلی پولو داده بود ولی یک خط کد تحویل نگرفته بود، یعنی اصلا چیزی نبوده که تحویل بگیره را توی شش ماه کامل کرد و سر یکسال زیر بار بردش که میلیاردی برای بانک و شرکت سود ساخت\r\nتیم دکتر، پروژه های پیشخوان و موبایل بانک را کامل کرد و الانم اماده لانچ هستش، وضعیت مالی شرکت سه سال پیاپی سود ده شد و کل زیان انباشته تیم های قبلی صفر شد، پرداختی های شرکت هر سال بیش از درصد اداره کار توی این سه سال افزایش یافت\r\nقراردادهای شرکت شسته رفته با بانک انجام شد\r\nنمیگیم هیچ اشتباهی نشده، اما دیکته نانوشته هم غلط نداره\r\n\r\nنکته مهمش این بود که همین دکتر ، آبروشو وسط گذاشت و همه آدم های سمی رو پاک سازی کرد\r\nافرادی بودن که فقط دنبال حاشیه بودن، با زیرپیرهن آستین حلقه توی شرکت میگشتن، بلند بلند فحش ناموسی میدادن، بیکار بیکار فقط میگشتن و منابع شرکت رو تلف کرده بودن، حلقه های خانه زنکی داشتن ، مدام دنبال تخریب شرکت بودن\r\nاما دکتر و تیمش همه آدم های سمی رو انداختن بیرون\r\nواسه همینه که توی این پیج اینقد برعلیه ایشون و تیمش مینویسن\r\nعقده هاشونو با هزارتا دروغ میگن، چون دیگه جایی نیست برن دروغ بگن، حاشیه سازی کنن، دو بهم زنی کنن\r\nاینجا شده جایی برای عقده گشاییشون\r\n\r\nرزومه دکتر و تک تک مدیران شرکت مشخصه که کجاها کار کردن و با نوشتن چارتا کامنت مزخرف خدشه ای بهشون وارد نمیشه و قطعا این مدیران هر روز پیشرفت میکنن و شاهد موفقیت هاشون خواهیم بود، چون با عرضه ، تلاشگر و قاطع هستن و با چارتا کامنت ناامید نمیشن و گ تلاششون رو برای تعالی این شرکت انجام میدن و جا نمیزنن ، توی همه شرایط سخت و جنگی کشور توی این شرکت وایسادن و دارن خالصانه کار میکنن\r\n\r\nمن به عنوان فردی که بیش از ۹ سال در این شرکتم، زحمات شبانه روزی شخص خود دکتر که زیر ۸ شب خونه نرفته و چقد برای این شرکت زحمت کشیده و آبروو اعتبارشو گذاشته و تک تک مدیرانی که ایشون آورده و دوستانی که از قبل بودن را دیدم، شرکت متحول شده و روز به روز داره پیشرفت میکنه، \r\nدوستانی که این پیج رو‌ میبینن زیاد کامنت ها رو جدی نگیرن\r\nاز بچه هایی که توی شرکت هستن بپرسن، آمار بگیرن\r\nتا ببینن وضعیت رضایت شرکت از مدیران ارشدشون چیه\r\n"
