description: "\r\n\r\nخوب دوباره کامنت های منفی ( شما بخون واقعی ) اومد و باز دکتر گفت برید کامنت مثبت بذارید\r\n\r\nخوب دوستان بریم به نقد و برررسی مثلاً کامنت واقعی زیر جواب این آقای خ ش ملقب به جناب دستمال شناس رو بررسی کنیم\r\n\r\nنوشته ۵۳ میلیارد ضرر این دقیقاً از کجا می یاد این ارقام چه مدرکی هست که قبل دکتر شرکت ورشکست بوده و الان سود ده هست ( حداقل تعدیلی نداشت پس ظاهرا کذبه ) والله آخرین باری که یادم هست خیلی‌ها رو دو تو دو مرتبه تعدیل کرد که پروژه ها رو بانک نمی خواد مقصر این موضوع شخصی نیست جز دکتر که پروژه رو بانک نمی خواد. خوب این همه مدت رو چیکار می‌کردی آقای دکتر به جای دخالت تو تک تک تسک های ریز البته با اکانت چت جی پی تی پلاس ات، می‌رفتی این مشکلات و موانع با بانک رو ردیف می‌کردی اصلاً می دونی وظیفه ی مدیر عامل چیه\r\n\r\n\r\n\r\nهمین حرف رو تو مراسم های به درد نخور و مسخره ی شرکت هم می‌گفت مدیر عامل قبلی ضرر گذاشته بودو همه چی رو نابود کرده بود و من مثل سوپر هیرو اومدم و همه چی رو درست کردم و بدون هیچ مدرکی و می‌گفت شرکت تو سود هست و این حرف‌ها با تعدیل بالای ۶۰ درصد نیروها در دو بازه ی ۴ ماهه کاملاً در تناقص می‌باشد و نخواستن پروژه ها از سمت بانک مهر تاییدی بود بر بی‌کفایتی دکتر\r\n\r\nبعد نوشته آجر های شرکت رو مونده بخورن، سؤال ( امتیاز بانک رسالت که حقوق بچه‌ها توش بود کجا می ره ؟ اشخاصی که در شرکت هستن حقوق می گیرن چرا حقوق می گیرن که پایین‌تر اسم اون ها به اختصار گفته شد ؟( اگر بگویید کذب هست مدارک مورد نیاز در این خصوص افشا خواهد شد ) بانک پرداختی حقوق چرا یهو عوض شد چه اشخاصی ذینفع بودن ؟ اصلاً چرا شرکت از خود بانک حقوق کارکنان رو پرداخت نمی‌کرد ؟ کلی سؤال به غیر این‌ها هست که این شخص می تونه پاسخ بده رفته نوشته آستین حلقه ای ها . . .\r\n\r\n\r\nگفته که بانکداری دیجیتال آماده ی راه اندازی هست منظور اش چیه دقیقاً کدام پروژه خوانندگان محترم هیچ پروژه ای تأکید می‌کنم هیچ پروژه ای در طول سه سال مدیریت دکتر لانچ نشد اگه شده یا هر وقت شد آدرس اش رو اینجا بفرمایید ما هم بریم استفاده کنیم پروژه های قبلی هم دات نت بود که کاملاً در جریان اش هستم و از زمان قبل دکتر بود و دقیقاً خیلی قبل تر لانچ بود\r\n\r\n\r\nاستاد آستین غیر حلقه ای فرمودن که کلی پولو داده بود ولی یک خط کد تحویل نگرفته بود: مگه می شه میلیاردی یه نفر پول بده بعد یه خط کد هم تحویل نگیره هیت مدیره و کلی مدیر بانک این شخص رو بازخواست نمی کنن حراست باز خواست نمی کنه مگه می شه اصلاً بگیم شده این اپن بنکینگ الان با کدام پروایدر ها و ترد پارتی ها در ارتباط بوده کلاینت های مطرح اش چه سازمان هایی هستن که میلیاردی سود رسوندن دقیقاً با چه شرکت های قرارداد بسته بود دقیقاً منبع در آمدش چی بوده\r\n\r\nبعد گفته تیم دکتر، پروژه های پیشخوان و موبایل بانک را کامل کرد و الانم اماده لانچ هستش، اینم یه جک دیگه اس\r\n\r\nاین دو پروژه هم مثل سایر پروژه های باشگاه مشتریان و SMPL, PNPL,BNPL چی چی Pl های دیگه\r\n\r\n( یعنی خدا شاهده اسم گذاشتن رو پروژه رو هم بلد نیستن آخه این‌ها چه اسمی هست هم اش چهار تا مخفف کلمه انگلیسی یه تنوع می‌دادید )\r\n\r\nبه زباله دان تاریخ پیوستن هیچ کدام از این پروژه ها لانچ نشدن و این مقصر اش کسی نیست جز دکتر\r\n\r\nاگه آماده اس لانچ کنید بعد بفرمایید آدرس پیشخوان اینترنتی و بدید ما هم استفاده کنیم همچین موبایل بانک آقای دکتر رو که لانچ کردید بفرمایید از گوگل پلی دانلود کنیم یا بازار یا سایت شرکت از کدوم ؟\r\n\r\nنوشته افرادی بودن که فقط دنبال حاشیه بودن، با زیرپیرهن آستین حلقه توی شرکت میگشتن، بلند بلند فحش ناموسی میدادن، بیکار بیکار فقط میگشتن و منابع شرکت رو تلف کرده بودن، حلقه های خانه زنکی داشتن ، مدام دنبال تخریب شرکت بودن :\r\n\r\nتا جایی که یادم هست حراست به پوشش سفت و سخت قانونی پایبند بود و کسی از جلوی حراست بدون حجاب یا با لباس‌های تقریباً غیر اداری طور نمی‌توانست وارد شرکت شود چطور کسی با زیرپیرهن آستین حلقه ای وارد شرکت شده این ادعای شما کذب محض هست و این ادعا عزیزان واحد حراست را زیر سؤال می‌برد هر چند رئیس محترم حراست آقای ر...ی فردی بسیار محترم و کاربلد هستن که به شدت به کارکنان آرمان بر خلاف دکتر و مجموعه ی اتوبوسی اش احترام می گذارند و اگر در شرکت اینجوری می گشته شما پس چه کاره بودید طرف با گروهی با زیر پیرهن آستین حلقه فحش های ناموسی داد می‌زدند تو شرکت پس شما چرا جلوی این افراد را نمی گرفتید چرا به حراست گزارش نمی دادید این ادعا در صورت راست بودن بر بی‌کفایتی شما و در صورت کذب بودن دروغ‌گو بودن شما رو می‌رساند\r\n\r\nاگر منظور از آستین حلقه ای پوشان بچه‌های تعدیل شده هست که می‌فرمایید اخراج شده‌اند اکثر بچه‌های تا جایی که بنده در لینکدین در ارتباط هستم جاهای خیلی بهتر مشغول به کار شده‌اند پس اگه واقعاً اونجوری بودند طبیعتاً جایی استخدام نمی شدن هر چند تک تک بچه‌های تعدیل شده چه اسفند چه تیر دونه دونه اش ون گل بودن و تک تک اشون رو می‌شناسم یه تار موشون از سر تون هم زیاد بودن اگر هم افراد دیگری مد نظر هست باز چرا و چطور این افراد از زیر نظر حراست و خود شما به عنوان مدیر عالی رتبه که تو همه چی سرک می‌کشید دور مانده اند\r\n\r\nامیدورام رئیس حراست فناوران اطلاعات آرمان راست یا کذب بودن ادعای شما ( آقای خ ش ) رو در مورد ورود افراد معلوم الحال به شرکت بررسی کند .\r\n\r\nالبته بیش از این وقت بنده اجازه جواب دادن به حرف‌های بی‌پایه و اساس این شخص را نمی‌دهد\r\n\r\nدر ادامه شرکت رو از زاویه دیگر مورد بررسی قرار می دم\r\n\r\n\r\nاین دکتر که می گید پروژه های چندین میلیاردی درست کرده بفرمایید شیر طبقه ۴ که بالای یک سال خراب بودو یه انبردست گذاشته بودن کنارش با اون بچه‌ها باز و بسته می کردن رو زود تر درست می‌کرد شیر دست شویی طبقه ۵ هم خراب بود و هست و ۳ سال هست تحت مدیریت آقای دکتر هنوز درست نشده هست وای اون کتری قوری انگار از نیسانی های آهن قراضه فروش خریده بودن و اون مبل های پاره ی مشکی شرکت هم آبروی شرکت رو که هر کی برای اولین بار وارد می شه رو می بره و . . . . بفرمایید این‌ها رو درست کنید لانچ پروژه ی میلیاردی و سود های میلییاااردی پیشکش یعنی از این حساب اش رو بکنید اون شرکت در نداشت همه از گاراژ می رفتن تو بعد در دار شد البته به لطف حراست بعد این آقای دکتر این رو به عنوان دست آورد می‌گفت تو جلسات اولاً دست آورد مدیر عامل رو دوماً همین هم کار خودش نبود اگه همکاری واحد حراست نبود هنوز آقای دکتر و مدیران اتوبوسی اش الان داشتن از گاراژ وارد می‌شدند.\r\n\r\n\r\nو این پایین هر چی کامنت مثبت هست از طرف خود این مدیران اتوبوسی و دکتر هست که قبلاً با عناوین مصاحبه شونده، برنامه نویس، دیزاینر می اومدن و از شرکت کلی تعریف می کردن حتی همین اخرین کامنت فیک هم اومده تو مزایا زده بازی ویدیویی :)))) کلا معایت و مزایا رو هم فیک نوشتن  ولی کامنت های واقعی یا به عبارتی منفی این ها رو هم درست زدن\r\nدر آخر تقدیر و تشکر می‌کنم از تک تک دوستانی که کامنت های واقعی می‌گذارند مخصوصاً کامنت 05/05 و کامنت منتسب با عنوان استاد همه چی دون که از نگاه نوین و متفاوتی ای به موضوعات شرکت پرداخته بودند\r\nو در آخر خطاب به دکتر و هیت همراه اتوبوسی اش\r\nوَاللهُ شَهیدٌ عَلی ما أقول، و ما کُنتُ أظنّ أن یُقابَلَ الإحسانُ بمثلِ هذا\r\n\r\nخداوند بر آنچه می‌گویم گواه است؛ گمان نمی‌کردم نیکی با چنین چیزی پاسخ داده شود.\r\n\r\n\r\n\r\n"
