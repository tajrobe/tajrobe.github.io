description: "این آدم هایی که توی این پیج کامنت منفی میزارن تا حالا براتون مشخص شده چه شخصیتی دارن\r\nدقیقا پست قبلی رو بخونید از درک و فهم و شعورشون پیدا میشه\r\nنکته اول: توهین این ادم ها به دیگران، دستمال شناس. واقعا اوج بی ادبی و شخصیتی هست که به مدیران با سابقه و زحمت کش شرکت لیبل می چسبونن تا خودشون رو توی سیف ساید ببرن، آخرش هم با تم مذهبی آیه و قرآن میخوانن، نه به توهین و دروغ گویی و بهتان زنیت نه به آیه و قرآنت\r\n\r\nنکته دوم: در مورد ضرر های قبل مدیریت دکتر سالهای ۱۴۰۰ تا ۱۴۰۲ و سود های سال های ۱۴۰۳-۱۴۰۴ و ان شالله ۱۴۰۵  اگر به صورت مالی شرکت رو بخونید مشخص میشه، برای کسی که اینقد بی سواده و بقیه را متهم میکنه جای تاسف داره که فقط نق میزنه و بقیه رو زیر سوال میبره، برو یه نگاهی به صورت مالی بانک بکن، مال شرکت هم توش هست\r\n\r\nنکته سوم: در مورد تعدیل ها، نامه های بانک موجود هست که ادامه پروژه های جدید را معلق کرده و کلا زیر ۱۰ درصد شرکت تعدیل شده امسال. با این سه جنگی که پارسال انجام شده خیلی شرکت ها ۱۰۰ درصد تعدیل داشتن و نکته مهم تر اینکه درخواست و دستور کارفرما بوده، همین که اینو هم نمیفهمن جالبه که اخه اینجا یک شرکت ماموریتی هست و طبق نظر بانک کارها انجام میشه ، نه یه نفر توی شرکت. اینکه پروژه های پیشخوان و موبایل بانک لایو عمومی نشدن به دلیل مسایل امنیتی کشور و کمبود تجهیزات بانک هست و در حال حاضر روی سرور های بانک عملیاتی هست و بیش از ۱۰۰۰ کارمند بانک از انها در اینترانت بانک استفاده میکنن \r\n و عدم لایو عمومی ربطی به کفایت دکتر یا مدیران شرکت نداره. کار فوق العاده انجام شده ولی هشدار های قرمز افتا و نبود یکسری تجهیزات امنیتی در بانک مانع لایو عمومی آنها شده \r\n\r\nنکته چهارم: سامانه اگزیم بوم شاه کار زمان مدیریت دکتر بوده که تا کنون بیش از ده ها میلیارد تومان به بانک توسعه صادرات سود داده و بیش از ۵ مشتریان کلان ملی از جمله بازار مبادله ارز و طلا داره ازش استفاده میکنن که اگر خواستی به شعبه بانک توسعه صادرات مراجعه کنید و ازش استفاده کنید.\r\n\r\nنکته پنجم: ورود حراست بانک به مجموعه آرمان از بعد از حوادث دی ماه و مشکلاتی که در جامعه پیش اومد با درخواست دکتر انجام شد و خدا رو شکر با همکاری مدیران شرکت خصوصا مدیران منابع انسانی، اتفاق های خیلی بودی جهت صیانت از دارایی های شرکت و بانک صورت پذیرفت. دقت کنید موضوعاتی زیادی در این سه سال مدیریت دکتر بوده و کمتر از ۹ ماه حراست بانک مستقیم ورود کرده و بقیه موارد با درایت ایشون و مدیران شرکت انجام شده.\r\n\r\nنکته ششم: به جای لجن پراکنی در این پیج، اگر فسادی در این شرکت مشاهده کردید یا مدارکی دارید حتما به مراجع قانونی مراجعه کرده و عدالت خواهی کنید. قطعا گردن دکتر و مدیران شرکت در مقابل قانون از مو باریک تر است. اگر در زمینه حقوق، سنوات، قولی که بهتون داده شده و انجام نشده، همین شنبه به شرکت مراجعه کنید و اگر حق با شما بود و دو روزه پرداخت نشد، هرچی دوست داشتی بیا اینجا بنویس. درغیر این صورت اتفاقا ماهم به خدا و گرد بودن زمین معتقدیم که از هر دست بگیری از همون دست پس میگیری پس منتظر کارمای دروغ ها، تهمت ها، بهتان ها، بی آبرویی ها و خراب کردن برند شرکتی که ۱۰۰ تا خانواده ازش نون میخورن باش.\r\nعلی یارت"
