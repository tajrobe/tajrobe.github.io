description: "نشسته پشتِ میز و نامش هست «خانم مدیر»\r\nولی در خویِ خود، سگ‌ صفت و بی تدبیر\r\nچو سگ‌ ماده که در شرکت، دمی دارد دراز\r\nبه جایِ کار، واق‌واق‌اش شده در جمع باز\r\nبه هر همکار می‌تازد، به نیشِ زبان\r\nدرانده آبرو، بی‌شرم در میانِ کسان\r\nمدیریت نه، که او «سگ‌خانه» ساخته است\r\nتمامِ نظمِ جمع را، به پارس‌اش باخته است\r\nبه جایِ راهبر بودن، خبرچینی کند\r\nبرایِ لقمه‌یِ فتنه، چه شیرینی کند!\r\nسگِ ماده اگر بر مسندِ کار است\r\nعجب نبود که بختِ ما، چنین تار است\r\nبه هر گوشه که پایی می‌گذارد،\r\nفقط بویِ تعفن از دهانش می‌بارد."
