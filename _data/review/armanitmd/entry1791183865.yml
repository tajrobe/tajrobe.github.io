description: "سلام\r\nدرباره این شرکت میشه یک کتاب نوشت به جای یک پست و یک نظر\r\nاول کار بگم جناب مهندس دستمال شناس کلا کارشون ماله کشیدن روی کارهای دکتر هست و نمیخوام زیاد به صورت تخصصی به ایشون بپردازم\r\nو دوم اینکه جناب پ.ش میاد اینجا هی جواب میده و چند تا ستاره میزنه که امتیاز شرکت توی این صفحه بالا بیاد، ضمنا خانم آ.ا که شعر زیبای ناموزونی که اینجا گفته شده براشون هم مورد حمله همین مثلا مدیر منابع انسانی قرار گرفتن\r\nبه نظر من تمام این کاستی های شرکت باید به پای شخص دکتر نوشته بشه و اگر ایشون شایسته سالاری رو به اتوبوس دوستان ترجیح میدادن الان وضعیت شرکت این نبود\r\nبله جناب دستمال شناس ما هم میدونیم زیان شرکت صفر شده و حتی کسانی که قدیمی هستند و یادشون میاد همه میدونن که از لحاظ سخت افزاری و حتی میز و صندلی و ... نسبت به دوره های قبلی و مدیران قبلی بهتر شده ولی با وجود شما و دوستانتون اونقدر حواشی وجود داره که این زحمات دیگه دیده نمیشه\r\nتوی دوره مدیریت دکتر ه.ن دو بار تعدیل داشتیم که یکی در بدو ورودشون بود و یکی همین تعدیل اخیر که شرکت تقریبا از لحاظ نفرات نصف شد\r\nبرای من جالبه توی تعدیل ها حتی یک نفر از اتوبوس دکتر کنار گذاشته نشد و برای تمامی مدیران عتیقه ایشون حداقل یک نفر نگه داشتن تا تیمشون بمونه ولی تنها کسی که توی شرکت واقعا لینوکس کار میکرد و کلی به دردمون میخورد تعدیل شد!\r\nمثلاً واحد it باید این کارا رو انجام بدن که جناب مدیر س.ر اصلا نمیدونن کار درست چی هست و فقط بلدن هر از چند گاهی اینترنت و دیتا بیس و ... رو به هم بریزن و دوباره درستش کنن\r\nباقی مدیران هم که خیلیاشون رو نام بردم خدا رو شکر توی خراب کاری استادن\r\nیکی از عجیب ترین موجودات هم مدیر مالی هستش که کلا با حرف راست کاری نداره و هر وقت مچش رو میگیری که حقوقت رو با اشتباه واریز کردن هزار تا دلیل الکی میاره\r\nدکتر ه.ن من هنوز نفهمیدم چرا از کارمندان شرکت فراری بودین و برای اینکه بتونن ببیننتون مثل اون بنده خدا که قدیمی ها میدونن کی رو میگم باید به زور میومدن تو اتاق و بعد از اون هم معمولاً باید تو آسانسور یا راهرو میدیدیمتون\r\nپارسال هم یک سری نیرو جذب کردین و به دروغ بهشون گفتید ۱۸ تا بهتون حقوق میدیم و دو تا پاداش و ... وقتی اومدن به ما گفتن ما همون اول بهشون گفتیم دروغ گفتن بهتون ولی باورشون نشد تا اینکه وقتی با واقعیت مواجه شدن همشون گذاشتن رفتن البته اینم بگم همون حقوق کم اونها هم باز از ما بهتر و بیشتر بود!\r\nاونقدر وقیح هستید تو جلسه میگید اول باید مدیران وام بگیرن و بعد نیروهای دیگه و هنوز نصف قدیمی ها وام نگرفتن ولی شما به دوستان خودتون وام دادید\r\nخدا رو شکر که دکتر با رفتنشون خوشحالمون کردن فقط جناب دکتر ه.ن یادتون رفته اتوبوس دوستانتون و ببرید و خوشحال ترمون کنید.\r\nتوی مزایا دیدم بعضی موارد مخصوصاً بازی رایانه‌ای نوشته شده بود خواستم به عرض برسونم که 😐 والا ما که ندیدیم.\r\nاین هم که هی میگن دکتر بدهی ها رو کاهش داده برای این بوده که ایشون یک مدیر کاملآ رانتی و متصل هستن و توی بانک باهاشون کاملآ همکاری میشد ولی تویی مدیریت قبلی به زور حتی پول حقوق ما رو بانک تقبل میکرد.\r\nتمام تیم مدیریتی که با ایشون اومدن حتی یک اثر مثبت نداشتن و ارزش افزوده ای برای شرکت نداشتن و فقط حقوق و مزایای بالا دریافت کردن.\r\nتاکید میکنم خواهشاً دکتر اتوبوستون رو با مسافرانش ببرید.\r\nمزایا هم آبسرد کن و قوری و کتری و دستگاه باینو و توالت رو میتونم نام ببرم."
