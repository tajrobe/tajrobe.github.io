description: "شرکتی که بیس خارجی داشته و از زمان خارجی ها اسمی برای خودش دست و پا کرده ولی طبق معمول با ایرانیزه و بهتر بگم قبیله گرایی همیشگی فرهنگ ما تبدیل به یه جهنم واقعی شده، باور کردنی نیست ولی حتی از وای فای خوابگاه هم ازتون جاسوسی میشه و بعضا شنود گذاشتن هم مشاهده شده، یه سری گروه تلگرامی و واتسپی هم راه انداختن بعضی ازین باندهای داخلی که یا با هم میجنگن یا با هم پاسکاری می کنن، در کل می تونم بگم اگه میخواد صرفا برای تجربه یه محیط وحشتناک سمی برید امتحانش ضرر نداره ولی حواستون باشه هیچ کدوم ازون قدیمیا آدم حسابی نیستن، متاسفانه به دلیل محیط کاری خشنی که داره و البته پرداختی نسبتا مناسب و بیس خارجی و تکنولوژی خوبی که از قبل بوده بعضی ویژگی های وسوسه کننده داره که گاهی آدم فقط افسوس میخوره که چرا به چنین فضاحتی کشیده شده. یه نکته احمقانه ای که داره سطح مدیرانه که تقریبا همشون یا پارتی دارن یا اطلاعاتین یا وصل به یه جایی یا اونقدر کیف کشی کردن که کثافت از سر و روشون میباره. امثال ح.ق و م.ک و حتی مدیران عامل که بعضا صرف داماد فلان سردار بودن رفتن و نشستن سر یه پست و حتی حاضرن به شرکت ضررهای هنگفت میلیارد دلاری  بزنن تا خودشون رو حفظ کنن، "
