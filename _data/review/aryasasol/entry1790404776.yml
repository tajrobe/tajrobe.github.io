description: "۴ سال تو تعمیرات برق اینجا کار کردم رییسم ازم می ترسید که شغلم ارتقا پیدا کنه و یه روزی جاشو بگیرم چون کارم خوب بود و کارم رو درست انجام می دادم برای همین با هم دست به یکی کردن اول برام شایعه درست کردن بعدش الکی توبیخم کردن و وقتی دیدن با این کارها هیچ کاری نمی تونن بکنن برام پاپوش دوختن\r\nیه جایی خودشون خرابکاری کردن منو فرستادن درستش کنم منم رفتم و کاری که از دستم بر می اومد انجام دادم و درستش کردم بعد که دیدن من کم نیاوردم و تونستم مشکل رو حل کنم گفتن خودش عمدا خرابکاری کرده بود که جای رییس رو بگیره یعنی حتی وقتی کار خودشون رو هم درست کردم باز یه جوری قضیه رو برگردوندن که من مقصر باشم\r\nحیف عمرم که اینجا گذاشتم چند سال از زندگیم رفت برای جایی که اخرش نه تنها قدردانی نکردن بلکه به اعتبارمم ضربه زدن و کاری کردن که پیش بقیه بد به نظر بیام واقعا ادم وقتی چند سال زحمت می کشه و کارش رو درست انجام می ده انتظار نداره یه روز اینجوری باهاش رفتار کنن تهشم با بهانه الکی اخراجم کردن\r\nبدترین بخشش اینه که حتی اگه عالی کار کنی و کارت رو بی نقص انجام بدی باز هم وقتی تعدادشون زیاد باشه و با هم هماهنگ باشن می تونن جوری برات پاپوش درست کنن که همه حرفشونو باور کنن وقتی چند نفر با هم یه حرف رو بزنن خیلی ها دیگه دنبال این نمی رن که ببینن اصل ماجرا چی بوده و کی راست می گه\r\nمن از کاری که با من کردن نمی گذرم چون فقط به شغلم لطمه نزدن بلکه به اعتبار و ابروی من هم ضربه زدن چیزی که سال ها براش زحمت کشیده بودم و خیلی راحت خرابش کردن من همیشه سعی کردم کارم رو درست انجام بدم و با کسی مشکل نداشته باشم ولی انگار برای بعضی ها کار کردن خودش باعث دردسر می شه، چند وقت پیشم دیدم همون رییسم شده مدیر کل برق\r\nازشون نمی گذرم و فقط امیدوارم یه روزی تو زندگی خودشون هر بلایی که سر من اوردن سر خودشون بیاد چون ادم باید بفهمه با همنوع خودش چه رفتاری می کنه واقعا حیوون هم این کارو با همنوع خودش نمی کنه اینا از حیوونم پست ترن"
