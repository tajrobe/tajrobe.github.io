description: "به روح پاک قاید شهید و همه شهدای مظلوم اسلام و انقللاب قسم میخورم که توی این پنج سالی که از نزدیک توی این مجموئه بودم چیزی که با چشم خودم دیدم تلاش واسه خدمت به نظام و انقللاب و زنده نگه داشتن دین بود دکتر حیدرزاده و دکتر قرنفلی هم توی همین مسیر زحمت کشیدن و به نیروهای مومن و انقلابی توجه داشتن من این حرفارو واسه دل کسی نمیگم چون آدم باید قدر اونایی رو بدونه که با نیت پاک و واسه رضای خدا پای کار نظام وایسادن اینجا میتونه خونواده باشه که توش آدما غم همدیگرو میخورن و توی سختی پشت همو خالی نمیکنن ما آذریااز قدیم به غیرت و معرفت و مهمون نوازی خونوادگیمون شناخته شدیم توی فرهنگ ما رفاقت و وفاداری و حرمت بزرگترا یه اصل مهمه ما یاد گرفتیم نون و نمک همدیگرو حرمت بزاریم و توی روزای سخت کنار هم وایسیم ان شاالاه همین روح اسلامی و مرام و معرفت توی آریاساسول هم پررنگ تر بشه و همه خودشونو از یه قوم بدونن\r\nمخصوصا بچه های جانبازان و فرزندان اونایی که سالهای عمرشونو پای خدمت به نظام و انقللاب گذاشتن باید احساس کنن این خونه خونه خودشونه و زحمات پدرهاشون از یاد نرفته پشت سر این خونواده ها یه عمر ایصار و فداکاری و صبر خوابیده و حرمت این سابقه باید حفظ بشه ما اگه دم از شهدا و ارزشهای انقللاب میزنیم باید توی عمل هم نشون بدیم که اهل معرفتیم و قدر  آدما رو میدونیم در مورد استخدامهای جدید هم اعتقاد من اینه که ایمان و تعهد و پاکدستی و روحیه خدمت باید کنار تخصص و توانایی کاری دیده بشه مدرک و تجربه مهمه ولی اخلاص و وجدان کاری رو نمیشه فقط با مدرک دانشگاهی بدست اورد نیروی مومن و متعهدی که دلش واسه این مملکت میتپه باید فرصت نمایش داشته باشه و کسی که مسولیت میگیره باید بدونه بیت المال امانت الهیه\r\nما که داریم بازنشست میشیم دلمون میخاد وقتی از اینجا میریم پشت سرمون یه خونواده محکم و باصفا بمونه که توش جوون بسیجی و نیروی مخلص و فرزند شهید و جانباز احساس غریبگی نکنه ما که سالها توی این مجموعه نون خوردیم و کار کردیم دوست داریم اونایی که بعد از ما میان با عشق و انگیزه بیشتر واسه این نظام و این مردم خدمت کنن ان شاالاه مدیریت جدید هم هوای این نیروها رو داشته باشه آخرش نه مقام میمونه نه پست و نه مدرک چیزی که پیش خدا میمونه نیت پاک و خدمت صادقانه و حقی هست که از مردم و همکارامون ضایه نکردیم خدا روح شهدا رو شاد کنه و به همه اونای که جانانه پای این کشور وایسادن اجر بده ان شاالاه آریاساسول همیشه سنگر خدمت و ایمان و مرام بمونه و هیچ کدوم از بچه های این خونواده مخصوصا فرزندان جانبازان و خادمان نظام احساس تنهایی و فراموش شدن نکنن"
