description: "سلام،\r\n\r\nدوست دارم تجربه شخصی خودم را صادقانه بیان کنم. البته باید در نظر داشت که هر بخش شرکت ممکن است مدیر، فرهنگ و شرایط متفاوتی داشته باشد و لزوماً مواردی که من مطرح می‌کنم در تمام قسمت‌های شرکت صدق نمی‌کند.\r\n\r\nاز نکات مثبت شرکت این است که بسیاری از نیروهای قدیمی آسا توانسته‌اند در طول زمان پیشرفت کنند و به جایگاه‌های مدیریتی و رده‌های بالای سازمان برسند. همچنین مدیرعامل دخالت مستقیمی در بسیاری از امور روزمره ندارد و بخشی از تصمیم‌گیری‌ها از طریق کمیته‌ها انجام می‌شود.\r\n\r\nاز نظر پرداخت حقوق، شرکت معمولاً پرداخت‌ها را به‌موقع انجام می‌دهد. در مورد حقوق توافقی، ساختار پرداخت به‌گونه‌ای است که مبلغ توافقی برای یک فصل محاسبه و در طول فصل در چند مرحله پرداخت می‌شود. البته یکی از تبعات این ساختار این است که مبلغ حقوق پایه و مبلغی که مبنای بیمه قرار می‌گیرد، کمتر از دریافتی واقعی است و در نتیجه مزایایی مثل اضافه‌کاری نیز بر اساس مبلغ بیمه‌ای محاسبه می‌شود و رقم بالایی نیست.\r\n\r\nمحیط کاری در مجموع دوستانه است و بسیاری از افراد برخورد خوبی دارند و فضای نسبتاً راحتی ایجاد شده است. با این حال، تجربه من با مدیر مستقیمم چندان مثبت نبود. به نظرم در حوزه منابع انسانی و مدیریت تیم ضعف‌هایی وجود داشت و در طول مدتی که آنجا بودم، تعدادی از نیروهای خوب تیم از دست رفتند. در برخی موارد نیز تصمیم‌ها و حساسیت‌هایی وجود داشت که از نظر من ضرورتی نداشت و گاهی بیشتر از منافع تیم، نگاه سازمانی و طرفداری از شرکت در تصمیم‌گیری‌ها پررنگ بود. البته این بخش کاملاً مربوط به تجربه شخصی من با آن مدیر است و نمی‌توان آن را به تمام مدیران شرکت تعمیم داد.\r\n\r\nپرداخت مبلغی ماهانه تحت عنوان «فودمود» است که در حدود ۶ میلیون تومان در ماه بوده و برای هزینه‌های روزمره قابل استفاده است.\r\n\r\nشرکت در گذشته وام نیز ارائه می‌کرد، اما با توجه به شرایط فعلی، این مزیت حذف شده است. در زمینه آموزش نیز میزان حمایت شرکت نسبت به گذشته کاهش پیدا کرده و در حال حاضر نسبت به قبل درصد کمتری از هزینه‌های آموزشی را پرداخت می‌کند.\r\n\r\nیکی دیگر از مواردی که در محیط شرکت به چشم می‌خورد این است که برخی مدیران، همسر یا نزدیکان خود را نیز در شرکت مشغول به کار کرده‌اند.\r\n\r\nاضافه‌کاری به شکل قابل توجهی وجود ندارد و در مواردی هم که پرداخت می‌شود، با توجه به پایین‌تر بودن مبلغ مشمول بیمه، مبلغ اضافه‌کاری چندان بالا نیست.\r\n\r\nدر مجموع، به نظرم آسا شرکت بدی نیست و مزایایی مثل پرداخت منظم حقوق، محیط نسبتاً دوستانه و امکان رشد برای نیروهای قدیمی دارد. با این حال، از نظر من ممکن است برای افراد تازه‌کار یا کسانی که در ابتدای مسیر شغلی خود هستند، گزینه مناسب‌تری باشد؛ اما برای فردی که سابقه کاری بیشتری دارد و انتظار بیشتری از نظر ساختار مدیریتی، مزایا، سطح درآمد و استقلال کاری دارد، احتمالاً باید شرایط را دقیق‌تر بررسی کند.\r\n\r\nیکی دیگر از نکاتی که برای من قابل توجه بود، تعداد زیاد جلسات و نیاز به هماهنگی‌های متعدد برای انجام کارهاست. برای پیشبرد بعضی از کارها لازم است با افراد و واحدهای مختلف هماهنگی انجام شود و همین موضوع گاهی باعث طولانی شدن فرآیند انجام کار می‌شود.\r\n\r\nدر مجموع، این موارد برداشت و تجربه شخصی من در مدتی است که در شرکت حضور داشتم و طبیعتاً ممکن است تجربه افراد در تیم‌ها و واحدهای مختلف متفاوت باشد.\r\n"
