description: "آسا از بیرون خیلی جای بزرگ و جذابی بنظر میرسه ولی واقعیت تجربه هرشخص بستگی داره توی کدوم تیم باشه و مدیر بخشش کی باشه.\r\nیه سری مسائل مثل پرداخت به موقع حقوق و بیمه مزیت نیست وظیفه ست دوستان !!\r\nکسایی که این موارد رو به عنوان خوبی آسا مطرح میکنن باید بگم خانه از پایبست ویران است!\r\nبله مدیرعامل معمولا هیچ دخالتی تو هیچ بخشی نداره حقیقتا سرکشی و چک کردن براش معنایی نداره همین میشه که اعضای هیئت مدیره تمام فامیلاشونو میارن اینجا\r\nخواهر برادر همسر ( همه هم تو بخش های مختلف مدیر میشن! ) \r\nبله شما تو آسا بعد از چندسال موندن میتونید رشد کنید به جایگاه های بالا تر برسید اما این تنها در صورتی هست که پاچه خواری مدیرانتون رو فراموش نکنید\r\nشما هرچقدر که تلاش کنید باز هم سر سال میشنوید که خب تو خیلی تلاش کردی ولی ما راضی نبودیم کافی نبود.\r\nتعدیل های عجیب و بدون ملاک امسال از همه چی خنده دار تر بود ، مدیر هایی که مستقیم با بچه ها کار میکردن و از پیشرفت و همه چیزشون آگاه بودن خبر نداشتن قراره کدوم نیروشون تعدیل بشه \r\nاما اون مدیر بخشی که هفته ای یه بار میومد شرکت و فقط سلام علیک میکرد با بچه ها و دنبال کار های نمایشی بود ( دورهمی های بی معنی ! ) \r\nاون انتخاب کرد که چه کسایی تعدیل بشن کیا؟ اونایی که دورهمی هاش نیستن !! \r\nاصلا مهم نبود جونیور باشی یا سنیور \r\nمورد داشتیم که شخصی که ۱۴ سال فقط سابقه تو این مجموعه داشت ( علاوه بر جاهای دیگه ) این نیرو تعدیل شد! \r\nسر پرداخت سنوات بچه هایی که  تعدیل شدن هرطوری تونستن پیچوندن و اذیت کردن \r\nتیم هارو بهم ریختن \r\nیه سری نیرو تعدیل کردن که تیم لید هارو دچار مشکل کرد چون روی بچه ها حساب کرده بودن ولی هیچ جوره نتونستن افرادی که میخوانو نگه دارن \r\nبعدم کلی گریه و ناراحتی که وای ما چاره ای نداریم مجبوریم تعدیل کنیم ( البته به جز فامیلای خودشون ! اونا باید بمونن !) \r\nاز اردیبهشت ماه به اینور تقریبا هر ماه خروج نیرو هست \r\nهمه منتظر موقعیتن که برن از اینجا \r\nمحصولاتی با مشتری های بی معنی که فقط کار درست کردنه \r\nجلسه های طولانی و بی فایده و یه مشت آدم که فقط شعاری حرف میزنن \r\nدر کل اگه سالها پیش آسا خوب بوده الان دیگه بدرد نمیخوره\r\nرنج حقوقی خیلی بالا تر از بازار واقعی بسته میشه \r\n"
