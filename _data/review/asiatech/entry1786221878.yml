description: "\r\n۱. تو دوران جنگ، دورکاری ندارند، چون مدیرعامل معتقدن که دورکاری یعنی بیکاری\r\n۲.تو دوران جنگ، وقتی توییت زده بودن و اسم اسیاتک هم به عنوان مقاصد احتمالی حمله اعلام کردند، شرکت دو روز اخر اسفند و روزهای کاری نوروز بستن و گفتن اجباری باید مرخصی رد کنید و اگر ندارید، مرخصی بدون حقوق رد کنید!!! \r\n۳. مرخصی ساعتی بیشتر از ۵ ساعت، مرخصی روزانه حساب میشه\r\n۴. بیمه تکمیلی شرکت،  طرف قراردادهای کمی داره و اگر از شرکت بیاید بیرون، باید تا اخر سال رو تسویه کنید اما دیگه اجازه استفاده ازش رو هم ندارید. یعنی فقط پول بیمه رو میدید.\r\n۵. ساعت کاری از ۸ تا ۱۷:۳۰ هست با نیم ساعت شناوری که بیشتر از ساعت مجاز قانونی هست.\r\n۶. اسیاتک اصلا دورکاری نداره به جز شغلهای مرکز تماس.\r\n۷. میزها مثل کانتر هستند و هیچ کشویی ندارید و اجازه هم ندارید رو میز وسیله ای بذارید .خوراکی هم رو میز بودنش ممنوعه البته نه برای مدیران!!!\r\n۸. هر سه میز، یک دستمال کاغذی داده میشه وبراتون ایمیل میزنن که هر ورق دستمال کاغذی ۴۵۰ تومنه، صرفه جویی کنید!!!\r\n۹. موس بی سیم فقط به سرپرست به بالاتر میدن و کارشناسها باید موس با سیم داشته باشن.\r\n۱۰. تو روز فقط دو ساعت دسترسی اینترنت داری که اون هم اکثر سایتها بسته است. هیچ هوش مصنوعی برات باز نمیشه مگر اینکه درخواست بدی و در صورت اجازه مدیر و معاون، باز میکنن که اینقدر سرعت اینترنت پایینه و زمانش کمه،بیخیالش میشی.یعنی عملا شرایط کار برات فراهم نمیکنن اگر کارت به سرچ وابسته است.\r\n۱۱. حجم کاری خیلی خیلی خیلی زیاد داره و تناسب با حقوق دریافتی نداره. اکثر تسکهای تحویلی هم دست مدیرها میمونه و فیدبکی داده نمیشه چون از اول که درخواستشو دادن، برنامه ای براش نداشتن.\r\n۱۲. قبلا هدایای مناسبتی داشتن که الان حذف شده. \r\n۱۳. سرپرست به بالاتر اضافه کار ندارند و چون شناوری ساعت کاری مدیران بیشتر هست و باید تا ۷ بمونن، اکثرا بعد ساعت کاری، سرپرستها  و کارشناسها رو نگه میدارن.\r\n۱۴. کارانه های فصلی خیلی با تاخیر و تقریبا اخر فصل بعدی واریز میشه که اگر کسی هم خواست بره، شاملش نشه.\r\n۱۵. قراردادها فقط سیستمی هست و فقط یک خط که اسمتو حقوق و تاریخ زده شده رو میبینی و از بندهاای قرارداد بیخبری. و نسخه کتبی با  امضا تحویل نمیدن که نتونی برای شکایت بری و هر وقت بخوان تاریخ قراردادت رو عوض میکنن.مثلا تو سیستم قرارداد ۶ ماهه تایید کردی، اما سرماه تعدیل میکنن و بعد قرارداد ۱ ماهه تحویلت میدن با امضای دیجیتال خودت پای قرارداد!!!!\r\n۱۶. هیچ لوازم اداری مثل دفتر, خودکار و منگنه، کاغذ A4 هرچیزی که لازم داشته باشی،نمیدن.\r\n۱۷. تاریخ های ورود کارمندهای جدید،دو بار تو ماه هست(اول و پانزدهم) و تا قبل ورود هیچ قراردادی امضا نمیکنید و بعد از ورود به شرکت و بعد از تحویل سیستم،قرارداد سیستمی امضا میکنید که بارها شده که افرادی رو اکی دادن و تاریخ و ورود بهش اعلام کردند و موقع تاریخ ورودش، استخدامشو لغو کردن و اون فرد بیچاره هم از کار قبلیش استعفا داده.\r\n۱۸. مبلغ قرارداد که امضا میکنید،عددی نیست که براتون بیمه رد میشه و مبلغ زیادی ازش رو به عنوان ماموریت کاری میزنن که شامل بیمه و مالیات نشه که کاملا به ضرر کارمند هست. هم برای استفاده از حقوق بیکاری و برای خانمها برای حقوق دوران مرخصی زایمان.\r\n۱۹. کلاسهای اموزشی به اجبار ثبت نام میکنن که یا بعد ساعت کاری هستند یا اخر هفته و شامل اضافه کاری هم نمی شود. در صورت استعفا یا اخراج هم مبلغ کلاس براساس فرمولهای خودشون از کارمند گرفته میشه. اگر شرکت هم نکنید، به علت عدم تمایل به پیشرفت،نمره کارانه فصلی رو کم میکنن.\r\n۲۰. فضای ساختمان به حدی کوچک هست که در اکثر طبقات بین دو میز امکان تردد وجود ندارد و باید دو نفر داخل میز بروند تا کسی بتواند از پشت انها رد شود.\r\n۲۱. تعداد خیلی زیاد دوربینها ازاردهنده است. بخصوص خاطراتی که کارمندهای قدیمی تعریف میکنن که عکس گوشی دست گرفتن رو مدیرعامل برای تذکر به افراد و مدیرانشون ایمیل کرده.\r\n۲۲. کمدی که به هر کسی میدن، برای یک کیف کولی یا ساک ورزشی هم اندازه نیست (یک سوم اندازه کمدهای سالنهای ورزشی) اگر ساک ورزشیت روی میزت باشه هم تذکر میدن و عکس میگیرن و نمره 5s واحد رو کم میکنن. \r\n۲۳. 5s گذاشتن و معاون بدون حفظ حریم شخصی کمدها رو باز میکنه و به وسایل شخصی خانمها توجه نمیکنه که شاید خانمی معذب بشه.\r\n۲۴.مدیرعامل ایمیل میزنه که گوش شنوای حرف های شما هستم اما مدیر با تهدید میگه ، فکر میکنید حرف من که بیست سال باهاش هستم رو باور می‌کنه یا شماهارو و کارشناسها از ترس بیکار شدن نمیرن و تجربه نشون داده هرکسی رفته و حرف زده،تعدیل شده!!!\r\n۲۵. تعداد استعفاها و تعدیل نیروها واقعا آزاردهنده است. نیروهای خوب رو زمان جنگ به علت شرایط اقتصادی تعدیل کردن و دو ماه نشده برای همون پوزیشن، اگهی استخدام میزنن. \r\n۲۶. نمازخونه به صورت اشتراکی خانمها و اقایون است که مبادا کسی بره دراز بکشه. این مصیبت و خانمهای باردار و خانمها تو بعضی روزهای ماهانه اشون میفهمن.\r\n"
