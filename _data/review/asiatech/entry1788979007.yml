description: "سطح بی‌سوادی و نادانی مدیران این مجموعه در این حده که فکر می‌کنن اگر به جای مدیر محصول بنویسن سرپرست محصول، می‌تونن حقوق کمتری پرداخت کنن! با ورود به ساختمان شرکت شما حس رفتن به اداره‌های فرسوده‌ی دولتی رو دارید، مصاحبه با معاونت محصول و منابع انسانی همزمان انجام شد، سوالات سطح پایین و و بی‌ربط پرسیده شد. در انتهای مصاحبه فرم استخدام رو دادن که پر کنم، مشخصات اعضای خانواده من به شما که هیچ به پدر و جد و آباد شما هم ربطی نداره، دوستان هر شرکتی که رفتم که اینقدر وقاحت داشته بدون استثنا با قهوه‌ای کردن طرف اومدم بیرون، شانس آوردید که آخر جلسه فرم رو دادید و در اتاق حاضر نبودید. من پر نکردم و ریجکت شدم. همون آگهی هم بعد از سه ماه دوباره باز شده. شرکتی که ورشکسته و رو به افول هست و صدها نفر رو تعدیل کرده، نیروی جدیدی نمی‌تونه بگیره، وقت خودتون رو با عره و عوره تلف نکنید."
