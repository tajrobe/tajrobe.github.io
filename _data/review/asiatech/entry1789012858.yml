description: "مصاحبه‌ها به‌صورت حضوری برگزار می‌شوند، در حالی که با توجه به اینکه این شرکت در حوزه اینترنت و فناوری فعالیت دارد، انتظار می‌رود حداقل مرحله اولیه مصاحبه‌ها به‌صورت آنلاین برگزار شود.\r\n\r\nدر شرایطی که بسیاری از شرکت‌ها امکان برگزاری مصاحبه آنلاین را فراهم کرده‌اند، دعوت کارجو به مصاحبه حضوری باعث صرف زمان و هزینه اضافی برای رفت‌وآمد می‌شود؛ در حالی که بخش قابل‌توجهی از ارزیابی اولیه، از جمله بررسی سوابق کاری، دانش فنی و گفت‌وگوی اولیه، به‌راحتی به‌صورت آنلاین قابل انجام است.\r\n\r\nبه‌خصوص برای شرکتی که خودش در حوزه فناوری و اینترنت فعالیت می‌کند، انتظار می‌رود فرآیند جذب نیرو نیز متناسب با همین رویکرد و با استفاده از ابزارهای آنلاین انجام شود."
