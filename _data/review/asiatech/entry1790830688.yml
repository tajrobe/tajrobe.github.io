description: "اینجا کامنت‌ها رو خوندم ولی باور نکردم تا اینکه خودم برای مصاحبه دعوت شدم. واقعاً اصلاً احساس نمی‌کردم وارد یک مصاحبه شغلی شده‌ام؛ بیشتر شبیه یک فضای به‌شدت کنترل‌گر و بازجویی‌گونه بود. \r\n\r\nفرمی به متقاضی می‌دهند که در آن درباره کوچک‌ترین مسائل شخصی سؤال می‌شود؛ از نام و مشخصات اعضای خانواده گرفته تا شماره تماس و اطلاعات هویتی. واقعاً برایم سؤال بود که وقتی فرد هنوز فقط برای مصاحبه آمده، چه ضرورتی دارد کد ملی، شماره شناسنامه و اطلاعات خانوادگی و اطلاعات شرکت قبلی با شماره تلفن برای پرسیدن از شرکت های قبلی ،این حجم از اطلاعات شخصی را در اختیار شرکت قرار دهد؟ \r\n\r\nنکته جالب این است که در مقابل، اطلاعات چندانی درباره خود شرکت، شرایط دقیق شغل و روند کاری ارائه نمی‌شود، اما درباره زندگی شخصی متقاضی کنجکاوی زیادی وجود دارد. \r\n\r\nحتی مدیران فنی هم به جای تمرکز صرف بر توانایی‌ها و سوابق فنی، وارد مسائل شخصی و حاشیه‌ای می‌شوند؛ مثلاً اینکه چرا تمام اطلاعات شخصی را در فرم تکمیل نکرده‌اید. برای یک مصاحبه فنی، انتظار می‌رود بخش اصلی ارزیابی روی مهارت، تجربه و توانایی‌های شغلی باشد، نه مسائل شخصی. \r\n\r\nموضوع استعلام گرفتن از محل کار قبلی هم برایم قابل درک نبود. اگر فرد از محل کار قبلی خود رضایت کامل داشت، طبیعتاً دلیلی برای تغییر شغل و ارسال رزومه به شرکت دیگری نداشت. \r\n\r\nدر مجموع، تجربه من این بود که فضای مصاحبه بیشتر از اینکه حرفه‌ای و شغلی باشد، کنترل‌گر و متمرکز بر مسائل شخصی بود. احساس کردم حریم خصوصی متقاضی چندان جدی گرفته نمی‌شود. \r\n\r\nواقعاً حیف وقتی که برای این مصاحبه گذاشتم. اگر قرار بود بر اساس تجربه‌ای که من داشتم نامی برای این فضا انتخاب کنم، «سم‌تک» از «آسیاتک» مناسب‌تر به نظر می‌رسید.\r\n\r\n"
