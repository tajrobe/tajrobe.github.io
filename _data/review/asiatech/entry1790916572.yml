description: "ساعت کاری مجموعه ۸ صبح تا ۱۷:۳۰ اعلام شده. طبق توضیحی که داده شد، یک ساعت از این زمان برای ناهار و نماز در نظر گرفته می‌شود؛ یعنی عملاً ۸.۵ ساعت حضور روزانه.\r\n\r\nبا توجه به اینکه مبنای قانونی ساعات کار، حداکثر ۴۴ ساعت در هفته است، این نیم‌ساعت اضافه در ساعت حضور روزانه برای من سؤال‌برانگیز بود؛ خصوصاً اینکه طبق توضیحات، این نیم‌ساعت اجباری به عنوان اضافه‌کاری محاسبه یا پرداخت نمی‌شود و اساساً سیستم اضافه‌کاری در مجموعه وجود ندارد.\r\n\r\nاگر قرار است نیروی کار هر روز نیم‌ساعت بیشتر از ساعت کاری متعارف در محل حضور داشته باشد، منطقی است نحوه محاسبه این زمان و مبنای قانونی آن شفاف باشد.\r\n\r\nاین موضوع را در کنار نبود اضافه‌کاری و محدود بودن مزایا که می‌گذاریم، تصویر چندان جالبی از شرایط کاری ایجاد نمی‌کند."
