description: "تجربه بسیار بدی از فرایند استخدام این شرکت داشتم. تمام مراحل مصاحبه را طی می‌کنید، چندین بار حضوری مراجعه می‌کنید، اما حتی حاضر نیستند بازه حقوقی پیشنهادی را شفاف اعلام کنند. وقتی از ابتدا حقوق مورد انتظار خود را اعلام می‌کنید، می‌گویند مشکلی نیست، اما در نهایت مشخص می‌شود که اتفاقاً مشکل وجود دارد!\r\n\r\nدر پایان هم شرایط جنگی را بهانه می‌کنند و می‌گویند به همین حقوقی که پرداخت می‌شود راضی باشید. مگر نیروی متخصص موظف است دانش و تجربه خود را ارزان در اختیار شرکت بگذارد؟\r\n\r\nاگر توان پرداخت حقوق متناسب با تخصص افراد را ندارید، از همان تماس اول شفاف باشید؛ وقت و هزینه کارجو را هدر ندهید. حتی حاضر به برگزاری مصاحبه آنلاین هم نیستند.\r\n\r\nوقتی اصول اولیه استخدام و احترام به وقت کارجو رعایت نمی‌شود، واقعاً باید درباره فرهنگ حرفه‌ای چنین شرکتی تجدیدنظر کرد.\r\nوقتی پایین تر از عرف همه شرکت ها دارید پول پرداخت میکنید ،حالا هرروز هم اگهی استخدام بذارید."
