description: "صادقانه بگم، هیچ جایی مدینه فاضله نیست ولی اگر بخواهم الان هم بین آسیاتک و جاهای دیگه، شرکتی رو انتخاب کنم، بازم آسیاتک رو انتخاب می کنم. برای بچه هاست فرصت رشد و توسعه ایجاد می کنه و جا به جایی شغلی به شکل حرفه آیی اینجا انجام میشه. من شش سال پیش وارد مرکز تماس آسیاتک شدم و دو سال بعد تونستم وارد معاونت فنی بشم. بعد از اون هم لول آپ شدم و الان سرپرستی تیم رو بعهده گرفتم. معمولا برای ارتقا اول بین بچه های خودشون دنبال فرد مناسب میگردند و تصمیمات روابطی نیست. غیر از این با اینکه تو جنگ ۸۰ درصد شرکتها تعدیل داشتند. آسیاتک بچه هاشو حفظ کرد و تعدیل نکرد. صادق باشیم😊"
