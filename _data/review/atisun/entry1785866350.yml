description: "تجربه من از فرآیند استخدام این شرکت چندان مثبت نبود. با وجود اینکه در آگهی ذکر شده بود متقاضیان اطراف محل کار در اولویت جذب هستند و محل سکونت من تنها یک خیابان با شرکت فاصله دارد، رزومه‌ام با دلیل «دور بودن محل کار» رد شد. \r\n\r\nاین موضوع باعث شد احساس کنم رزومه‌ها به‌دقت بررسی نمی‌شوند یا فرآیند بررسی توسط منابع انسانی با دقت کافی انجام نمی‌شود. اگر دلیل واقعی رد شدن مورد دیگری بوده، بهتر بود شفاف اعلام می‌شد، زیرا ارائه دلیل نادرست، تجربه نامطلوبی برای متقاضی ایجاد می‌کند. \r\n\r\nامیدوارم شرکت در فرآیند بررسی رزومه‌ها و اطلاع‌رسانی به متقاضیان بازنگری کند تا زمان و انرژی افراد بی‌دلیل هدر نرود."
