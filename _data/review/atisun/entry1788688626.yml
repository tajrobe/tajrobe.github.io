description: "من از ۲۵ تیر وارد شرکت شدم و ۶ روز در تیر ماه در شرکت کار کردم. بعد که چند روز از مرداد ماه گذشت مدیرعامل گفت اون ۶ روز تستی بوده و حقوق پرداخت نمی کنم.\r\nسپس تا ۱۲ مرداد در شرکت بودم و چون معمولا شرکتهایی که از ابتدا به این شکل برخورد می کنند بعدا هم درست حقوق نمی دهند از شرکت بیرون آمدم.\r\nمدیرعامل هیچ حقوقی از ۲۵ تیر تا ۱۲ مرداد به من پرداخت نکرد با اینکه چند بار از او درخواست کردم.\r\nدر ورود و خروج بسیار سخت گیر هست. ساعت کاری شرکت ۸ تا ۱۷ می باشد. البته مدیرعامل می گوید زودتر از ۸ می توانی بیایی. مثلا اگر ۵ روز در هفته ساعت ۷ به شرکت بیایی مدیرعامل می آید و نگاهی بهت می کند که انگار وظیفت بوده که این کار را بکنی و اگر یک روز باقی مانده هفته را مثلا ساعت ۸:۱۰ بیایی مدیرعامل بهت می گوید که دیر میایی برادر.\r\nاضافه کاری به هیچ وجه محاسبه نمی شود. یعنی اگر ۷ صبح بیایی تا ۷ شب حقوق بیشتری دریافت نمی کنی.\r\nپنجشنبه ها اجباری هست و مدیرعامل می گوید چون بانکها پنجشنبه ها باز هستند باید پنجشنبه ها بیایی. ولی انگار مدیرعامل نمی فهمد که بانکها در طول هفته ساعت کاریشان حدود ۷ صبح تا ۱ بعدازظهر است. اونجا مدیرعامل نمیگنه که چون بانکها ساعت کاریشون کمتر هست تو هم کمتر بمون.\r\nدر آگهی جاباینجا ذکر شده که شرکت ۱۱ تا ۵۰ نفره است و این یک دروغ است و شرکت با خود مدیرعامل و یک کارمند بانک رفاه که به زور پنجشنبه های می آید به ۹ نفر هم نمی رسند.\r\nصبحانه هم ارزان ترین مدل نون لواش می باشد با پنیر."
