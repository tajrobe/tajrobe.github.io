description: "اگر قرار باشد مدیریت این مجموعه را در چند کلمه توصیف کنم، «بی‌برنامگی، تبعیض و رابطه‌محوری» مناسب‌ترین توصیف‌ها هستند.\r\nاینجا تخصص و توانایی اهمیت زیادی ندارد؛ مهم اینه که چقدر بلد باشید تعریف و تأیید کنید و به خواسته های نابجا تن بدی. در این فضا، افراد شایسته و متخصص دیده نمی‌شوند، در حالی که افراد متملق و کم‌توان فرصت بیشتری برای دیده شدن دارند.\r\nاز طرف دیگه، حجم کاری زیاده ، حقوق و مزایا بسیار ناچیز و  هیچ ارزشی هم برای زحماتت قائل نمیشن.\r\nدرضمن مدیر این شرکت به خودش اجازه میده با برخی همکاران خانم، رفتار تعرض آمیز و نابجا داشته باشه . ظاهرا اینجا قرار نیست بهترین افراد رشد کنند؛ قرار است افرادی رشد کنند که بهتر بلدند مدیریت را راضی نگه دارند."
