description: "با توجه به تجربه ای که در مورد همکاری با این شرکت محترم دارم اینه که تا جایی که میتونید از خودتون به مدیر شرکت اطلاعات ندید. ایشون به شدت شکاک هستند و به دنبال اطلاعات شخصی و نقطه ضعف از اطرافیانشون هستند. من فکر میکنم با توجه به تجربیات ناموفقی که در همکاری با برنامه نویسان در گذشته داشتند بجای درس گرفتن از گذشته ناموفقشان از اطرافیانشان انتفام میگیرند. با دوربین به شدت چک میشوید صوت و تصویر شنود میشود. سر میز صبحانه نباید زیاد اظهار نظر کنید چون ایشان خوش ندارند نظر کسی را بشنوند. به هیچ عنوان از ایمیل کاری خود روی کامپیوترتان استفاده نکنید ایشان به علت اشتهای زیاد در گرفتن اطاعات از اطرافیان ایمیل های شما را چک میکنند. به شدت روحیه کنترلگر دارند به صورتی که حتی در مورد زندگی شخصی شما اظهار نظرهای توهین آمیزی میکنند. "
