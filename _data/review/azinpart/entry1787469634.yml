description: "تجربه کاری من در شرکت آذین پارت از نظر مدیریت، شرایط شغلی و مسیر رشد حرفه‌ای، تجربه‌ای رضایت‌بخش نبود.\r\nیکی از نکات منفی برای من، عملکرد ضعیف و ناکارآمدی بخشی از مدیریت بود. انتظار می‌رود مدیران علاوه بر مدیریت نیروها، بتوانند دانش، تجربه و مسیر حرفه‌ای مشخصی را به کارکنان منتقل کنند؛ اما در تجربه من، در برخی موارد چنین اتفاقی نمی‌افتاد و حتی گاهی شرایط به‌گونه‌ای بود که نیروی اجرایی مجبور می‌شد بخشی از مسائل تخصصی و کاری را به مدیر آموزش دهد. به همین دلیل، حضور در کنار برخی مدیران عملاً ارزش آموزشی و حرفه‌ای قابل توجهی برای من ایجاد نمی‌کرد.\r\nاز طرف دیگر، مشکلاتی مانند حقوق پایین، نبود مسیر مشخص برای ارتقای شغلی، عدم ثبات کاری، نبود قرارداد رسمی و شفاف، مشخص نبودن دقیق وظایف و شرایط همکاری، پرداخت نشدن یا نامشخص بودن اضافه‌کاری و تأخیر در پرداخت حقوق از مواردی بودند که تجربه کاری را دشوارتر می‌کردند.\r\nدر برخی مواقع نیز مسئولیت‌ها و وظایف بیشتری به پرسنل واگذار می‌شد، بدون اینکه افزایش مسئولیت با افزایش حقوق یا پرداخت اضافه‌کاری متناسب همراه باشد.\r\nموضوع دیگر، نبود چشم‌انداز مشخص برای رشد فردی و حرفه‌ای بود. زمانی که نیروی انسانی احساس کند نه از مدیران امکان یادگیری مناسبی دارد و نه مسیر مشخصی برای ارتقای شغلی و افزایش درآمد پیش روی او قرار گرفته، انگیزه برای ادامه همکاری به مرور کاهش پیدا می‌کند.\r\nهمچنین در تجربه من، توجه کافی به رفاه، انگیزه و احترام حرفه‌ای به کارکنان وجود نداشت و این مسئله در کنار نبود ثبات شغلی، فضای کاری را از یک محیط مناسب برای پیشرفت حرفه‌ای دور می‌کرد.\r\nدر مجموع، نقد اصلی من به شیوه مدیریت مجموعه، ضعف در مدیریت منابع انسانی، نبود شفافیت، ضعف در ایجاد مسیر رشد کارکنان و پایین بودن کیفیت مدیریتی در برخی سطوح است. از نظر من، یک مدیر موفق فقط وظیفه تقسیم کار و نظارت ندارد؛ بلکه باید بتواند برای نیروهای خود ارزش ایجاد کند، آموزش بدهد، مسیر رشد مشخص کند و خودش نیز از نظر تخصص و تجربه، مرجع قابل اتکایی برای تیم باشد.\r\nاین متن صرفاً بیانگر تجربه و برداشت بخش زیادی از همکاران من از دوره همکاری است. توصیه من به افرادی که قصد همکاری با این مجموعه را دارند این است که پیش از شروع کار، درباره قرارداد، حقوق، اضافه‌کاری، شرح وظایف، مزایا، شرایط قطع همکاری و مسیر ارتقای شغلی، توافقات خود را کاملاً شفاف و ترجیحاً مکتوب کنند."
