description: "درود،\r\n\r\nاولین بار که آگهی این شرکت رو در جابینجا دیدم، دستمزد رو ۵۰۰ میلیون تومان ذکر کرده بودند. یک شبی با من تماس گرفتن تلفنی و با بیان کلماتی مثل دلار و ۳۰۰۰ و بهترین رزومه نظرم را جلب کردن و خواستار جلسه آنلاین همان شب شدند.\r\n\r\nپیش از توضیح ماجرای جلسه آنلاین، باید بگویم فردی که با او صحبت تلفنی داشتم از قیمت جابینجا برای ارسال آگهی و نمایش لوگوی شرکت در صفحه اصلی شگفت‌زده بودند و این را صراحتا ابراز کردند گویی تا حالا این کار را نکرده بودند و این با مشخصات پروفایل شرکت که بیش از ۵۰ همکار داشتند در آن زمان در تناقض بود.\r\n\r\nمن به جلسه آنلاین رفتم. اولین چیزهایی که نظرم را جلب کردند کیفیت بد دوربین، صندلی ارزان قیمت، فردی با چهره‌ای غیر موفق بود. اینها در تناقض با ادعای داشتن شرکتی در آمریکا و موفقیت زیاد هستند.\r\n\r\nتا انتهای جلسه ۵ مرتبه اسم «علی» را آوردند و او را مثال زدند. بنظرم آمد «علی» شخصیتی غیرواقعی است. برایم سوال بود چرا از کارمندان دیگری نام نمی‌برند.\r\n\r\nطی جلسه تلاش کردند به صورت کودکانه با بزرگ جلوه دادن اعداد و کلمه دلار نظرم را جلب کنند. این را بارها تکرار کردند.\r\n\r\nراستی، آنها بدون کسب اجازه از بنده، بدون هیچ دلیلی، از صفحه جلسه آنلاین که من هم در تصویر بودم یک اسکرین‌شات گرفتند!\r\n\r\nآقایی که با ایشان جلسه آنلاین داشتم یک پسر ۲۳ ساله بنظر میامدند که طی جلسه آنلاین ناراحتی خود را از عدم استقبال متخصصین از فعالیت کودکانه‌شان ابراز کرد.\r\n\r\nطبق توضیحات ایشان روش کار به این صورت است، رزومه شما را می‌گیرند و با آن در لینکدین اپلای می‌کنند. بقیه فرایند استخدام در آن شرکت بر عهده متخصص است. اگر متخصص موفق به دریافت موقعیتی شود، این شرکت ۷۰٪ درآمد را کسر می‌کند و ۳۰٪ درآمد را به متخصص می‌دهد.\r\n\r\nدر نهایت، جلسه را ترک کردم و آن آقا پسر را در تلگرام بلاک کردم زیرا مدام پیام می‌دادند و پیگیر نتیجه از سوی بنده می‌شدند. فعالیت شرکت به همینجا ختم نمی‌شود...\r\n\r\nپس از مدتی در واتس‌اپ با ۲ اکانت متفاوت به بنده پیام دادند و مجدد همان پیام ثابت و تکراری با این مضمون که رزومه شما دیده و پذیرفته شد را برایم ارسال کردند.\r\n\r\nخلاصه نظر بنده، وقت گذاشتم این ماجرا را بنویسم تا اگر متخصصی برای این شرکت اپلای کرد بداند این شرکت فیک است و قرار نیست شغلی داشته باشد."
