description: "واقعاً جای تأسف داره که مجموعه‌ای مثل بیمه بازار این‌قدر نسبت به نیروی انسانی خودش بی‌توجهه و هیچ شفافیتی در مدیریت و پرداخت حقوق نداره!\r\nبعد از ۸ ماه، هنوز مدل حقوقی مشخص و شفافی وجود نداره و هر بار به یک بهانه و تحت عنوانی جدید، از حقوق نیروها کم می‌شه. انگار هر ماه باید منتظر یک قانون و کسورات جدید باشی، بدون اینکه بدونی دقیقاً بر چه اساسی قراره حقوقت محاسبه بشه!\r\nاز طرفی، نیروی دورکار نه بیمه‌ای داره، نه تجهیزات کاری در اختیارش قرار می‌گیره و نه از مزایای خاصی برخورداره؛ اما در مقابل، انتظار ارائه سفته ۵۰۰ میلیون تومانی ازش وجود داره! واقعاً این حجم از تعهد و مسئولیت از سمت نیرو، در مقابل چه حمایت و تضمینی از سمت شرکت قرار می‌گیره؟\r\nنیروی انسانی فقط زمانی ارزشمند نیست که در حال تولید آمار و صدور باشه! نیروها هم حق دارن امنیت شغلی، حقوق شفاف و رفتار منصفانه داشته باشن.\r\nوقتی شرکتی نه مدل پرداخت شفافی داره، نه مزایایی برای نیروی دورکار در نظر می‌گیره و نه برای حفظ نیروهای قدیمی تلاش می‌کنه، نباید از بی‌انگیزگی و قطع همکاری اون‌ها تعجب کنه.\r\nبیمه بازار باید بدونه که اعتبار یک مجموعه فقط به اسم و تبلیغاتش نیست؛ به نحوه برخوردش با آدم‌هاییه که برای اون مجموعه کار می‌کنن. نیروی انسانی هزینه اضافی نیست که هر وقت لازم نبود، به‌راحتی کنار گذاشته بشه!"
