description: "دوستمون در نظر قبلی درست میگن، اما کامل بلور کاوه را توصیف نکردند، دفتر مرکزی دارآباد با ساختمانی مجلل، دقیقا ساختار نظام خان و رعیت در این مجموعه وجود دارد، حقوق وزارت کار حتی اگر سال‌ها تجربه و مهارت داشته باشید، رقم سفته نجومی، ماشین و خانه سازمانی که به مدیران و افراد باسابقه می دهند، و به محض عدم حرف شنوی از ایشان گرفته و اخراج می شوند و طرف با حقوق وزارت کار هیچ پشتوانه مالی در هنگام خروج نخواهد داشت. فقط نیم ساعت طول می‌کشه که در صف آسانسور بری پایین برای ناهار. چایی به پرسنل داده نمیشود و فقط یکبار در صبح آب جوش می‌آورند، خودت باید از خانه چایی و فلاکس ببری! نظام مدیریت خانوادگی است و جهت بهره کشی از کارگر پی ریزی شده است. \r\nاگر مجبور نیستید و جوان هستید اصلا سمت این شرکت ها نرید این محیط ها سمی هستند و روح و روان تان را داغون میکنند."
