description: "به عنوان برنامه نویس جاوایی که چند سال توی این شرکت کار کرده میگم.\r\nبرادر من خواهر من، عمرت رو تلف نکن توی این شرکت.\r\nتکنولوژی ها قدیمی هست و از بازار کار عقب می‌مونید . اینجا کار کنید به یک روزمرگی عادت میکنید. \r\nاضافه کارهای زیادی داره. حتی خیلی وقتها تعطیلات آخر هفته رو میگیره. توان نمی‌مونه که بخوای روی خودت و پیشرفت خودت و زندگی عادی خودت وقت بگذاری.\r\nمضاف بر این تیم های اولیه توسعه تقریبا همه شون از شرکت رفتند و مدیرانشون ته مونده تیم های توسعه اولیه هستند. برنامه نویسان ضعیفی هستند و اکثرشون چیزی بلد نیستند و اگر بفهمند ازشون چیزی بیشتر بلدید بیچاره تون می‌کنند.\r\nخلاصه اینکه توی کاسپین به معنای واقعی کلمه میسوزید و ازتون استفاده میکنند تا جایی که تموم بشید.\r\nچشم باز میکنید می‌بینید چند سال هست که گذشته و از همه چی عقب می‌مونید."
