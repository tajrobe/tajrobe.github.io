description: "من اگه قبل از ورود به CRM کاریزما این چیزا رو می‌دونستم، واقعاً چند بار بیشتر فکر می‌کردم.\r\n\r\nیه موردی که خیلی برام سواله، بحث مدیریته. توی یکی از نظرات ادعا شده مدیر CRM در محل کار قبلیش درگیر پرونده قضایی و اتهاماتی مثل استفاده از سند مجعول و خیانت در امانت بوده. طبیعتاً من نمی‌تونم صحتش رو تأیید کنم، ولی اگه همچین موضوعی واقعاً وجود داشته، سوال اینه که سوابق مدیر موقع انتخابش چقدر بررسی شده؟\r\n\r\nحالا اینو بذارید کنار خروج مداوم نیروهای خوب، حاشیه، رفتارهای غیرحرفه‌ای و شکایت از مدیریت ضعیف. یه جایی دیگه آدم میگه شاید مشکل فقط «نیرویی که رفت» نباشه، شاید باید خود مدیریت هم یه نگاهی به عملکردش بندازه.\r\n\r\nاز بیرون شرکت بزرگ و شیکه؛ بیمه، حقوق به‌موقع و صبحانه هم سر جاش. ولی اینا قرار نیست جواب بدن که چرا بعضی نیروهای خوب ترجیح میدن برن.\r\n\r\nخلاصه قبل از اینکه جذب ظاهر قضیه بشید، درباره خود CRM و مدیرش از چند نفر که واقعاً اونجا کار کردن پرس‌وجو کنید. چون صبحانه رایگانه، ولی اعصاب آدم رایگان نیست! :))"
