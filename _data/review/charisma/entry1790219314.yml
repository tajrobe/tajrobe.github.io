description: "سی آر اِم کاریزما واقعا نوبر هست.\r\n\r\nیه آدم که از اولین محل کارش  پرونده ی قضائی داشته و متهم به استفاده از سند مجعول و خیانت در امانت بوده رو گذاشتن مدیر crm ، اون هم اومده دو تا از رفیق هاش که توی شرکت قبلیش همکارش بودن و حتی ابتداییات بازار سرمایه رو نمیدونستن و یکیشون حتی سجام هم نداشت ، براشون پست ایجاد کرده و چپونده توی این شرکت .\r\n\r\nکلا سمت crm کاریزما نیاید ، رفتارشون حرفه ای نیست و باندبازی و رفیق بازیه نه شایسته سالاری ، از طرف دیگه حقوق و مزایای مناسبی نسبت به فشار کاری که میارن نمیدن . دروغای شاخدار مدیرش هم که واحد رو با دبستان اشتباه گرفته و تعادل رفتاری نداره و هر روز یک سیاست به کار میگیره و دهن بین هست هم به کنار‌‌‌. \r\n\r\nمار خوش خط و خالی هست که خودش رو مهربون و نایس نشون میده ولی پشت لبخندش شیطنت و خباثت پنهان شده . عوض این که پخته عمل کنه ، خیلی خاله زنک هست و حرف جابجا میکنه بین کارمندانش .\r\n\r\nهرروز هم توی واحد یا دعواست یا حاشیه . \r\nبرای یک روز هم این واحد رو انتخاب نکنید و وقتتون رو تلف نکنید . یک مدت میمونین و بعد فرار میکنین از دست مدیر crm .\r\n هزار ماشالا همیشه هم در به در دنبال نیرو هستن ولی کسی سمتشون نمیاد و بحران نیروی انسانی دارند ، اگرم کسی اشتباه کنه و بیاد crm کاریزما ؛ یه مدت میمونه و بعدش در میره ، واحدشون مثل ترمیناله و نرخ ماندگاری نیروی انسانی شون پایینه . از دی به بعد ۶ تا نیرو گرفتن ، ۳ تاشون که بهترین rate ها رو توی QC داشتن فرار کردن از شرکت و دیگه با شرکت تمدید نکردن یا استعفا دادن . اول یک دختر که به دلیل برخورد زشت سوگلی های مدیر ، استعفا داد . دومی هم بهونه آورد و دیگه تمدید نکرد .\r\nآخرین قربانی هم از نیرو های شیفت عصر بود , این بیچاره از نخبه های دانشگاه تهران بود و تحصیلات مرتبط با مالی داشت ، کاملا همه چیز تموم بود و حتی با این که سابقه نداشته توی واحد crm و  کسی نتونسته بود ، برای اولین بار ۳ دوره  توی QC های سخت گیرانه ی خانم ، اول شد ، از بس مدیر ( خانم شین . میم ) و سوگلی های مدیر توی شیفت عصر اذیتش کردن و فضا رو مسموم کردن ، به محض این که ۳۱ شهریور قراردادش تموم شد ، به صورت کاملا ناگهانی وسایلش رو جمع کرد و دمش رو گذاشت روی کولش و فرار کرد . \r\nبعدش جالبه طرف با دیپلم یا تحصیلات غیر مرتبط با مالی و بازار سرمایه رو میگذارن راحت کارش رو توی واحد ادامه بده و حتی ترفیع هم میدن . \r\nکم ندیدم نیروی خوبشون به خاطر محیط سمی بزاره بره ؛ احتمالا چون این خانم میترسه نیرو هاش پیشرفت کنن یا بزرگتر از خودش بشن ، یهویی حسودیش میشه و اون قدر شخص رو تحت فشار میزاره و جو رو با خاله زنک بازی هاش مسموم میکنه که طرف یا استعفا بده یا این که مثل این پسره تا قراردادش تموم شد در بره . \r\n\r\nواقعا لقب مدیر کوتوله برازنده ی این خانم هست . \r\n\r\nتوی کاریزما از دور همه چیز قشنگه و اسم و رسم داره ولی در بحرش که میری واقعا داغونه ."
