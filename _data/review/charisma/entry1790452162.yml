description: "امروز هم یکی دیگر از نیروهای قوی و کاربلد شیفت صبح CRM ترجیح داد عطای ماندن را به لقایش ببخشد و از مجموعه جدا شود.\r\nنیرویی که تیمش سه بار پشت سر هم در QC اول شده بود و خودش از مسلط‌ترین کارشناسان ارشد حوزه بیمه در کاریزما بود؛ اما ظاهراً این روزها «عملکرد» و «تخصص» همیشه به اندازه کافی برای ماندن در یک مجموعه ارزشمند نیست!\r\nاز طرفی، وقتی برای بعضی رفتارهای حاشیه‌ای، به جای تذکر و مدیریت، فضا باز باشد، نتیجه چندان عجیب نیست. مخصوصاً وقتی حتی سابقه حاشیه‌هایی مثل ماجرای آقای «س.ح» از شیفت عصر و تلاش برای تخریب این نیرو هم وجود داشته باشد؛ از جمله اینکه گفته می‌شود س.ح در حضور مدیر CRM نیز علیه این نیروی ارشد صحبت کرده و تلاش داشته جایگاه و عملکرد او را زیر سؤال ببرد. س.ح چند روز پیش نیز با رفتارهای زشت و غیرحرفه‌ای خود باعث شده بود یکی دیگر از نیروهای برتر و با انگیزه ی شیفت عصر ، پس از اتمام قرارداد، به‌سرعت از واحد خارج شود.\r\nاینکه چنین رفتن‌هایی صرفاً به «انتخاب شخصی» نیروها نسبت داده شود، ساده‌انگارانه است؛ به‌ویژه وقتی الگوی تکرارشونده‌ای از بی‌توجهی به حاشیه‌ها، فرسوده‌کردن نیروهای مؤثر و ضعف در مدیریت فضای کاری دیده می‌شود.\r\n مسئولیت مدیر CRM فقط ثبت خروج نیروها نیست؛ بلکه باید درباره چرایی این خروج‌ها و نقشی که شیوه مدیریت در شکل‌گیری آن‌ها داشته است نیز پاسخ‌گو باشد.\r\nتبریک ویژه به این سبک مدیریت؛ سبکی که ظاهراً خیلی خوب بلد است نیروهای مؤثر را خسته کند، حاشیه‌ها را جدی نگیرد و در نهایت کاری کند که آدم‌های توانمند خودشان درِ خروجی را پیدا کنند!\r\nواقعاً چه بهتر از این؟\r\nیک تیم قوی بسازید، آدم‌های توانمند جذب کنید، با عملکردشان نتیجه بگیرید و بعد جوری فضای کاری را مدیریت کنید که همان آدم‌ها یکی‌یکی ترجیح بدهند بروند!\r\n\r\n"
