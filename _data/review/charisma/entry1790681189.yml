description: "اگر قصد دارید برای CRM کاریزما اپلای کنید، قبل از تصمیم نهایی فقط به اسم شرکت و حقوق و مزایا نگاه نکنید؛ درباره خود واحد هم تحقیق کنید.\r\n\r\nچیزی که من شخصاً در مدت حضورم دیدم، جابه‌جایی مکرر نیرو و نیاز مداوم به جذب نیروی جدید بود. خروج نیرو در سطوح مختلف به صورت غیر طبیعی اتفاق می‌افتاد و تا جایی که من مشاهده کردم، در بسیاری از موارد بعد از گذشت چند ماه ، خود افراد ترجیح می‌دادند یا استعفا دهند یا بعد از پایان قرارداد ادامه ندهند، نه اینکه قطع همکاری از جانب شرکت باشد.\r\n\r\nحجم کار هم کم نیست؛ تعداد طرح‌ها، صندوق‌ها، بیمه‌ها و سرویس‌هایی که باید پشتیبانی بشن بالاست. بنابراین حقوق رو در کنار حجم مسئولیت و فشار کاری و همچنین فضایی که ممکنه برای برخی افراد مسموم یا غیرحرفه‌ای به نظر برسه بسنجید؛ مخصوصاً اینکه با حدود همین سطح دریافتی، گزینه‌های شغلی دیگری هم در بازار وجود داره.\r\n\r\nاز نظر فرهنگ کاری هم تجربه من چندان مثبت نبود. در طول حضورم مواردی از ادبیات توهین‌آمیز و فریاد و فحاشی نسبت به خودم شنیدم و حتی در بعضی جمع‌های غیررسمی، تا جایی که من شاهد بودم، بدگویی و فحاشی پشت سر مدیر هم اتفاق می‌افتاد.\r\n\r\nنکته‌ای که برای من مهم‌تر بود، نحوه برخورد مدیریت واحد crm با این رفتارها بود. چیزی که من مشاهده کردم این بود که مرزبندی و برخورد مؤثر و مستمری با رفتارهای غیرحرفه‌ای به چشم نمی‌خورد؛ در نتیجه به نظر می‌رسید بعضی رفتارها عملاً به بخشی از فضای روزمره تیم تبدیل می‌شدند. از نگاه من، این موضوع می‌تونه علاوه بر رفتار افراد، به شیوه مدیریت و فرهنگ تیم هم مرتبط باشه؛ چون مدیریت یک تیم فقط تقسیم کار و پیگیری عملکرد نیست، بلکه تعیین استاندارد رفتاری و حفظ چارچوب و اخلاق حرفه‌ای هم هست.\r\n\r\nدر مورد همدلی تیمی هم چیزی که من تجربه کردم با تصویری که از یک تیم کاملاً همدل انتظار میره فاصله داشت. صحبت از همدلی وجود داشت، اما در تجربه من همیشه همکاری، حمایت و همراهی پایداری که از یک تیم همدل انتظار میره دیده نمی‌شد. به بیان ساده‌تر، برای من همدلی بیشتر در حد یک شعار به نظر می‌رسید تا چیزی که بتوانم در همه موقعیت‌ها روی آن حساب کنم.\r\n\r\nآنبوردینگ هم از بخش‌هایی بود که به نظرم جای کار جدی داشت. تجربه من این بود که فرآیند ورود نیروی جدید، انتقال اطلاعات و آموزش اولیه می‌تونست ساختارمند، شفاف‌تر و منظم‌تر باشه.\r\n\r\nموضوع دیگری که برای من قابل توجه بود، نحوه محاسبه ساعات اضافه‌کاری بود. در تجربه من، شفافیت کافی درباره اینکه ساعات اضافه‌کاری دقیقاً با چه مبنایی محاسبه می‌شوند، چه ساعاتی مورد تأیید قرار می‌گیرند و مبنای نهایی محاسبه چیست ، وجود نداشت ؛ تا جایی که من به خاطر دارم، مدیر گفته بود هر ماه فایل دقیق نحوه محاسبه اضافه‌کاری را ارائه می‌دهد، اما چهار ماه گذشت و این وعده در حد حرف باقی ماند . به نظرم این موضوعی است که بهتره قبل از شروع همکاری، کاملاً شفاف از منابع انسانی یا مدیر مربوطه پرسیده بشه. \r\n\r\nالبته این‌ها تجربه شخصی منه و نمی‌تونم ادعا کنم رفتار همه افراد یا تمام زمان‌ها همین بوده. اما اگر احترام متقابل، فرهنگ سازمانی سالم، مدیریت منسجم، شفافیت مالی و فرآیندهای حرفه‌ای براتون مهمه، این بخش‌ها رو حتماً قبل از ورود بررسی کنید.\r\n\r\nدر مورد وعده‌های زمان جذب هم پیشنهاد می‌کنم همه‌چیز رو شفاف بپرسید؛ از شرح وظایف و مسیر رشد گرفته تا شرایط تمدید قرارداد . ممکنه چیزی که در زمان مصاحبه درباره شرایط کار مطرح میشه خیلی جذاب باشه ، اما در عمل به شکل دیگری پیش بره. بنابراین صرفاً به صحبت‌های جلسه جذب اکتفا نکنید؛ چون ممکنه بعضی وعده‌ها بعد از جذب نیرو، از نظر من، به‌طور کامل پیگیری نشوند یا به فراموشی سپرده بشن .\r\n\r\nدر نهایت، قبل از قبول پیشنهاد خیلی حساسیت به خرج بدید، چون موضوع مهمیه و قراره وقت و انرژی‌تون رو بذارید.\r\n\r\nحقوق و مزایا رو توی آگهی استخدام می‌نویسن؛ اما اینکه هر روز قراره در چه فضایی و با چه ادبیاتی کار کنید، چقدر همکاری واقعی بین اعضای تیم وجود داره، فرآیند ورودتون چقدر حرفه‌ایه و وعده‌های زمان جذب چقدر در عمل محقق میشن معمولاً توی آگهی نوشته نمی‌شه..."
