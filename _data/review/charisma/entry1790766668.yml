description: "گروه مالی کاریزما جای خوبی واسه کار کردنه و توش امکان یادگیری و اینا وجود داره ولی نکاتی هم هست که گاهی بسیار آزار دهنده س و روح و روان آدمو… \r\nاولیش زمان پرداختی ها س، مثلا اخیرا اومدن گفتن زمان پرداخت کارانه هر ۴۵ روز اما نه تنها پرداخت ۴۵ روزه نداشتن بلکه فصل هم که تموم میشد ده بیست روز بعدش شاید کارانه بدن، این خیلی غیرمنصفانه س چون آدما توی این شرایط اقتصادی رو تک تک درآمدا شون حساب میکنن .پس اگه زمان پرداخت منظم براتون مهمه اصلا سمت کاریزما نیا\r\nوام و اینا هم عملا هیییییچی نداره، کلا اعتقادی به وام دادن به بچه‌ ها ندارن با اینکه به سادگی از محل مانده حساب‌ بانکیشون میتونن برای بچه ها وام بگیرن\r\nمدیرای ارشد شرکت آدم حسابین اکثرا، البته بینشون آدمای فضول مذهبی و وصل حکومتی هم کم نیست که متاسفانه کاملا هم دستشون بازه.\r\nواسه انتخاب بین واحدای شرکت هم ابدا ارتباط با مشتریان رو انتخاب نکنید چون هم فضا به شدت مسمومه هم مدیر با دو سه تا سوگلی خودش خوبه فقط\r\nچیز دیگه ای که بسیار رو مخه اینه که فضای نفرت پراکنی و زیرآب زنی بین صغیر تا کبیر این شرکت وجود داره و از کارشناسا تا مدیرا و حتی مدیرعاملا اکثرا این مدلین\r\nشرکت نهار و صبحانه داره و کیفیتشم خوبه\r\nواسه پرداخت اضافه کاری اذیت میکنن گاهی\r\nجای شرکت خوبه و خوش مسیره به خصوص برای مترو\r\nرنج حقوقی هم متوسط به پایینه\r\n"
