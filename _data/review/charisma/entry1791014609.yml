description: "حرف دوستمون به نظرم بیراه نیست. چیزی که من از نزدیک در CRM دیدم، با تصویری که ممکنه قبل از ورود از یک محیط حرفه‌ای داشته باشید، فاصله داره.\r\n\r\nاینجا بعضی رفتارها که در یک محیط کاری معمولاً باید خط قرمز محسوب بشن، کم‌کم عادی میشن. داد زدن، برخورد تند و حتی بی‌احترامی از طرف مدیر، سرپرست یا دیگر همکاران، لزوماً با واکنش جدی روبه‌رو نمیشه. انگار صرفِ اینکه کسی جایگاه مدیریتی یا ارشد یا سابقه بیشتری داشته باشه، باعث میشه رفتار اشتباه خودش رو به حق بدونه؛ چه در اون لحظه حق باهاش باشه، چه نباشه.\r\n\r\nاز طرفی، چیزی که برای من آزاردهنده بود، نحوه برخورد مدیریت با حواشی داخل مجموعه بود. در مواردی احساس می‌کردم به جای اینکه موضوعات در همان چارچوب حرفه‌ای و محرمانه مدیریت بشن، بعضی صحبت‌ها و مسائل بین افراد بازتاب پیدا می‌کنه و همین موضوع باعث شکل‌گیری یا تشدید حاشیه‌ها میشه. به نظرم در جایگاه مدیریتی، اینکه چه چیزی به چه کسی گفته میشه و چه موضوعی اصلاً نباید از اتاق مدیریت خارج بشه، اهمیت زیادی داره؛ چون یک جمله یا انتقال یک صحبت می‌تونه خیلی راحت یک مسئله کوچک رو به یک حاشیه بزرگ تبدیل کنه.\r\n\r\nبرای همین به برخورد خیلی خوب و صمیمی روز مصاحبه اکتفا نکنید. فضای واقعی یک واحد رو معمولاً بعد از شروع کار می‌فهمید، نه پشت میز مصاحبه.\r\n\r\nیک نکته قراردادی هم هست که بهتره قبل از امضا جدی بگیرید. در قراردادی که به ما ارائه شد، برای استعفا در دوره آزمایشی شرایط مالی مشخصی وجود داشت؛ از جمله پرداخت هزینه آموزش و محدود شدن پرداختی‌ها و مزایا طبق مفاد قرارداد. یعنی اگر بعد از ورود متوجه شدید این محیط چیزی نیست که دنبالش بودید، خروج از آن الزاماً بدون هزینه نیست. پس قرارداد رو سرسری امضا نکنید و بندهای مربوط به دوره آزمایشی و استعفا رو دقیق بخونید.\r\n\r\nبرای بچه‌های مالی، اقتصاد، بازرگانی و مدیریت هم یک نکته رو جدی میگم: اگر یکی از انگیزه‌هاتون از ورود به CRM اینه که بازار سرمایه رو لمس کنید و از افراد باتجربه چیز یاد بگیرید، خیلی روی وعده‌های جلسه جذب حساب باز نکنید. بین چیزهایی که گفته میشه و چیزی که واقعاً در طول کار اتفاق میفته، ممکنه فاصله زیادی وجود داشته باشه.\r\n\r\nاز طرف دیگه، اسم «شرکت خدمات بازار سرمایه» نباید این تصور رو ایجاد کنه که تمام افرادی که در CRM با مشتری در ارتباط هستن، الزاماً از نظر دانش مالی و بازار سرمایه در یک سطح حرفه‌ای قرار دارن.\r\n\r\nترکیب نیروها می‌تونه خیلی متفاوت باشه؛ حتی افرادی با تحصیلات کاملاً غیرمرتبط ممکنه در جایگاه کارشناس یا مشاور قرار بگیرن. داشتن مدرک غیرمرتبط به خودی خود ایرادی نداره، اما وقتی چنین فردی مستقیماً با مشتری و تصمیم‌های مالی اون در ارتباطه، سطح دانش و توانایی حرفه‌ای اهمیت خیلی بیشتری پیدا می‌کنه.\r\n\r\nچون در نهایت مشتریه که ممکنه بر اساس حرف و راهنمایی اون فرد تصمیم مالی بگیره. اگر دانش کافی وجود نداشته باشه و مشاوره دقیق ارائه نشه، اشتباه فقط یک اشتباه کاری ساده نیست؛ می‌تونه روی تصمیم مالی مشتری اثر بذاره و حتی احتمال زیان مالی ایجاد کنه.\r\n\r\nنمیگم حتماً نرو. میگم قبلش خوب تحقیق کن.\r\n\r\nاحتمالش هست چیزی که یک فرصت شغلی خوب به نظر میاد، در عمل از نظر زمان، اعصاب و انرژی، ارزش هزینه‌ای که براش می‌پردازید رو نداشته باشه."
