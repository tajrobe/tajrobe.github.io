description: "در خصوص پیام های اخیری که راجع به واحد CRM گذاشتن، لازم میدونم یکسری از تجربیات خودم رو با همه عزیزان در میون بذارم. \r\nاول اینکه با تمام احترامی که به ثبت کنندگان نظرات قائل هستم، بهتره برای رعایت انصاف، پیش از اینکه کسی بخواد تجربه خودشو اعلام کنه، اینم ذکر کنه که چند سال سابقه کار داشته و تا حالا موفق به فتح کدوم تپه ها شده که همه بدونن چه ضریب اطمینانی رو باید به نظر اون فرد اختصاص بدن. بماند که 90درصد نظرات اخیر رو مشخصا فقط یک نفر نوشته.\r\n\r\nبنده با حدود 8سال سابقه کار، قبلا یه مدتی تجربه کار با مدیر فعلی این شرکت رو داشتم. پس بد نیست که بدون هیچگونه اغراقی، اقدامات ایشون رو از زمان ورودشون به کاریزما بهتون بگم و قضاوت رو به خودتون محول کنم: 1. طبقه‌بندی کارشناسان بر حسب شایستگی دانشی/رفتاری; هر چند که در ابتدای امر مشاوره‌های نادرست منابع انسانی باعث شده بود جایگاه یکی دو نفر بالا پایین بشه. 2. احقاق حقوق ضایع شده واحد سی ار ام و بالا رفتن جایگاه CRM در هلدینگ کاریزما. 3. مهیا کردن فرصت های شغلی و ترقی برای کارشناسان در درون خود CRM و همچنین در بین سایر بخش‌های درون سازمان. 4. پیگیری‌های مصرانه جهت استفاده از جدیدترین ابزار لازم در CRM مثل استفاده از چت‌بات دارای هوش مصنوعی، تهیه لپ‌تاپ‌ و هدفون های جدید برای تسهیل در برقراری ارتباط بین کارشناس و مشتری. 5. فراهم کردن دوره‌های آموزشی مربوط به واحد ارتباط با مشتریان. «همون دوره هایی که اون عزیز دل به اصطلاح نخبه دانشگاه تهران، توش چاپلوسی مدیرشو میکرد که ترفیع بگیره ولی تا دید از این خبرا نیست، بار و بندیلشو بست و بعدش اومد اینجا از زبون افراد مختلف، چندتا کامنت بی‌شرمانه گذاشت.» و کلی کار دیگه تو جنبه‌های سی ار ام، مارکتینگ و تجربه کاربران انجام داد و حداقل تا وقتی که ما بودیم، عملا زندگیشو وقف بهبود این واحد و بچه‌هاش کرده بود.\r\n\r\nاینکه یکسری از افراد داخل این بخش صلاحیت و شایستگی حضور در این شرکت، این مدیریت و این کارشناسان خونگرم و زحمتکش رو نداشتن و با چاپلوسی، حاشیه‌سازی و زیرآب زنی، قصد داشتن ره صد ساله رو یه شبه برن، حقیقتیه که نمیشه کتمانش کرد. ولی اینکه این صفات رو همون افراد حاشیه‌ساز و خود نخبه دان، که صدقه سر همین مدیر فعلی، دیگه رزومه کاریشون خالی نیست و بالاخره یه سابقه کاری واسشون رد شد، دارن به افراد فداکار و دلسوز این واحد نسبت میدن، بی انصافیه و نمک‌نشانسی."
