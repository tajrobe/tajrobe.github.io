description: "دوست عزیز ، یکی از نظرات برای بنده بود ، که کاملا محترمانه بود و البته کمترین ارتباط رو به مدیر محترم واحد داشت . \r\n\r\nبنده خاک پای همه ی بچه های  crm هستم ، علی الخصوص بچه های بامرام شیفت صبح و ادعایی هم ندارم ؛ این که چند تا از دوستان لطف داشتن و این تعابیر رو به کار بردن ، نظر لطفشونه و من هم قطعا لایق نیستم . پرونده و سابقه ی من هم توی استعداد های درخشان مشخصه ، هر چند نخبه از نظر شما شاید کسی باشه که لیسانس ردی باشه و افتخارش این باشه که با ۳ ترم مشروطی و  به زور نقص های قانونی تونسته باشه لیسانسش رو بگیره ... \r\n\r\nاین که رفتن من از اونجا باعث شده یک سری زخم کهنه سر باز کنه و حرف هایی زده بشه و افراد بخوان پشت من قایم شن و همزمان با خروج خودخواسته ی من این نظرات رو گذاشتن تا از آب گِل آلود ماهی بگیرند که به پای من نوشته شه ، من مقصرش نیستم . همه هم از ارادت قلبی من به مدیر محترم واحد خبر دارند که بفهمند یکسری نظرات برای بنده نیست و با ادبیاتم متفاوته مگر ذهن های غرض ورز ، متوهم توطئه و کینه توز . \r\n\r\nشما مشخصه خیلی وقته از واحد و فضاش دور بودید خودتون هم اشاره کردید که قبل تر و در گذشته با مدیر محترم واحد کار کردید ، من ارتقاءم رو همون اردیبهشت ماه گرفتم و نیازی به ارتقاء نداشتم ، از همون روز اول هم ایشون به بنده لطف داشتن که این موضوع اسباب حسادت همکاران رو فراهم کرد و روز های آخر با فحاشی به بنده و عدم همکاری برای حل مشکل مشتری که پشت خط منتظر بود ، خودش رو نشون داد و من رو به نتیجه ی قطع همکاری و عدم تمایل به تمدید رسوند . \r\n\r\nجالب این هست که میگید قبل تر و درگذشته با مدیر واحد همکاری داشتید و الان همکاری ندارید اما از علت خروج بنده در چند روز قبل اطلاع دارید !؟ که همین تناقض ، صحت و انصاف ادعاهای شما رو زیر سوال میبره . \r\n با توجه به عدم حضورتون در واحد طبق فرمایش خودتون ؛ از نظر اخلاقی کار درستی نیست وقتی از موضوعی مستقیما اطلاع ندارید این گونه اظهار نظر کنید و این بحث های خبر چینی دور از شان شماست .\r\n\r\nفکر میکنم صفت خودشیرین برازنده ی کسی هست که از واحد خارج شده و در جریان ریز ماجرا ها نیست ؛ ولی خودش رو میندازه وسط و بر اساس واقعه ای که یک طرف ماجرا رو شنیده قضاوت میکنه و این قدر بد از مدیرش دفاع میکنه که ناخواسته علیه مدیرش حرف میزنه . \r\n\r\nضمن این که اگر اهل زیرآب زنی بودم ، خیلی موارد بود که میشد گفت ؛ اما امانت داری کردم تا همکارم که اخراج نشه و آبروش نره .\r\n\r\nعلاوه بر اون ، سی آر ام کاریزما ، چنان آش دهن سوزی هم نیست که بخوام به خاطرش زیرآب کسی رو بزنم  ، شاید کافر همه را به کیش خود پندارد ... خدا رو هزار مرتبه شکر مشکل امریه‌ی سربازی هم ندارم که بخوام برای حفظ موقعیتم و گرفتن امتیاز به کسی متوسل بشم و سرم بلند هست ... \r\nکسی اهل زیرآب زنی هست که چیزی برای ارائه نداشته باشه ، الحمدلله کارنامه ی عملکردی قوی ای دارم که نیاز به این حرکت ها نداشته باشم . \r\n\r\nاغلب مواردی هم که اسمشو میزارید چاپلوسی یا خودشیرینی ، کار هایی بود که خود مدیر محترمه ، به بنده سپردند و دستور دادند که انجام بدم و با هماهنگی و استقبال ایشون بوده ، من هم بدون چشم داشتی ، با جان و دل و البته افتخار انجام دادم تا به اندازه ی توانم قدردان زحماتشون باشم و مدیون دلم نباشم ...  حالا این که کوتَه فکر هستید و این موارد انسانی و اخلاقی برای شما و یک سری دوستانتون قابل فهم نیست و چیز دیگری برداشت میکنید ، مسئولیتش با من نیست . \r\n\r\nنصف فحش ها و توهین هایی هم که از دوستان به قول شما صمیمی و گرم  خوردیم به دلیل این بود که پشت سر  و در غیاب مدیر محترم واحد ازشون دفاع میکردیم و با دوستان یک تیم نشدیم که به مدیر فشار بیاریم یا اعتراض الکی کنیم .  \r\n\r\nجهت اطلاع اون آموزش ها و دوره های توسعه فردی هم که میفرمایید بعد از ارتقاء بنده ارائه شدند ، پس شرکت در اون ها به انگیزه ی ارتقاء نبوده ، من هم چون عاشق این کار بودم ( جدای از اتمسفر سمی واحد ) علی رغم توهین ها و تمسخر های همون کارشناسان گرم و صمیمی واحد ، نشستم دوره ها رو دیدم و در آزمون ها شرکت کردم . البته مدیر محترم هم لطف داشتند و هدیه ای دادند و تشویق کردند .\r\n\r\nچه فرهنگ بزرگ منش و باشعوری که وقتی کسی دوره ی پیشنهادی و اختیاری مدیر رو با عشق و علاقه و شوق و ذوق می بینه و اول میشه توی امتیاز ها ، یکی از افراد باسابقه و مدعی بهش میگن میخواستی خودت رو عزیز کنی که این کار ها رو کردی ! \r\n\r\nدر ثانی ، اگر به قول شما بنده زیرآب زن و حاشیه ساز بودم و منطبق با فرهنگ اصیل سازمانی واحد شما نبودم ، وای به حال مدیری که بعد چند ماه کار کردن هم چنین نیرویی رو نشناخته و چند بار باهاش تمدید کرده و ارتقاءش هم داده و باز هم دنبال تمدید باهاش بوده و ازش تقدیر لسانی و عملی هم کرده ... \r\n\r\nمنّتی هم سرم نیست ، همزمان با کاریزما ، از دو جای دیگه پیشنهاد کار داشتم که اشتباه کردم اومدم توی چنین واحد پر حاشیه ای از کاریزما ، تعجیل مدیر محترم بود که یک هفته بعد از شروع فرایند اولین مصاحبه ، وقتی حتی بعد از جلسه ی آخرین مصاحبه نرسیده بودم منزل ، خواستند قرار داد ببندن . \r\n\r\n\r\nمن که به خاطر فرهنگ غنی سازمانی ، گوشم از فحاشی دوستان گرم و صمیمی تون پر هست ، شما اگر واقعا دلسوز و مدافع مدیر محترم هستید ، به دوستان خونگرم تون یاد بدید ، هنگام خشم و فشار تیکت ، به والدین شریف مدیر محترمه که از تبار سادات هم هستن ، توهین نکنند که حال آدم بد نشه از اون فضای منفی که مجبور شه ازش خارج شه و حرمت مدیر رو پشت سر مدیر هم حفظ کنند .\r\n\r\nفکر میکنم بی شرمی واقعی این هست که جلوی مدیر احترام بگذاری و پای سفره ش بشینی ولی پشت سرش حرمتش رو نگه نداری .  \r\nنمک نشناسی این هست که پشت مدیر شایعه و تهمت توی شیفت پخش کنی و جلوی روش بله قربانگو باشی . \r\n\r\nنمک نشناسی و بی شرمی این هست که از نفوذتون و اعتماد مدیر سابقتون توی crm سوءاستفاده کنین و به واحد های دیگه فشار بیارین که صدای ضبط شده ی کارشناس و دوست صمیمی تون که حرفای نامربوط به مشتری زده رو از سرور حذف کنین تا از مدیر پنهانکاری کنین ؛ شاید به دلیل همین روحیه است که از کنترل شرکت با دوربین هراس دارید و این گونه نظارت ها رو از معایب شرکت میدونید . \r\n\r\nشاید هم به این خاطر از کنترل شرکت با دوربین بدتون میاد که مشخص نشه دوستانتون به بهونه ی استِیت ماموریت ، میرن سیگار میکشند و یک کارشناس بیچاره رو تحت فشار میزارن روی تماس و چت . \r\n\r\nفرمایش شما در مورد کارشناسان خونگرم هم کاملا درسته ، دوستان در حدی خونگرم و دلسوز هستند که اگر هم کارشناسی حواسش نباشه روی خط هست و صداش داره ضبط میشه و به مشتری حرف نامربوط و بد بگه  ، همه دست به دست هم میدن تا اون ویس رو از سرور حذف کنند تا مدیر متوجه نشه . البته اگر این اتفاق بیفته ، خدا رو شکر که هیچ وقت از این اتفاقات توی crm نیفتاده ! . \r\n\r\nضمنا همین پیام شما که به خاطر سابقه ی کار ، به حساب خودتون دارید تحقیر میکنید و نگاه بالا به پایین دارید و هیچ بهانه ی دیگری برای تخریب پیدا نکردید ، تایید کننده ی ذهنیت و فضای سمّی و ادبیات نامحترم حاکم بر اتمسفر اون واحد هست که در نظرات دوستان نوشته شده ، که به خاطر سابقه ی بیشتر به خودتون اجازه میدید هم چنین ادبیات و نگاهی داشته باشید و حتی سر نیروی به گمان خودتون تازه کار ، منّت بگذارید . \r\n\r\nسابقه ی کارم رو هم دوستان خبرچین اشتباه به عرضتون رسوندن . هر چند که سابقه چه ۸ سال باشه ، چه ۸ ماه باشه ، چه ۸ روز باشه ، حقیقت ، حقیقته و برخی واقعیت هایی که دوستان توی نظرات قبل گفتند تغییر نمیکنه و با این فرافکنی ها و ربط دادن گودرز به شقایق نمیشه ازش فرار کرد ... بالفرض بنده تازه کارم ، بقیه ی دوستان و نظرات چه ؟! \r\n\r\nخوشحالم که این پیام رو نوشتید تا مهر تاییدی بگذارید به نظراتی که دوستان روز های گذشته داشتند ، اگر کسی نظر های قبل و نظر شما رو بخونه کاملا متوجه فضای رفتاری و اخلاقی حاکم میشه و میفهمه وقتی وارد اون واحد بشه با چه ماجرا ها و حرف هایی روبرو خواهد شد و راحت میتونه قضاوت کنه که به جنگ اعصاب و بی احترامی و مِنَّتش می ارزه ریسک کنه وارد واحد بشه یا خیر . \r\n\r\n روند پاک کردن صورت مسئله و توهم بزنیم که همه ی نظرات رو یک نفر نوشته و موضوع رو شخصی کنیم و به طرف تهمت و برچسب بزنیم ، راحت ترین و دم دستی ترین کار هست . کاش یاد بگیریم به جای پاک کردن صورت مسئله ، خود مسئله و خطاهای رفتاری و حرفه ای را اصلاح و حل و فصل کنیم ."
