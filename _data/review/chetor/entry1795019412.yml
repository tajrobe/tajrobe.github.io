description: "شرکت کشتیرانی خدمات دریایی ستاره شرکت فامیلی، مدیریت میلی. در صورتیکه در این شرکت، پارتی ندارید اصلا اجازه پیشرفت هم ندارید. مدیران، همگی ظالم و حق خور. پاداش کار خوب یا اضافه کاری رو پرداخت نمی کنن، اعتراض هم بکنین، بهتون انگ می چسبونن که بهشون بی احترامی کردین. دختران مدیرعامل و رئیس هیئت مدیره هم در این شرکت شاغلن ولی بیشتر اوقات سال رو در مرخصی یا دنبال قر و اطوار خودشون هستن و کارشونو سر واحدهای دیگه می ریزن. مدیر مالی هر ده دقیقه یکبار می ره سیگار، ولی پرسنل رو به خاطر کلاً ۱۰ دقیقه تاخیر در روز، بازخواست می کنه و بخاطر استراحت های زیاد ایشون، وظایف واحد مالی هم روی هوا می مونه و در نهایت سر بقیه واحدها خالی می شه."
