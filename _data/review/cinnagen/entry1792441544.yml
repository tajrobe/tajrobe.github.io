description: "سرپرست پورعلی زنی مطلقه که باروابطی که مدیران داره جایگاه خودشو حفظ کرده کسی که با خونواده خودش هم قطع رابطه است و کاملا زن ستیز و هیچ دوستی نداره همه به اجبار باهاش خوبن و فقط نقش بازی می کنند.\r\nسرپرست امیری محمودی غفاری که به دخترهایی که باهاشون وارد رابطه بشن بها میده که امنیت شغلی داشته باشن و همه کسانی که در قسمت بسته بندی تونستن چندین سال بمونن با باج دادن به مردای شرکت بوده و کافیه طبق خواسته های اونا پیش نری به راحتی از قلمرو اخراج می کنند.\r\nاین شرکت نه تنها پولشون حرومه که آدم هایی هم که تو اون شرکت هستند بویی از انسانیت نبردن و کاملا برده داری نوین است."
