description: "سال گذشته برای سمت کارشناس صادرات دعوت شدم. من 12 سال سابقه صفر تا صد صادرات رو در چند حوزه ی تخصصی و در شرکت های بزرگ و بنام دارم.\r\nجلسه اول مصاحبه با مدیر و کارشناس بخش صادرات بود که انصافا بسیار محترم، مودب و دوستانه رفتار کردن. در همین جلسه هم گفتن که اینجا بین کسانی که تخصص داروسازی و پزشکی دارند و کسانی که ندارند تبعیض وجود داره. در همین جلسه هم من حقوق مدنظرم رو اعلام کردم.\r\nجلسه دوم با معاونت سازمان بود، یک دختر خانم جوان و بسیار کم سن و سال که نگاه بالا به پایین و تحقیرآمیزش واقعا آزار دهنده بود. از من پرسید درباره سیناژن چی میدونی؟ و من بر اساس مطالعه ای از سایت سیناژن داشتم، پاسخ دادم که میدونم اولین تولیدکننده فلان داروئه و در ادامه توضیحات بیشتری دادم. واکنش ایشون این بود که یه پوزخند زد و با تحقیر گفت که: هه! فقط همین! و بعد شروع کرد به تعریف و تمجید از سیناژن و افتخار خودش که از روزی که از دانشگاه فارغ التحصیل شده اونجا داره کار میکنه و ... . و بعد اینکه: اینجا جنگ و کرونا و سیل و خشکسالی! نمیشناسه، نه تعطیلی داریم و نه دورکاری. ممکنه جمعه ها و روزهای تعطیل رسمی هم نیاز باشه حضور داشته باشید. اینجا من دیگه تصمیم خودم رو گرفته بودم که از اون محل بزنم بیرون و دیگه برنگردم، تحت هیچ شرایطی. در پایان هم گفت اینجا از شما تعهد محضری 5 ساله میگیرن. گفتم من مشکلی ندارم که این تعهد رو به شما بدم، اما آیا شما هم به من این تعهد رو میدید که طی این مدت، هر سال مطابق با تورم واقعی دریافتی من رو افزایش بدید؟ گفت: خیر، این تعهد یکطرفه و فقط از جانب شماست!\r\nلذا من فکر میکنم این شرکت برای کسی که تازه از دانشگاه فارغ التحصیل شده و به دنبال رزومه ای برای آینده شه مناسب باشه، اما برای کسی که سابقه کار تخصصی داره، نه.\r\nو نکته قابل توجه اینه که هر دو ماه یکبار آگهی استخدام کارشناس صادرات رو روی سایت های مختلف کاریابی میذارن."
