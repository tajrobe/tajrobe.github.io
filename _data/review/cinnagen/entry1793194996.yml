description: "سلام دوستان \r\nمن به دلیل پیشنهاد دوستی در بخش بسته بندی استعفا دادم ....\r\nدر قسمت بندی پیش آقای غفاری بودم ایشون نگاهشون خیلی سنگین بود و فقط حرف های جنسی با نیروهای ثابت خودش میزد و می خواست منو محک بزنه ...\r\nبعد منو جا به جا کردن بخش آقای امیری ایشون هم با سرپرست ها فقط می شست راجع به دختر ها حرف می زد و نیروهای خودشونو مسخره می کردند ذره ای برای نیروهای خودش ارزش قائل نبود ....بخش دیگه ای که رفتم ایشون هم آقای محمودی بود که می گفتند با نیروی ثابت خودش به اسم خانم قوامی صیغه است و کل سایت دست این خانم و بقیه خانم های ثابت اونجا می چرخه و زیرآب همه ی نیرو های جدید میزنند که به جز خودشون کسی وارد اونجا نشه .....\r\nمتاسفم برای محیط سمی اونجا خداروشکر من نجات پیدا کردم ...\r\nنیروهای قدیمی فقط نیروهای جدید اذیت می کردند و باند درست کرده بودند کسی بتونه اونجا ددومم بیاره .....از ترس ای که اخراج نشن و اصلا هم از نظر کاری خوب نبودند و فقط پول نفت میگرفتند ...."
