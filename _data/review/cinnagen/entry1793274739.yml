description: "سلام به همگی\r\nخوشبختانه از فضای سمی بسته بندی خارج شدم ....\r\nجالبیش اینه وقتی چند نفر رفتیم پیش حیدری که مدیر تولید از مشکلاتمون گفتیم اصلا براش مهم نبود تازه گفت من می خوام مدیر عامل بشم قرار جای منتجبی بگیرم...\r\nدر واقع ما داشتیم از سرپرست ها که بی احترامی به ما می کنند حرف زدیم و از مدیر بسته بندی گفتیم که حق به سرپرست ها میده .....غافل از این که اینا یک تیم هستن که مدیر و سرپرست همگی با هم دوستن قرار بود از حیدری هم حمایت کنند که بشه مدیر عامل.....اینجوری قدرتشون بیشتر از قبل بشه .....جالبیش اینه پورعلی سرپرست یکی از بخش ها همه مردا ازش حساب می برند هر چی این خانم بگه انجام میشه چون قرار باشه مدیر بسته بندی .....یعنی می خوام بگم قلمرویی ساختن برای خودشون که خودشون صاحب کارخونه می‌دونن....و به همه دستور میدن طبق خواستشون رفتار کنند .....\r\nحتی این خانم که ذره ای انسان نیست به کنترل کیفی هم دستور میداد چیکار کنند همه چی دست این خانم بود از بسته بندی گرفته تا کنترل کیفی و برنامه ریزی تولید و\r\n....زن مطلقه ای که زیر مردان شرکت جای خودشو حفظ کرده و از طریق جادو به همه دستور میده که قدرت دستش باشه و همرو کرده برده خودش .....\r\nبعد از شرکت هم با آقایون مدیر و سرپرست دورهمی شبانه میرن سرویس های شبانه میده و از جایگاه خودش بیشتر حفظ می کنه ....\r\n\r\n\r\n"
