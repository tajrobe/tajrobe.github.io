description: "سلام وقتتون بخیر\r\nدر قسمت بسته بندی یک اقایی بودن به اسم رستمی ایشون تازه هم ازدواج کرده بود چه قدر آدم بی شخصیتی بود.....\r\nتازه از شهرستان اومده بود فکر کرده بود چه خبر آدم بیسواد دهاتی ....\r\n با سرشیفت های دیگه که تو سایت sd2 بودن فقط به نیرو های جدید توهین می کردند تو دل نیروهای جدید خالی می کردند و می گفتند چرا می مونید اینجا برید استعفا بدید اصلا این شرکت خوب نیست خودشون چندین سال اینجا بودن اگه با شرکت مشکل داشتن نمی رفتن استعفا بدن ‌...به خانم ها توهین می کرد بی احترامی می کرد ....یجوری رو روانشون کار می کرد که عصبی بشن زیراب همرو به دروغ میزد ....الکی به سرپرست می گفت فلانی کار نمی کنه که اخراجش کنند چون از کسی خوشش نمی‌آمد و دوست داشت کلا لج کنه  ....‌ادم های اینجا سرشیفت هستند که اصلا صلاحیت کار کردن ندارند .....خودتون از اونجا راضی نیستید از شرکت نمیرید یکاری می کنید بقیه هم اونجا کار نکنند که اخراج بشن .....پاپوش و تله درست می کردن واسه بقیه ....الکی می انداخت تقصیر نیروها که زیراب بزنه .....\r\nیک تعدادی به سرپرست گفتند اهمیت نداد به مدیرم ارجاع داده شد گفت هر چی سرشیفت میگه باید گوش بدن اگه نیروی بد می خوان نگه دارند که نیروهای جدید از دست بدهند و هی نیرو بگیرند خب مشکل از مدیریته نه نیرو های جدید مشکل از نیروهای قدیمیه نه جدید .....\r\nهر کس روزی می‌بره امیدوارم روزیش بسته بسته بشه...."
