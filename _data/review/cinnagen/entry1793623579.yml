description: "سلام وقت همگی بخیر \r\nماهایی که تو قسمت بسته بندی کار می کنیم و صدامون به جایی نمی‌رسه ....اعتراض کنیم اخراج میشیم.... سکوت کنیم سواستفاده می کنند....\r\nسرپرست های به ظاهر انسان نما که از زن و بچه خودتون خجالت نمی کشید اونجا دوست دختر ها و زن های صیغه ایتون عشق و حال می کنند ...عذاب وجدانی نمیگیرند چون جنس خاک اون شرکت بر پایه ظلم و فساد....\r\nجامعه ای کوچک از جامعه خودمون .....\r\nخب اگر معیارتون دوستی هست کسانی که نمی خوان باهاتون وارد رابطه بشن چرا اذیت می کنید که بگید قدرت دست ماست.... شما برده ی مایید.....شاید خیلیا نخوان مثل شما حیوان باشند چه اصراری برای گرفتن چنین نیروهایی هست .....متاسفم خودمون وقتی به خودمون رحم نمی کنیم چه انتظاری از بقیه دارید .....که جامعه رو به رشد باشه...."
