description: "سلام من یک مدت قسمت بسته بندی بودم \r\nو قسمت پارتیکل سنجی که به اسم محمودی سرپرست اونجا بودن ....آقایی متأهل و بچه دار که \r\nبا خانمی به اسم سیما قوامی صیغه بودن که کل سایت دست این خانم می چرخید این خانم متاهل بوده بعد با سرپرست دوست میشه از همسرش جدا میشه .......این خانم می تونست هر طور دوست داره رفتار کنه لباس بپوشه رفتار کنه ولی بقیه کارکنان حق هیچ کاری و نداشتند چون فقط دوست دختر این آقا هست...\r\n چندین نفر دیگه هم بودند که اکیپ بودند و این اکیپ تعیین می کردند حتی به سرپرست می گفتند چیکار کنه و نکنه حالا به خاطر روابط دوستی و چیزای دیگه\r\n اکیپی که سر دستشون به اسم نرگس احمدی بود همه ی دوستای خودشو آورده بود اونجا و همشون دیپلمه که سواد نداشتند این خانم شده بود سرپرست یک بخش دیگه....و از دهن سرپرست فقط اسم خانم میومد بیرون که زیرآب همه ی نیروهارو میزد که جایگاه خودشو حفظ کنه...\r\nکه نیروی جدید وارد اونجا نشه و خودش و دوستاش اونجارو بدست بگیرند و هر شب یک نفر با سرپرست بخوابه..."
