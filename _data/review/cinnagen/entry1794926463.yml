description: "سلام وقتتون بخیر\r\nمن قسمت بسته بندی بودم رفتم با مدیر تولید به اسم حیدری حرف زدم از مشکلاتم بگم حالا خوبه زنه خودشم قبلاً بسته بندی بوده\r\n آخه اینا دقیقا به چیشون مینازن به مدیریتی که بلد نیستن....\r\nبه من میگه هر چی سرپرست و مدیر میگه من همونو انجام میدم به سرپرست اعتراض می کنیم میگه هر چی سرشیفت میگه همونو باید انجام بدی...\r\nخب عزیز من طرف مثل برده با ما رفتار کنه هر چی از دهنش در بیاد بگه تهش ما هم بگیم چشم مگه اینجا باغ وحش که هیچ رسیدگی نمیشه ......\r\nهمون سرپرست های زن باز براتون خوبن که به جای این که دنبال کار باشند ذهنشون دنبال دوست دختر بازی و.....\r\nتو محیطی که فقط نگاه مردای اونجارو باید تحمل کنی....\r\nاز رستوران و سلف و محیط کار و جاهای دیگه گرفته شده تا جاهای دیگه ........\r\nهیچ ارزشی برای زن قائل نیستن.....فقط دنبال سواستفاده هستن......آنقدر نگاه از بالا به پایین شما جایگاه شمارو بالا نمی‌بره....کوچیک بودن شما رو نشون میده که آنقدر آدم های بدبخت و عقده ای هستید که دنبال چاپلوسید.......\r\nاینا خودشون ناموس ندارند که آنقدر بی غیرت و بی وجدان شدند"
