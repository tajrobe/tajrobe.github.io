description: "سلام \r\nتو این شرکت که همه فامیلی هست و جز خودشون کسیو راه نمیدن که مبادا به جز خاندان خودشون کسی تو این شرکت کار نکنه.....دلیلش اینه فقط پول و درآمد بین خودشون ادامه پیدا کنه و به بقیه مثل برده نگاه می کنند .....اینا نمونه کوچیک جامعه ایران که سران دنبال غارت.... زیردستا هم از خودشون باشند.....یعنی حیوون شرافت داره به اینا .....بیچاره اسم حیوون که رو این شرکت بزاری..... نیروهایی که از بیرون وارد این شرکت میشه فقط برای ابزار جنسی حالا چه آقا چه خانم که به اینا سرویس بدن .....  بعد یک مدت هم می اندازند از شرکت بیرون چون استفادشونو کردن ...\r\nجالیش اینه سهامدارا داخل شرکت هستند یعنی پول بین خودشون رد و بدل میشه یک سری آدم بی سواد کم سن دهه شصتی هم شدن مدیر.......یک کارخونه هم از طریق پولشویی ترکیه زدن که هر موقع احساس خطر کردن تو ایران فرار کنند برند ...........\r\nبرای داروهایی هم که تست انسانی انجام میشه حالا رو کی انجام میدن..... کارکنان همونجا .....\r\n الکی میگن خود خانم دکتر هم تست میده شما بشنو باور نکن .....\r\nحالا از اینور تست انجام شده....دارو تولید میشه حالا بدن یک سری به دارو واکنش نشون میده و سرطان میگیرن .....اونم بعد از چند سال .....حالا اون بنده خداها که تست دادن سرطان میگیرند و ددوم نیارند می‌میرند .....اینجا کی جواب این بنده خداهارو میده که دارو مشکل داره تازه تولید هم شده فروش هم رفته.....هیچکس ....چون ذره ای وجدان ندارند دنبال پولند ....پول کثیف .....\r\nمن قسمت کنترل چشمی دارو بودم ....\r\nدارو توسط ما چک میشه بعد بسته بندی میشه....ذره توی دارو موردی پیش بیاد باعث مرگ بیمار میشه .....نیروهای قدیمی که اونجا بودن اصلا چک نمی کردن تازه چیزی هم بهشون نمی گفتن....ولی فشار و نیاوردن به نیروهای جدید که که درست چک کنید جون مریض زیر دست شماست .....شما اگه جون مریض براتون مهم بود فکر دیگه ای می کردید برای کنترل دارو .......اصلا داروها اونجا درست چک نمیشه و همینجوری به بیمار میدن بدون عذاب وجدانی.......\r\nعملا اونجا کسی نسبت به کارش نه تعهدی داره نه وجدان کاری ........و فقط به ماهایی که نیروهای جدید بود فشار میاوردن که چون پارتی یا روابطی نداشتیم که تو شیفت های سنگین عصرو شب و روز باید دارو چک می کردیم .....بدون استراحت و تعطیلی حتی حق مرخصی هم نداشتیم و با حقوق کم .....\r\nنیروهای قدیمی هم که حقوق بالا داشتند دلیلش این بود پارتی و روابط دارند ...."
