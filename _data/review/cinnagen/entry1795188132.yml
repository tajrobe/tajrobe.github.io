description: "سلام وقتتون بخیر\r\nبا این که یک مدت کوتاه کار کردم ولی بیشترین بی احترامی و توهین ها رو از سرپرست ها و نیرو های که اونجا قدیمی بودند می‌دیدم پیش مدیر که رفتم صحبت کنم که آنقدر آقا بیشخصیت و آدم کوچیکی هست که اصلا نمیشه با آدم صحبت کرد یک آدم از خودشیفته و مریض به اسم صباغ که همه متنفر بودن ازش .....\r\nبه خاطر ظلم ها و حق خوری هایی که در حق نیروهای بسته بندی می کنه....من جاهای دیگه هم کار کردم ولی این مدلی رفتار نمی کردند این آدم فکر می کنم تنها مدیر این کشور و تنها شرکتی خوب تو کل دنیا کسی که فقط تا نوک بینیشو میبینه .......\r\nکسی که شخصیت و شعور نداره سرپرست های مثل خودشم میاره تو اون شرکت که نه سوادی دارند نه چیزی از انسانیت می دونند...وقتی یک نیرو می خواد اخراج کنه آنقدر بهش توهین می کنه میگه تو گاوی همه برای این شرکت زوزه می کشن یعنی تو مثل سگ می مونی داری کار می کنی تو که داری اخراج می کنی توهینت برای چیه وقتی نمی تونی نیرویی که روبروت نشسته درست بشناسی و نمی تونی مدیریت کنی ضعف های خودتوو چرا رو بقیه خالی می کنی .....\r\nکسی که دیوونه زوزه میکشه مدیرای اون شرکتن والا همه ترجیح میدن شرکت کوچیک کار کنند ولی شخصیتشون خورد نشه توسط آدمای مریض و سادیسمی اونجا ....\r\nآقای صباغ و آقای حیدری شما ها پر از عقده های دوران کودکی هستید و زن باز کن واسه زن ها ارزشی قائلی نیستید ....\r\nکارگر واقعی شمایید که از درون پوچید ....\r\nخدا نظاره گر همه چی هست ....\r\n"
