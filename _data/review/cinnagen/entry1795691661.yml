description: "سلام وقتتون بخیر\r\nچیزی که خیلی عجیبه تو این شرکت رفتار متناقض مدیر ها و سرپرست ها نسبت با یک سری از کارمندان است .....خود مدیر ها و سروپست زن و بچه دارند.... زن های مطلقه هم دور خودشون جمع کردند عشق و حال می کنند.....\r\n زنا هم با پسرای کم سن دوست میشن یعنی هر کس قدرتی داره مقامی داره آشنایی داره هر جور دوست داره رفتار می کنه و به بقیه فشار میارن که تو حق نداری هیچ کاری انجام بدی.....دقیقا مطابق سران دولت که خودشون کلی گند بالا میارند بقیرو توبیخ می کنند نکن اگه بکنی اخراج میشی.....\r\nحتی به زندگی شخصیتم کار دارند آمار دقیق در میارند که چیکار می کنی .....بعد خودشون دورهمی و مشروب ...روابط نامشروع کلی صیغه ای و......زن و مردشم فرقی نمی کنه....\r\nیک دختر به خاطر این که تاتو داره می خواستن اخراج کنند دختر می گفت من تو مصاحبه تتو داشتم دیگه چرا پس اون موقع اشکال نداشت....\r\nبعد قسمت اداری که میری همه تاتو لباس نامناسب انگار تایلند ....اعتراض که می کنی چرا بخش های دیگه آزاد به یک سری بخش ها کار دارید تهش میگن مدیر فرق می کنه اون مدیر بخش دوست داره دخترای خیابونی بکنه کارمند اون بخش که بعدش برند مهمونی ....."
