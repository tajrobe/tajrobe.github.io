description: "سلام\r\nخیلی عجیب نیست از دکتری که هاله حامدی فر تو زندگی شخصیش پر از مشکله شوهرش زن باز ....به زور کنار هم خودشون تحمل می کنند عقده هاشون تو شرکت خالی کنند ‌....فقط به دروغ خودشونو خوب نشون بدن... \r\n....زن و شوهر مشکل داری که با کسای دیگه می خوابند یک بچه حرومزاده هم بار آورده مثل خودشون....منتجبی که تاوان کاراشو پس داده زن و بچش مرده ......یعنی خدا یک جوری می‌زاره تو کاست که تا آخر عمر بدیاتو جواب بدی ....منتجبی که پر از عقده و کینه است چون خونواده ای نداره دوستای و فامیلای خودشو می کنه مدیر و سرپرست ....\r\nهمشون مریضن از نظر روحی و جسمی....به زور خونواده های خودشونو تحمل می کنند ....بعد تو شرکت دوست دختر دوست پسر دارند.....خلا درونیشون با هیچی پر نمیشه چون همشون حرومزادن .....\r\nمن قسمت بسته بندی بودم مردی تو شرکت نبود به من پیشنهاد نده حالا فرقی نمی کنه متاهل و مجرد ......\r\nآنقدر های عقده ای هستند دوران بچگیشون درست بزرگ نشدند کینه و حسادت و عقده دارند ......نمی تونند اززندگیشون خوشحال باشند ......به سرپرست و سرشیفت هایی که تازه به دوران رسیدن آنقدر بها دادند به خودشون اجازه هر بی احترامی میدهند ...\r\n......من اونجا کار میکردم هیچ مشکلی هم کارم نداشت بیشتر از بقیه هم کار می کردم ولی بیشترین بدی ها رو دیدم ....پاداش ندادند مرخصی بهم نمی دادند ....به پوششم گیر می دادند ....به کارم که درست بود ایراد می گرفتند....همه دنبال زیراب زدن بودن اونم به دروغ که تهش منو اخراج کنند. .....\r\nاخه نیروهای قدیمی از این نیروهای جدید بیان جاشونو بگیرند می ترسند چون اکیپشون به هم می‌ریزه ....سرپرست ها انگار که تو مدرسه جاسوس بودند اینجا هم همون رویه رو ادامه میدادند همه هم دهه شصتی عقده ای سریع برند به مدیر زیراب بزنند ....سرشیفت ها هم همینطور فقط زیرآب نیرو ها میزدند .....یک سری ادمای‌بدبخت که دنبال قدرت هستند تهشم به هیچی نمیرسد چون ذاتشون کثیفه .....\r\nپورعلی جنده که زیر مدیر جایگاه خودشو حفظ کرده ....مورد داشتیم سرپرست های مرد به پسرا هم رحم نمی کردند با اونا رابطه جنسی داشتند اسماشون غفاری محمودی و امیری بود .....کارمندای قدیمی مرد که فکر می کردند صاحب همه دخترای بسته بند هستند دوست میشدن تموم می کردند تهشم دخترا رو اخراج می کردند ...\r\nمردستیزی بیداد می کرد.....یکی از کارمندای بازرگانی که ترخیص کار بود پیام داده به دختر که تو بسته بندی کار می کرد. ...زن و بچه هم داشت به بهونه ای که بخواد یک نفر و از بسته بندی جابه جا کنه گولش زد که الکی من با زنم مشکل دارم با زنم در ارتباط نیستم می تونم تو هم جا به جا کنم اگه ۳ ماه باهام پارتنر جنسی باشی تهشم بپیچه به بازی اسمشم محمد رضا شاه .....بود ....\r\nدنبال سواستفاده از دخترای بسته بندی بود ۱۰ سالم بود اونجا کار می کرد...\r\nمنابع انسانی نمی دونم چجوری این همه آدم مریض اونجا نگه داشته بود ...."
