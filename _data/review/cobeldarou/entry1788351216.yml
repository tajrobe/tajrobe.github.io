description: "این سازمان به لحاظ امنیت شغلی واقعا سازمان خوبی هست.\r\nدرسال های اخیر باوجود مشکلات کشور و برخلاف بسیاری از شرکت هایی که تعدیل نیرو داشتند یا افزایش حقوق نداشتند، این شرکت برای پرسنل سنگ تمام گذاشت.\r\nواحد منابع انسانی و مالی پرسنل نسبتا خوبی داره.\r\nواحد IT در تلاش هستن عملکرد خوبی داشته باشن تا حدی موفق هستن نسبت به سالهای گذشته.\r\nواحد IS دو سه سالی هست تغییر کرده پرسنل نسبتا خوبی داره اما مدیر این واحد آقای ر.ق که خیلی هم ادعا دارن، بشدت دچار ضعف جنسی هستند و همش آویزون خانم های واحدشون هستن و واقعا تو کل سازمان معروفن این آقا.\r\nطوریکه ما خودمون با این واحد جلسه داریم دعا میکنیم این آقا حضور نداشته باشن انقدر که نگاه و رفتارشون آزاردهنده و زننده هست و اینو همه آدمهایی که باهاشون کار کردن میدونن.\r\n\r\nدر کل سازمان بسیار سازمان با اصالت ساپورتیو و امن هست و رنج حقوقی بالایی داره اما خیلی مهمه که در چه واحدی مشغول به کار باشید و مدیرتون چه شخصی باشه."
