description: "کارخونه ۲ زندان آلکاتراسه. زندانی که خودم هر روز داوطلبانه میرفتم نهایتش خودم از زندان فرار کردم و زندگیه جدیدی دارم خوش هستم\r\nمجموع حقوق و بن های فروشگاه زنجیره ای از کروز بیشتره و به معنای کلمه راحت شدم البته نه اینکه سختی و زحمت نباشه ولی کروز نابودم کرده بود ۵ سال چقد ساده بودم هر روز با سرویس داغون از ملارد پامیشدم میرفتم برمیگشتم و هیچ زندگی نداشتم\r\nتوهین مستقیم فشار و استرس تبدیل شد برام به زحمته کار روتین داخل فروشگاه.\r\nمحل کار اونجا نور و تهویه مناسب نداشت دائم سرپا و تند تند بپیچ به آمار برسی. سرپرستم که بهش باید میگفتن «به دامپزشکی مراجعه کن» هیچ ابای نداشت برای توهین. چه زندگی و کاری بود خدا رو شکر در اومدم ازدواج و بچه که تابو و ممنوع بود داخل کروز نمیدونم آیا خانمای کارخونه ۱ و کارخونه ۳ شرایط مارو داشتن؟ رفتن و موندن داخل کروز کوته فکری بود\r\nمالکای شرکت کلی وام بانکی و دلار دولتی ارزون و قطعه چینی قالب کردن و ارتشا و حق کارگرو به جیب زدن. عکسایه املاک لوکس خارجشونو بچه ها داشتن به معنای کلمه آخراش احساس میکردم وسط حروم هستم و حقوقم از حروم و پول و خون مردم پرداخت میشه و از سادگی دخترونم سو استفاده شده. جرات کردم و از سر سفره حرام کش... و عل... پا شدم الان دارم عقد میکنم و راضیم و بچه دارم خواهم شد. مینویسم برای همکارام که هنوز اونجان. خانما ارزش نداره اون حقارت\r\nاین بازرسایه وزارت کار و نماینده های مجلس و‌ مسئولایی که میومدن بازدید چرا کاری برای کارگر نمیکردن و رفیق گرمابه گلستانه کش... بودن و به به چه چه میکردن براش داخل سایتا؟ حتما مالی هواشونو خوب داره"
