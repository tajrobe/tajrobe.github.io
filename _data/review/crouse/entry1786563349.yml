description: "این واحد عملا جهنم و تبعیدگاه کروزه. فرقی نداره طراحی ماشین‌آلات و ماشین‌سازی سایت 1 باشی یا تجهیزات تولید دسته‌سیم و ماشین‌سازی سایت 2 یا ماشین‌سازی سایت 3. تو همشون شرایط تقریبا یکسانی حاکمه. اول ورودت که 3-2 ماه میفرستنت داخل کارگاه و مث یه تکنسین باید ساعت‌ها با دستگاها کار کنی و پدر کمرت و دستت و ... در میاد. کلا همه آقایونی که کارشناس جذب بشن رو اول کار میفرستن کارگاه ماشین‌سازی تا تو شرایط سخت کار کنن و بعد رفتن تو واحد خودشون قدر واحدشون رو بدونن. دیگه شما ببینید اینجا چقدر وضع خرابه که همه رو میفرستن اینجا تا براشون درس عبرت بشه. حتی کسی رو هم بخوان اذیتش کنن و یه کاری کنن که خودش استعفا بده و بره هم میفرستن این واحد چون اینجا تبعیدگاهه و نمیتونی واحدی بدتر از اینجا تو شرکت پیدا کنی. \r\nبعد کار کشیدن ازت تو کارگاه میبرنت داخل دفتر مهندسی و فک میکنی خب سختی‌هام تموم شد در حالی که تازه داستان شروع میشه! قاعدتا تو دفتر مهندسی جای کارشناسا هستش ولی یه سری تکنسین نورچشمی رو گذاشتن اونجا تا هم کار شما رو بی ارزش کنن و بهت بگن کار تو رو یه تکنسین هم میتونه انجام بده، هم حسابی زیر نظر داشته باشنت و اخبارت رو آنلاین به گوش بالا دستیت برسونن. برخی از این تکنسین ها رو هم یه حال گنده بهشون میدن و کارشناس یا کارشناس ارشد میکنن که هم برده خوبی براشون باشن هم میزان رضایت رو ببرن بالا.\r\nبعد چند ماه کار کردن و یکم باز شدن گوش و چشمت و ارتباط گرفتن با واحدای دیگه میفهمی به طرز فجیعی نمره پاداش ماهانه بهت کم میدن در حالی که تو تلاشت رو کردی و خروجی خوبی داشتی ولی خب باید بزنن تو سرت تا شاخ نشی براشون.\r\nوقتی هم به پایان سال برسی دقیقا همین اتفاق برا پاکتیت میفته (پاداش پایان سال رو اینجا میگن پاکتی) و مبلغ اون نسبت به واحدای دیگه بسیار پایین تره. حالا هرچی بری به رئیس و مدیر اعتراض کنی فقط جواب سربالا میشنوی و کاملا معلومه یه چرتی میگن که فقط دهنت رو ببندن.\r\nحتی اخیرا برا بچه‌هایی که 2 سالشون رو پر کردن فوق العاده جذب بازار کار (همون حق جذب) زدن و اینجا هم در مقایسه با واحدای دیگه کمترین مقدار رو به بپه‌های واحد ما دادن. کلا انگار یه خصومتی با این واحد دارن که همیشه بیشترین حجم کار رو داره ولی از نظر مالی همیشه کف کفه!\r\nاین داستانا همش از گور معاون تکنولوژی تولید در میاد که نمیخواد بذاره این واحد دیده بشه و پیشرفت کنه در حالی که خودش از کارگری و تکنسینی تو همین واحد به معاونت تکنولوژی تولید رسیده. البته مدیر واحد هم آدم بی‌عرضه‌ای هستش که نمیتونه درست واحد رو برا بالادستی‌هاش پرزنت کنه و بکشدش بالا و دنبال اینه با کاهش هرچه بیشتر هزینه‌ها خودشو پیش معاون و مدیرعامل و ... شیرین کنه.\r\nاگه یه روز به فکرتون زد یا بهتون پیشنهاد شد که تو این واحد کار کنید یادتون باشه باید بیشترین حجم کار رو با کمترین آورده مالی در مقایسه با سایر واحدای شرکت هندل کنید. پس بهتره برید واحدای دیگه و ترجیحا زیرمجموعه تکنولوژی تولید نباشن تا اینجوری گرفتار نشید.\r\nاز مباحث مالی گذر کنیم این واحد پر از آدمای ضعیفه که بیشتر دنبال خبرچینی و زیرابزنی ان تا خودشونو بکشن بالا و رییسام دقیقا از همین افراد گلچین شدن و اومدن بالا بنابراین انتظار همکار شدن با افراد خفن و باسواد رو نداشته باشید.\r\nدیگه نمیخوام از این طولانی‌تر کنمش و فقط بهتون میگم پاتون رو تو این واحد نذارید چون بعدا باید دائما حسرت شرایط کاری و مالی و رفاهی و ... واحدای دیگه رو بخورید!"
