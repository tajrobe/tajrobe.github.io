description: "اگر فرصت استخدام در ماشین سازی کروز براتون پیش اومد این نکات رو حواستون باشه:\r\nاگر واقعا علاقه و استعدادتون به کارهای طراحی و ساخته،اونجا به اندازه کافی براتون جذابیت خواهد داشت.پروژه های متنوع و جذاب که خوراک آدمای علاقمنده.\r\n2 ماه آموزش فنی بهتون میدن و شما باید کار با تجهیزات رو یاد بگیری که قطعا سختی هایی هم داره ولی خب برای کسایی که از دانشگاه اومدن و تجربه عملی ندارن یه نعمته.در این 2 ماه هم علارغم آموزش، حقوق و مزایا را تکمیل دادن بهمون.فرقش با مرکز فنی و حرفه ای اینه که کروز هم یاد میده هم حقوق میده ولی فنی حرفه ای واسه یاد دادن پول میگیره. در کل اگر سختی هاش و کار دستی و عملی رو تحمل کنی، دوره ارزشمندیه و به افزایش دید فنی کمک میکنه.\r\nبعد دوره کارگاه شما به یکی از کارشناسان قدیمی تر وصل میشد و پروسه ها رو یاد میگیری.پروژه های سبک سپرده میشه و این فرصت داده میشه که کم کم مهارتت رو ببری بالا.یعنی اولش نمیاد یه کار خفن بخوان ازت که تو گل گیر کنی.ولی عوضش سخت میگرن و شمارو به حال خودت ول نمیکنن که هر مدلی که دوست داری بری جلو.این یه کم آزار دهنده میشه برات.ولی بعد یه مدت که بیشتر با نفرات اشنا میشی و یه تیم یک دست میبینی،دلیل این کارو میفهمی.\r\nیکی از چیزایی که برای جلب توجه خواهد کرد اینه که هر سوالی میپرسی بهت جواب میدن و مشکلی بابت اینکه کسی بهت یاد نده یا تجربه اش رو در اختیارت نزاره نخواهی داشت.حتی به کسایی که از واحد های دیگه میرن اونجا واسه آموزش.\r\nیکی از چیزهایی که شاید آزارتون بده امتیاز ماهانه است.اولش فکر میکنی چرا باید نصفه یه کارشناس دیگه امتیاز بگیری وقتی مثل اون تلاش میکنی.ولی وقتی میبینی که اون کارشناس، پروژه ها رو در یک چهارم زمان شما و بدون دوباره کاری انجام میده،اونوقت یه کم حق میدی که اون کارشناس لایقه اینه که از شما امتیاز بالاتری بگیره و طبعا پاداش بیشتر.در کل سختگیرانه ولی در عین حال عادلانه به نظر میرسه.\r\nیکی از بدی ها و یا شاید بهتر بگم سختی هاش،خطرات و حوادثیه که ممکن پیش بیاد که اینم ماهیت کاره و معمولا واسه رده های کارشناسی به اون صورت خطری نیست. معمولا واسه ایمنی نفرات سختگیری میشه و شاید با رعایت نکردن نکات بهت گیر بدن و حرفی بزنن و بهت بر بخوره.\r\nدر کل واسه آدمای فنی و علاقمند جذابه ولی واسه آدمای بی علاقه و از زیر کار در رو ، خسته کننده و عذاب آور.\r\nیا علی."
