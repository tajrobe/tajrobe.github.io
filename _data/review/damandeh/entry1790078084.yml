description: "مدیر واحد مهندسی\r\nوارد کارخانه که شدم اولین چیزی که جلب توجه کرد حجم بالای تولید و نیروی کم در واحد مهندسی بود که متوجه شدم هر کسی که میاد واحد مهندسی بعد از چند ماه از شرکت میره! اول دلیلش رو نیمدونستم ولی کم کم متوجه شدم که در مدت 2-3 سال اخیر پنج شش نفر مدیر واحد مهندسی اومدن و رفتن! دلیلش چی بود؟ مدیر کارخانه!\r\nیه آدم بی شخصیت و بی ادبی که در جلسات مشترک با مدیران واحدها و سرپرست ها، کارش بد و بیراه گفتن به مدیران و سرپرست ها و ضایع کردن اونهاست. تقریبا تو اون زمانی که من اونجا بودم هر مدیر و سرپرستی که جذب شد بعد از نهایتا 4-5 ماه شرکت رو ترک کرد به خاطر همین رفتار مدیر کارخانه. عجیبه که یه شرکتی با این برند و سابقه یه همچین مدیر بی شخصیتی رو انتخاب کرده. ظاهرا برای مالک کارخانه هم مهم نیست چه اتفاقی در سازمانش داره میفته. برخی از نیروهایی که چند سال بود اونجا بودند بالاخره کم آوردن و استعفا دادند و رفتند. روزی که خودم میخواستم از شرکت بیام بیرون، متوجه شدم چند نفر از سرپرست ها هم تا حالا چند بار استعفا دادند ولی واحد پرسنلی اونها رو منصرف کرده و یا قصد داشتند به محض پیدا کردن کار استعفا بدهند. اوضاع اونقدر خراب بود که مدیر واحد منابع انسانی هم استعفا داد و رفت.\r\n شما هرکاری که انجام بدید باز یه چیز برای گیردادن و ضایع کردن شما پیدا میکنه. مخصوصا واحد مهندسی که واقعا حجم کارش خیلی زیاده چون شرکت به خاطر رنج حقوقی کمی که داره نمیتونه نیرو جذب کنه!\r\nنکته عجیب دیگه ای که من در این سالها کار کردن در شرکتهای ایرانی و اروپایی ندیده بودم بازرسی بدنی مهندسین و بدتر از اون مدیران شرکت بود. واقعا جای تأسف داره شرکتی که هواکش توالت تولید میکنه مدیرانش رو میگرده که مبادا کسی یه دونه از این هواکشها رو با خودش بیرون نبره! ظاهرا از نظر مدیریت کارخانه یا صاحب مجموعه همه دزدند و واقعا به شخصیت آدم توهین میشه.\r\nخلاصه اگر میخواهید به عنوان مدیر یا سرپرست در این شرکت کار کنید باید فحش خورتون خوب باشه و تا حدی سیب زمینی باشید.\r\nنکته عجیب دیگه اینکه سرویس تردد همه از کارگر خط گرفته تا مدیران مجموعه، همه اتوبوس یا مینی بوس های فرسوده هست. یعنی مدیران مجموعه با کارگرها در یک اتوبوس یا مینی بوس هستند. وقتی این مساله رو با یکی از مدیران منابع انسانی شرکت دیگه ای مطرح کردم خیلی تعجب کرد. خودم هم یه همچین چیزی رو قبلا ندیده بودم.\r\nاولویت شرکت فقط تولید هست. کیفیت در مراحل بعدی. در حدی که صدای همه کارگرها و مهندس ها در اومده بود.\r\nماشین آلات فرسوده و قالبهای فرسوده مزید بر علت شده و تقریبا شما رو در یک دور باطل میندازه. مدام خرابی دستگاه و قالب رو دارید که مدیر کارخانه هم حرف حساب سرش نمیشه و همیشه پرسنل رو مقصر میدونه.\r\nخلاصه یه تجربه کاری خیلی بد شد برای من که چندین سال بود که تجربه کاری در شرکتهای مختلف رو داشتم و بعد از حدود چند ماه تحمل کردن این شرایط افتضاح، شرکت رو ترک کردم. امیدوارم دیگه این تجربه هرگز تکرار نشه.\r\n"
