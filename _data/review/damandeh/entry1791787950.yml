description: "قبل از اینکه بخوام کارم رو در این شرکت شروع کنم به یکی از دوستانم که چند ماه قبل دمنده کار می کرد زنگ زدم تا اطلاعاتی در مورد شرکت بگیرم. یه جمله ای گفت که خیلی تعجب کردم. گفت \" من اگر کلاهم بیفته دمنده نمیرم برش دارم\". فکر کردم داره مبالغه میکنه تا اینکه خودم رفتم اونجا. واقعا چه افتضاحی بود. شرکتی که فقط تولید براش مهمه و کیفیت اصلا جایگاهی نداره با یه مدیریت ضعیف و بیخود. دستگاهها و تجهیزات قدیمی که هر روز چند تایی از اونها خرابند و کلا محصولات مدام با مشکلات کیفی تولید میشه. کارگرهای بدبخت باید فقط آمار روزانه شون رو تولید کنند و هیچ عذری هم پذیرفته نیست به همین دلیل کیفیت در رده آخر قرار داره.\r\nچیزی که اونجا زبانزد هست رفتار بد مدیر کارخانه با پرسنل هست. این مساله اونقدر شور شده که حتی شرکت های مشاوره  ای برای جذب نیرو با دمنده حاضر نیستند کار کنند. یکی از همین شرکتها به دوست من گفته بود \" مدیر اونجا دیوونه است از آزار و اذیت کردن پرسنل لذت میبره\". بعدش هم گفته بود \" دمنده محل رفت و آمده\"\r\nخلاصه عمر و رزومه تون رو با کار کردن در این شرکت تباه نکنید که خیل پشیمون میشید."
