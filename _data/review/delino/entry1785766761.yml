description: "از بدترین تجربه های کاری هست که میتونید داشته باشید، این شرکت از هم پاچیده با دخالت های نابجا مدیرعاملش.\r\n\r\nنبود مدیریت، اهمیت ندادن به نیروی انسانی، تمایل مدیرعامل به حواشی، نداشتن استقلال واحد ها، امور هیئتی وار، نداشتن زیر ساخت های درست بیزنسی، نداشتن چهارچوب رفتار، سلیقه مدیرعامل همانند ادارات دولتی برای همه به جز منابع انسانی که دوستمون اشاره داشت با ارایشگاه محیط کار و اشتباه گرفته، ناراضی بودن تمام افراد، نداشتن امید به آینده، نداشتن شرح وظایف درست، اهمیت ندادن به حال نیرو، تمایل به رفاقتی پیش بردن تمام مسائل به جز مذاکره برای تمدید قرارداد، مدیر عامل به شدت دهن بین و دم دمی مزاج که البته چند وقت یه بار خودشون اظهار دارن مودی نیستند ولی صد هستند، به شدت ضد نظام، قاطی کردن مسائل سیاسی با عقاید کارمندان،گرفتن تصمیمات هیجانی که به شدت از بازار هدف دور است، ارتقا شغلی تو این شرکت اسم هست، مدیرانش از کارشناساش بیشتره :))) ، تمایل به جلسات راجب انجام کار تا انجام خود کار، دخالت نیرو های نزدیک مدیرعامل در تمام امور و و و و و و.... تنها مزیت این شرکت به خاطر زیر مجموعه همکاران سیستم پرداخت منظم مزایا و حقوق هست ک بیشتر افراد به خاطر همین مشغول به کارند.\r\nالبته هر چند وقت یک بار یه همکاری هم تو دلی مدیر عامل میشه ک هرچی اون بگه درسته :))\r\nاینم اضافه کنم تو این شرکت هیچ کس در جای درست خودش قرار ندارد از مدیر عامل گرفته تا مسئول تحصیلدار ک برای بردن نامه حتی نق میزنه چه برسه به مدیر مارکتینگ و فروش و خیلی افراد دیگر......\r\n\r\n\r\nاگر روانتون براتون مهم نیست\r\nآیندتون مهم نیست\r\nروز تعطیل و کاری براتون فرقی نداره\r\nتمایل دارید تو محیط سمی یه سری کار کنید و یه حقوقی بگیرید\r\nدرخواستی از کارفرما ندارید\r\nتوهین به شخصیت و شعور و عملکردتون براتون مهم نیست\r\nو توی یک دفتر کا رکنید نه شرکت \r\nجای به شدت مناسبیه برای شما\r\nبرای ما که نبود\r\nامیدوارم خوب راهنماییتون کرده باشم"
