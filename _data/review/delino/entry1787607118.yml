description: "\r\n\r\nمن از کارشناسان دلینو هستم و حدود ۳ سال است در این مجموعه مشغول به کارم.\r\n\r\nمطالبی که در این صفحه درباره شرکت و مدیران منتشر شده، با تجربه شخصی من در این مدت همخوانی ندارد و بخش قابل‌توجهی از این ادعاها را **کذب محض** می‌دانم.\r\n\r\nنکته مهم‌تر اینکه خود سایت «تجربه» در قوانین خود بر عدم انتشار نام اشخاص تأکید کرده، اما در همین محتوا نام افراد به‌صراحت ذکر شده است. سؤال اینجاست که وقتی فردی بدون امکان دفاع، با نام و عنوان مشخص مورد اتهام یا تخریب قرار می‌گیرد، آیا این مصداق بازی با آبرو و اعتبار حرفه‌ای افراد نیست؟\r\n\r\nانتقاد از یک شرکت و بیان تجربه شخصی کاملاً قابل قبول است؛ اما **نسبت دادن مطالب خلاف واقع به افراد مشخص و انتشار نام آنها موضوع کاملاً متفاوتی است.**\r\n\r\nآدم خوب است در بیان تجربه و قضاوت درباره دیگران، کمی انصاف داشته باشد.\r\n"
