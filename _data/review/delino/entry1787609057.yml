description: "واقعاً برای من جالبه که بعضی از دوستان از محیط کار و عملکرد مجموعه با چنین ادبیاتی صحبت می‌کنند. اگر واقعاً شرایط مجموعه تا این حد نامناسب و غیرقابل‌تحمل بوده، این سؤال مطرح می‌شود که چرا مدت قابل‌توجهی در همین مجموعه مشغول به کار بوده‌اند و چه چیزی باعث شده در چنین محیطی ادامه همکاری دهند؟\r\n\r\nبه شخصه در مدت همکاری‌ام، شاهد زحمات و پیگیری‌های تیم منابع انسانی در قبال مسائل کارکنان بوده‌ام و طبیعتاً تجربه من با برخی از مطالب منتشرشده تفاوت دارد.\r\n\r\nبه نظرم انتقاد و بیان تجربه شخصی کاملاً قابل احترام است؛ اما وقتی صحبت از قضاوت درباره یک مجموعه و افراد مشخص می‌شود، بهتر است انصاف، واقعیت و مسئولیت‌پذیری در بیان مطالب هم رعایت شود.\r\n\r\nنارضایتی از یک تصمیم مدیریتی یا پایان همکاری، نباید بهانه‌ای برای زیر سؤال بردن تمام عملکرد یک مجموعه یا افرادی باشد که برای آن زحمت کشیده‌اند."
