description: "من خودم قبلاً اینجا کار کردم و از نزدیک در جریان محیط کار، روند کار و شرایط مجموعه بودم. چیزی که توی این چندتا نظر نوشته شده، اصلاً با تجربه‌ای که من از کار کردن اینجا داشتم همخوانی نداره.\r\n\r\nطبیعیه که هر محیط کاری ممکنه ایرادهایی داشته باشه، ولی اینکه چند نفر با این ادبیات و تقریباً با یک مضمون مشخص بیان نظر بدن، بیشتر از اینکه نقد منصفانه باشه، شبیه غرض‌ورزی و حسادته. کسی که واقعاً اینجا کار کرده باشه، شرایط و نحوه کار رو می‌شناسه و می‌دونه که خیلی از حرف‌هایی که نوشته شده واقعیت نداره.\r\n\r\nمن تجربه شخصی خودم رو دارم و به همین دلیل گفتم بهتره قبل از باور کردن این نظرات، به تجربه واقعی آدم‌هایی که از نزدیک با این مجموعه کار کردن هم توجه بشه.\r\nمزایا: محیط کاری مناسب، تجربه کاری خوب، آشنایی با روند حرفه‌ای کار\r\nمعایب: فشار کاری در بعضی مواقع"
