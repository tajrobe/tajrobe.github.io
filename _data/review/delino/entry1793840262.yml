description: "\r\nتوجه داشته باشین بیشتر افراد این شرکت یعنی کارمندها افرادی هستند که از خوبی مدیرعامل سو استفاده میکنند و چون مدیرعامل جوان هستند و از بعضی افراد حتی کوچک تر از نظر سنی هستند\r\nهمان دوستان به نظر بنده اینجا کامنت گذاشتن و به شدت حسادتشان مشخص هست\r\nبنده در این شرکت ۳ سال مشغول هستم\r\nدر این سه سال پیشرفت کردم\r\nازدواج کردم\r\nترفیع گرفتم \r\nحقوق ما به تازگی با توجه به این وضعیت ۱۰ تومان افزایش یافته.\r\nشرکت شرایط خوبی دارند و کسانی که نام برده میشه که مدیرعامل ارتباط خوبی باهاشون دارن\r\nاز سخت کوش ترین ها هستند و کسانی که از یادگیری استقبال میکنند. \r\nبا تمامی خوبی شرکت افراد سمی هستند که پشت مدیرعامل صحبت میکنند و جلوی ایشون براشون خم و راست میشوند.\r\nدقیقا همون ها کامنت های منفی اینجارو ثبت کردن ای کاش میتونستم نام ببرم چون برای همه تابلو هستند این دوستان"
