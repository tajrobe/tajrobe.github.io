description: "مصاحبه به‌صورت آنلاین برگزار شد، اما روند آن منظم و هدفمند به نظر نمی‌رسید. بخش زیادی از سؤالات مطرح‌شده درباره مشکلات و چالش‌های فعلی شرکت بود و بیشتر این احساس ایجاد می‌شد که مصاحبه‌کننده به دنبال دریافت راه‌حل از مصاحبه‌شوندگان است تا ارزیابی توانایی آن‌ها.\r\n\r\nهمچنین به نظر می‌رسید شرح وظایف و نیازمندی‌های موقعیت شغلی به‌صورت شفاف مشخص نشده بود و مشخص نبود دقیقاً به دنبال جذب چه نوع نیرویی هستند. در مجموع، تجربه من این بود که فرآیند مصاحبه ساختار مشخصی نداشت و این تصور را ایجاد کرد که احتمال جذب نیرو چندان جدی نیست و مصاحبه‌ها بیشتر جنبه تشریفاتی دارند.\r\nمصاحبه برگزار می کنند که فقط سوالات و مشکلات خودشون در کار را از افراد مصاحبه کننده بپرسند و راهکار یاد بگیرند وگرنه جذبی در کار نیست و وقت افراد را هدر می دهند"
