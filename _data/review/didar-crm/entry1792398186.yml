description: "میتونم ازتون یه سوال بپرسم؟\r\nوقتی استخدام ندارید تنتون میخارە آگهی استخدام توی سایت های کاریابی میذازید؟\r\n\r\nاخه فلان فلان شده ها، مگه روح و روان ما توی این شرایط اسباب بازی دست چهارتا بی..... مثل شماست؟\r\n\r\nفلان فلان شده دردتون چیه آگهی میذارید، رزومه می گیرید، هنوز تکلیف رزومه قبلی ها رو مشخص نکردید دوباره همون آگهی رو میذارید.\r\n\r\nدنبال چیز مار می گردید؟"
