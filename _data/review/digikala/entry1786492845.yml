description: "سلام بنده کارگر انبار دیجی کالا بودم\r\nسه سال اونجا زحمت کشیدم\r\nزحمت که چه عرض کنم حمالی کردم\r\nموهام توی اون سه سال سفید شد پاهام پرانتزی شد کمرم هم هنوز خوب نشده\r\nمن یک سال قسمت جای گذاری بودم و دو سال هم قسمت سورت کار کردم\r\nبزارید از کار براتون بگم...\r\nفرقی نداره کدوم قسمت کار میکنید هر جا بیفتید ده ساعت سرپا هستید فقط نیم ساعت تایم غذا دارید و یک ربع تایم چای\r\nمن هم شیفت صبح کار کردم هم شیفت عصر\r\nسرویس داره برای رفت و آمد اما اصلا حساب نکنید روش چون خیلی پیش اومده سرویس نیومده یا دیر و زود اومده شما جا موندی\r\nهر دفعه ماشین های سرویس عوض میشه کسی هم درست اطلاع رسانی نمیکنه\r\n\r\nتایم کاری ده ساعته ولی دو ساعت قبلش و دو ساعت بعدش درگیر رفت و آمد و سرویس هستید پس ۱۴ ساعت از روزتون میره از زندگی میفتید مثله ربات میشید\r\n\r\nدیجی کالا اینقدر دزده که تایم شبکاری رو از ۵ عصر گذاشته تا سه شب بخاطر اینکه نصف تایم کار توی روز بیفته و پول شبکاری کمتر بده\r\n\r\nیه غذا بهمون نمیدادن از خونه باید بیاری غذا رو پول غذا امسال سال ۱۴۰۵ روزی صد هزار تومن میدادن که باهاش فلافل هم نمیدن\r\n\r\nمیان وعده چای خالی میدن خیلی از بچه ها فشارشون میفته ضعف میکنند ولی کو میان وعده مقوی\r\n\r\nسر گروه های بی لیاقت فقط برای خودشون میچرخند و هیچکاری نمیکنند بجز لاس زدن با دخترا و گیر دادن های الکی به پسرا \r\n\r\nحراست عقده ای موقع خروج شما رو میگرده حتی داخل دهانتون رو نگاه میکنه !\r\nهیچی نمیتونید با خودتون بیارید داخل انبار بجز کارت بانکی\r\n\r\nهر ساعت موقع کار باید آمار کاری ثبت کنید اگه کمتر از میانگین عملکرد باشید سرگروه میاد و تحقیرتون میکنه\r\n\r\nدستشویی بدون اجازه حق نداری بری حق نداری موقع کار بشینی و خیلی چیزای دیگه\r\n\r\nبیشتر دستگاه هاشون خرابه سبد هاشون سوراخه اشتباهی هم کنی جنسی از دستت بیفته پولشو از حسابت کم میکنند\r\n\r\nالانم تابستونه همیشه برق قطع بود داخل انبار جهنم میشد من دیگه استعفا دادم رفتم اصلا نمی ارزه کار کردن دیگه نمیصرفه بشینم خونه بهتره برام\r\n\r\nمن توی این سه سال کلی درد و مرض گرفتم هیچ پولی هم برام نموند از بس بی برکته پولش\r\n\r\nتنها مزایاش اینه حقوق رو به موقع میدن فقط همین !\r\n\r\nانبار دیجی کالا آخر دنیاست من به کسی پیشنهاد نمیکنم برای کار مگر اینکه واقعا از همه جا مونده رونده باشید\r\n\r\nزیاد هم نترسید اگه مجبورید بیاید برای تجربه کار کنید ولی قبلش بدونید چخبره بی در و پیکره\r\n\r\nدر آخر متاسفم برای مدیران بالا دستی دیجی کالا که هیچ ارزشی برای کارگر قائل نیستند"
