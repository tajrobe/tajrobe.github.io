description: "\r\nقیمت بعضی از محصولات به‌قدری سریع تغییر می‌کند که عملاً نمی‌شود برای خرید برنامه‌ریزی کرد؛ حتی گاهی در فاصله کوتاه شاهد افزایش قیمت هستیم، در حالی که انتظار می‌رود با کاهش نرخ دلار، حداقل بخشی از قیمت کالاها نیز کاهش پیدا کند. این تغییرات لحظه‌ای باعث شده اعتمادم به قیمت‌گذاری در دیجی‌کالا بسیار کمتر شود.\r\n\r\nاز طرف دیگر، وضعیت پشتیبانی واقعاً ناامیدکننده است. به جای اینکه یک کارشناس به‌صورت مؤثر پاسخگو باشد، بخش زیادی از پاسخگویی به ربات سپرده شده و اگر هم تیکت ثبت کنید، ممکن است چندین روز بعد پاسخ دریافت کنید؛ زمانی که دیگر موضوع یا قیمت کالا کاملاً تغییر کرده است.\r\n\r\nموضوع نگران‌کننده‌تر، تجربه من از دریافت کالاهایی با تاریخ انقضای گذشته یا نزدیک به انقضاست. در چنین مواردی انتظار می‌رود پشتیبانی واقعاً موضوع را پیگیری کند، اما تجربه من این بوده که پیگیری مؤثری انجام نمی‌شود.\r\n\r\nبه نظر من دیجی‌کالا زمانی مزیت بزرگی داشت: تنوع کالا، مقایسه راحت و پشتیبانی قابل اتکا. اما وقتی قیمت‌ها دائماً تغییر می‌کنند، پاسخگویی پشتیبانی زمان‌بر است و برای مشکلات مربوط به کیفیت و تاریخ مصرف کالا پیگیری مناسبی انجام نمی‌شود، واقعاً این سؤال ایجاد می‌شود که آیا هنوز خرید از دیجی‌کالا ارزش دارد یا نه.\r\n\r\nامیدوارم دیجی‌کالا به جای اتکا به پاسخ‌های رباتیک و قیمت‌گذاری لحظه‌ای، روی شفافیت قیمت، کنترل کیفیت کالاها و پاسخگویی واقعی و سریع به مشتری تمرکز بیشتری داشته باشد."
