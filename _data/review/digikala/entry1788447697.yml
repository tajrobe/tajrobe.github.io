description: "به تبلیغات گسترده استخدام توجه نکنید!تو اوج گرما و بی برقی رفتم برای مصاحبه،چون گفته بودن شغل پاره وقت دارن برای افراد دانشجو یا هر کسی که امکان کار تمام وقت نداره!\r\nهمون اول مصاحبه خیلی محترمانه توجیهت میکنن که شیفت صبح ثابت یا پاره وقت برای هر کسی نیست!یا شیفت شب یا هیچی!میخوای بخواه،نمیخوای به سلامت!مصاحبه همونجا متوقف میشه و تو از لیستشون خارج میشی!یا تو بهترین حالت میگن برو پیام‌میدیم،ندادیم یعنی استخدامتون اوکی نیست!\r\nنمیدونم اگر ظرفیت ندارید یا برای اقوام و دوستان و آشناهاتون رزرو کردید،چرا تو آگهی میزنید نیروی پاره وقت میخواید؟!\r\nگفتم تجربه ام رو اینجا بگم که مثل من اسیر نشید و وقتتون تلف نشه!"
