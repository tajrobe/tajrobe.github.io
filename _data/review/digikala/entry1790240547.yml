description: "انقدر باگ زیاده نمیدونم از کجا شروع کنم:) فقط میتونم بگم متاسفم برای خودم که دو سال از عمرم رو توی انبار دیجی کالا تلف کردم؛\r\nاما نمیخوام خیلی سیاه به قضیه نگاه کنم! من اونجا دوستای خوبی پیدا کردم، چون واقعا برای معاشرت و صحبت کردن آزادی وجود داره. البته این هم از سیاست و اتاق فکرشون بیرون میاد.\r\nمطمئن باشید اگه بابت حجاب، روابط، دوستی، اکیپ و... سخت‌گیری میکردن، کسی نمی‌تونست این همه باگ رو تحمل کنه و اکثریت استعفا میدادن.\r\nاکثرا به خاطر همین آزادی نسبی تحمل میکردن. نه صبحونه خوبی داشتیم، نه ناهار داشتیم، نه حتی میان وعده‌ای که مناسب ۱۰ ساعت کار باشه!\r\nشاید باورش سخت باشه اما من تو این شرکت روزایی رو تجربه کردم که هیچ میان وعده ای(به جز چایی) برای ۱۲ ساعت کار نداشتیم. اگه خیلی می‌خواستن حال بدن بعضی روزا دوتا بیسکویت در کنار چایی(با منت) میدادن. اگه خیلی خیلی حال میدادن کیک و آبمیوه میگرفتیم که البته هر روز نبود.\r\nاین اواخر تو  بلک فرایدی هر روز بدون آف کار کردیم. تصور کنید ۱۲ روز ۱۲ ساعته بدون آف و مرخصی! دردت اومد نه؟\r\nبله:) ما این روزا رو تجربه کردیم.\r\nما عید به عید شاهد این بودیم که صاحب بزرگترین انبار کشور به پرسنلش آجیل، مرغ، گوشت، روغن و... نمیداد.\r\nفریب تبلیغات گسترده استخدام رو نخورید. از دیجی کالا دوری کنید. این شرکت مثل طبل تو خالیه. انگار یه تیم قوی سال‌ها برای ظاهرسازی، فریب و دستکاری روانی شما برنامه چیده.\r\nاز دور همه چی شیک و محترمانه به نظر میاد؛ وقتی وارد محیطش میشی معنی واقعی تبعیض رو میفهمی...\r\n\r\nکار کردن تو شرکت هایی که دو شیفت صبح و عصر دارن یعنی بیگاری!\r\nبعضی هاشون تعارف رو کنار کذاشتن و ۲۴ ساعته چرخشی(با احتساب اضافه کاری) کار میکنن؛\r\nرک بگم کار کردن تو این شرایط شرف داره به کار تو محیطی که با وعده های پوچ و بدون احتساب حق ۲ ساعت اضافه کاری، ۱۰ ساعت پرسنل رو استثمار میکنه، هروقت دلشون بخواد آف رو برمیدارن، هروقت دلشون بخواد ۱۲ ساعته کار میکنن. هروقت دلشون بخواد اخراجت میکنن(قراردادها یه ماهه‌ست).\r\n\r\nدوستان اگه مثل من از سر ناچاری مجبور  شدید سر از دیجی کالا دربیارید، فقط و فقط پیک آپ یا بسته بندی برید. اصلا سمت سورت نرید. علی الخصوص سورت شیف شب که آدم بیسواد و مریضی به اسم علی حیدری سرپرستشه."
