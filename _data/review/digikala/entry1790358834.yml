description: "واقعاً در این شرایط گرونی، انتظار میره فروشگاهی مثل دیجی‌کالا بیشتر به فکر کاهش هزینه‌های مشتری باشه، نه اینکه برای هر کالا هزینه ارسال جداگانه محاسبه کنه.\r\n\r\nوقتی چند کالا رو از یک فروشگاه یا در یک سفارش خریداری می‌کنی، منطقیه که اگر قرار هست همه با یک مرسوله ارسال بشن، هزینه پیک هم تا حد امکان یکجا محاسبه بشه. اما دریافت هزینه ارسال جداگانه برای هر کالا باعث میشه مبلغ نهایی خرید به شکل قابل‌توجهی افزایش پیدا کنه.\r\n\r\nبه نظرم این شیوه قیمت‌گذاری ارسال، مخصوصاً در شرایط اقتصادی فعلی، فشار بیشتری به مشتری وارد می‌کنه و تجربه خرید رو اصلاً مطلوب نمی‌کنه. کاش دیجی‌کالا به جای افزایش هزینه‌های جانبی، راهکارهایی برای کاهش هزینه ارسال و حمایت بیشتر از مشتری‌ها در نظر بگیره."
