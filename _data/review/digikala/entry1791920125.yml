description: "عنوان: فشار روانی بالا، مدیریت ضعیف و نبود احساس امنیت شغلی در پشتیبانی تلفنی دیجی‌کالا\r\n\r\nتجربه من از کار در بخش پشتیبانی تلفنی دیجی‌کالا، تجربه‌ای به‌شدت فرسایشی و ناامیدکننده بود. اگر قصد استخدام در این بخش رو دارید، پیشنهاد می‌کنم قبل از تصمیم‌گیری، حتماً درباره شرایط واقعی کار تحقیق کنید و فقط به توضیحات زمان استخدام اکتفا نکنید.\r\nاز همون دوره آموزش، فشار و استرس زیادی وجود داشت. بعد از حدود یک ماه آموزش و امتحان، وارد تماس‌های واقعی شدیم؛ تماس‌هایی که در اون‌ها بارها با مشتریان عصبانی، توهین و فحاشی مواجه می‌شدیم. گاهی احساس می‌کردم در طول یک شیفت، باید بارها توهین بشنوم و بلافاصله بدون فرصت کافی برای بازیابی آرامش، تماس بعدی رو جواب بدم. فشار روانی این کار واقعاً بالاست و به نظرم حمایت از کارشناس در برابر چنین شرایطی باید جدی‌تر گرفته بشه.\r\nموضوع فقط تماس‌های سخت و مشتریان عصبانی نیست؛ نحوه مدیریت نیروها هم بخش مهمی از مشکل بود. مرتب تماس گرفته می‌شد که چرا روی خط نیستید، کجا رفتید، چه‌کار می‌کنید و چرا آماده پاسخگویی نیستید؟ حتی برای یک استراحت کوتاه ده‌دقیقه‌ای هم احساس آزادی و آرامش نداشتم و مدام باید نگران تماس بعدی و تذکر بعدی می‌بودم. چنین فضایی به‌جای تمرکز روی کیفیت پاسخگویی، استرس دائمی ایجاد می‌کنه.\r\n\r\nاز نظر من، رفتار برخی از تیم‌هدها و نحوه برخورد سرپرست با نیروها هم اصلاً حرفه‌ای و محترمانه نبود. در تجربه شخصی من، وقتی درباره دشواری کار و ناتوانی در ادامه همکاری صادقانه صحبت کردم، به‌جای یک گفت‌وگوی حرفه‌ای و بررسی شرایط، در جلسه‌ای با حضور مسئولان مربوطه با برخوردی تند مواجه شدم. جمله‌ای که به من گفته شد این بود: «با توجه به این شرایطی که پیش اومده، دیگه امکان ادامه فرایند همکاری رو نه برای یک روز، بلکه برای یک ساعت هم با شما نداریم.»\r\n\r\nاین نحوه برخورد برای من تحقیرآمیز بود. ممکنه عملکرد یک کارشناس مطابق انتظار شرکت نباشه و شرکت هم تصمیم بگیره همکاری رو ادامه نده؛ اما این موضوع توجیهی برای برخورد غیرحرفه‌ای با نیروی انسانی نیست.\r\n\r\nموضوع مهم بعدی، احساس ناامنی شغلی و وضعیت تسویه‌حسابه. بعد از قطع همکاری، به من اعلام شد که حقوق، عیدی، سنوات و سایر موارد مربوط به تسویه حدود دو ماه بعد پرداخت می‌شه. این موضوع برای کسی که تازه کارش رو از دست داده، نگرانی مالی بیشتری ایجاد می‌کنه. من هنوز منتظر تسویه هستم و نمی‌تونم درباره نتیجه نهایی پرداخت قضاوت کنم، اما همین زمان اعلام‌شده برای پرداخت، نگرانی زیادی برام ایجاد کرده.\r\nدر مجموع، تجربه من از این محیط کاری ترکیبی از فشار روانی بالا، تماس‌های پرتنش، کنترل مداوم، برخورد مدیریتی نامناسب و نگرانی درباره امنیت شغلی و تسویه‌حساب بود. من انتظار نداشتم کار بدون چالش باشه؛ انتظار داشتم در کنار این حجم از مسئولیت و فشار، حداقلی از احترام، حمایت و رفتار حرفه‌ای هم وجود داشته باشه.\r\n\r\nتوصیه من به متقاضیان: قبل از پذیرفتن این موقعیت، درباره فشار واقعی تماس‌ها، زمان استراحت، نحوه برخورد با فحاشی مشتریان، حمایت سرپرستان، معیارهای ارزیابی عملکرد و زمان دقیق تسویه‌حساب سؤال کنید. صرفاً اسم بزرگ یک مجموعه به این معنی نیست که تجربه کاری در تمام بخش‌های اون مناسب و رضایت‌بخش خواهد بود.\r\n\r\nاین متن بازتاب تجربه شخصی منه و هدفم اینه که متقاضیان با دید بازتری تصمیم بگیرن."
