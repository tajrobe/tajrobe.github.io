description: " با سلام\r\nشرکت همواره نقدهای واقعی و مستند را فرصتی برای بهبود می‌داند؛ اما در خصوص این دیدگاه، لازم می‌دانیم جهت شفاف‌سازی برخی موارد را اعلام نماییم.\r\n\r\nهمکاری با این شخص صرفا در قالب دوره کارآموزی و پیش از استخدام قطعی بوده و فرآیند جذب ایشان هیچ‌گاه به مرحله نهایی نرسید. تصمیم عدم ادامه همکاری نیز پس از ارزیابی‌های فنی، رفتاری و سازمانی اتخاذ شد.\r\n\r\n در طول دوره کارآموزی، موارد متعددی از جمله عدم انطباق با الزامات فنی مورد انتظار، عدم رعایت برخی الزامات رفتاری و سازمانی، وجود مغایرت در بخشی از اطلاعات ارائه‌شده در فرآیند جذب و همچنین عدم احراز شرایط لازم برای تأیید نهایی استخدام، در مستندات داخلی شرکت ثبت گردید و بر همین اساس ادامه همکاری امکان‌پذیر نبود.\r\n\r\n همچنین مطابق رویه شرکت، دوره کارآموزی مشمول بیمه نبوده و صرفا کمک‌هزینه‌ای بابت ایاب‌وذهاب و ناهار پرداخت می‌شود که این موضوع از ابتدای همکاری برای تمامی کارآموزان به‌صورت شفاف اعلام می‌شود.\r\n\r\nدر زمان خاتمه همکاری نیز مطابق عرف، چندین مرتبه جهت انجام تسویه و تعیین مبلغ توافقی با ایشان تماس گرفته شد که امکان نهایی شدن فرآیند فراهم نگردید. تمامی مستندات مربوط به این موضوع نزد شرکت موجود است.\r\n\r\n شرکت در حال حاضر با بیش از 12 نفر نیروی متخصص به‌صورت مستقیم همکاری داشته و تمامی فرآیندهای جذب، ارزیابی و خاتمه همکاری بر اساس ضوابط مشخص، مستندسازی‌شده و یکسان برای همه افراد انجام می‌شود. از انتشار هرگونه اظهار نظر یا نقد استقبال می‌کنیم، اما انتظار داریم مطالب منتشرشده نیز مبتنی بر واقعیت، مستندات و رعایت اصول حرفه‌ای باشد.\r\n\r\nعدم احراز شرایط نهایی استخدام آقای امیر مهدی رضایی\r\n1.فرآیند جذب ایشان به مرحله استخدام قطعی نرسید و پس از طی ارزیابی‌های فنی، رفتاری و سازمانی، تأیید نهایی همکاری صادر نشد.\r\n\r\nعدم تأیید در ارزیابی‌های امنیتی\r\n2.مطابق فرآیندهای داخلی شرکت، تأییدیه‌های موردنیاز در ارزیابی‌های امنیتی و پیش از استخدام برای ایشان احراز نگردید و فرآیند جذب متوقف شد.\r\n\r\nمغایرت در اطلاعات محل سکونت\r\n3.در فرآیند بررسی و راستی‌آزمایی اطلاعات استخدامی، مغایرت‌هایی میان اطلاعات اعلام‌شده و اطلاعات احرازشده در خصوص محل سکونت مشاهده گردید. (محل سکونت واقعی قرچک ورامین، محل اعلامی به شرکت طهران، محل شرکت طهران سهروردی)\r\n\r\nمغایرت در اطلاعات سوابق شغلی و حقوق\r\n4.بخشی از اطلاعات ارائه‌شده در خصوص سوابق شغلی و حقوق دریافتی پس از بررسی مستندات و راستی‌آزمایی، قابل تأیید نبود.\r\n\r\nعدم احراز حداقل دانش فنی\r\n5.در ارزیابی‌های فنی، حداقل دانش و مهارت مورد انتظار جهت کار با تجهیزات فایروال و انجام وظایف محوله احراز نگردید.\r\n\r\nعدم انطباق رفتاری\r\n6.در دوره کارآموزی، انطباق کامل با الزامات رفتاری، اخلاق حرفه‌ای و فرهنگ سازمانی مورد انتظار شرکت احراز نگردید.\r\n\r\nعملکرد دوره کارآموزی\r\n7.عملکرد ایشان در انجام وظایف و تسک های محوله طی دوره کارآموزی با معیارهای مورد انتظار شرکت انطباق نداشت.                                                                                                   \r\n+شرکت کلیه مستندات مرتبط با فرآیند جذب، ارزیابی، دوره کارآموزی، پرداخت‌ها و خاتمه همکاری را نزد خود نگهداری می‌نماید. در صورت استمرار انتشار مطالب خلاف واقع یا مطالبی که موجب خدشه به اعتبار، شهرت تجاری و منافع قانونی شرکت گردد، حق هرگونه پیگیری حقوقی و کیفری مطابق قوانین کشورمان ایران برای شرکت محفوظ بوده و در صورت لزوم از طریق مراجع صالح قانونی اقدام خواهد شد.\r\n\r\nامید است افراد، به جای انتشار مطالب غیرمستند پس از عدم ادامه همکاری، از این تجربه در مسیر رشد حرفه‌ای، تقویت مهارت‌های فنی و رعایت اصول اخلاق و رفتار سازمانی بهره ببرند. با سپاس 05.05.05"
