description: "تجربه همکاری من با شرکت بسیار مثبت بود. این شرکت را مجموعه‌ای حرفه‌ای، سالم و اخلاق‌مدار می‌دانم که در آن احترام به نیروی انسانی و کیفیت کار از اولویت‌های اصلی است. مدیرعامل و تیم مدیریت ارشد، علاوه بر تخصص بالا، از سلامت کاری، صداقت، شرافت حرفه‌ای و مسئولیت‌پذیری برخوردار هستند و تصمیمات سازمانی را با نگاه بلندمدت، تحلیل دقیق و مدیریت ریسک اتخاذ می‌کنند.\r\n\r\nیکی از مهم‌ترین نقاط قوت شرکت، سرمایه انسانی آن است. تیم فنی شرکت را از توانمندترین تیم‌هایی می‌دانم که در حوزه فناوری اطلاعات و امنیت سایبری فعالیت می‌کنند تیمی متخصص، متعهد و به‌روز که استانداردهای حرفه‌ای را به‌خوبی رعایت می‌کند.\r\n\r\nبا وجود اینکه  شرکت در حال رشد (Startup) است، سرمایه‌گذاری قابل‌توجهی در توسعه زیرساخت‌ها، آموزش و توانمندسازی کارکنان انجام داده و همواره تلاش کرده محیطی پویا، حرفه‌ای و مبتنی بر یادگیری ایجاد کند. فضای کاری صمیمی و در عین حال حرفه‌ای است و همکاری میان تیم‌ها بر پایه احترام متقابل شکل گرفته است.\r\n\r\nنکته دیگری که برای من ارزشمند بود، توجه واقعی شرکت به مسئولیت اجتماعی است. طی سال‌های اخیر، شرکت اقدامات مؤثر و ارزشمندی در این حوزه انجام داده که در میان بسیاری از شرکت‌های هم‌اندازه خود کمتر دیده می‌شود و نشان‌دهنده نگاه فراتر از صرفا کسب‌وکار است.\r\n\r\nدر مجموع، همکاری با دیاکو برای من تجربه‌ای ارزشمند، همراه با یادگیری، رشد و همکاری با مدیران و همکاران متخصص و اخلاق‌مدار بود و با اطمینان این شرکت را به افرادی که به دنبال محیطی حرفه‌ای و سالم هستند، پیشنهاد می‌کنم."
