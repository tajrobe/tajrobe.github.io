description: "تجربه من از کار کردن توی داتین در مجموع مثبت بود. حقوق‌ها همیشه به‌موقع پرداخت می‌شد و از نظر مبلغ هم نسبت به خیلی از موقعیت‌های شغلی مشابه وضعیت بهتری داشت. رفاهیات شرکت هم خوب بود و در کل احساس می‌کردم به مسائل و نیازهای کارکنان رسیدگی می‌شه.\r\n\r\nیکی از نکات مثبت شرکت، مخصوصا توی دوران جنگ، این بود که تا جای ممکن نیروها رو حفظ کرد و تعدیل نیرو نسبت به خیلی از شرکت‌ها کمتر بود.\r\n\r\nاز نظر مدیریتی هم تجربه خوبی داشتم. آقای رشیدیان واقعا یکی از حرفه‌ای‌ترین مدیرهایی بودن که توی دوران کاری‌ام دیدم. از اون مدیرهایی نبودن که فقط از دور مدیریت کنن  همیشه کنار تیم بودن، برای شنیدن مشکلات و دغدغه‌های بچه‌ها وقت می‌ذاشتن و می‌شد روی حمایت‌شون حساب کرد. آقای بیاتی هم مدیر حرفه‌ای و توانمندی بودن. واحد منابع انسانی هم در مجموع همراهی خوبی با تیم ما داشت.\r\n\r\nتنها بخشی که تجربه خوبی ازش نداشتم، روان‌شناس مجموعه بود. به نظرم نحوه برخورد و کیفیت خدماتی که ارائه می‌شد جای کار زیادی داشت و انتظار می‌رفت در این زمینه حرفه‌ای‌تر عمل بشه\r\n\r\nدر کل، داتین از نظر حقوق، مزایا، رفاهیات و کیفیت بعضی از مدیرها شرکت خوبیه و تجربه کاری من در مجموع تجربه مثبتی بود."
