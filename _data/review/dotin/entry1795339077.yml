description: "اتفاقا همکاری با داتین یکی از دارک ترین تجربیات من و یکسری از آدمای دیگه هستش که با مسیر اداره کار و شکایت, حقوق ماه آخر, سنوات و بقیه مطالبات قانونی رو گرفتن.\r\nزمانیکه میخواهید استخدام داتین بشید خیلی از فضای گل و بلبل و حقوق بالا یا شرایط کاری شبیه سیلیکون ولی برایتون داستان سرایی می کنن.\r\nهمون خانم های دهن گشاد منابع انسانی که اینجا هم نظرات دیگه خیلی خوب به حسابشون رسیدن!\r\nولی وقتی قرارداد رو امضا می کنی و وارد داتین خراب شده یا کثافت خونه میشی دیگه هیچ کسی از hr طرفدار یا پذیرای شما نیست و تنها جمله ای که ازشون میشنوی: درست میشه هستش یا برگه استعفا برای اینروزها ساخته شده!\r\nشاید باورتون نشه بخاطر فضای مسموم من و حداقل 5 نفر دیگه از بچه های طبقه ما استعفا دادیم و برای سرپرست فنی و مسئول hr تیم ما هیچ اهمیتی نداشت و با کمال پر رویی گفتن خدانگهدار و تو بانک رزومه افراد نیازمند زیاد داریم و سریع جایگزین خواهید شد!\r\nو با صراحت کامل گفتن: داتین یک شرکت شناخته شده هستش و با بودن یا نبودن شما که هیچی حتی 100 نفر آدم این طبقه هم چیزی ازش کم نمیشه!\r\nبله همون خانم های منابع انسانی که به قولی بعضی ها شبیه زنهای فاسد و خیابونی هستن!!!!!\r\nداتین خروج نیروی وحشتناک بالایی داره, باعث خراب شدن رزومه ات میشه و زمانیکه از سازمان خارج میشی من به چشم خودم دیدم برای رفرنس چک چه بدگویی هایی از بچه های نازنین تیم و کاربلد می کردن.\r\nدوستان \"\"صادقانه\"\" و به \"\"شرافتم قسم\"\" داتین یک فاجعه که هیچ چاه فاضلاب هستش که فساد, پارتی بازی و بی شرفی داخلش بیداد می کنه!\r\nلطفا حتی برای امتحان هم شده طرفش نیاید و تنها زمانی میفهمی که اون بلایی که سر همه میارن و استعفا میدن و میرن سرت بیاد.!!!!!\r\nگول نظرات فیک hr یا دلقک بازی هایی که تو لینکدین و مجازی می کنن رو نخورید.\r\nموفق باشید"
