description: "داده پردازی ایران مجموعه ای از تجربه های خوب و بد برای من بود.\r\n\r\nاز محاسن شرکت شروع میکنم. اینکه در یک شرکت با سابقه ی خیلی زیاد و زیرساخت آی تی قوی (مین فریم) کار کردم تجربه ی لذت بخشی بود برام. همچنین محیط دوستانه ی خوبی در هر بخش بین همکارا وجود داره هم جزو محاسن شرکت هست و کم پیدا میشه آدم زیرآب زن و بدخواه بین بچه ها حضور داشته باشه (و اگرم هست انگشت نمای کل شرکته و همه از نزدیکی به اون شخص حذر میکنند). \r\nدر مورد مزایا متاسفانه به همین دو مورد بیشتر نمیتونم اشاره کنم.\r\n\r\nدر مورد حقوق، اینکه پرداختی ها به موقع هست و هدایای نقدی مناسبتی دارند خوبه و همچنین مجموع مبلغ واریزی ها در طول سال مناسبه، ولی اینکه حقوق پایه رو خیلی خیلی کمتر از رنج معمول مبیندن اصلا خوب نیست. و آدم اصلا روی درامد ماهیانه اش نمیتونه حساب کنه و باید چشم انتظار پرداختی های خارج از حقوق برای گذران زندگی باشه. و این اصلا برای زندگی در این شرایط بد اقتصادی نیست. البته شرکت توجیه خودش رو برای این موضوع داره. و میگه مجموع واریزی ها در طول سال تقسیم بر 12 عدد خوبیه. ولی چون خودشون واریزی ماهیانه بالایی دارند اصلا درک زندگی با حقوق پایه کم رو ندارن.\r\n\r\nاما در مورد معایب خیلی زیاد داده پردازی.\r\n(قبلش تو پرانتز باید بگم بنا به شنیده هام از قدیمی های شرکت، هیچکدوم از این معایب در دهه هفتاد و تا حدودی هشتاد وجود نداشت و در ده پونزده سال اخیر شرکت انقدر داغون و افتضاح شده و همه هم به اتفاق مدیریت رو مقصر میدونن)\r\nاز بزرگترین عیب شرکت شروع میکنم: ساختار مدیریتی فاجعه و خراب!\r\nامکان نداره یه ایراد توی شرکت وجود داشته باشه و یه سرش به مدیریت نخوره.\r\nاز فساد مالی و دزدی منابع مالی  شرکت بگیر، تا تبعیض و بی عدالتی در پرداخت پاداش ها و دروغ و کمبود امکانات و همه چیز... حتی غذای رستوران!\r\nاینطوری بگم که یه تیم متشکل از معاونت ها و مدیر امور ها و حتی کارمندان وجود داره که دارن کل شرکت رو اداره و تصمیم گیری میکنن. اخراج های ناعادلانه، تبعیض های عجیب، دو رویی و دروغگویی مدیران، دو به هم زنی بین کارمندان، و رفتارهای عجیب خاله زنکی بیداد میکنه تو شرکت.\r\nشرکتی که یه زمانی گل سر سبد تمام شرکت های انفوراتیک کشور بوده الان یه شرکت افتضاحی شده که همه کارشناسای خبره دارن ازش فرار میکنن و هرکی مونده یا تو دل فساده، یا مجبوره بمونه، یا راضیه از اوضاع داغون!\r\nآدم دقیقا یاد اون مملکت باشکوهی میفته که تو دنیا همه حسرتشو میخوردن، و الان شده یه ویرانه که همه دنیا طردش کردن. مثال بارز از عرش به فرش!\r\nدر طول 3 سالی که من در داده پردازی کار کردم چیزی جز درجا زدن عایدم نشد. مدیران شرکت هیچگونه علاقه ای به پیشرفت فنی و راه رفتن در لبه ی تکنولوژی ندارن. و هیچ جای شرکت نمیبینی یه آدم لایق در سمت مدیریت باشه. هرچی فسیل و عقب مونده و پاچه مال، ببخشید پاچه خوار هست توی سمت مدیر دیده میشه. و اجازه پیشرفت به پرسنل نمیدن. انتقاد و شکایت هم راه به جایی نمیبره و هیچ تاثیری نداره.\r\n\r\n\r\nبطور خلاصه بخوام بگم:\r\nاگه دانشجوی ارشد یا دکتری هستید، اگه میخواید کار پاره وقت شخصی سر کارتون انجام بدید، اگه میخواید زایمان کنید و کارتون رو از دست ندید، اگه میخواید موش چال کنید و کسی کاری به کارتون نداشته باشه، اگه سنتون خیلی بیشتر از پدربزرگ منه و بازنشسته شدید و جایی بهتون کار نمیدن و دنبال درامد ثابت هستید، داده پردازی ایران بهترین انتخاب برای شماست. اما اگه به دنبال یه شرکت با ساختار سازمانی سالم هستید، اگه دنبال پیشرفت در حرفه ی خودتون هستید، اگه دنیال آرامش اعصاب و روانتون هستید اصلا داده پردازی رو پیشنهاد نمیکنم.\r\nبه جرات میتونم بگم از بچه های داده پردازی از هرکسی (بجز اون افرادی که لیست کردم) بپرسید حرفای منو تایید میکنه."
