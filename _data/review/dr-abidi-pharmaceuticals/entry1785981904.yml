description: "سلام من چند ساله تو داروسازی عبیدی انبار کار میکنم و خیلی شرایط کار تو انبار بد میباشد از روز مصاحبه مدیر انبار با لحن بدی با من برخورد کرد و الانم که چند سال از این قضیه میگذره هنوز بر خورد بد و تبعیض هایی که هست نسبت به افزایش حقوق پرسنل انبار و افزایش تولیدها کاملآ مشخصه هیچ رسیدگی وجود نداره مدیری کاملآ بی شخصیت و بی ادبی داره من تحقیق کردمایشون تو بهشهر هم شخصیت و سمت جالبی نداشت یه کانکس داده بودند تو یه جای پرتی حتی ظرف غذاش رو هم خودش میشست الان اون روزها رو فراموش کرده این آدم فوق العاده بی شخصیت و بی ادب هست خیلی از دوستان ما رو به دلایل مختلفی اخراج کرده شما همیشه نگاه کنید میبینید تو جاب ویژن انبار در حال نیرو گرفتنه لیست  نیروهایی که اخراج شدن از انبار رو پیگیری کنید خیلی زیاد هست خلاصه تو داروسازیهای دیگه اسم عبیدی و مدیر انبار بد پیچیده "
