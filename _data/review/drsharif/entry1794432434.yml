description: "تجربه من از مراجعه به این شرکت واقعاً عجیب و ناامیدکننده بود.\r\n\r\nبه نظر می‌رسه مجموعه اصلاً آشنایی درستی با اصول و روند یک مصاحبه استخدامی نداره. ابتدا شما رو به ساختمونی دعوت می‌کنن که حتی از بیرون هم وضعیت مناسبی نداره؛ آیفون ساختمان کنده شده، سیم‌ها بیرون زده و هیچ نام و نشانی مشخصی هم از شرکت روی ساختمان وجود نداره.\r\n\r\nبعد از ورود، یک برگه A5 بهتون می‌دن تا اطلاعات شخصی مثل نام و نام خانوادگی و تاریخ تولد رو وارد کنید؛ اطلاعاتی که طبیعتاً بخش زیادی از اون‌ها در رزومه وجود نداره. سپس صداتون می‌کنن، ازتون می‌خوان خودتون رو معرفی کنید و در نهایت خیلی ساده می‌گن: «خب، حالا باهاتون تماس می‌گیریم!»\r\n\r\nواقعاً سؤال من اینه که اگر قرار بود کل فرایند به همین چند مرحله محدود بشه، چرا این اطلاعات رو تلفنی دریافت نمی‌کردن؟ حداقل انتظار می‌رفت یک مصاحبه اولیه با واحد منابع انسانی (HR) یا یک ارزیابی فنی انجام بشه تا مشخص بشه اصلاً همکاری دو طرف امکان‌پذیر هست یا نه.\r\n\r\nنکته عجیب دیگه هم وضعیت داخل شرکت بود؛ یک نفر در گوشه‌ای از محیط شرکت دراز کشیده بود و پتو رو روی سرش کشیده بود و خوابیده بود! صحنه‌ای که واقعاً به فضای یک محیط کاری و جلسه مصاحبه شباهتی نداشت.\r\n\r\nموضوع دیگه اینکه نام شرکت در آگهی جابینجا با نامی که داخل مجموعه درج شده بود متفاوت بود. در جابینجا با یک نام دیگه آگهی منتشر کرده بودن، اما داخل شرکت نام «رهپویان شریف» درج شده بود.\r\n\r\nدر مجموع، تجربه من از این مراجعه بسیار منفی بود. این سطح از بی‌نظمی، نبود شفافیت و نداشتن یک فرایند مشخص برای جذب نیرو، برای من نشانه‌های خوبی از وضعیت مجموعه نبود. شخصاً این شرکت رو برای ارسال رزومه یا مراجعه جهت مصاحبه پیشنهاد نمی‌کنم."
