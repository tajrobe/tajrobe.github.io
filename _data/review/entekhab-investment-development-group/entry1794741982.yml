description: "درودها... من دو سال برای این مجموعه با سمت مشاور فروش کار کردم، موقعیت یک شهر کوچک پانزده هزار نفری... جدا از اینکه خیلی از هزینه ها بر دوش خودت بود، توقعات مدیریت به شدت ضعیف و بله قربان گو بسیار بالا.... جلسات فروش با زبان چاله میدونی و بی احترامی همراه و هیچ شعوری بر جلسات حاکم نبود \r\nبعذا برخی از مدیران که لفت و لیسشان با فرانچایز به راه بود اخراج میشدند ولی سو رفتارشان هرگز پاک نمیشد و نخواهد شد...\r\nیادمه در یک جلسه آنلاین کشوری که برای مثال بهمن ماه برگزار شده بود، مدیریت کل کشور داشت میگفت فروش دی ماه خیلی برای شرکت مهمه .... همینقدر پرت ...\r\nمدیران فاسدی که قبلا ذکر کردم همین مدیر نالایق را رهبر خطاب میکردند\r\nخلاصه که اگر در خودت تملق کافی و بسیار میبینی جای خوبی برای رشده ...."
