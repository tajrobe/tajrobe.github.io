description: "بصورت شفاف و صادقانه تصمیم گرفتم افتضاح ترین تجربه مصاحبه قرن با این شرکت رو با بقیه اشتراک بزارم تا متضرر نشید\r\n۲ ماه بعد از ارسال رزومه با من تماس گرفتند دفتر مرکزی واقع در اصفهان هست و بعد از مصاحبه اولیه تلفنی و توضیحات مختصر از شرکت قرار به انجام مصاحبه آنلاین با مدیر جذب استخدام اقای م.م گذاشتند مصاحبه با ایشون کمتر از ۵ دقیقه بدون هیچ سوال فنی و تخصصی یا توضیح در مورد شرایط کار شکل گرفت که تعجب کردم ولی تصور کردم باتوجه به رزومه و مهارت هام نیاز به ارزیابی مجدد ندیدن ولی اینطور نبود در اصل دانش لازم رو برای سنجیدن نداشتن بعد از اون مصاحبه تلفنی با مدیر منابع انسانی داشتم ایشون گرم و صمیمی بودن سپس کلی مدارک شخصی از من گرفتند (در حالی که استخدام هنوز قطعی نبود و اشتباه کردم اعتماد کردم مدارک فرستادم) قرار شد مصاحبه نهایی با مدیر عامل انجام بشه که بعد از مصاحبه به من گفتند همه موافق همکاری هستند فقط می بایست یکبار هم حضوری دفتر اصفهان بیایید تا مدیر عامل ارزیابی نهایی داشته باشن\r\nجالب این بود که این دعوتشون بدون در نظر گرفتن هزینه ایاب ذهاب و… بود و میگفتن با خودتونه در حالیکه سایر شرکت های معتبر یا نامعتبر متوجه هستن اگر کسی رو از شهر دیگه با مسافت ۵۰۰ کیلومتری می خوان دعوت کنن تمام هزینه هاش رو پرداخت کنن و این لحظه بود که در مورد این روند غیر اصولی طی شده و ادامه فرایند با این شرکت به فکر فرو رفتم و در نهایت با تردید تصمیم به سفر گرفتم . ۱۰۰۰ کیلومتر رفت برگشت با مخاطرات جاده طی کردم و حضورا با مذیر عامل ملاقات کردم در نهایت تایید نهایی رو دادن و قرار شد مدارک تکمیل کنم\r\nبعد از حداقل ۶ مرحله مصاحبه انلاین و حضوری که شامل هزینه و گذشت زمان و نادیده گرفتن سایر موقعیت هام بود مدیر جذب نالایق با من تماس کرفت و با لحن دستوری مدل بازجویی تازه شرایط کار رو رو کرد که روزانه چندساعت اضافه کار اجباری داری ، پنجشنبه ها کاریه ، ماهی یکبار باید بری ماموریت شهرستان فقط با اتوبوس پرواز و تاکسی در کار نیست ، حق نظر در مورد استخدام ها نداری، علاوه بر جذب تشکیل پرونده هم با خودته، از وقتی رسیدی شرکت باید گزارش کار پر کنی هر روز بفرستی ، و هر هفته یکبار باید بیای دفتر اصفهان جلسه !!!!!\r\nهمون لحظه صحبتش رو قطع کردم و گفتم نمیتونم هر هفته بیام شهرستان و جلسه انلاین شرکت می کنم که گفت نه منم گفتم شرایطی که میگی اصلا برام قابل قبول نیست و چرا این چیزارو الان میگی که کلی زمان و هزینه کردم و روز اول کاملا شرایط دیگه ای بهم اعلام شده بود و… این آدم که اصلا نه رفتار و نه علم و نه دانش جذب استخدام داشت هیچ جوابی نداد مطمعنم از این شگرد استفاده می کنن تا آدم ها رو فریب بدن طرف ناچارا قبول کنه چون اگه اول میگفت هیچچچچ فرد باتجربه حتی کسایی که تازه میخوان بیان تو این فیلد شرایط مسخرشو قبول نمی کنن\r\nو بعد پیگیری کردم همکاران خودشون هم تایید کردند ایشون اصلا صلاحیت این شغل رو نداره و هرکی باهاش کار میکنه داره استعفا میده و سوابق قبلیش محدود پراکنده تو شرکت های اجر پزی و… بوده و نصف من سابقه کار داشت و مطمعنم یک دهم من تخصص نداشت و بعید میدونم حتی توانایی صحبت در مورد شغل خودش رو دلشته باشه و نمیدونم چجوری با چه روشی اومده اون شرکت\r\nاینارو گفتم قبل از هر تصمیمی با اطلاع باشین تا مثل من نقره داغ نشین اصلا توصیه نمی کنم جای بشدت غیر حرفه ای"
