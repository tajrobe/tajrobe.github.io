description: "برای پوزیشن برنامه نویس فرانت اند رفته بودم مصاحبه. رفتارشون واقعا توهین آمیز بود. با اینکه رزومه دادیم باید فرم پر کنیم و اسم و شغل اعضا خانواده رو بنویسیم.\r\nمصاحبه با 35 دقیقا تاخیر شروع شد و شخص مصاحبه کننده یه بیسواد بی ادب بود و قیافه اش شبیه اراذل و اوباش که بویی از رفتار مودبانه و ادبیات درست نبردن.\r\nکلی سوالات شخصی هم پرسیده شد مثل ازدواج و ریز زندگی خانواده.\r\nبعدش فهمیدم سقف حقوق 60 تومن هستش و مبلغ 500 میلیون باید سفته بدی و قرارداد ها کوتاه و مثلا 2-3 ماهه هستن که از این طویله فرار کردم.\r\nاگر وقت و شعورتون برای شما ارزش نداره حتما برید مصاحبه."
