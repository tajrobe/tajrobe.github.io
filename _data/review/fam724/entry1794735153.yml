description: "متأسفانه با تغییر مدیریت عامل، فضای کاری شرکت به‌شدت دستخوش تغییرات منفی شد. مدیرعامل جدید همراه با تیم مدیریتی منتخب خود وارد مجموعه شد؛ تیمی که به اعتقاد من، تجربه و شناخت کافی از ساختار، محصولات و پیچیدگی‌های کسب‌وکار ملل نداشتند و در مدیریت شرکت های خدمات و شاپرک و سداد شکست خورده بودند.\r\nدر ادامه، بسیاری از نیروهای باسابقه و متخصص مجموعه که سال‌ها برای توسعه محصولات و زیرساخت‌های شرکت زحمت کشیده بودند، کنار گذاشته شدند و جای خود را به نیروهای جدید و عمدتاً نزدیک به مدیریت جدید دادند.\r\n\r\nاز آن زمان، امنیت شغلی کارکنان به‌شدت کاهش پیدا کرد و فضای سازمانی به‌جای تمرکز بر تخصص، بهره‌وری و توسعه محصول، تحت تأثیر حواشی مدیریتی، روابط غیرحرفه‌ای و جابه‌جایی‌های سلیقه‌ای قرار گرفت.\r\n\r\nیکی از تلخ‌ترین بخش‌های این تغییرات، برخورد دوگانه با مدیران و کارکنان بود؛ به‌گونه‌ای که برخی مدیران قدیمی با وجود انتقادهای جدی نسبت به عملکرد و سلامت کاری‌شان(مدیر نرم افزار)، همچنان در مجموعه حفظ شدند، در حالی که مدیران دلسوز، متخصص و باسابقه به‌راحتی حذف شدند.\r\n\r\nجمع‌بندی: فام پیش از این تغییرات، مجموعه‌ای با نیروهای باتجربه و دانش سازمانی ارزشمند بود؛ اما تغییرات مدیریتی باعث از دست رفتن بخش قابل‌توجهی از این سرمایه انسانی شد. متأسفانه در چنین فضایی، تخصص، تعهد و سابقه کاری دیگر تضمین‌کننده امنیت شغلی نیست و این موضوع انگیزه و اعتماد کارکنان را به‌شدت تحت تأثیر قرار می‌دهد."
