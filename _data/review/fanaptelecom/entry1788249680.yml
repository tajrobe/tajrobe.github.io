description: "داخل این شرکت که وارد میشی باید بگم همه اینا رو تجربه میکنی :\r\nحدود ۲ ماه اول تمامی همکاران به تو جواب سلام و محل نمیدن و هرچی حرف میزنی با دیوار زدی چون کسی جواب نمیده بعدش سرپرست میگه که تو با بقیه دوست نشدی و شروع میکنه ایراد گرفتن که تو از کار خوشت نمیاد نمیدونم چه ربطی بهم دارن.\r\nهمه ادمای اینجا فوق العاده مذهبی اما درباطن فوق العاده زیراب زن و دورو و خراب کن طوری که شما یه تسکی رو انجام میدی بعدش میبینی نیست که همکار میاد پاک میکنه که بگه تو کاری انجام ندادی. بابت کارهاتون اگه اسکرین مدرک بگیری بازم کسی قبول نمیکه یا مثلا خانم چادری مذهبی از عمدا کار رو اشتباه به شما میگه که خراب کنی یا کلا نمیگه که جریان کار چیه که شما کار رو یاد نگیری و نتونی بمونی \r\nبعداز مدتی شما دیگه نمیتونی اعتماد کنی به حرفاشون ، مجبوری روندی که توی ذهنتون هست رو پیش ببری که اونم بعضی وقتا اشتباه درمیاد\r\nاینجا همه با ادمای تازه وارد بدن حتی همون سرپرستی که تورو قبول کرده . من خودم وقتی اومدم سرپرست خانم خوان*** از حرفاش می‌فهمیدم که منو از گروه نمیدونه نفرات گروه بقیه رو حساب میکنه اما منو نه \r\nجواب سوال رو با توهین که تو خنگی و نفهمی و انواع توهین ها و بدرفتاری میدن چون که اینجا یه سری ها چند سال موندن اونم بخاطر اینه که خودشون مذهبی بودن نه خوب بودن کارشون ، خودم دیدم که با کاربرا فوق‌العاده بدرفتاری میکنن اما سابقه دارن.\r\nشما کاررو تحت هیچ شرایطی یاد نمیگیری چون که کار تلکام و خودشرکت داخل نت وجود نداره منحصر هست و کسی راهنمایی نمیکنه بعدشم میگن از کار خوشت نمیومد اما اون موقع که موقع تمدید قرار داد شه حدود ۵ تا ۱۰ نفر همزمان براتون شروع میکن درست کردن که بزاری و بری\r\n خدا رحم کنه بهتون که هرکاری کنی یه ایرادی یا درمیارن یا درست میکنن برات طوری که روانت میریزه به هم .\r\nخودت حس میکنی که من دارم کارو درست میکنم اما کارام دیده نمیشه یا انگار همه کارهام اشتباه یا کم کاریه \r\nدلیلش بد بودن شما نیست محیط مسموم اینجا هست\r\nبنظرم توی شرکتای مذهبی نرید چون اینطوری هستن فقط حقوق سروقت و مزایا داره اما فرهنگ سازمانی صفره امنیت شغلی هم صفر چون جایگاهی برات نگه نمیدارن برای من لکه سیاهیی تو رزومه من شدش اینجا و فقط خاطرات بد شدش برام فقط  اقای خدماتی اینجا ادم شریف و پاک و خوبی هستش "
