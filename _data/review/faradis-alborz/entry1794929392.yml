description: "تجربه‌ی کار در داده‌ورزی فرادیس البرز\r\nبیشتر از ۲۰ ساله که توی شرکت داده‌ورزی فرادیس البرز کار می‌کنم و الان هم به‌عنوان کارشناس در بخش عملیات مشغولم. دو نفر قبل از من تجربه‌شون رو نوشتن و فکر کردم شاید بد نباشه من هم نظرم رو از دید یک کارمند بخش عملیات بگم.\r\n\r\nمن واقعاً از کار کردن توی این شرکت لذت می‌برم. جمعه‌ها لحظه‌شماری می‌کنم که شنبه بشه و دوباره برگردم سر کار و با چالش‌های پیش رو روبه‌رو بشم. به نظرم هر روز حس پویایی، کار تیمی و زنده بودن رو تجربه می‌کنم و این برام خیلی خوبه.\r\n\r\nحقوق و مزایای شرکت هم به نظرم مناسبه. من حدود ۹۰ میلیون تومان حقوق می‌گیرم. شاید این مبلغ برای همه کافی نباشه، اما در مقایسه با شرکت‌های مشابه توی این حوزه، به نظرم شرایط بدی نیست. البته طبیعتاً حقوق هرکس با توجه به سمت و سابقه‌اش می‌تونه فرق داشته باشه.\r\n\r\nشرکت فرادیس از بخش‌های مختلفی تشکیل شده که همه با هم در ارتباطن و کارها به هم وابسته است. به نظرم شرکت مدام در حال تغییره و هر چند وقت یک‌بار چیزهای تازه‌ای بهش اضافه می‌شه. امیدوارم با ادامه‌ی روند رو به رشد شرکت و اومدن مدیرعامل جدیدی که از بدنه‌ی خود شرکت هست، اتفاق‌های خوب بیشتری بیفته.\r\n\r\nیکی از چیزهایی که من دوست دارم اینه که می‌تونی مشکلاتت رو با مدیران مطرح کنی، جواب بگیری و حرفت شنیده بشه. البته همیشه همه‌چیز اون‌طوری که من می‌خوام پیش نمی‌ره، ولی همین که امکان صحبت و پیگیری هست و گوش شنوا وجود داره، برام ارزشمنده.\r\n\r\nدر شرایطی که اوضاع اقتصادی کشور و خیلی از شرکت‌های مشابه خوب نیست، به نظرم ما شرایط نسبتاً خوبی داریم و باید منصفانه درباره‌ی شرکت حرف زد. تجربه‌ی من از کار در فرادیس مثبته و به‌طور کلی از کار کردن توی این شرکت راضی‌ام.\r\nراستی تا یادم نرفته ، بیمه تکمیلی خیلی خوبی داره،  در طول سال به مناسبت های مختلف هم پاداش یا کارت هدیه میدن . اساس نمیخوام بگم اینجا مدینه فاضله است ولی در مقایسه با شرکت های مشابه تو  این رسته کاری خوبه ولی میتونه خیلی بهتر بشه. "
