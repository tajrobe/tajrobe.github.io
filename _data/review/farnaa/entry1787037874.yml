description: "قصه‌ی تلخِ پشتِ نقابِ «هوشمندی»\r\n\r\nوقتی اسم یک شرکت «توسعه تجارت هوشمند» است، آدم انتظار دارد حداقل رفتار با نیروهای انسانی‌اش هم «هوشمندانه» باشد. اما متأسفانه تجربه‌ی حضور در شرکت «فرنا»، قصه‌ی متفاوتی است.\r\n\r\nمن این متن را نه برای تخریب، بلکه برای شفاف‌سازی می‌نویسم؛ برای تمام همکارانی که در جست‌وجوی محیطی حرفه‌ای هستند و ممکن است مثل ما، فریب ظاهرِ کار را بخورند.\r\n\r\nواقعیت این است که در فرنا، به جای توسعه و هوشمندی، ما با مجموعه‌ای از چالش‌های فرساینده طرف بودیم:\r\n\r\nاز عدم امنیت شغلی و بی‌نظمی‌های کلافه‌کننده گرفته، تا حقوقی که با هیچ متر و معیاری «کافی» نبود و نبودِ پاداش که خستگیِ کار را دوچندان می‌کرد. اما دردناک‌تر از همه، فرهنگِ «کنترلِ حداکثری» است؛ اینکه به جای اعتماد، با دوربین و نظارت افراطی با متخصص‌ها رفتار شود، یعنی عملاً اصلی‌ترین سرمایه‌ی یک شرکت، یعنی «اعتماد»، در این مجموعه گم شده است.\r\n\r\nاینجا محیطی است که در آن «توازن کار و زندگی» بیشتر شبیه یک شوخی تلخ است و «مدیریت ضعیف» باعث می‌شود بهترین استعدادها، به‌جای رشد، فقط به فکر فرار باشند.\r\n\r\nنوشتنِ این کلمات سخت است، اما سکوت کردن در برابر «محیطِ غیرحرفه‌ای» و «بی‌عدالتی»، یعنی همدستی در ادامه دادنِ همین چرخه.\r\n\r\nامیدوارم این کلمات، تلنگری باشد برای مدیریت مجموعه؛ شاید هنوز راهی برای بازگشت به مسیر حرفه‌ای و انسانی وجود داشته باشد. و هشدار و توصیه‌ای برای دوستان عزیزم که در حال جست‌وجوی کار هستند: قبل از انتخاب، فقط به برند نگاه نکنید، به فرهنگِ پشتِ پرده‌اش هم دقت کنید.\r\n\r\n#تجربه_کاری #توسعه_تجارت_هوشمند_فاخر #فرنا #نقد_سازمانی"
