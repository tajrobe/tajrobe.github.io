description: "با سلام و وقت بخیر خدمت همه عزیزانی که این متن رو میخونن\r\nمن قبل اینکه بخوام برای شروع کار توی این شرکت اقدام کنم به ویکی تجربه رجوع کردم که اطلاعاتی به دست بیارم، اما خب نظری نبود\r\nمیخوام که نظر خودم رو راجب مدتی که توی این شرکت کار کردم اعلام کنم، توی مدتی که توی این شرکت کار کردم هیچوقت نشد که حقوق رو به موقع بدن، از اولین ماه کاری من همیشه حقوق با 15 روز تاخیر داده میشد و بعد تبدیل به پرداخت به صورت واریز توی چند پرداخت شد، محیط به صورت کلی دارای فضای سمی و جذب کارکنان به صورت سفارشی هست، و کارکنان به دلیل اینکه اگر از این شرکت بیرون بیان جایی نمیتونن استخدام بشن، توی این شرکت میمونن تا بتونن توی گروه های دیگه سایپا جذب بشن و بتونن از این شرکت بگریزن\r\nنزدیک به 2 ساله که از این شرکت خارج شدم و حقوق خودم اعم از ثنوات و عیدی به من پرداخت نشده و مسئولیت مالی و  hr  و مدیر عامل هیچ تایمی رو بردای گرفتن حق معوقه من اعلام نمیکنند و بیمه دو ماه از ماه هایی که من توی این شرکت مشغول بودم رو هم پرداخت ننموده اند\r\nامیدوارم که این تجربه باعث بشه که اشخاص دیگه ای که به دنبال کار با تکیه بر شایستگی خودشون هستن از انتخاب این شرکت برای کار منصرف بشن"
