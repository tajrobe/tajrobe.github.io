description: "من تابستان سال 404 با این شرکت در قالب کارآموزی همکاری داشتم. برای بخش بهینه‌سازی دسترسی رادیویی کارآموز گرفتن تا تسک‌های این بخش را بتونن با برنامه‌نویسی یکم اتوماتیک کنن. با شروع کار در اختیارتون لپ‌تاپ و کیبورد میزارن و بابتش سفته میگرن. منتهی حواستون باشه روی سفته دقیقا ذکر کنید بابت تجهیزاته چون ممکنه انتهای کار بگن بابت آموزش تو دوره کارآموزی هم بوده؛ که خب آموزشی در کار نیست :)) شما صرفا صبح تا عصر میری اونجا میشنی داکیومنت میخونی بدون اینکه حتی یه تسک خیلی ساده بت بدن انجام بدی. کلا  دو تا مشکل وجود داره یکی اینکه برای اینکه بخواید کاری انجام بدید باید از همراه اول دسترسی داشته باشید. برای ما سه نفر کارآموزی که گرفته بودن اصلا یادشون رفته بود دسترسی بگیرن و من نزدیکای بیرون اومدنم از شرکت تازه پیگیرش شدم. مشکل دیگه هم اینه که خیلی برای نیروی جدید بدون برنامه عمل کردن. اصلا مشخص نبود واسه چی نیرو میگرن و دقیقا با این نیروها میخوان چیکار کنن. اون بازه تب و تاب n8n شروع شده بود و فقط یه ایده داشتن که بیاید نیرو بگیریم برامون تسکای بهنیه‌سازی را اتومیت کنه :| یعنی برن تسکای بهینه‌سازی را یاد بگیرن بعد بیان برامون اتومیتش کنن و خب نه کاری به من یاد دادن نه از چیزی که بلد بودم استفاده کردن. (البته تو پرانتز بگم این تعللشون تو سپردن کار تا حدودی درسته چون مسئله مخابرات در ایران یکمی امنیتیه و بخوان سرویس‌های حیاتی اپراتورا بدن دست شما اونم بدون سواد فنی شاید خیلی منطقی نباشه؛ ولی خب تو فرافن مشکل اینکه به من کاری نمیسپردن فکر میکنن بیشتر ناشی از مدیریت بدشون بود) \r\n\r\nمن صبح تا عصر فقط داشتم داکیومنت میخوندم و هر سری قرار بود چیزایی که خونده بودم را ارائه بدم به انواع و اقسام دلایل از جمله اینکه مدیر پروژه فلان شهرستانه و ... عقب انداختن. این ارائه هم چیز رسمی‌ای نبود صرفا میخواستن منو ارزیابی کنن ببینن داکیومنتا خوندم یا نه. داکیومنتش Hedex هوآوی بود که هم پیچیده است و هم طولانی.\r\n\r\nبه کارآموز حقوق نمیدن (البته من سابقه کار رسمی جایی نداشتم و فقط قبل از فرافن جای دیگری کاراموز بودم)، ناهار نمیدن، مزایا هم نداره. موقعیت شرکت هم نزدیک آرژانتینه که هم دسترسیش خیلی بده هم سفارش غذا تو اون منطقه به شدت گرونه. در مورد دسترسیش بگم شما بخواید با مترو برید شرکت باید ایستگاه میرزای شیرازی پیاده شید که فوق‌العااااااده شلوغه. یعنی یکی از اصلی‌ترین دلایل من برای بیرون اومدن از اونجا همین بوده. بعد از مترو هم شما باید یه خطی سوار شید تا بیارتتون دم میدون آرژانتین.\r\n\r\nبخش بهینه‌سازیس برای همراه اول کار میکنه و تو اون بازه میگفتن چون همراه تازه پهنای باند 5G خریده و به رگولاتوری مقرضه فعلا پول شرکتا نداده که بتونن حقوق بدن و جوری که الان یادمه دو سه ماهی بود به بچه‌های بخش حقوق نداده بودن. حالا اینکه این فقط مربوط به اون موقع بوده یا همیشه مشکل معوقات داره نمیدونم. حقوق‌ها هم به نسبت شرکت‌های مشابه مثل ناک پایین‌تر بود و همه از بابت همین و معوقات همیشگی شکایت داشتن. پرداخت حقوق‌ها هم اینطوریه که یه بخشیش (فکر کنم نصفش) به یک حسابی زده میشه که فقط میتونید باش کالا بخرید.\r\n\r\nدر مورد کارمندای شرکت بگم که بچه‌های فوق‌العاده‌این. اغلب جوون و خوب. بخشی که من بودم بیشتر خانوم بودن. یعنی از 100 نفر شاید 70 نفر خانوم بودن و خیلی مهربون. همه هم با هم رفیق‌اند و فضا خیلی صمیمیه و دور از تنشه. مدیرای بخش و سرپرستای استان‌ها هم خیلی خوب و نایس بودن.\r\n\r\nمن در نهایت به خاطر مشکلاتی که گفتم مخصوصا اینکه خیلی بی‌برنامه بودن و هیچ تسکی بم نمیسپردن، نوع کار بهینه‌سازی که خیلی کم چالشه و با روحیه‌م جور نیست و اینکه یکمی هم درگیر پایان‌نامه‌ام بودم بعد حدود یک ماه از شرکت اومدم بیرون.\r\n\r\nدر مورد روند مصاحبه هم بگم که برای من دو تا مصاحبه داشت و هر دو حضوری. جلسه اول یکم فنی و شخصیت شناسی‌طور بود. جلسه دوم هم دوباره شخصیت شناسی و بستن قرارداد بود. کلا هم مصاحبه‌هاش خوب بود."
