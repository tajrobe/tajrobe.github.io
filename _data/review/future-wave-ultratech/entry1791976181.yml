description: "امکانات رفاهی و شرایط خوبی نداره \r\nمثلا ب نیروی خدماتی صبحانه میدن ولی نیروی متخصص هیچ اپشنی نداره\r\nاضافه کار هم ب کسی نمیدن\r\nنه پاداش ن چیزی\r\nمعمولا مدیر هم با پارتی انتخاب میشه و خیلی سطح پایین داره و باعث میشه ک کل تیم ب فنا بره\r\nبیشتر کارمندای شرکت هم پسر خاله یا دختر خاله هییت مدیره هستن\r\n\r\nجدیدا هم زنگ ورزش گذاشتن ک ی خانومی با نیم تنه حرکات ورزشی وسط کار میومدن انجام میدادن🤣🙈\r\n\r\nسطح تیم لیدا خیلیییی پایین و تجربیات خیلیییی کمی داشتن متاسفانه\r\n\r\nمحیط شرکت دلگیر\r\nصندلی داغون\r\nامکانات فوالعاده کم\r\nفقط ی چای بود اونم اکثرا جوشیده👀\r\n\r\nروابط دختر پسر و اینجور بازیا خیلی خوبه اکثرا ساعتها دخترا و پسرااا تو حیاط مینشستن برای ناهار یا سیگار وقت میگذروندن\r\nتایم کاری بی برنامه و زیاد\r\nحقوق شرکت خیلیییییییی بی برنامه و با تاخیر واریز می‌شد اگرم پیگیری میکردی جواب سربالا میدادن متاسفانه ی درصدی هم تو بن کارت میزدن اونم خیلیییی دیر واریز میکردن\r\n\r\nاصلا تجربه خوبی ندارم از این شرکت\r\nواقعا سطح سواد تخصصی پایینی دارن🫥\r\n\r\nاکثرا دختر مجردا با مردای متاهل رل میزدن🥸\r\n\r\nمنابع انسانی خیلی ضعیف\r\n\r\nمدیریت فوقالعاده سطح پایین\r\n\r\nرنج سنی کارمندا بالا\r\n\r\nی سامانه در باگ داشتن ک فرسوده شده بود\r\nو مدیرای اون سامانه فکر میکردن خدا هستن🤣🤣🤣\r\nی چیزی ک منو خیلی اذیت می‌کرد کار رو درست انجام نمیدادن و پر باگ تحویل زیرساخت میدادن و ادعای خدایی داشتن\r\n\r\n\r\nهرچی زیرابزن تر موفق تر\r\nاصلا سمت این شرکت نرید\r\n\r\nشرکتم خیلی جای بدی قرار داره\r\nبد مسیر و لوکیشن بدیه\r\n\r\nریخت و‌پاش برا پز دادن خودشون داشتن \r\nاما ب پرسنل اصلا نمیرسن\r\n\r\n\r\nشرکت بدرد نخور با منابع انسانی فجیع\r\nمدیران بی کیفیت\r\nو امکانات زیر خط فقر😂😂😂😂\r\n"
