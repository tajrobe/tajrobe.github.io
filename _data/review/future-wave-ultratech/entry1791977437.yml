description: "شرکت فرافن خیلی شرکت سطح پایین هستش اصلا نیروی متخصص براشون مهم نیست\r\nواقعا آدم تلف میشه\r\nن اضافه کاری و امکانات داره خیلی ضعیف هستش فقط ادعای باکلاسی دارن\r\nامکانات شرکت شامل\r\nچایی جوشیده\r\nبرگزاری زنگ ورزش توسط ی خانم با نیم تنه بهمراه آهنگ شکیرا🙈😂\r\n\r\nجالبیش اینه ب نیروی خدماتی صبحانه میدن\r\nولی ب نیروی متخصص هیچ امکاناتی نمیدن\r\nخیلی هرج و مرج هستش هر کی هر ساعتی می‌خواد و میره\r\nمنابع انسانی بشدت ضعیف\r\nمدیرا بیسواد و با پارتی اومدن\r\nو کل تیم رو ب گند میزنن\r\nی مدیر همه کاره هست و فک میکنه خدا هستش🤣🥸\r\n\r\nاکثر کارمندا سن بالا بیشتر شبیه خانه سالمندان\r\nاکثر نیروها بیکار و داخل اینستا میچرخن\r\n\r\nرابطه دختر پسرااا خیلی رایج هست بصورت ک ساعتها در حیاط مشغول ناهار خوردن و سیگار کشیدن هستن \r\n\r\n\r\nروابط دختر مجرد با مرد متاهل هم رایج\r\nمدیرا هم با دخترااا لاس میزنن\r\nاصلا محیط شرکت مشخصه\r\n\r\nخیلی لختی و پختی\r\n\r\nبنظرم سمت این شرکت نرید هیچی نداره\r\n\r\n\r\nحقوقاااارو خیلی دیر و بی برنامه میزنن\r\nی درصدی از حقوق هم بن کارت میزنن ک اونم وحشتناک بی نظم میزنن\r\n\r\nخلاصه وقت و عمرتونو اینجا تلف نکنید\r\n\r\nخیلی از تیم ها با مدیر خوب نیستن و کار خودشونو خوب انجام نمیدن و کل مجموعه درگیره\r\n\r\nی سامانه فرسوده و چند تا مدیر مسن دارن🤣🤣🤣😂\r\n\r\nآقا نرید این شرکت🫢👀"
