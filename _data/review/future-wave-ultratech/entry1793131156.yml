description: "ضمن عرض سلام 🫢\r\nو خداقوتتتت خدمت دوستتتان عزیرم در فرررراووول😂\r\n\r\n\r\nباید قبول کرد که شرکت فرا وول شرکت خیلی لوووووول پایینه🫢🤣\r\n\r\nاینکه با یک پیغام واقعی چرا اینقدر بهم ریخته شدید جای سوال داره🥴\r\n\r\nشخصی ک پیغام گذاشته به احتمال زیاد استعفا زده رفته از محیط شرکت اما زخم خورده ناعدالتی و موارد حاشیه ای شرکتتت فررررا ووول بوده😮‍💨 \r\n\r\nواقعا مالی شرکت وضعیت خوبی نداره🤢 \r\nروابط سازمانی اصلا مفید و کارساز نبوده🥴\r\nمنابع انسانی خسته👀\r\nمدیران نالایق🫪\r\nسیستم بی کیفیت علمی و آموزشی😶‍🌫️\r\n\r\nضعف شدید امکانات رفاهی و موارد دیگر بیایید فرهنگ سازی کنیم بخاطر پیغام منفی یک شخص بجای راه حل رفع موانع خودمونو عالی نمایش ندیم🫥\r\n\r\nباید واقعیت ها گفته بشه🥸\r\nتنها امتیاز مثبت شرکتتتت وقت گذرونی هست و مسایل ارتباطی دختر و پسر😍🥰\r\n\r\nدانشگاه سراسری ولی بی تخصص بودن خیلی بدتر از دانشگاه دیگه خوندنه💪🏻\r\n\r\n\r\nبنظر بنده این شرکت رو اصلا برای مصاحبه و ارسال رزومه تو الویت خودتون ندارید بنده مصاحبه اومدم هیچ خبری نشد و همینطور منتظر موندم 🙈\r\n\r\n\r\nشرکت خیلییییی بهتر از فررررااااا ووول هم هست😂🙏🏻🌹😘"
