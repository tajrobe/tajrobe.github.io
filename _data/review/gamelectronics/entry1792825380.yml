description: "شرکتی خانوادگی و بسیار پولدار که وقتی پای حقوق کارکنان وسط می‌آید، به‌شدت خسیس می‌شود. تجربه من این بود که اگر برای حقوقتان نجنگید و مدام پیگیر نباشید، با خیال راحت شما را در پایین‌ترین سطح دریافتی نگه می‌دارند. انتظار نداشته باشید صرفاً با خوب کار کردن، حقوقتان هم بهتر شود.\r\n\r\nاز نظر تخصص هم وضعیت تعریفی ندارد. در کنار معدود افراد باسواد و کاربلد، تعداد زیادی حضور دارند که به‌نظر من دانش و مهارتشان با جایگاهی که دارند تناسبی ندارد؛ اختلافی که در کار روزمره کاملاً به چشم می‌آید.\r\n\r\nبرای یادگیری و جمع‌کردن تجربه بد نیست، البته اگر شانس بیاورید و در تیم مناسبی قرار بگیرید. اما از نظر من جای ماندن طولانی‌مدت نیست؛ فضای دلگیر و فرساینده‌اش به‌مرور انگیزه‌تان را می‌گیرد. فریب جذابیت دورکاری را هم نخورید؛ راحتی کار از خانه ارزش گیر افتادن در چنین محیطی را ندارد.\r\n\r\nرعایت حجاب هم در محیط شرکت اجباری است؛ موضوعی که بهتر است پیش از شروع همکاری از آن مطلع باشید."
