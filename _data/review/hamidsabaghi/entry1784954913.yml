description: "من با انگیزه بالایی وارد مجموعه حمید صباغی شدم و قرار بود به‌عنوان کارشناس فروش، اگر حقوق ثابت نگیرم و تارگت فروش را محقق کنم، در عوض پورسانت خوبی بگیرم .\r\n\r\nبا تلاش زیاد، تارگت فروش را محقق کردم، اما زمانی که نوبت پرداخت پورسانت رسید، همه‌چیز به وعده‌های «ماه بعد» ختم شد. این وعده بارها تکرار شد و در نهایت پورسانتی که بابت آن زحمت کشیده بودم، هرگز پرداخت نشد.\r\n\r\nدر کنار این موضوع، در تمام مدت همکاری نه قرارداد رسمی داشتم، نه بیمه برایم رد شد و نه مزایایی مانند سنوات گرفتم .\r\n\r\nاز نظر فضای کاری هم احساس امنیت و آرامش نداشتم و رفتارهای مدیریتی، از نگاه من، حرفه‌ای و در شأن یک محیط کاری سالم نبود.همیشه به من شک داشت خود آقای حمید صباغی و میگفت وای از روزی که فروشنده ای مشتری های منو باخودش ببره !\r\n\r\nاین تجربه به من یاد داد که قبل از شروع هر همکاری، هیچ وعده‌ای را بدون قرارداد قبول نکنم ، درباره بیمه و مزایا از همان روز اول شفاف باشم و تا وقتی که همه چیز روی کاغذ مشخص نشده، فقط به قول شفاهی اعتماد نکنم.\r\n\r\nامیدوارم این تجربه به بقیه کمک کنه با آگاهی بیشتری درباره محل کار آینده‌شون تصمیم بگیرند."
