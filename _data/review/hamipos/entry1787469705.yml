description: "تجربه کاری من در شرکت نرم‌افزاری مدیریت رستوران «حامی» چندان مثبت نبود و مهم‌ترین مشکل، ضعف جدی در مدیریت و ارتباط با کارکنان بود.\r\n\r\nاز نظر مدیریتی، تصمیم‌گیری و ارتباط بین واحدها ضعیف بود و در محیط کاری متأسفانه حاشیه، زیرآب‌زنی و انتقال نادرست مسائل بین افراد هم دیده می‌شد. بخشی از زمان کاری به‌جای یادگیری و پیشرفت، صرف حاشیه و اتلاف وقت می‌شد و شخصاً احساس نکردم فرصت مناسبی برای رشد و یادگیری تخصصی وجود داشته باشد.\r\n\r\nموضوع پرداخت حقوق نیز یکی از نکات منفی مهم بود؛ پرداخت به‌موقع و منظم حقوق آن‌طور که انتظار می‌رود انجام نمی‌شد. در کنار آن، شرایط مربوط به بیمه تکمیلی هم مناسب نبود و شرکت توانایی یا امکان ارائه بیمه تکمیلی مطلوب به کارکنان را نداشت.\r\n\r\nاز طرف دیگر، تایم‌های آنکال نسبت به مبلغ دریافتی، تناسب چندانی نداشت و مسئولیت و زمانی که از کارکنان انتظار می‌رفت، با جبران خدمات همخوانی کافی نداشت.\r\n\r\nدر مجموع، تجربه من از این شرکت بیشتر از آنکه باعث رشد شغلی شود، با ضعف مدیریت، ارتباط نامناسب با کارکنان، حاشیه‌های سازمانی و اتلاف زمان همراه بود.\r\n\r\nاگر برایتان محیط کاری سالم، مدیریت منظم، پرداخت به‌موقع، یادگیری و مسیر رشد شغلی اهمیت دارد، پیشنهاد می‌کنم قبل از پیوستن به این شرکت حتماً با چند نفر از کارکنان فعلی یا سابق آن صحبت کنید و شرایط را از نزدیک بررسی کنید. شخصاً با توجه به تجربه‌ای که داشتم، پیشنهاد نمی‌کنم بدون بررسی دقیق سمت این شرکت بروید."
