description: "کار در شرکت داده پرداز پارسیان اگر به طور خلاصه  بخواد توصیف بشه، میشه با این عبارات توصیف اش کرد.\r\nحجم کار بالا، بی نظمی در پرداخت، عدم رفتار حرفه تیم مدیریت.\r\nبه طور مفصل تجربه کاری در حامی ( داده پردازی پارسیان ) در موارد پایین توصیف میشه.\r\n\r\nساعات کاری:\r\nشنبه تا چهارشنبه، از ساعت 9 تا 6\r\nپنجشنبه ها از ساعت 9 تا 3 یا 4\r\nیک الی دو روز در هفته، شیفت آنکال از ساعت 6 ب.ظ تا 11 شب. ( شیفت های آنکال علاوه بر ساعات کاری از ساعت 9 الی 6 هستند، یعنی عملا از ساعت 9 صبح تا 11 شب )\r\nیک بار در ماه، شیفت آنکال پنجشنبه و جمعه از ساعت 10 صبح تا 11 شب.\r\nپس به طور خلاصه با زندگی شخصی خودتون خداحافظی کنید چون قراره تمام وقت و انرژی خودتون رو صرف شرکت حامی کنید.\r\n\r\nحقوق و مزایا:\r\nحقوق به صورت دو مرحله ای واریز میشه، بخش اولی حقوق بین یکم تا سوم و فقط حقوق پایه وزارت کار واریز میشه. بخش دوم حقوق از ششم تا دهم هر ماه واریز میشه. اما هیچ تعهدی به پرداخت به موقع حقوق ها نیست، گاها پیش اومده حقوق ها با فاصله های زمانی یک هفته ای واریز شدن. و قسمت تاسف آور تر، پاسخگو نبودن تیم مدیریت در قبال بد قولی در پرداختی هاست. مبلغ کلی حقوق هم ابدا با حجم کاری پشتیبانی همخوانی ندارد. به طور کلی حقوق دریافتی کاملا غیر منطبق با حجم کار و تقریبا همیشه با بدقولی و بی نظمی واریز شده.\r\nبرای پرسنل آقآ، اعزام های حضوری در محل مشتری بخشی از روند کاری هست، پرسنل با وسیله نقلیه شخصی یا عمومی باید خودشون رو به محل مشتری برسونن، با این وعده از سمت شرکت که هزینه رفت و آمد تخت عنوان تنخواه تماما پرداخت میشه. اما اگر در خصوص پرداخت حقوق بدقولی های چند روزه وجود داره، در خصوص پرداخت هزینه های تنخواه، این بدقولی ها گاها به چندین ماه می رسه.  در نهایت یا باید به کل قید حق تنخواه خودتون رو بزنید یا با دعوا حق خودتون رو از مدیران بگیرید.\r\n\r\nفرهنگ کاری:\r\nارتباط بین کارمندان بخش های مختلف در حداقلی ترین حالت ممکن قرار داره. از طرفی تیم مدیریتی شرکت عملا تعاملی با کارکنان شرکت علی الخصوص پرسنل پشتیبانی ندارن. تا حدی که حتی بعضی از پرسنل پشتیبانی رو به اسم هم نمی شناسن. محیط  ساختمان و تجهیزات شرکت کاملا نامتناسب  و قدیمی نسبت به جایگاه شغلی.\r\n\r\nبا اینحال فارغ از مشکلات بالا، پرسنل بخش پشتیبانی با یک معضل بزرگتر دست به گریبان بودند. متاسفانه فردی که به عنوان مدیر بخش پشتیبانی انتخاب شده بود، هیچ صلاحیت فنی و مدیریتی برای این جایگاه نداشت. همین بی اطلاعی ایشان از روند کاری و فنی، باعث بروز مشکلات متعدد در پروسه انجام امور روزانه می شد. رفتار های غیرحرفه ای ایشان و برخورد های نامحترمانه در قبال پرسنل پشتیبانی. دروغ گویی مکرر. و از همه تاسف آور تر، بدگویی پشت سر کارمندانی که حضور ندارند. منظور حضور نداشتن استعفا یا ترک شغل نیست، حتی اگر یکی از پرسنل در اتاق پشتیبانی حضور نداشت یا مرخصی بود، این به اصطلاح مدیر پشتیبانی شروع به بدگویی و تخریب کارمند مورد نظر میکرد. جایگاه شغلی پشتیبان نرم افزار یک جایگاه شغلی پر فشار و فرسوده کننده است، و حضور این شخص در اتاق پشتیبانی نه تنها کمکی به پیشبرد بهتر کارها نمی کرد، بلکه باعث نارضایتی در بین همه پرسنل می شد. تا جایی که در روز های غیبت این شخص، حال تک تک پرسنل بهتر بود. \r\nشاهکار نهایی این شخص موقع تسویه حساب با شرکت بود، زمانی که مطمئن شد قصد تمدید قرارداد ندارم، نقاب ادب رو کنار گذاشت و در پیام های متنی شروع به عقده گشایی های بچگانه نسبت به دوران همکاری کرد. \r\n\r\n--- اگه این شخص مشغول خوندن پیامم باشه، تا الان باید فهمیده باشه من کیم! از همین جا برات دست تکون میدم! :)) ---\r\n\r\nاما سوال مهمتر این است که دلیل تیم مدیریت شرکت برای انتخاب چنین فردی که هیچگونه صلاحیتی برای جایگاه خود ندارند چیست؟!\r\n\r\nتنها تجربه مثبت کار در شرکت داده پردازی پارسیان، تیم استقرار و پشتیبانی شرکت هست. تمامی پرسنل بدون چشم داشت و با حداکقر توان خود در جهت پیشبرد پروژه ها، با هم همکاری داشتند، شاید تنها عاملی که باعث تحمل کاستی های فاحش شرکت می شد، همین تیم سازنده بخش پشتیبانی بود. تیمی که متاسفانه به خاطر حضور یک شخص بی کفایت در جایگاه مدیر پشتیبانی، روز به روز فرسوده تر و در انتها از تیم جدا می شوند.\r\n\r\nپس به طور خلاصه آیا کار در شرکت حامی را پیشنهاد میکنم؟\r\n\r\nخیر، ابدا، هرگز! \r\nتا زمانی که یک تجدید نظر کلی در خصوص بهینه شدن شرایط کار، پرداختی ها و از همه مهمتر سرپرست بخش پشتیبانی نشده، از این شرکت در حال زوال فاصله بگیرید."
