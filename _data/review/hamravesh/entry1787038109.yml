description: "اگر بخوام از تجربه خودم در همروش بگم، چیزی که از بیرون دیده می‌شه با چیزی که داخل شرکت تجربه کردم، تفاوت زیادی داشت.\r\nهمروش از نظر فنی و مشتری‌هایی که داره شرکت قابل توجهیه، ولی به نظرم از نظر مدیریتی و سازمانی هنوز به بلوغ کافی نرسیده.\r\nیکی از چیزهایی که در مدت حضورم زیاد می‌شنیدم، این بود که ورود به همروش خوبه، خروجش نه. جابه‌جایی نیرو هم نسبتاً زیاده و این موضوع به نظرم نشونه‌ایه که باید جدی گرفته بشه.\r\nدر بعضی پروژه‌ها، مخصوصاً پروژه‌های حساس، استانداردهای امنیت اطلاعات و محرمانگی رو در حدی که از یک شرکت زیرساختی انتظار می‌ره ندیدم. نحوه دسترسی و گردش اطلاعات مشتری‌ها داخل سازمان هم برای من یکی از نقاط نگران‌کننده بود، مخصوصاً با توجه به حساسیت بعضی مشتری‌ها.\r\nاز نظر فرهنگی هم در بعضی تیم‌ها نگاه از بالا به پایین و خودمحوری رو زیاد دیدم و فضای کاری در دوره‌ای که من حضور داشتم، چندان باثبات نبود. از نیروهای قدیمی‌تر هم شنیدم که شرایط شرکت قبل از جذب سرمایه بهتر بوده.\r\nدر مجموع، به نظرم بین اندازه پروژه‌ها و مشتری‌های همروش و بلوغ فرآیندهای داخلی شرکت فاصله وجود داره.\r\nاگر قصد پیوستن دارید، قبل از تصمیم‌گیری حتماً با چند نفر از نیروهای فعلی و سابق صحبت کنید. به نظرم این بهترین راه برای فهمیدن واقعیت شرکته.\r\nاین فقط تجربه شخصی منه و طبیعتاً ممکنه تجربه افراد دیگه متفاوت باشه.\r\n"
