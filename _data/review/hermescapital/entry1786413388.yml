description: "من نزدیک به ۸ سال در هرمس کار کردم و در تمام این مدت خودم را یکی از مدیران وفادار، پرتلاش و متعهد به این مجموعه می‌دانستم. به همین دلیل، چیزی که امروز درباره هرمس می‌بینم برای من واقعاً تأسف‌برانگیز است.\r\n\r\nهرمس زمانی مجموعه‌ای بود که افراد توانمند و مدیران حرفه‌ای در آن می‌توانستند کار کنند، تصمیم بگیرند و چیزی بسازند. اما به مرور، تعدادی از همان مدیران و نیروهای توانمند از مجموعه خارج شدند و متأسفانه بخش قابل‌توجهی از این سرمایه انسانی حفظ نشد. به نظرم نتیجه‌اش هم کاملاً قابل مشاهده است: افت کیفیت، افت انگیزه و فاصله گرفتن از استانداردهایی که هرمس زمانی داشت.\r\n\r\nمشکل فقط حقوق یا مزایا نیست. مشکل عمیق‌تر است. وقتی فضای سازمان به جای شایسته‌سالاری و گفت‌وگوی حرفه‌ای، تحت تأثیر حاشیه، روابط، حرف‌های پشت سر، تهمت و افترا قرار بگیرد، طبیعی است که آدم‌های توانمند یا کنار گذاشته می‌شوند یا ترجیح می‌دهند خودشان بروند. سازمانی که نتواند با نیروهای حرفه‌ای خودش حرفه‌ای رفتار کند، در نهایت هزینه‌اش را در کیفیت کار می‌دهد.\r\n\r\nشاید تلخ‌ترین بخش تجربه شخصی من این بود که بعد از نزدیک به ۸ سال همکاری و با وجود تمام زحمتی که برای این مجموعه کشیده بودم، حتی یک خداحافظی ساده یا یک بدرقه کوچک هم اتفاق نیفتاد. نه به خاطر اینکه انتظار تشریفات داشتم؛ مسئله برای من معنای این رفتار بود. اینکه بعد از ۸ سال، پایان همکاری با چنین سابقه‌ای حتی ارزش یک «خداحافظ» هم نداشت.\r\n\r\nمن از هرمس چیزهای زیادی یاد گرفتم و هنوز برای بسیاری از آدم‌های توانمندی که آنجا هستند احترام قائلم. اما نمی‌توانم درباره تجربه‌ام بنویسم و از این واقعیت عبور کنم که به نظرم هرمس بخش مهمی از کیفیت و سرمایه انسانی خودش را از دست داده است.\r\n\r\nامیدوارم روزی دوباره مجموعه‌ای شکل بگیرد که در آن آدم‌های توانمند به جای درگیر شدن با حاشیه و سیاست‌های داخلی، بتوانند کار کنند، رشد کنند و اثر بگذارند.\r\n\r\nبرای من، هرمس فقط یک محل کار نبود؛ ۸ سال از زندگی حرفه‌ای من بود. شاید به همین دلیل است که دیدن وضعیت امروز آن، بیشتر از هر منتقد بیرونی برایم ناراحت‌کننده است.\r\n"
