description: "هرمس؛ هوشمندی در حرکت\r\n\r\nدر دنیای اساطیر، هرمس پیام‌آور خدایان و حامی تجارت بود؛ خدایی که سرعت را با زیرکی و حرکت را با هوشمندی پیوند می‌داد.\r\n\r\nامروز، هرمس کپیتال همین مفاهیم را در دنیای فناوری و بازارهای مالی بازآفرینی می‌کند.\r\n\r\nدر بازاری که هر میلی‌ثانیه اهمیت دارد و هر تصمیم می‌تواند سرنوشت‌ساز باشد، تنها سرعت کافی نیست. آنچه اهمیت دارد، توانایی تبدیل انبوهی از داده‌های پیچیده به تصمیم‌هایی دقیق، سریع و هوشمندانه است.\r\n\r\nهرمس کپیتال با تکیه بر مهندسی نرم‌افزار، پژوهش‌های کمی، یادگیری ماشین و توسعه سامانه‌های معاملاتی الگوریتمی، تلاش می‌کند میان قدرت فناوری و پیچیدگی بازارهای مالی پلی بسازد.\r\n\r\nاگر هرمس در اساطیر یونان پیام‌ها را میان خدایان و انسان‌ها جابه‌جا می‌کرد، هرمس امروز اطلاعات را به بینش، بینش را به تصمیم و تصمیم را به اقدام تبدیل می‌کند.\r\n\r\nهرمس، تنها نام یک خدا نیست؛ نمادی از سرعت، هوشمندی، نوآوری و هنر یافتن فرصت در میان پیچیدگی‌هاست."
