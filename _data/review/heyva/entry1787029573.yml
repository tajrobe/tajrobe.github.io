description: "من تقریبا ۳،۴  روز تو این مجموعه بود\r\nو میتونم بگم یهو روز سوم اینقد تماس بهم وصل شد اینقد جو نامنظم شد که دیگه نتونستم ادامه بدم \r\nیعنی اولین روز که رفتیم با ما صحبت کردن گفتن هر چیزی که وصل میشه قبلش بهتون یاد میدیم یهو روز سوم ی تماسی بهت وصل میشد که اصلا بهت نگفته بودن \r\nهمه داد میزدن \r\nیهو اسم ی نفر که تو دستشویی بود رو صدا میکردن اصلا وضع مناسبی نداشت\r\n\r\nشاید ۳،۴ روز ، زمان کافی ای نباشه برای انتقاد ‌کردن ولی واقعا جا نداشت که بخوای بیشتر تو اون محیط بمونی "
