description: "برای شناخت انواع بیماری های روانی نیازی به تحصیل در رشته روانشناسی یا روانپزشکی نیست. کافیه یک ماه در این محیط کار کنید تا نادرترین موجودات منظومه شمسی رو مشاهده کنید. اگر مذهبی هستید پولی که از اینجا به عنوان حقوق میگیرید قطعا حرامه. اگر مذهبی نیستند هم حقوق این مجموعه غیراخلاقی هست و کاملا از طریق کلاهبرداری و دروغ به دست میاد. اگر وارد این مجموعه شدید حتما لوازم زیر رو همراه داشته باشید:\r\nالکل \r\nقرص مسکن\r\nاسپری خوشبو کننده \r\nلیوان \r\nصابون \r\nآب معدنی\r\nدستکش \r\nقرص زولپیدم \r\nدفترچه بیمه درمانی\r\nممکنه بپرسید چرا؟ کاری نداره می‌تونید یک روز حضور در این مجموعه رو تست کنید! "
