description: "من وقتی دنبال کار بودم یکی از شرکت هایی که رفتم اینجا بود \r\nمسئله ای که هست وقتی اینجارو با شرکت های دیگه مقایسه کردم دیدم ارزش رفتن نداره \r\nشرکتی که الان کار میکنم هم کال سنتر اما اتاق استراحت داره ، ناهار خوری داره ، همچنین صبحانه و ناهار هم با شرکت .\r\nهیوا من پرسیدم ناهار کجا باید بخوریم گفتن همونجایی که نشستین (فکر کنید کلی سر و صدا اطرافتون هست اونوقت شما تو همون محیط باید غذا بخورید ) یعنی لحظه ای آرامش تو این کار نبود \r\nو خب طبیعتا من ادامه به همکاری ندادم و برای همین این شرکت رو انتخاب نکردم . "
