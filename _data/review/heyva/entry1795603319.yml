description: "نرید هیوا\r\nاگر میخواید تو جامعه سرتون رو بالا بگیرید و از تجربیات کاری خوبتون بگید هیوا جای مناسبی نیست\r\nاگه میخواید بهتون زور نگن هر کاری رو ندن بهتون نرید هیوا\r\nاگر میخواید تو شرکتی کار کنید که ۴ تا مزیت داشته باشه نرید هیوا\r\nاگر میخواید برید تو شرکتی که دستمال توالت حداقل داشته باشه نرید هیوا \r\nو هزار تا چیز دیگه \r\nاگر این پیام باعث شه ی نفر از رفتنش به هیوا پشیمون شه و یا اینکه اگر داخلش هست استعفا بده این پیام کار خودشو کرده ."
