description: "از طریق Job Vision (جاب ویژن) برای یک مجموعه ارسال کردم. بعد از اون، در ۳ مرحله مصاحبه شرکت کردم و در طول این مدت هم حداقل ۷ بار پیگیری انجام دادم.\r\n\r\nدر نهایت، طبق اعلام مسئول مربوطه، تأیید فنی (Technical) رو دریافت کرده بودم و حتی در مورد مبلغ همکاری هم با من به توافق اولیه رسیده بودند.\r\n\r\nاما، بعد از گذشت ۲۶ روز، صرفاً با یک پیام اعلام کردند:\r\n\r\n«... امکان همکاری وجود نداره ...»\r\n\r\nبدون هیچ توضیح یا دلیل مشخصی.\r\n\r\nبه نظرم منابع انسانی واقعا ارزشی برای کارجو نمیزاره، الکی وقتتون رو نزارید براش"
