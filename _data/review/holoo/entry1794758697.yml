description: "کارجویان عزیز که حدود سنی ۱۸-۲۲ را دارند و تابه حال سابقه هییییچ کاری رو نداشتند شرکت هلو میتونه براتون مناسب باشه تنها و تنها برای کسب رزومه و اصول بسیار اولیه ارتباط با مشتری.من به شخصه بعد از سال ها کار در این مجموعه عرض میکنم محیط به شدددت سمی،مدیران نالایق،بیشتر شبیه به حاشیه خانه هست تا محیط کاری!به هرچیزی اهمیت میدن به جز سطح کاری شما. امکان داره نفره اول تارگت باشید اما قرارداد باهاتون نبندن!چرا؟چون توی تیم سرپرست واحد نیستید.امیدوارم صاحب هلدینگ این پیام هارو ببینه و به فکر بیزینس خودش باشه.محیط اصلا جای پیشرفت نداره و ماکسیمم ۲سال بیشتر عمرتون رو هدر این سازمان نکنید.فشار کاری بالایی داره و بعد حداکثر ۲سال کار اصلا مطلبی به شما اضافه نخواهد شد.با قرص اعصاب یا بهترین حالتش سیگاری شدن باید ادامه بدید.هرکس هرکاری بخواد اونجا میکنه با شما که به حق نیست.برای خودتون و سلامت جسم و روانتون ارزش قائل باشید"
