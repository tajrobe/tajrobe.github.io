description: "من برنامه نویسم حدود 12 سال در اینجا خاک شرکت گسترش رو خوردم،  اگر پنج سال بهم میگفتن در غرب تهران بهترین و ايده‌آل ترین شرکت کجاست میگفتم گسترش . الان شرکت از نظر مزایا و رسیدگی به پرسنل اصلا نمره قبولی نمیگیره . \r\nبه طور کلی 5 نفری اینجا با زدو بند در بازرگانی و هیئت مدیره دارن برای شرکت تصمیم میگیرند . مدیرعامل ترجیحا علاقه خاصی به کار کردن با پرسنل خانم داره . \r\nنظرات فنی تخصصی تقریبا اخرین اولویت هست . \r\nرشد سازمانی وجود نداره متولد 68 رو اوردن رییس شبکه کردن ، گیج ترین ادم ها که رفیقهای مدیرعامل و هیئت مدیره هستن سمت گرفتن . \r\nیه جایی یه چیز جالب دیدم ،اکثر  ابدارچی های تازه استخدام  فامیل های هیئت مدیره هستن ، نمیتونی بهشون کار بگی . \r\nشرکت رو چند دسته کردن ، به اسم هلدینگ . معاونت ها دنبال گرو کشی ، چپاول و.... \r\nفساد مثل مابقی مملکت ، بی پروا انجام میشه \r\nمیرن ساختمون در خیابان کابلی میخرند میگن اینو 3 همت خرج کردیم هرجوری حساب میکنی نمیشه \r\nمیرن یه ساختمون تو گاندی میخرند تهش در میاد رییس هیئت مدیره این وسط ساختمون 3 همتی رو میگه 4 همت خریدم ... \r\nمدیر بازرگانی یه خانم که منشی بوده \r\nمدیرعامل بی اختیار ترین فرد \r\nمنابع انسانی و بازرگانی به قدری نیروهاش زیاد شده که از نفرات فنی بیشتر شدند . \r\nاینقدر استخدام کردند که دیگه جا نیست بازم نیرو میگیرند . \r\n\r\nبرای خودشون واحد و اداره درست میکنند ... \r\nبیمه تکمیلی رو بازرگانی جوری نوشته که بدون اغراق میشه گفت زدوبندی برای خودشون داشته . به ضرر پرسنل به سود یکی دو نفر .\r\nحقوق ها پایینه . \r\nکلا سند سازی کثافت کاری ... اگر دنبال کاری هستی که بتونی 10 سالی بمونی این شرکت اخرین شرکته . ولی اگر میخوای شرکتی باشه که یکی دوسالی بمونی تا دستت پر بشه خوبه . \r\nاگرم چاپلوسی بلد باشی که تبریک میگم تا معاونت میتونی رشد کنی ولی سقف داره خلاصه . \r\nشرکتهای دیگر در حوزه بانکی خیلی جلوتر از گسترش هستند تا 5 سال پیش گسترش یه سروگردن جلو بود . "
