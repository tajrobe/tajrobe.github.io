description: "با اختلاف کثیف ترین فاسدترین شرکت به ظاهر چینی با مدیریت ایرانیه. جوری که ادمای اصلیش حتی عبایی از اشکار بودن کثافت کاری هاشون ندارن.\r\nشگرد اینطوریه که بچه های دانشگاه های برتر که فقط درس خوندن و بازار رو اصلا نمیشناسن رو به اسم کار خفن و اسم گنده رسما به حمالی میگیرن. حمالی که هیچ اورده ای برای خود شخص نداره و رسما پادوی چینی ها هستن.\r\nدر ظاهر اینطوریه که اهمیت میدن ادما درس بخونن و اپدیت شن ولی در عمل انقدر کار اشغالی و غیر فنی روت میریزن که تو اصن فرصتشو نداری بری سمتش یا حتی اگرم بری و بهترین حالتم اماده باشی بازم انقد سوال پیچت میکنن تا یه جایی یه سوراخی در بیاد و از همونجا هم احساس ناکافی بودن بهت بدن هم این حسو توی تو ایجاد کنن که ما لطف کردیم نگهت داشتیم وگرنه تو اشغالی!\r\n همزمان از یه طرف دیگه دائما با یه سری بازی روانی و ادابازی تو مخ ادمه میکنن که تو مهندس با ارزش مایی و خیلی برامون مهمی.. این در حالیه که کوچیکترین امنیت شغلی نداره، اصلا و ابدا سرنوشت فرد براشون مهم نیست و هروقت که نصرفه به راحتی ادمه رو دور میریزن. در مورد اکسپرت ها هم همینه هیچ فرقی نمیکنه.\r\nتنها چیزی که اهمیت داره برا مدیرا واقعا پول بیشتر دراوردنه تیم برای شرکته تا بونس های تپل تری عاید خودشون بشه.\r\nاینکه چه بلایی سر به ظاهر مهندسه میاد هیچ اهمیتی نداره.. خیلیا رو اینجا دیدم که واقعا روانی شدن یا احساس هیچی بودن بهشون دست داده و مثل یه ربات فقط حمالی میکنن و جرات استعفا هم ندارن چون تو مارکت نبودن و هیچ چیزی از برند ها و تجهیزات دیگه نمیدونن.\r\nدر بهترین حالت اکثرا فرار میکنن ایرانسل و همراه اول\r\nاتفاقا اگه ادم باسواد و حسابی باشی این اتفاقه زودتر میفته و بیشتر این حسو بت میدن که بدرد نخوری..چون واقعا میترسن براشون شاخ بشی. دعوا تو هواوی بین ادما سر اینه که کی بی شرف تره.. به همین صراحت.\r\nاونی که اسم خودشو میذاره اکسپرت و توهمشو داره (استثنای واقعا باسواد هم وجود داشت بینشون) تو بازار واقعی حتی به عنوان جونیور هم جذبش نمیکنن چون واقعا هیچی برای ارائه نداره اما به وقت فک زدن بدون اینکه خندشون بگیره ساعت ها خودستایی میکنن و ادای بزرگان رو درمیارن\r\nدقیقا ادم هایی رو میخوان که بی سوادن اما جوگیر و ادایی..چون سیبه رو میگیرن جلو خره تا بیشتر بدوئه براش و از دوویدنش برق تولید کنن!\r\nاینطور ادما برا اهداف اینا هر پشتکی که فکرشو کنید (یا نکنید) میزنن!\r\nعمده افرادی که تن به این سیرک میدن شهرستانین (با احترام به ادم حسابی های تمام سرزمین ایران) و چون عملا تو مارکت واقعی این افراد هیچ شانسی ندارن برای اداشم که شده و توهم \"من تو جای خفن کار میکنم و وای من چقدر بلدم\" هر بی شرف بازی که فکرشو کنید انجام میدن و ترسناک تر اینکه واقعا باور دارن خفنن! ۹۰ درصد وضعیت زبانشون افتضاحه و من حتی به چشم دیدم که برا سیو کردن خودشون زیراب چینی هارو هم میزدن\r\nاگه فک میکنید قراره یه محیط بین المللی خفن تجربه کنید اصلا اینطوری نیست.\r\nتو هواوی اکثر بچه های با استعداد و درست حسابب سرخورده میشن و یکاری باهاشون میکنن که خودشون برن.\r\nاین شرکت با اختلاف منفورترین شرکت تلکام ایرانه. پر از روانی های متوهم بی سواد که نقاب های قشنگی زدن و از بیرون خیلی خفن به نظر میان! البته که خود تلکامی ها میدونن دقیقا توش چه خبره\r\nشاید بگید خب حتما تو بدرد نخور بودی و کارکن نبودی واقعا وگرنه مگه میشه شرکت بین المللی خفنی مث هواوی بد باشه؟\r\nپاسخ اینه که این یه چرخس! منم اولش اینو به کسی که داشت میرفت گفتم!هرکس که واردش میشه اولش اینو میگه ب ادمایی که تجربش کردن! بعد میری جلوتر کم کم کثافتش میخوره تو صورتت و متوجه میشی چقدر اشغاله و وقتی داری استعفا میدی نفر بعدی همون حرفارو میزنه :))))))\r\nیه مدت بعد میبینی یه سری بدبخت جدید رو اوردن نشوندن جای قبلیا و بازی تکرار میشه\r\nاسم گول زننده بزرگی داره اما اگه ادم با تجربه یا با استعدادی هستید هواوی جای شما نیست. شاید صرفا برا بچه های تازه کار برا یه مدت محدود خوب باشه اما برای یه ادم با سواد و پر تجربه خود خود چاهه\r\nقدیمی هاشونم اکثرا دوزاری ان چه برسه به این جوگیرهای تازه به تهران رسیده!\r\nاینم بگم تک و توک ادم خوبم توشون هست ولی اونا هم در عذابن و خیلیاشون مجبورن که موندن و کار میکنن. همینطور تک و توک بچه های خیلی گلی توشون پیدا میشه چه تهرانی چه شهرستانی چه حتی چینی\r\nطبق افسانه ها سابقا شرکت خوبی بوده و ادمای درست حسابی زیادی داشته که از ایران رفتن (ما که ندیدیم :)) )\r\nولی اگه بخواید به اصطلاح پیشرفت کنید اینجا باید ادم بی شخصیت و بی شرفی باشید!\r\nاینم بگم اون خری که اینجا دنبال سیب میدوئه و فک میکنه با خراب کردن بقیه و ادای خوبارو دراوردن داره پیشرفت میکنه، خودشم یه روزی به راحتی کنار گذاشته میشه فقط الان نمیفهمه! اینجا حتی به تازگی یه ادم با ۱۵ سال سابقه مستقیم تو هواوی رو هم تعدیل کرده.\r\nکلا پیشنهاد میکنم گول زرق و برقشو نخورید و از تجربه کسایی که نوشتن استفاده کنید. اگرم فک میکنید این همه ادم دروغ میگن بفرمایید خودتون تجربه کنید شرکت خفن هواوی رو :)))"
