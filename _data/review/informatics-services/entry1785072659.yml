description: "سلام \r\nمن این تجربه رو مینویسم تا چراغ راه افرادی باشه که مثل خودم دنبال یه شرکت حرفه ای و سالم هستن. از اونجایی که خدمات ، برند خیلی معروفی هست و من فکر میکردم خبر خاصی هست متاسفانه اومدم این شرکت که پر از حاشیه و باندبازیه. اینجا اگه پارتی داشته باشی مثل خیلیا نونت تو روغنه و بدون هیچ کار خاصی(خروجی صفر و شوآف صد) میتونی حقوق نجومی و وام های درشت بگیری اما اگه مثل من بدون پارتی و با انگیزه پیشرفت اومدی و چاپلوسی هم بلد نباشی ، به هرشکل ممکن دهنتو سرویس میکنن و کار زیاد سرت میریزن و از اون طرف هم چنان برات میزنن که تو خواب هم نمیدیدی! انواع تهمت ها و دروغ های فنی و حیثیتی و تهدیدهای کوچیک و بزرگ رو میبینی. مدیرای سطح بالاتر هم مطلقا هییییچ اهمیتی نمیدن چی سر بقیه میاد و فقط مواظبن خودشون ناک اوت نشن و بتونن درببرن.\r\n\r\nشرکت  تحریم بین المللی هست و ممکنه نتونید بعدا توی شرکتهای خارجی استخدام بشید و خودشونم از نظر امنیتی شدیدا کنترل میکنن.\r\n\r\nهیچ توازن و عدالتی بین حجم کار و حقوق دریافتی نیست.\r\n\r\nاگه مدیرت ازت خوشش نیاد به هردلیلی یا بقیه زیرآبتو بزنن که خیلی هم عمومیه، میتونه راحت نیرو رو رد کنه و هر دروغی هم میگه و هیچ کسی هم کاریش نداره. اگه مشکلی برات پیش بیاد هیچ کس درکت نمیکنه و اگه حرفی از مشکلت بزنی ، ازش هرنوع سواستفاده ای علیه ت میکنن.\r\n\r\nبه شدت محیط کثیف و پر از ریا و دروغ هست ، هم از نظر فنی هم غیر فنی داغونه.\r\n\r\nمنابع انسانی فقط از مدیرعامل و معاونا دستور میگیره و مطلقا دخالتی توی نگه داشت و امنیت شغلی کارمندا نداره. صد جور امضای عدم افشا و غیره هم میگیرن که کسی جرات نکنه کاری کنه. \r\n\r\nاگه روحیه زیرآب زنی و چاپلوسی نداشته باشی و نتونی تو این محیط مثلشون بشی ، خودت مجبور میشی با کلی زخم روحی و فکری و جسمی ، ته مونده جونتو مثل من جمع کنی و بری.\r\n\r\nمن اگه برمیگشتم عقب هیچوقت هیچوقت اینجا (شرکت خدمات عنفورماتیک) نمیومدم ."
