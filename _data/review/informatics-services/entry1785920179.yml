description: "در مورد گروه هوش مصنوعی این شرکت بگم که متوجه بشید عمق فاجعه هوش در شرکت تا چه حدیه.\r\nیه گروه چند ساله تشکیل شده که بیشتر از هر چیزی مشغول شوآفه. بخش زیادی از افرادش نه کامپیوتر خوندن و نه هوش مصنوعی. تعدادی هم با پارتی و رابطه وارد مجموعه شدن. اونایی هم که واقعاً توانایی دارن، بیشتر از ترس بیکار شدن توی گروه موندن. اکثرشون حتی یک پروژه واقعی هم توی زندگیشون تجربه نکردن و فقط درگیر تحقیق‌های بی‌نتیجه و بی‌سرانجام هستن.\r\n\r\nاین گروه چند ساله عملاً خروجی خاصی نداشته و فقط هزینه روی دست شرکت گذاشته. رئیس های گروه هم معمولاً چیزی بلد نبودن و تقریباً هر سال یکی میره و یه نفر دیگه جاش میاد.\r\n\r\nالان هم فردی رئیس گروه شده که سال‌ها بیشتر به خوابیدن پشت میز معروف بود و با هیچکی حرف نمیزده. نه توی زندگیش یک خط کد زده، نه کامپیوتر خونده و نه هوش مصنوعی و نه شناخت درستی از هوش مصنوعی داره. از لحاظ اخلاقی هم به‌شدت بی‌ادب و پروئه.\r\n\r\nاین شخص تصور می‌کنه صرف اینکه می‌تونه با ChatGPT چت کنه، یعنی توی همه حوزه‌ها متخصصه و حتی ادعای CTO بودن هم داره. کل دغدغه‌اش اینه که شرکت چه منافعی میده و چطور میشه بیشترین استفاده شخصی رو ازش برد. حتی این حس رو منتقل می‌کنه که حالا که ازدواج کرده، باید هزینه‌های زندگیش از جیب اعضای گروه تأمین بشه.\r\n\r\nبه‌شدت اهل دروغ و ریاکاریه. چون مدیریت جدید مجموعه هم شناخت از اون نداشته و آدم مثبتیه، تونسته مدیر‌ رو هم قانع کنه که فرد فنی و متخصصیه در صورتیکه تو شرکت استادش کار تحقیقاتی در زمینه برق داشته ولی الکی گفته استارتاپ داشتم! با انواع بزرگ‌نمایی و ظاهرسازی خودش رو به عنوان آدم فنی جا زده. درصورتیکه باید با خروجی واقعی کارش ارزیابی میشد. تو این چند سال تنها تواناییش شناخت چنتا ابزار برای ساخت ویدیو و .. که بوده که اینها رو هر کودکی هم بلده. یه مدل هم از نت داونلود کرده چندساله دروغ میگه مدلم ترین شده (البته در خواب بدون زیرساخت!)\r\n\r\nاین آدم اون‌قدر سمی هست که اگر متوجه بشه کسی توانایی واقعی داره، شروع به اذیت کردنش می‌کنه. کاملاً دچار سندروم ریاست کوتوله شده.\r\n\r\nبرای هر موضوعی که می‌خواد درباره‌اش تحقیق کنه، اولین چیزی که به دستش می‌رسه پاسخ‌های GPT هست. چون دانش تخصصی نداره، نمی‌تونه پرامپت درست و حرفه‌ای بنویسه و طبیعتاً جواب‌های ناقص دریافت می‌کنه. نتیجه هم معمولاً حرف‌ها و تحلیل‌هایی میشه که بیشتر جنبه طنز پیدا می‌کنن و همه پشت سرش بهش میخندن ولی چون سمی هست جلو روش چیزی نمیگن که آسیب نبینن.\r\n\r\nبعد از اون هم کل بچه‌های تیم رو بسیج می‌کنه که براش تحقیق کنن و در نهایت خروجی کار دیگران رو به اسم خودش منتقل می‌کنه به مدیریت . حتی حفظات و درکش از چیزایی که فهمیده هم کمه. انگار کسی نیست بهش بگه صرف چت کردن با مدل‌های LLM (آن هم فقط GPT) به معنی داشتن دانش هوش مصنوعی نیست؛ دانشی که ای کاش حداقل همون رو هم داشت.\r\n\r\nمتأسفانه بخشی از خدمات انفورماتیک به دست چنین افراد سفارشی و کم‌سواد افتاده.\r\n\r\nتحت هیچ شرایطی برای این گروه رزومه ارسال نکنید. اگر هم به هر دلیلی در مصاحبه با این فرد مواجه شدید، سعی کنید با دانش فنی خودتون این گونه نادر رو به چالش علمی بکشید. در حال حاضر گروه‌هایی در معاونت نرم افزار ۲ هستند که نیاز به متخصص هوش مصنوعی برای کارهای عملیاتی دارن، برای اون گروه‌ها اقدام کنید\r\nولی گروه هوش مصنوعی رو دیدید فرار کنید"
