description: "در جواب کامنت همکارم\r\nحق با شماست \r\nچون خودم در همون صندلی هستم\r\n\r\n اما خود رئیس گروه بودن ایرادی نداره و هر جا واقعاً کار رو جلو ببره لازمه \r\n\r\nولی مشکل از جایی شروع میشه که بعضی رئیس‌های گروه فقط اسم و صندلی رو دارن\r\n و وقت کار و گرفتاری نه گرهی باز می‌کنن نه پشت کارشناس درمیاد \r\n\r\nمن توی این سال‌ها حداقل ده نفر رو می‌تونم اسم ببرم که هر جا کار گیر کرده این کارشناس بوده که آستین بالا زده و جمعش کرده \r\nدر حالی که رئیس گروه خیلی وقت‌ها اصلاً توی باغ نبوده بعد هم اگه خروجی ایراد داشته باشه اولین نفر همون کارشناس باید جواب پس بده \r\n\r\nاین وسط اگه قراره یه عده فقط به خاطر جایگاه و روابط سر جاشون بمونن و نیرویی که واقعاً کار می‌کنه هزینه بده و کنار بره دیگه اسمش شایسته‌سالاری نیست\r\n\r\n بله حق با شماست \r\nاما نه در مورد همه\r\nو یه همکارم هم گفته باند هستند\r\nبله حق با شما هم هست\r\nاما جمع نبندیم\r\n"
