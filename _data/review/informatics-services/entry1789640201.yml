description: "یه چیزی که توی این صفحه واقعاً برام جالب بود اینه که انتقاد از مدیریت و بعضی رؤسا اصلاً چیز جدیدی نیست   از سال ۱۴۰۱ تا امروز، یه‌سری گلایه‌ها با شکل‌های مختلف هی تکرار شدن\r\nحالا واقعاً یه سؤال   وقتی نیروها میان و میرن، ولی بعضی مشکلات مدیریتی سال‌هاست همچنان سر جاشونن و بعضی رؤسا هم ظاهراً قصد رفتن ندارن، نمی‌شه یه لحظه هم به این فکر کرد که شاید مشکل فقط از نیروها نیست؟\r\nچیزی که توی بعضی تجربه‌ها خیلی به چشم میاد اینه که وقتی مشکلی پیش میاد، آخرش یه جوری مسئولیت می‌رسه به کارشناس   خب اگر مدیری سال‌ها مسئول یه بخشه، بد نیست عملکرد و تصمیم‌های خودش هم یه بار جدی بررسی بشه   بالاخره مدیریت فقط عنوان و جایگاه نیست، مسئولیت هم هست\r\nواقعاً عجیبه که نیروها عوض می‌شن، ولی بعضی مشکلات همون مشکلات قبلی‌ان   شاید وقتشه به‌جای اینکه همیشه بپرسیم «مشکل این نیرو چیه؟»، یه بار هم بپرسیم «چرا بعد از این همه سال، این مشکل هنوز حل نشده؟»\r\nدر نهایت یه پیشنهاد برای مطالعه   کتاب What Got You Here Won’t Get You There از مارشال گلداسمیت   درباره همین نقاط کور مدیریتی و رفتارهایی صحبت می‌کنه که ممکنه سال‌ها تکرار بشن، بدون اینکه خودِ مدیر متوجه اثرشون بشه   شاید خوندنش برای بعضی مدیرها بد نباشه، مخصوصاً وقتی یه مشکل چند ساله‌ست و هنوز هم ادامه داره"
