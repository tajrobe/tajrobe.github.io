description: "زمانی وارد شرکت شدم که ورود عادی به شرکت سخت بود و فقط چند حالت امکان‌پذیر بود:\r\nیا باید رزومه خیلی خوبی می‌داشتی،\r\nیا با رابطه وارد می‌شدی،\r\nیا به‌ندرت شانس می‌آوردی.\r\nاما الان چی؟\r\nالان نیروهای ضعیف به‌راحتی وارد شرکت می‌شن، چون شرکت افتاده دست کوتوله‌ها.\r\nشاید در گذشته افراد شایسته دیده می‌شدن و انتصاب بر اساس شایستگی هم اتفاق می‌افتاد، اما در ده سال اخیر من هرگز چنین چیزی ندیدم. تمام انتصاب‌ها، بدون استثنا، از بین افرادی بوده که صلاحیت مدیر شدن نداشتن؛ نه دانش فنی، نه اخلاق و نه توان مدیریتی لازم.\r\nخیلی‌هاشون هم آدم‌های روانی و عقده‌ای بودن که به‌جای ساختن تیم، شروع کردن به تخریب آدم‌ها.\r\nوقتی کسی صلاحیت ریاست و مدیریت نداره، طبیعیه که اولین کاری که می‌کنه اینه که تیم خودش رو ضعیف می‌کنه. نیروهای قوی رو کنار می‌زنه، آدم‌های ضعیف رو بالا می‌کشه و در نهایت هم تیم رو نابود می‌کنه.\r\nبعد همین اتفاق در مقیاس بزرگ‌تر برای خود شرکت افتاده.\r\nکوتوله‌پروری با سرعت عجیبی رشد کرد؛ تا جایی که شرکت رو به مرز سقوط رسوند.\r\nمدیرهای قدیمی هم تکون نمی‌خورن. خودشون رو به‌روز نمی‌کنن، با هر تغییری مخالفت می‌کنن و حاضر نیستن قبول کنن که روش‌های قدیمی دیگه جواب نمی‌ده.\r\nممکنه این فضا در معاونت‌های مختلف کم و زیاد داشته باشه، ولی اصل ساختار شرکت بر همین اساس شکل گرفته:\r\nرئیس‌های کوتوله و بیمار که به‌شدت به نیروهای فنی خوب آسیب می‌زنن.\r\nنیروهای خوب رو منزوی می‌کنن، نادیده می‌گیرن و عملاً کاری می‌کنن که احساس کنن هیچ ارزشی برای شرکت ندارن.\r\nدر عوض، افراد ضعیف و سمی تیم دیده می‌شن، بهشون کارانه می‌دن، امتیاز می‌دن، افزایش حقوق می‌گیرن و روزبه‌روز بیشتر رشد می‌کنن.\r\nبعد هم تعجب می‌کنیم چرا نیروهای خوب می‌رن.\r\nهر نیروی خوبی هم که وارد شرکت بشه، اگر این ساختار ادامه پیدا کنه، دیر یا زود از شرکت می‌ره.\r\nلط... فر... وقتی مدیر منابع انسانی شد، مافیای خودش رو قدرت داد. یکی از همون نیروهای وابسته به مافیای خودش، یعنی مه... عل... خا... رو هم وارد شرکت کرد. به طور عجیبی این دو نفر باهم بودن و همین رابطه هم بخشی از قدرت گرفتن و شبکه‌ای بود که در شرکت ساختن. با هم نیروهای ضعیف و سفارشی وارد سازمان کردن و عملاً یک حلقه برای خودشون درست کردن.\r\nیعنی بحث فقط این نبود که یک نفر اشتباه استخدام یا منصوب بشه؛ بحث این بود که یک شبکه شکل گرفت که آدم‌های ضعیف و بی‌صلاحیت رو وارد می‌کرد، بالا می‌کشید و بهشون موقعیت می‌داد. بعد از اون، نیروهای بی‌سواد آکادمی هم وارد شدن و آن‌قدر نیروهای فنی خوب و قدیمی رو سرکوب کردن که بخش زیادی از اون‌ها ترجیح دادن از شرکت برن.\r\nبعد اتوبوس بعدی اومد و این دو نفر رو بیرون کرد.\r\nاین دو نفر هم رفتن جای دیگه و همیشه برای این مافیا شبکه ای پست های مدیریتی هست.\r\nو نتیجه چی شد؟\r\nخدمات ضعیف شد.\r\nدر دوره ب. د. ر. که مدیرعامل شد، یک اتوبوس آدم بی‌سواد و سفارشی وارد سازمان شدن. این‌ها دیگه واقعاً توی یه لیگ دیگه بازی می‌کردن.\r\nحتی اتوبوس قبلی رو هم تا حدی بیرون کردن.\r\nولی امان از اتوبوس این‌ها.\r\nبا اینکه دوباره مدیرعامل عوض شده، هنوز چند نفرشون باقی موندن. واقعاً معلوم نیست این‌ها به کی وصل بودن که تکون نمی‌خورن.\r\nیکی از سمی‌ترین اون‌ها خانم پر... کا... بود.\r\nاین خانم تو سداد در آتلیه بود و خودش و خانواده‌اش همیشه آویزون مدیرها بودن که قدرت بگیرن. به‌سختی انداختنش بیرون از سداد و بعد با اتوبوس ب. د. ر. اومد خدمات.\r\nاومد خدمات و گفت: «UI/UX کارم!»\r\nبا عوض شدن مدیرعامل هم تکون نخورد.\r\nبعد با خدماتی که به معاون نرم یک خر... ش... داد، تبدیل شد به ملکه دربارش.\r\nبعد رسید به حقوق خوب، نمایشگاه جیتکس و...\r\nاین خانم همیشه و در هر ساعت از شبانه‌روز با اینکه دوربین تو راهرو هست، تو اتاق معاونه و شده مدیر محصول ارشد و دنبال اینه که بهش پست و مقام بدن.\r\nحالا که دیده نرم یک داره از شرکت جدا می‌شه، خودش رو چسبونده به هیئت‌مدیره شرکت.\r\nو نتیجه این شده که کل نرم یک تبدیل شده به بازیچه دست معاون و معشوقه‌اش.\r\nحالا من از منابع انسانی یک سؤال خیلی ساده دارم:\r\nواقعاً ارتباط ناسالم یک مرد متأهل با چنین نیروی سمی و سفارشی، از نظر شما عادی و اوکیه؟\r\nاگر نیست، پس چرا هیچ‌کس نظارت نمی‌کنه؟\r\nاگر هست، دقیقاً معیار شما برای سلامت سازمانی چیه؟\r\nاصلاً با چه معیاری این افراد رو به پست و مقام می‌رسونید؟\r\nبا چه معیاری منابع انسانی شرکت رو دست چنین آدم‌هایی می‌سپارید؟\r\nچطور ممکنه یک نفر بدون دانش فنی، بدون شایستگی مدیریتی و با چنین سابقه‌ای، به‌جای اینکه کنار گذاشته بشه، روزبه‌روز بیشتر قدرت بگیره؟\r\nنظارت می‌کنید یا فقط اسم نظارت وجود داره؟\r\nاصلاً متوجه هستید دارید با سرمایه‌های شرکت چه کار می‌کنید؟\r\nدارید شرکت رو ضعیف می‌کنید.\r\nدارید نیروهای باارزش انسانی رو نابود می‌کنید.\r\nدارید نیروهای فنی خوب رو فراری می‌دید.\r\nدارید آبروی شرکت رو می‌برید.\r\nو بدتر از همه، دارید ساختاری درست می‌کنید که آدم‌های ضعیف در اون رشد می‌کنن و آدم‌های قوی ازش فرار می‌کنن.\r\nآقای م. س. ط، مدیرعامل جدید شرکت؛\r\nشمایی که می‌گن فنی هستی، بیا درد بچه‌ها رو بخون.\r\nبیا ببین شرکت واقعاً چه وضعیتی داره.\r\nاز پشت ویترین به شرکت نگاه نکن و فکر نکن همه‌چیز خوبه.\r\nاون چیزی که به مدیرعامل نشون می‌دن با چیزی که نیروها هر روز دارن تجربه می‌کنن، ممکنه زمین تا آسمون فرق داشته باشه.\r\nحتی در دوره خودت هم انتصاب‌هایی که انجام شده، در موارد زیادی همون مسیر قبلی رو ادامه داده و باز هم آدم‌های کوتوله سر کار اومدن.\r\nوقتی یک‌بار، دو بار یا سه بار یک اتفاق بد می‌افته، می‌شه گفت اشتباهه.\r\nولی وقتی سال‌ها همین اتفاق تکرار می‌شه، دیگه نمی‌شه اسمش رو اتفاق گذاشت.\r\nیعنی یک ساختار وجود داره که این وضعیت رو تولید و بازتولید می‌کنه.\r\nحداقل به خاطر رزومه خودت جلوی ادامه این اتفاقات رو بگیر.\r\nآقای ز.، مدیر منابع انسانی؛\r\nشما که نظرسنجی گذاشتی و گفتی مشکلات رو محرمانه باهاتون در میون بذاریم، بیا همین‌جا بخون.\r\nاینجا بچه‌ها بی‌پرده واقعیت رو می‌گن.\r\nاینجا دیگه خبری از گزارش‌های قشنگ و جواب‌های کلیشه‌ای نیست.\r\nاینجا آدم‌ها دارن چیزی رو می‌گن که احتمالاً توی جلسات رسمی جرئت نمی‌کنن بگن.\r\nاگر واقعاً می‌خوای کاری کنی، بیا برای همین دردهای واقعی کاری کن.\r\nنه اینکه یک نظرسنجی دیگه بذاری، چند تا جواب جمع کنی و بعد همه‌چیز برگرده سر جای اولش.\r\nشرکت با پاورپوینت و گزارش‌های قشنگ درست نمی‌شه.\r\nبا آدم‌های درست، مدیریت درست و تصمیم‌های شجاعانه درست می‌شه.\r\nاگر واقعاً دغدغه شرکت و سرمایه انسانی رو دارید، وقتشه این حرف‌ها رو جدی بگیرید.\r\n\r\n"
