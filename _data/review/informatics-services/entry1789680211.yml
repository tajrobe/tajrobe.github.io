description: "امیدوارم مدیر توسعه کسب و کار این پیام رو بخونه و منطقی نقد رو بپذیره:\r\nواقعا برات مهمه بدونی چه آدم هایی رو داری بهشون قدرت میدی یا فکر میکنی نیروی خوبن؟ بعضی از این افراد هم از نظر اخلاقی مشکل دارن، هم از نظر فنی. با علم به این موضوع انتخاب میکنی یا مثل بقیه شرکت سفارش شدن؟ انتخابات با چه معیاری بودن؟\r\nاگر سفارش شدن، حداقل بگو که همه حساب کار دستمون بیاد. مگه میشه با این تجربه، هنوز تو شناخت آدم ها مشکل داشته باشی؟ ما رو سپردی دست این نیروهای سمی و در برابر ما مسئولی. نمیشه چشم هات رو روی اتفاقاتی که برای نیروها میفته ببندی و فقط به کسانی که دور و برت هستن اعتماد کنی.\r\n الان کار به جایی رسیده که هیچ کس نمیتونه راحت حرف بزنه و همه به جون هم افتادن. چون فضای ترسی ایجاد شده و هر کسی هم بخواد چیزی بگه، از واکنش احساسی و تصمیم عجولانه شما میترسه.\r\nیه چیز دیگه رو هم در نظر بگیر؛ همین آدم هایی که امروز بهت نیاز دارن و کنارت هستن، ممکنه یه روزی همین رفتارها رو با خودت بکنن. فعلا بهت نیاز دارن، ولی این شرایط همیشه همینطور نمیمونه.\r\nیه بار به آدم هایی که بهشون اعتماد داری نگاه کن. شاید لازم باشه قبول کنی در شناخت بعضی ها اشتباه کردی. اگر هم فکر میکنی شناختت درست بوده، مسئولیت اتفاقاتی که برای بقیه میفته رو هم بپذیر. \r\nتو این شرکت با زندگی کاری اینهمه آدم به راحتی بازی میشه!"
