description: "یه مدته میام اینجا حرفای بچه‌ها درباره خدمات رو می‌خونم\r\nچون اینجا خیلی از حرفای واقعی گفته میشه\r\n\r\nطی پنج سال گذشته بالای مجموعه هی عوض شد\r\nپایین مجموعه هم این همه آدم جابه‌جا شدن\r\nولی اون وسط که اصل ماجراست انگار آب از آب تکون نخورده\r\n\r\nهمون لایه‌ای که عملکرد بقیه رو می‌سنجه و برای بقیه تصمیم می‌گیره\r\nولی خودش سال‌هاست تو حاشیه امنه\r\nهرجا هم گندی بالا میاد اشتباه و سوءمدیریت خودش رو با زدن نفر پایین‌تر جمع می‌کنه\r\nکارانه کم میشه یا یکی کنار گذاشته میشه\r\nفقط که صندلی خودش تکون نخوره\r\n\r\nنظرسنجی واقعی یعنی پایین‌دست بتونه با امنیت کامل درباره بالادستی خودش نظر بده\r\nاین صفحه برای خیلی‌ها شده همون نظرسنجی واقعی\r\n\r\nهرچی گفتیم نشد\r\nاین بار شاید بد نباشه اون وسط هم بره زیر ذره‌بین\r\n\r\nعنوان و صندلی هنر نیست\r\nصندلی با نون‌بُری حفظ میشه\r\nولی مجموعه با خروجی و پاسخ‌گویی می‌مونه\r\n\r\nو اگه جواب اعتراض اینه که مشکل داری برو\r\nنه رفیق\r\nاین بار اون کسی باید جواب پس بده که سال‌ها پشت همون صندلی قایم شده"
