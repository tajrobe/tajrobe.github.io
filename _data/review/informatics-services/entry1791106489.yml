description: "وقتی فردی بی تجربه، غیر فنی و دارای مشکلات جدی رفتاری، بدون داشتن نقطه قوت مشخصی در حوزه تخصصی یا مدیریتی، در جایگاه ریاست قرار می گیره، طبیعیه که این نگرانی به وجود بیاد که افراد توانمند تیم به درستی دیده نشن و حتی حضورشون برای او تهدید تلقی بشه.\r\nبعضی از این افراد در دوره ای حتی در معرض اخراج شدن بودن، اما امروز بخشی از منابع انسانی در اختیارشون قرار گرفته و نتیجه این وضعیت می تونه آسیب جدی به نیروها و مجموعه باشه.\r\nبا وجود مشکلات موجود، همچنان شرایط به سمتی پیش می ره که نیروهای خوب خسته و بی انگیزه بشن و در نهایت از مجموعه برن، در حالی که برخی افراد سفارشی یا کم اثر باقی بمونن. روزی ممکنه برسه که نیروهای توانمند رفته باشن و دیگه کسی برای انجام واقعی کارها باقی نمونده باشه.\r\nاینجا حتی اگر به ندرت فرد مناسبی هم در جایگاه مدیریتی قرار بگیره، باز به دلیل وجود افراد سفارش شده ممکنه نتونه درست عمل کنه.\r\nمن در مجموعه ای هستم که مدیرم، با وجود اینکه فنیه و در ظاهر فردی اخلاق مدار به نظر می رسه، تحت تاثیر ظاهر و روایت افراد قرار می گیره و متاسفانه برخی افراد مسئله دار به افراد مورد اعتمادش تبدیل شدن. از جمله رئیسی که خودش منتصب کرده \r\nچند جمله خطاب به مدیریت:\r\nمدیری که صرفا با حرف یک نفر نگاهش نسبت به یک انسان تغییر می کنه، با توجه به تجربه مدیریتی که داشته، انتظار می ره حرفه ای تر و مستقل تر قضاوت کنه.\r\nوقتی مسئول یک مجموعه هستید، طبیعیه که باید مراقب نیروهای اون مدیریت باشید و اجازه ندید یک کارشناس بدون حمایت در اختیار فردی قرار بگیره که ممکنه بهش آسیب بزنه. درک می کنیم که در این سازمان بیشتر انتصاب ها تحت تاثیر تصمیمات یا محدودیت هایی خارج از اختیار مدیر باشن، اما حداقل باید ظرفیت شنیدن واقعیت و بازبینی شرایط وجود داشته باشه.\r\nمی شه در یک فضای کاملا محرمانه از افراد تیم نظرسنجی کرد و واقعیت رو از خود اونها شنید.\r\nچطور فردی که هیچ سابقه جدی در کار فنی نداره می تونه برای افراد فنی کار تعریف کنه، پیچیدگی کار اونها رو بفهمه و بعد عملکردشون رو ارزیابی کنه؟\r\nچطور فردی که سابقه عملی وتحصیلی مشخصی در حوزه کامپیوتر نداشته و مدت قابل توجهی هم فعالیت موثری نداشته، می تونه درباره ارزش و کیفیت کار نیروهای فنی قضاوت کنه؟\r\nچطور فردی که به شدت بدبینه، خیلی از اتفاقات رو از زاویه توطئه و رقابت می بینه و نسبت به جایگاه خودش احساس ناامنی داره، می تونه بدون سوگیری افراد توانمند تیمش رو ارزیابی کنه؟\r\nوقتی فردی دائما نگران جایگاه خودش باشه، ممکنه به اعضای تیم برچسب بزنه، اونها رو تهدید تلقی کنه یا به شکلی رفتار کنه که افراد از تیم خارج بشن. چنین الگوهای رفتاری معمولا با چند آموزش ساده منابع انسانی اصلاح نمی شن و اگر ریشه دار باشن، می تونن برای مدت طولانی به روابط کاری و سرمایه انسانی مجموعه آسیب بزنن.\r\nحتی اگر چنین فردی آموزش های HR و مدیریت ببینه، تا زمانی که مشکلات رفتاری عمیقش حل نشده باشن، صرف آموزش نمی تونه تضمین کنه که آسیبی به نیروهای انسانی وارد نشه(البته که مشکلات ریشه دار شخصیتی هیچ وقت حل نمیشن).\r\nاگر قراره این فرد در جایگاه خودش باقی بمونه، حداقل اجازه ندید نیروهای خوب و توانمند به دلیل نحوه رفتارش بی انگیزه بشن یا مجموعه رو ترک کنن.\r\nاگر این نیروها براتون اهمیت دارن، لازمه خودتون بیشتر مراقب شرایطشون باشید.\r\nدر نهایت باید افرادی در مجموعه باقی بمونن که واقعا کار رو انجام بدن، نه اینکه فقط خروجی دیگران رو تحویل بگیرن و گزارشش رو به نام خودشون ارائه کنن.\r\nمشکل وقتی جدی تر می شه که فردی که درک عمیقی از کار نداره، گزارش و حاصل تلاش دیگران رو دریافت کنه و اون رو به عنوان خروجی خودش به سطوح بالاتر منتقل کنه.\r\nبه دوره ای رسیدیم که افراد سالم و حرفه ای گاهی مجبورن از مشاور کمک بگیرن تا یاد بگیرن چطور با رفتارهای خیلی ناسالم اطرافشون برخورد کنن، چطور آسیب کمتری ببینن و چطور شرایط رو تحمل کنن.\r\nیارب مباد آنکه گدا (م.. ب..) معتبر شود.\r\n"
