description: "مدیر توسعه کسب و کار از وقتی اومد فقط در حال تعدیل نیروهاست به هر شکل\r\nنیروها دارن استعفا میدن یا به گروههای دیگه اجباری جابجا میشن\r\nفقط چون دوست صمیمی مدیرعامله میتونه اینهمه نیرو تعدیل کنه و رکورد زده\r\nاصلا نمیتونه تشخیص بده کدوم نیرو ضعیفه یا حاشیه دار. همه هم از این اخلاقش سواستفاده کردن و میرن ظاهر نمایی جلوش و دوره اش کردن\r\nاون چنتا نیرویی که قبل تعدیل گروه، منتقل شدن به هوش، بیسواد ترین و پرروترین نیروهای گروه بودن که از دستشون راحت شدیم بسکه هر روز اینجا دعوا داشتن \r\nاون دختر دهه هشتادی جیغ جیغو سفارشی ف م\r\nخانم م ب که از آکادمی اومد و نمراتش صفر شد و چند بار اخراج شد از تیم ها \r\nخوبه بدونه خانم ر ش بدون اینکه کارت خروج بزنه حراست رو میپیچونه و چند ساعت از شرکت خارج میشه برای کار شخصی و تنها کارش تو حوزه تحلیل، تحلیل دیتای کارکنای شرکت و مالی بوده و خبر تو کل شرکت جابجا میکنه، شاید دوست داشته باشی بدونی که خبرهای گروهتو به مدیریت ح م نرم دو میده. هر روز هم میاد تو واحد ما خبر جابجا کنه با آقای ج ر که لید تیم ما شد! و گفته شما دارید کار فریلنسری خودتون رو انجام میدین تو شرکت و براتون مدیریت مجموعه اصلا مهم نیست!\r\nکل شرکت میدونن گروه هوش که بهش اهمیت میدین نیروهای بی سواد و بیکارن و چاپلوس\r\nالان دو دوره هست مدیرعامل عوض میشه و چون مدیریت این مجموعه توهم هوش دارن این تیم رو فقط میبینن و بقیه آدم نیستن\r\nهمین نیروهایی که جابجا شدن فیت اون تیم ان\r\nهرچقدر در تشخیص نیروهای تیم ما قوی بودی، همینقدر هم مدیریتت موفق خواهد شد\r\nما که رفتیم\r\nولی تغییرات فقط برای کارشناسا نیست\r\nهر سال همه تغییر میکنن\r\nشاید کار درست رو شما میکنی که تو شرکت خدمات داری با دلار درامد فریلنسری در میاری و مدیریت رو رها کردی\r\n"
