description: "بعضی از رئیس‌های گروه، کل مدیریت رو خلاصه کردن توی چارگون و نوشتن اقدام شود، کار رو می‌ندازن گردن کارشناس و خودشون کنار می‌کشن!\r\n\r\nپروژه که موفق می‌شه، می‌گن کار خودم بود، اما تا یه اشتباه پیش میاد، با داد و بیداد و تهدید، کارشناس رو مقصر می‌کنن و خودشون رو کنار می‌کشن!\r\n\r\nرئیس گروهی که نه تصمیم می‌گیره، نه مشکلی حل می‌کنه و نه مسئولیت اشتباهاتش رو می‌پذیره، بابت چی حقوق و حق مسئولیت می‌گیره؟ موقع گرفتن حق مسئولیت، همه‌چی خوبه، اما موقع جواب‌گویی خبری از مسئولیت‌پذیری نیست؟!\r\n\r\nرئیس گروه عزیز، مدیریت کن، مشکل حل کن و مسئولیت بپذیر؛ فورواردر نباش!\r\n\r\nبه عمل کار برآید، به سخندانی نیست\r\nدو صد گفته چون نیم کردار نیست\r\n\r\nبه قول یه عزیزی، بعضی از رئیس‌گروه‌ها، مخصوصاً اون‌هایی که تخصص فنی ندارن، خودشون بهتر از هر کسی می‌دونن بیرون از این مجموعه چه جایگاهی دارن، برای همین به‌جای اثبات توانایی خودشون، هوای همدیگه رو دارن و جایگاه همدیگه رو حفظ می‌کنن، اما هزینه این وضعیت رو کارشناسان شایسته می‌دن!"
