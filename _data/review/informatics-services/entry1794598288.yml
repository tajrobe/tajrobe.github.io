description: "به دوستانی که مدام زیر پست‌ها از فرهنگ زیرآب‌زنی، حاشیه، بی‌نظمی و مشکلات شرکت می‌نویسن، یه سؤال دارم: اگر واقعاً این محیط تا این حد برایتان غیرقابل تحمله، چرا از شرکت نمی‌روید؟ مگه کسی به زور نگهتون داشته؟\r\n\r\nاگر این‌قدر از شرایط ناراضی هستید و ادعای توانمندی و تخصص دارید، چرا به‌جای رفتن و پیدا کردن محیط کاری بهتر، این‌قدر به صندلی‌ هاتون چسبیدید؟\r\n\r\nجالب تر این که بعضی‌ها فقط پای همین پست‌ها حضور دارن و مدام کامنت منفی می‌ گذارند. اگر واقعاً این مجموعه تا این اندازه بد و بی‌ارزشه، این همه حساسیت و واکنش برای چیه؟\r\n\r\nشاید بهتر باشه به‌جای تخریب مداوم و تکرار گلایه‌ها، یک بار هم در عمل تصمیم بگیرید. اگر جای بهتری براتون وجود داره، تشریف ببرید و اجازه بدهید نیروهای جدید هم فرصت حضور و فعالیت داشته باشند.\r\n\r\nمحیطی که این‌ همه از آن انتقاد می‌کنید، ظاهراً هنوز هم ارزش موندن براتون رو داره؛ چون با وجود تمام این حرف‌ ها، همچنان محکم به صندلی‌ هاتون چسبیدید!\r\nتمام کامنت هایی که نوشتن کاملا دروغ هست و محیط شرکت کاملا دوستانه و فضای بسیار خوب و همکار های بسیار خوبی داره .اگر این فضایی که شما در کامنت ها می گویید شاید مشکل اصلی خود شما هستید که باید بروید که عرضه بیان مسائل را ندارید و اینجا فقط حرف یاوه می زنید."
