description: "گروه بی خاصیت استعداد یابی شکر اضافی نخور\r\nشرکت باید برای شما خوب باشه\r\nکه میایید اینجا دفاع میکنید\r\nظاهرا فرصت نداشتین ایمیل رو بخونید وقتی نتایج نظرسنجی رو خود شرکت منتشر کرد. کاملا واضح بود وضعیت چطور هست\r\nوقتی صبح تا شب در حال … زدن با مردهای شرکت هستید. خانم زه.. فر…. معرف حضورتون هست پ ۳۷۸۱\r\nو خانم س ب 2914 و خانم ث ص 331 با اون ظاهرای عملی و پلنگی زشتتون و رفتارهای زننده\r\nهم شما راست میگید هم پینوکیو\r\nاگر فنی ها نباشن که پولی نیست حقوق علاف های امثال شما رو شرکت بده\r\nنیروهای سربار بی خاصیت\r\nاز وقتی امثال شما و افراد سفارشی استخدام شدین شرکت رو به نابودی کشوندین\r\nو دائم روی نحوه استخدام ها و بی عدالتی ها سرپوش میزارید\r\nشما اقلیت های سفارشی برید از شرکت\r\nارث پدرتون که نیست"
