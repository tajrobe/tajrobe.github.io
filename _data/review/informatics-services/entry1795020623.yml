description: "دقیقا با خودتم همون عزیزی که میگی هرکی ناراضیه جمع کنه بره\r\n\r\nحافظه ما کوتاه نیست فقط تا امروز احترام گذاشتیم و این احترام همیشگی نیست\r\n\r\nما دل خوشی از این وضعیت نداریم و اگر هم بریم چیزی از دست ندادیم\r\n\r\nاما کاری نکن مجبور بشیم حرف هایی رو بزنیم که تا امروز به احترام بعضی ها نزدیم\r\n\r\nچون اون وقت شاید معلوم بشه چه کسانی بیشتر از همه به این موقعیت وابسته اند و رفتن چه کسانی براشون گرون تموم میشه\r\n\r\nبرای بقیه نسخه نپیچید \r\nشرکت ملک شخصی شما نیست"
