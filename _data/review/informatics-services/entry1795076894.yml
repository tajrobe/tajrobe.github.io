description: "بسم الله الرحمن الرحیم\r\n\r\nهنوز گوشهایم و هنوز چشمانم برای دیدن و شنیدن آنچه بعد از اعلام خبر پذیرفتگی ام در مقطع ارشد و قصدم برای ادامه تحصیل را تجربه کرده ام آمادگی ندارند.\r\nهمکاران دسته جمعی شورش کرده و در حرکتی باورنکردنی رئیس بی زبان و ناتوان در مدیریتم را مجبور ب عقب نشینی و اعلام مخالفت کرده اند.\r\nدر معرکه ای غربتی وار همگی من را محکوم و درخواست باج گیری از من برای این مساله دارند ب صورتی ک مجبور باشم روزهای حضور در شرکت تا 7 شب و اخر هفته ها یعنی پنجشنبه جمعه هارا حاضر در شرکت باشم تا اجازه ادامه تحصیل بدهم.\r\nهمکاری ک 6 ماه قبل صدای غربتی بازی و داد و هوارش سر رییس قبلی اش را با گوش هایم شنیدم و مجبورا او را ب گروه ما منتقل کرده اند امروز با سیاست های عجیبی درحال کنترل کل افراد گروه است و ب من میگوید تو باید ما را راضی نگه داری!!!!! پناه بر خدا\r\nمن را تیکه باران کرده و معتقدند ک افسار افراد نسل زد را باید ب شیوه خاص گرفت ب دلیل اینکه در زمان استخدام ما این امتیازات را نداشتیم.\r\nناحرفه ای ترین برخورد مدیریتی عمرم را زمانی دیدم ک رئیسم ب عنوان راهکار حل مساله ب من گفت یا شرکت را انتخاب کن یا دانشگاهت را.\r\nپاسخ قاطعم ب او را ک روشن و مسلم بود اینجا هم اعلام میکنم ، درس نه صرفا برای رشد شخصی و بلکه برای رشد سازمان و هر مملکتی از اوجب واجبات است.\r\nمسلما افرادی چون بنده ک با بند و پارتی و معارفه وارد نشده و معتقد است روزی انسان در دست خداست و نه خلق خدا ، نه تنها با این حرف احساس ترس و تهدید نمیکند و بلکه مصمم تر و قاطع تر از همیشه و استوار در راه درست و در جهت پیشرفت قدم خواهد برداشت.\r\n"
