description: "مدیر عامل عزیز\r\n\r\nمیدونم کمتر از یک ساله مسئولیت شرکت رو به عهده گرفتید و از همون ابتدا هم درگیر اتفاقات سنگینی مثل حمله سایبری به زیرساخت های بانکی و اختلال خدمات بانک‌ها بودید    \r\nاما فکر میکنم در کنار این مسائل توجه به واقعیت های داخل شرکت و شرایط همکارا هم ضروریه\r\n\r\nوقتی میبینم همکاری به خاطر ادامه تحصیلش با فشار و سنگ اندازی مواجه میشه واقعا ناراحت میشم    \r\nهیچ نیرویی به هیچ دلیلی نباید توی محیط کار تحت فشار قرار بگیره\r\n\r\nمتاسفانه طی سال های گذشته یه حلقه از روابط و نفوذ در شرکت شکل گرفته \r\nکه اعضاش از هم حمایت میکنن و گاهی برای افراد دارای رفتارهای مخرب اعتبار و جایگاه ایجاد میکنن    \r\nبعضی از مدیران و رؤسای گروه های سمی هم با  فشار انکار واقعیت و عوض کردن جای مقصر و قربانی فضای کار رو برای همکارا فرسایشی میکنن\r\n\r\nدر مورد مطرح شدن شماره پرسنلی بعضی افراد در پیام های قبلی هم بگم که نه اون کار رو درست میدونم و نه معتقدم همه اون افراد سمی هستن    \r\nحرف من درباره افراد مشخص نیست بلکه درباره یه شبکه از روابط و حمایت های متقابله که در بخش های مختلف شرکت اثر گذاشته\r\n\r\nاز دست دادن یه نیروی متعهد فقط هزینه جذب نیروی جدید با حقوق بالاتر رو نداره    آشنایی نیروی جایگزین با پیچیدگی های شرکت هم زمان بره    در مقابل باید دید رفتار افراد سمی چه هزینه هایی تا امروز به شرکت تحمیل کرده و همچنان میکنه\r\n\r\nمن سال هاست از همین شرکت امرار معاش میکنم و خودم رو بخشی از بدنه این مجموعه میدونم    \r\nبرای همین دیدن اینکه کار همکارا به جایی رسیده که توی یه صفحه غیر رسمی از شرکت گلایه میکنن واقعا برام خوشایند نیست و به نظرم نشونه ایه که شرایط داخل شرکت نیاز به توجه خیلی جدی داره\r\n\r\nهیچ کس هم نباید خودش رو فراتر از پاسخگویی بدونه    \r\nوگرنه کارشناس که پایین ترین و بی دفاع ترین سطح شرکته در نهایت همیشه باید هزینه رفتار و تصمیم های دیگران رو بده\r\n\r\nبا ستمگر دشمن و یاور مظلوم باشید\r\nامام علی (ع)"
