description: "در این شرکت فقط در صورتی پیشرفت می‌کنید و درآمدتان بالا می‌رود که بله‌قربان‌گوی مدیران ارشد باشید و مدام تملق‌شان را بگویید. رفتارشان با پرسنل به شدت توهین‌آمیز و پر از تحقیر است. هر وقت از جایی عصبانی باشند، حرصشان را سر بچه‌ها، مخصوصاً بچه‌های فروش خالی می‌کنند؛ به‌ویژه تو زمان کمپین‌ها با بی‌احترامی برچسب بی‌عرضگی و بی غیرتی به آدم می‌زنند. یک سری آزادی‌های ظاهری تو محیط کار ایجاد کرده‌اند که فقط برای فریب دادن و بیگاری کشیدن بیشتر است. شرکت نه نظم و ساختار درستی دارد و نه واحد منابع انسانی. خیلی از نیروها با نارضایتی و به دلیل عدم دریافت مطالباتشان می‌روند. از همه بدتر گروکشی مالی موقع خروج از شرکت است؛ صراحتاً تهدید می‌کنند که اگر استعفا بدهید، پورسانت‌های فروش قبلی شما سوخت می‌شود و مجبوری بین گرفتن حق و حقوقت و زندگیت یکی را انتخاب کنی. در جلسات و مراسم‌ها فقط شوآف اخلاق‌مداری می‌دهند اما در واقعیت تضاد عمیقی بین حرف و عملشان هست که اگر کسی وارد شرکت شود از این حجم از دوگانگی شوکه می‌شود."
