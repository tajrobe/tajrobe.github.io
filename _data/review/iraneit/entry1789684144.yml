description: "اولش یه تست هوش گرفتند و بعدش با مدیر تیم تست یک مصاحبه داشتم که ایشون کل ۴ سال تجربه دانشگاهی منو نادیده گرفت و راجع به نمرات ریاضی فیزیک دبیرستانم و عملکردم تو دوران مدرسه پرسید. بعد وارد دوره ۱ هفته‌ای کاراموزی شدم که باید مفاهیم بیمه یاد میگرفتم، هیچکسی که چیزی یاد نمیداد، قبل دوره یکسری فایل باید برام می‌فرستادن و من میخوندم و طبق اونا یکسری سناریو که اماده بود رو سیستم شرکت انجام میدادم. روز اول فهمیدم همون فایل‌ها رو هم مسئول مربوطه برام نفرستاده، بهشون گفتم باز هم نفرستادند. آخر به رئیس جذب و آموزش گفتم و ایشون فرستادند. هیچکس هم به روش نیورد که کوتاهی کردند و یک عذرخواهی ساده هم نکردند. بعد دوره یک آزمون ۱۰۰ نمره‌ای میگیرن که نمره قبولی ۹۵ هست. سوالات تشریحی بودن و بعضی بارم نداشتن تا رئیس آموزش به دلخواه نمره بده که یا رد کنه یا قبول. در نهایت من رو با نمره ۹۰ رد کردند و زیر بار کوتاهی‌ای که سر فرستادن فایل‌ها کردن، نرفتن. برداشت من تو اون دوره این بود که سرت تو کار خودت باشه و کم حرف بزنی خوششون نمیاد. تیم تست هم تو یک ساختمون دیگه هست که یک آپارتمان مسکونیه، نه شرکت. و ازتون سفته ۲ ساله میگیرن که یه وقت نتونید از شرکت برید. شرکت فناوری اطلاعات با این همه دبدبه کبکبه تمام تست‌ها رو دستی انجام میدن و جالبه که اتفاقا یکی از نرم افزارهای خود شرکت باگ داشت. رمز یکبار مصرف بعد از گذشت زمان مورد استفاده، همچنان قابل استفاده بود!"
