description: "بعد از مصاحبه تلفنی به مصاحبه حضوری دعوت شدم قبلش ی آزمون تست هوش خیلی سطح پایین که بصورت پرینت سده بود ازم گرفتن ی لحظه فک کردم تو کنکور سراسری شرکت کردم ازم از دنباله اعداد تل پرورش کاهو و تماشای فوتبال سوال پرسیدن\r\n\r\nخیلی افتضا بود سوالاتش ی لحظه خواستم بلند شم 🤣\r\nبعد از اون مرحله ی شخصی اومدن مصاحبه کنن در مورد سابقه و تجربه کاری ک اصلا معلوم نبود دنبال چی بودن و چرا برای این پوزیشن دارن نیرو جذب میکنن انگار سازمان اصلا ظرفیت این آگهی شغلی رو نداشتن\r\nخلاصه شخص مصاحبه کننده خیلی گیج بودن و حدود یکساعت و نیم مصاحبه کردن واقعا سوالات شون و سطح تجربه کاریشون در حد خیلیییی پایینی قرار داشت و خودشونم گفتن ک چندین سال در این مجموعه هستن و به سیستم و بخش های مختلف گند زدن \r\nبعد از مصاحبه خیلی انرژی خوبی از محیط شرکت و ادامه فعالیت نگرفتم و برای پروسه بعدی انصراف زدم ،، ارزش نداره فعالیت با این مجموعه داغون رو داشته باشم ، مطمئن هستم کار فعلی خودم در همین شرکت خیلی حرفه ای تر و باصرفه تر هست.\r\nمحیط داخل شرکت خیلی خشک و اکثرا با رنج سنی بالا اونجا مشغولن \r\nی لحظه فک کردم وارد زندان شدم فضای شرکت بشدت تاریک و دلگیر \r\nپیشنهادم اینه اصلا سمت این شرکت ترید حتی برا مصاحبه\r\nچند ساعتی وقتتون تلف میشه\r\nمسیر بشدت بد و دور هم هستش\r\n"
