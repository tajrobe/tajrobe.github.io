description: "بعد از مصاحبه تلفنی برای مصاحبه حضوری دعوت شدم🙂‍↔️\r\nمتاسفانه مسیر شرکت فوقالعاده بد مسیر و به مترو دسترسی نداره و خیلی دور هست\r\nیک آزمون تست هوش گرفتن ک خیلی سطح پایین داشت واقعا شخصی ک متخصص هست و در سطح ارشد تحصیلات داره این مدل آزمون تست خیلی کلاس شرکت رو پایین میاره با سوالات بسیار درهم پرهم\r\nبعد از این مرحله ک بنده بیشتر از حد نصاب نمره تست هوش رو آوردم🤥\r\nدعوت شدم مصاحبه تخصصی🫥\r\nی آقای بودن ک زیاد از فیلد شغلی بنده اطلاعاتی نداشتن🫢\r\nمشخص نبود دنبال چی بودن خیلی سردرگم سوال میپرسیدن\r\nراستش وسط مصاحبه خیلی انرژی خوبی نگرفتم از شرکت و منابع انسانی و متخصص شرکت\r\nبابت ادامه همکاری اعلام کردن ک سفته باید بدیم\r\nمتاسفانه بنده قبول نکردم و چون ی فرصت شغلی بهتر داشتم سعی کردم تمرکزمو بزارم رو همون موقعیت شغلی \r\n\r\n\r\nپرسنل هم بنظرم تو کار هم سرک میکشن بصورت ک یک خانوم از پرسنل شرکت بود برای کنجکاوی دنبال من اومد🫤🙈\r\n\r\nبنظر من شخصی ک متخصص فنی هستش تو این شرکت حیف میشه چون جاهای بهتر هم هستن ک ارج و قرب بهتری دارند\r\n\r\nتو این شرایط اقتصادی بنظرم رو حقوق درخواستی من هم اوکی نبودن\r\nدرحالی ک بنده بسیار منصف بودم😄\r\n\r\n\r\nپیشنهادم اینه این شرکت آینده شغلی خوبی نداره🥺\r\n\r\nچون منابع انسانی بشدت ضعیف🥸\r\nنیروی متخصص نداره🤢\r\nپارتی حرف اول رو میزنه😤\r\nسفته میگیرن🎃\r\nامکانات خیلی پایین داره🥴\r\nاگر دقت کنید اصلا نیرو جذب نمیکنن وقت آگهی استخدامی میزارن ک بگن ما هم جذب نیرو داریم🤣"
