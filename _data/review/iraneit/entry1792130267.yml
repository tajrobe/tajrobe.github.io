description: "یکی از نکات قابل‌تأمل درباره این شرکت، نحوه تعریف دورکاری و انتظاراتی است که از نیروها دارد. وقتی شرکتی از امکان دورکاری صحبت می‌کند، انتظار می‌رود زیرساخت‌های لازم برای انجام کار از راه دور، از جمله لپ‌تاپ یا سیستم مناسب و در صورت لزوم کمک‌هزینه اینترنت، فراهم شود نه اینکه با حقوق پایین، انتظار داشته باشد نیروی کار از تجهیزات شخصی و اینترنت خودش برای پیشبرد امور شرکت استفاده کند.\r\n\r\nدورکاری به این معنا نیست که تمام هزینه‌های کار به نیروی انسانی منتقل شود. اگر شرکت تصمیم گرفته به‌صورت دورکار نیرو جذب کند، باید مسئولیت تأمین تجهیزات و امکانات موردنیاز را هم بپذیرد. نمی‌توان از یک طرف امکانات و فضای کافی برای حضور نیروها در شرکت نداشت و از طرف دیگر، بدون تأمین ملزومات کار، همه‌چیز را به عهده خود کارکنان گذاشت.\r\n\r\nموضوع قابل‌تأمل دیگر، دریافت سفته‌های سنگین از نیروهاست. وقتی از کارکنان چنین ضمانت‌هایی گرفته می‌شود، انتظار می‌رود در مقابل، شرکت نیز تعهدات خود را در قبال نیروی انسانی، از جمله تأمین امکانات کاری، پرداخت حقوق متناسب و ایجاد شرایط همکاری منصفانه، جدی بگیرد.\r\n\r\nفرآیند مصاحبه نیز جای تأمل دارد. سطح برخی از پرسش‌ها و نحوه برگزاری مصاحبه‌ها این تصور را ایجاد می‌کند که مصاحبه‌کنندگان تسلط کافی بر موضوعات مطرح‌شده ندارند و گاهی به‌جای ارزیابی تخصص و تجربه متقاضی، بیشتر به دنبال دریافت ایده و راهکار از او هستند. مصاحبه حرفه‌ای باید بر پایه معیارهای مشخص، شناخت فنی کافی و ارزیابی واقعی توانمندی‌های افراد انجام شود.\r\n\r\nدر نهایت، عملکرد واحد منابع انسانی نیز نیازمند بازنگری جدی است. جذب نیرو زمانی اثربخش خواهد بود که علاوه بر انتشار آگهی استخدام، شرایط مناسب همکاری، حقوق منصفانه، امکانات لازم و فرآیند ارزیابی حرفه‌ای نیز وجود داشته باشد. صرفاً اعلام فرصت‌های شغلی و انتظار برای تأمین همه امکانات از سوی کارکنان، به‌معنای داشتن یک فرآیند استخدام استاندارد نیست.\r\n\r\nاگر شرکت به دنبال جذب و حفظ نیروی متخصص است، باید میان انتظاراتی که از کارکنان دارد و امکانات و مزایایی که در اختیارشان قرار می‌دهد، تناسب برقرار کند. دورکاری بدون تأمین امکانات، حقوق نامتناسب با انتظارات و فرآیند استخدام غیرحرفه‌ای، مسائلی هستند که می‌توانند اعتماد متقاضیان و کارکنان را کاهش دهند."
