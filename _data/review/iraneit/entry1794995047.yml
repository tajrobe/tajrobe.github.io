description: "امیدوارم قبل از اپلای کردن برای این شرکت حرفای من رو بخونین.\r\n\r\nاگر فرد با سابقه و متخصصی هستید تحت هیچ شرایطی حتی به قیمت بیکاری سمت این شرکت نیاین.\r\n\r\nتوی این شرکت تقریبا همه چیز بوی عقب موندگی میده. بوی مریضی میده. بوی کثافت میده. از تکنولوژی بگیر تا ساختار و روش کاری و آدما...\r\n\r\nتوی کل این شرکت شاید کمتر از انگشتهای یه دست آدم حسابی پیدا میکنی. که اونا هم یا از درد ناچاری اومدن اونجا یا حماقت!\r\n\r\nاگر فکر میکنین منابع انسانی زیرآب زن و هوچی و مریض زیاد دیدین به نظرم کمی صبر کنین. فناوران با اختلاف از هرجایی که دیدین بدتره. \r\n\r\nاگر فکر میکنین شایسته سالاری در شرکتتون وجود نداره پس باید فناوران رو ببینین. \r\n\r\nاگر فکر میکنین با تکنولوژی قدیمی کار میکنین لطفا عجله نکنین. فناوران سرآمد عقب ماندگی فنیه. \r\n\r\nگول حرفهای مدیر شارلاتان منابع انسانی رو هم نخورین که میگه اینجا داره تغییر میکنه و فلان. هیچ چیزی در این شرکت نه تغییر میکنه نه قراره تغییر کنه.\r\n\r\nیه مشت احمق دور هم جمع شدن و دارن یه گاو شیرده 20 و خرده ای ساله رو میدوشن تا بمیره!\r\n\r\nحتی خوندن آگهی شغلی فناوران هم کفاره داره.\r\n\r\nاپلای نکنین.\r\n\r\nاگر اپلای کردین مصاحبه نرین.\r\n\r\nاگر مصاحبه رفتین آفر اکسپت نکنین.\r\n\r\nاگر اکسپت کردین....\r\n\r\nتبریک میگم...\r\n\r\nتو هم مثل من یه احمقی!"
