description: "بعضی شرکت‌ها آن‌قدر درگیر توهم حرفه‌ای بودن هستند که حتی متوجه عمق فاجعه‌ای که در ساختار مدیریتی‌شان جریان دارد، نیستند.\r\n\r\nتجربه مصاحبه با این مجموعه، بیشتر از آنکه یک جلسه ارزیابی تخصصی باشد، نمایشی تمام‌عیار از ضعف مدیریتی، فقدان بلوغ سازمانی و اعتمادبه‌نفس بی‌پشتوانه بود.\r\n\r\nمدیر فنی‌ای که انتظار می‌رود نماد دانش و تخصص باشد، اما در عمل بیشتر از دانش فنی، عنوان مدیریتی‌اش به چشم می‌آید.\r\n\r\nمدیر منابع انسانی‌ای که ظاهراً هنوز تفاوت میان رفتار حرفه‌ای و برخورد غیرمحترمانه را درک نکرده است. واقعاً جای سؤال دارد که فردی با چنین سطحی از مهارت ارتباطی، چطور مسئول ارزیابی و جذب نیروی انسانی شده است.\r\n\r\nفرهنگ سازمانی: صفر.\r\nشعور سازمانی: صفر.\r\nاحترام به افراد: صفر.\r\nکیفیت مصاحبه: زیر صفر.\r\nتوهم تخصص و خودبزرگ‌بینی: بی‌نهایت!\r\n\r\nفاجعه اصلی، بی‌اطلاعی نیست؛ بی‌اطلاعی همراه با توهم دانایی است.\r\n\r\nوقتی افرادی که خودشان نیاز جدی به آموزش، ارزیابی و بازنگری در صلاحیت حرفه‌ای دارند، در جایگاه قضاوت درباره توانمندی دیگران قرار می‌گیرند، نتیجه چیزی جز چنین تجربه تأسف‌باری نخواهد بود.\r\n\r\nاین مجموعه برای من نمونه روشنی از یک طبل توخالی سازمانی بود؛ پر از عنوان‌های پرطمطراق، ادعاهای بزرگ و ژست‌های مدیریتی، اما تهی از ابتدایی‌ترین اصول حرفه‌ای‌گری.\r\n\r\nپیشنهاد می‌کنم قبل از اینکه به فکر جذب نیروی متخصص باشید، ابتدا به فکر جذب مدیرانی باشید که واقعاً چیزی برای ارائه داشته باشند.\r\n\r\nو در آخر:\r\n\r\nهر کسی که پشت میز مدیریت می‌نشیند، لزوماً مدیر نیست. بعضی‌ها فقط ثابت می‌کنند که فاصله میان جایگاه شغلی و شایستگی فردی چقدر می‌تواند زیاد باشد.\r\n\r\nتنها نکته مثبت این مصاحبه، شناخت به‌موقع محیطی بود که قطعاً ارزش صرف کردن زمان و توانایی حرفه‌ای را ندارد.\r\n\r\nگاهی رد شدن در یک مصاحبه شکست نیست؛ نجات پیدا کردن از یک اشتباه بزرگ است."
