description: "چیزی که در این مجموعه واقعاً عجیبه، فاصله بین ادعای بعضی مدیران و توانایی واقعیشونه.\r\n\r\nمعاون فنی مجموعه طوری رفتار می‌کنه که انگار به تمام مباحث فنی مسلطه و هر چیزی که خودش می‌دونه، نهایت دانش اون حوزه‌ست. این حجم از خودبرتر‌بینی در حوزه‌ای که یادگیری مداوم یکی از اصول اولیه‌شه، واقعاً جای تعجب داره.\r\n\r\nبرخورد منابع انسانی هم به‌شدت زننده و به دور از ابتدایی‌ترین اصول ارتباط حرفه‌ای بود. واقعاً مشخص نیست افرادی که خودشون در برقراری یک ارتباط محترمانه مشکل دارن، چطور مسئول ارزیابی و جذب دیگران شدن.\r\n\r\nالبته انصافاً باید به یک نکته مثبت هم اشاره کنم. فردی در جلسه مصاحبه حضور داشت، کاملاً متفاوت از بقیه بود. بسیار محترم، مسلط به مباحث فنی، حرفه‌ای و مهم‌تر از همه، دقیقاً می‌دونست دنبال چه چیزی می‌گرده و چطور باید توانایی یک فرد رو ارزیابی کنه.\r\n\r\nاتفاقاً حضور همین شخص باعث شد تفاوت بین تخصص واقعی و صرفاً ادعای تخصص، بیشتر به چشم بیاد.\r\n\r\nتنها چیزی که هنوز برام سؤال باقی مونده اینه که فردی با این سطح از دانش، شخصیت حرفه‌ای و درک فنی، چطور سر از چنین مجموعه‌ای درآورده و قراره چطور با این سبک مدیریت کنار بیاد؟\r\n\r\nنکته جالب‌تر اینکه وقتی بعد از مصاحبه کنجکاو می‌شی و سوابق کاری بعضی از این مدیران رو بررسی می‌کنی، تازه فاصله بین عنوان‌های شغلی و چیزی که در عمل از خودشون نشون می‌دن، بیشتر مشخص می‌شه.\r\n\r\nواقعاً بعضی‌ها حتی برای مسئولیت آبدارخونه هم باید از نظر رفتار و مسئولیت‌پذیری ارزیابی بشن، چه برسه به مدیریت یک مجموعه فنی!\r\n\r\nدر نهایت امیدوارم حضور افراد متخصص و حرفه‌ای مثل همون شخص که کاملا با بقیه متفاوت بود، بتونه تغییری در وضعیت این مجموعه ایجاد کنه؛ هرچند با چیزی که از مدیریت فعلی دیدم، چندان خوش‌بین نیستم."
