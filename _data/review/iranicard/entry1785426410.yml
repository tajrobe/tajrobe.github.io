description: "من برنامه نویس هستم ولی در یک شرکت دیگه...در ایرانیکارت نه کار کردم نه تابحال مصاحبه اومدم ولی این نظر آخر رو در لیست اخرین نظرات دیدم واقعا یاد مشکلات خودم در شرکتی که کار میکردم افتادم: \r\nمردهایی که زن ستیز بودن و بدون هیچ تجربه و تخصص و مهارتی با هم دست به یکی میکردن که هیچ دختری ارتقا پیدا نکنه و مدیر نشه من 3 برابر اون پسرها سابقه و مهارت داشتم وقت مدیر شدنم که رسید رفتن گفتن دختر نباید مدیر باشه! بعد تخریبم کردن زیرابم رو زدن با مدیر بالایی طرح رفاقت و دوستی میریختن و اون مدیر خاله زنک هم تابع نظرات اونا  شده بود و برای اینکه افرادی امثال شما، براش حرف در نیارن دخترا رو یکی یکی تعدیل میکرد!  \r\n\r\nحالا فکر کن یه دختر هم سابقه داشته باشه هم خشگل باشه فکر میکنی میتونه پیشرفت کنه؟ مزاحمت و دست کم گرفتن دخترای فنی از یه طرف این حرفای خاله زنکی بعضی مردای زن ستیز هم از یه طرف دیگه  ..\r\n نمیدونم این تجربه قبلی رو کی نوشته و واقعا اون شرکت دخترای مدیر بی تخصص هستن یا نه ولی انقدر راحت به جرم زیبا بودن به جرم دختر بودن به کسی انگ و تهمت نزنید..انقدر راحت اینده و زندگی کاری یه نفر رو خراب نکنید ..\r\n بنظر میرسه کسی که این تجربه رو نوشته اتفاقا خیلی به چهره خانم ها توجه داره که تخصص رو نمیبینه فقط دختر بودن و خشگل بودنشون رو میبینه !  چطوری فکر کردین مدیریت و ارتقا فقط مختص شما مرداست اونم بدون هیچ تخصص و مهارت و تجربه ای؟! یا اصلا با تجربه و مهارت چرا فکر میکنید فقط شماها باید مدیر باشین ؟! \r\nشماها چه مدیر نباشین چه باشین موجودات وحشتناکی هستین!\r\nاگه یه مرد مدیریت کنه میگن اقتدار داره ولی اگر یک زن مدیریت کنه  بهش میگن قدرت طلب ! این شمایین که موجود وحشتناکی هستین که بر اساس جنسیت ادما درباره شون نظر میدین اینهمه کشت و کشتار و جنگ تو کل دنیا و این وضعیت  کشور نتیجه قدرت طبی امثال شما مردهاست اگه یه زن بین این سیاست مدارا و مدیرا بود الان وضعیت  مون این نبود!  "
