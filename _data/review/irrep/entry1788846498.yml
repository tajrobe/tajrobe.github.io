description: "قبل از اینکه وارد این شرکت بشم، در مورد شرکت تهیه و تولید مواد نسوز کشور بخصوص برخورد با نیروی انسانیش از یکی دو نفر تعریف شنیده بود. همینطور میگفتن که حقوق خوبی میده. متاسفانه وقتی وارد شدم متوجه شدم تمام اینا اشتباه بوده. البته قبلا شرکت سابقه خوبی داشته و کارخونه ش واحد نمونه برتر استان خراسان جنوبی شده بوده. حدود 4 الی 5 سالی هست که به شدت افت کرده. فضا برای زیرآب زنی بسیار بسیار زیاده. مخصوصا اینکه یک خانمی در این شرکت هست که تقریبا هیچ سواد کاری و تخصصی نداره جز خبرچینی، آمار گرفتن برای مدیرعامل و تهمت زدن به پرسنل! شرکتی که معروف بود به برخورد خوب با پرسنل و حتی شاید از معدود شرکت های خصوصی بود که کارمنداشو بعد از چند سال کار کردن رسمی میکرد، با ورود این خانم به شرکت، تعداد زیادی از پرسنل با سابقه به بهانه مختلف اخراج شدند. الان شرکت جز یک سری پرسنل پیر بازنشسته که به دلیل ارتباط با مدیرعامل در این شرکت حقوق میگیرن و هیییییچ کاری نمیکنن، و اون خانم و افرادی که مجیزش رو میگن و خودشون رو چسبوندن بهش، پرسنل دیگه ای نداره! سال گذشته انقدر حقوقا عقب میفتاد که چندین بار تو کارخونه اعتصاب شد! با این حال مدیرعامل برای جمع کردن این اوضاع ترجیح داد به مدیران کارخونه و شرکت و همین خانم خبرچین نفری 200 میلیون تومان پاداش بده، تا اونا همراه کارگرا نشن و اعتصابات رو جمع کنه! حقوق این شرکت حداقل یک ماه با تاخیر پرداخت میشه که در دو سال گذشته حتی به سه ماه هم رسیده و گاهی بعد از سه ماه، نصف حقوق رو پرداخت کردن! البته جدیدا که صنعت فولاد در جنگ آسیب دیده و اینام تامین کننده آجرهای نسوز فولاد هستن، الان کمی پول تو دست و بالشون اومده و دارن پول پاشی میکنن، ولی مدیریت انقدر در فساد اخلاقی وفرو رفته که قطعا این وضعیت کوتاه مدته و باز برمیگرده به اوضاع قبلی! هیچ مزایایی هم نداره، نه کارانه، نه بن کارت، نه مزایای مناسبتی! فقط میتونم بگم که اگر آدم درستی هستید جای شما تو این شرکت نیست! نه شخصیت براتون میذارن نه اعصاب! مدیرعامل یک آدم تازه به دوران رسیده بی اخلاقه که طبل رسواییش تا خانه معدن هم صدا کرده ولی عین خیالشه! اگر در پوزیشنی باشید که نیاز به ارتباط مستقیم با مدیرعامل داشته باشه، ایشون جوری تخریب شخصیتتون میکنه که نتونید از جاتون بلند شید! به ظاهر یه آدم خوشتیپ و جنتلمنه! ولی در واقع یه لمپن بددهنه که اخلاق زشتش رو خواسته با فکل کراوات بپوشونه! .\r\nمعایب: پرداخت حقوق نامنظم، برخورد نامناسب با پرسنل، ارجحیت رابطه بر شایستگی، نبود مزایا، فضای ناسالم و مسموم کاری"
