description: "تجربه کاری من در ایتی‌ساز با چالش‌های جدی از نظر فرهنگ سازمانی و امنیت شغلی همراه بود. کنترل دائمی کارکنان با دوربین، حساسیت بیش از حد روی مسائل کوچکی مثل چند دقیقه دیرتر صبحانه خوردن و ایجاد فضای ترس از اخراج، باعث می‌شه به‌جای تمرکز روی کار، مدام نگران وضعیت شغلی‌تون باشید.\r\n\r\nیکی از مشکلاتی که به چشم میاد، فامیلی بودن فضای مدیریتی و نگرانی از کم‌رنگ بودن شایسته‌سالاریه. این حس وجود داره که حتی اگر کارتون رو درست انجام بدید، ممکنه ماه بعد با دلایل غیرشفاف یا بهانه‌های مختلف کنار گذاشته بشید تا یکی از نزدیکان یا بستگان مدیر کسب و کار وارد مجموعه بشه.\r\n\r\nاز طرف دیگه، صحبت از رفاقت و صمیمیت در محیط کار با چیزی که در عمل تجربه می‌شه، همیشه هم‌خوانی نداره. تناقض بین حرف و عمل مدیران باعث می‌شه اعتماد کردن سخت بشه و کارکنان احساس امنیت و آرامش کافی نداشته باشن.\r\n\r\nدر مجموع، به نظرم محیط کار حرفه‌ای باید بر اساس شفافیت، احترام متقابل، امنیت شغلی و شایسته‌سالاری اداره بشه؛ نه کنترل بیش از حد و ایجاد ترس دائمی از اخراج. پیشنهاد می‌کنم قبل از پیوستن به این مجموعه، حتماً درباره فرهنگ سازمانی و تجربه کارکنان فعلی و سابق تحقیق کنید.\r\n\r\nمزایا: تجربه کار در پروژه‌های مختلف، فرصت یادگیری و کسب تجربه\r\n\r\nمعایب: کنترل بیش از حد کارکنان، استرس و نگرانی از امنیت شغلی، مدیریت فامیلی، نگرانی از نبود شایسته‌سالاری، فاصله بین حرف و عمل مدیران، ضعف اعتماد متقابل، حساسیت بیش از حد روی مسائل جزئی"
