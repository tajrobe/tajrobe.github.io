description: "مدتی که در آی‌وحید به عنوان برنامه‌نویس فرانت‌اند فعالیت داشتم، بیشتر کارم تبدیل طرح‌های UI به صفحات واقعی سایت بود. پروژه‌ها تنوع خوبی داشتند و همین باعث می‌شد کار بعد از مدتی حالت تکراری پیدا نکند و در هر پروژه با چالش‌های متفاوتی روبه‌رو شوم.\r\n\r\nیکی از قسمت‌هایی که شخصاً از آن لذت می‌بردم، طراحی‌هایی بود که برای پیاده‌سازی به من داده می‌شد. طراحی UI پروژه‌ها عمدتاً توسط مدیریت مجموعه انجام می‌شد و خلاقیت زیادی در آن‌ها وجود داشت. طرح‌ها با قالب‌های تکراری سایت‌ها متفاوت بودند و از نظر ترکیب‌بندی، جزئیات و ظاهر کار جذاب بودند. برای من به عنوان برنامه‌نویس حس خوبی داشت که یک طرح زیبا و جدید را تحویل بگیرم و مرحله‌به‌مرحله آن را به یک سایت واقعی تبدیل کنم.\r\n\r\nطبیعتاً بعضی از همین طراحی‌های متفاوت، پیاده‌سازی سخت‌تری هم داشتند و گاهی برای رسیدن دقیق به چیزی که طراحی شده بود چند بار نیاز به اصلاح وجود داشت. بعضی مقاطع هم به دلیل همزمان بودن پروژه‌ها فشار کاری بیشتر می‌شد.\r\n\r\nدر مجموع چیزی که از این همکاری برای من باقی ماند، تجربه کار روی پروژه‌های واقعی و طراحی‌هایی بود که معمولاً دست برنامه‌نویس را برای یک پیاده‌سازی ساده و تکراری نمی‌گذاشتند و باعث می‌شد برای اجرای جزئیات بیشتر فکر کنم و چیزهای جدید یاد بگیرم."
