description: "برای طراحی سایت فارسی ساز (https://farsisaz.com) دنبال تیمی بودیم که صرفاً یک قالب آماده تحویل نده و بتونه ظاهر سایت رو متناسب با فضای گیم و مخاطب خودمون طراحی کنه. بعد از بررسی و صحبت‌هایی که داشتیم، طراحی و اجرای سایت رو به تیم آی وحید سپردیم.\r\n\r\nچیزی که برای ما مهم بود این بود که سایت حس یک فروشگاه اینترنتی معمولی رو نداشته باشه. چون حوزه کار ما فارسی‌سازی بازی‌های کامپیوتر و کنسوله، روی ظاهر صفحات، نحوه نمایش بازی‌ها و جزئیات رابط کاربری حساسیت زیادی داشتیم.\r\n\r\nچیزی که تحویل گرفتیم از نظر طراحی نزدیک به هویتی بود که برای فارسی ساز می‌خواستیم و مهم‌تر اینکه ظاهر سایت حالت قالب‌های آماده و تکراری رو نداشت.\r\n\r\nدر مجموع از نتیجه همکاری راضی بودیم و اگر بخوام نکته اصلی این تجربه رو بگم، برای ما توجه به طراحی و جزئیات ظاهری پروژه نقطه قوت این همکاری بود."
