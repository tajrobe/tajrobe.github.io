description: "سلام به همگی همراهان ، من تجربه خودم که چندین ماه اونجا بودم رو بدون هیچ تعصبی براتون مینویسم ، اگر سنتون کم هستش و دنبال رزومه سازی هستید . جای خوبیه ، و یکم با بازار کار اشنا میشید ولی اگر تجربه کاری قبلا داشتید بهتون پیشنهاد نمیدم.\r\nاگر از ساپورت اسنپ و تپسی میاید فشار روانی کمتری رو متحمل میشید ولی خب سختیای خودشو قطعا داره مثل اضافه کاری های اجباری و...\r\nاز طرف دیگه محیطش تا زمانی که خودتون دنبال دردسر نباشید ، خاله زنکی نمیشه. محیط دوستانه خوبی داره. از نظر مدیریتی ما با اقای ص.ح و ع.ط طرفیم که واقعا مکمل همدیگه هستن. سینیور واقعا جدی و دلسوز کاری داره. توی کار با هیچکس شوخی نمیکنه از شما هم فقط و فقط کار کردن میخواد . ببینه هم خوب کار میکنید لبخندشو بهتون هدیه میده و نه هیچ چیز دیگه ای- سوپروایزر بخش عملیات ادم شوخیه ، یعنی تا زمانی که هست شاید تو یه موقعیت های جدی و سخت باعث چاشنی شیرینی بخش روزای تلخ باشه بعضی وقتاهم باعث میشه روی مختون بره و کاری کنه با شوخیاش که خجالت بکشید.\r\nدر کل محیط خوبی داره - مدیریت متوسط - حقوق و مزایای متوسط - فشار کاری زیاد (تسک های زیاد و بی پایان )\r\n.\r\n.\r\nیه واقعیتی در این باره هست که من اینو اخرش تفکیک شده نوشتم:\r\nشما اونجا مثل یه اسب میمونید که تا وقتی سرحاله و تازه نفسه بهتون بها میدن \r\nبه مرور زمان که سرعت و دقتتون پایین بیاد با اخطار عملکردی و کیو ای و کیو سی و تذکرای دیگشون پدرتونو در میارن و از خداشونه خودتون برید.\r\nپس برای زمان بندی طولانی برنامه نریزید و نزارید قلبتونو بشکونن:))\r\nبه یاد همه کسایی که وقتی من بودم از پیشمون رفتن...\r\nا.ق-ف.ه-م.ن-پ.گ-ا.ع-ن.چ-ش.پ-\r\n"
