description: "ما ۲۰ نفر بودیم که اواخر سال۱۳۹۹ و اوایل سال ۱۴۰۰ پول داده بودیم برای طراحی سایت توسط ویستا...همین شرکت جوانفکران داده گستر.‌‌...\r\nیه روز حدود اوایل مهر شخصی بنام آقای امیرمسعود محمدی با من تماس گرفت و گفت شما هم پروژه دادی به این شرکت...\r\nگفتم بله...\r\nگفت تحویل دادن.\r\nگفتم نه\r\nگفت ما یه گروه واتساپی تشکیل دادیم عضو میشی برای پیگیری و شکایت\r\nگفتم بله....\r\nخلاصه فقط ایشون و دونفر دیگه با شکایت و پیگیری پولشون رو گرفتند \r\nوالان من هم پیگیرم.\r\nخواهش میکنم گول حرفاشون رو نخورید...\r\nمن که تا ابد لعنشون می کنم\r\nمشتی کلاهبردار و دزد هستند و از دانشجوها بیگاری میکشند و و بعدا اخراجشون میکنند...پروژه های ناتمام می ماند و کارفرمایان بدبخت...\r\nالان هم پروندشون در  اجرای احکام شعبه ۵ شهید بهشتی تهران در حال پیگیری است.\r\nاگه یه حساب بانکی به حساب این شرکت فعال پیدا کردید به من اطلاع بدهید ممنون\r\n۰۹۱۲۹۷۲۱۹۱۴ نصیری هستم."
