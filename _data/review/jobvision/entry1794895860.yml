description: "من نمی تونم بنا به دلایلی عنوان شغلی خودم رو اینجا منتشر کنم!\r\nمی خواستم فقط درباره جاب ویژن توضیحاتی رو بدم که امیدوارم برای همیشه میزان پلیدی و شگردهای کسب درآمد این تیم کلاهبردار مشخص بشه.\r\nمحصولی که در تیم توسعه داده شده باگ های زیادی داره که منجر به غربالگری اشتباه رزومه کارجویان میشه. بارها به مدیریت این باگ اعلام شده ولی از آنجایکه صرفا پول آگهی رو دوست داره هیچ هزینه ای برای برطرف کردن اش نکرده! چون متخصص AI نداریم و مدتی با یک تیم بیرون از شرکت کار می کردیم و اون تیم هم بخاطر اختلافات مالی حتی جواب تلفن این مرتیکه رو نمیده!\r\nبارها ازش خواستیم سیستم پیشنهاد شغل یا فیلتر رو بهتر کنیم ولی میگه کارجو چشمش کور اگر واقعا دنبال کار بره فیلتر رو دستی بزنه!\r\nاکثر فیچرهای سایت دکوری هستن و اصلا AI پشت اش نیست و فقط با if/else های معمولی هندل میشن.\r\nاز قصد نیازهای شرکت هارو برطرف نمی کنه تا کارفرما الکی سنگ قلاب بشه و با وعده های تیم مارکتینگ کار رو جلو میبره, چون از نظر فنی نیروش هم نداره.\r\nتو سیستم کوئری های دیتابیس اشتباهات و باگ زیاده و کلی کارجو بعد یک اکشن به اشتباه رد میشن و رزومه شون گم میشه.\r\nاون پولی که برای خرید \"جاب ویژن پرو\" میدین تا رزومه هاتون دیده بشه دروغی بیش نیست! یک باگ تو لیست وجود داره حتی اگر پرو بخری کسی رزومه جدید بده الویتش بیشتر میشه.\r\nاین ها حقایق جاب ویژن هستش و امیدوارم توضیحات برای کارجویانی که این روزها از جاب ویژن خسته شدن مفید بوده باشه."
