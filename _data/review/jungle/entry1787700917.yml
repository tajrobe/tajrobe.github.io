description: "توصیه می‌کنم حتی برای مصاحبه هم این مجموعه را انتخاب نکنید. تجربه‌ای که داشتم متأسفانه کاملاً غیرحرفه‌ای بود و برخوردها در مجموع محترمانه نبود.\r\nدر بخش منابع انسانی، دو نیروی جوان حضور داشتند که به نظر می‌رسید آشنایی کافی با روند مصاحبه و وظایف خود ندارند. دو فرم به من داده شد که همان‌ها را تکمیل کردم، اما پس از ورود به جلسه مصاحبه، با این سؤال مواجه شدم که چرا فرم روان‌شناسی را پر نکرده‌ام؛ در حالی که چنین فرمی اساساً به من ارائه نشده بود. با وجود این تناقض، ترجیح دادم وارد بحث نشوم.\r\nدر جلسه مصاحبه نیز لحن و نحوه برخورد مدیری که با او مصاحبه داشتم فردی جوان بود که به نظر می‌رسید آشنایی کافی با اصول رفتار سازمانی و فرآیند مصاحبه ندارد و متأسفانه نوع برخوردش نیز محترمانه نبود. در طول مصاحبه به من گفت که برای این موقعیت شغلی مناسب نیستم و با لحنی نامناسب این موضوع را بیان کرد.\r\nبا توجه به اینکه پیش‌تر رزومه‌ام بررسی و برای مصاحبه دعوت شده بود، چنین برخوردی عجیب به نظر می‌رسید. در نهایت، انتظار می‌رود چنین مجموعه‌ای حداقل از مدیرانی استفاده کند که توانایی مدیریت و برقراری ارتباط محترمانه با متقاضیان را داشته باشند. افرادی که برای یک مصاحبه زمان می‌گذارند، شایسته برخورد حرفه‌ای هستند، نه اینکه در فضای مصاحبه مورد تمسخر یا رفتار نامناسب قرار بگیرند.\r\nدر مجموع، فضای مصاحبه به‌گونه‌ای بود که ادامه آن را بی‌فایده دیدم و جلسه را ترک کردم. "
