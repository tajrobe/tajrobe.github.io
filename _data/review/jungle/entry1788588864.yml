description: "شرکت جنگل بهترین جاست برای اینکه آدم‌کوتوله‌ها بشن مدیر و سرپرست و هرچی عقده و کمبود دارن، سر بقیه خالی کنن.\r\n\r\nاز صدر تا ذیلشون به‌دردنخورن؛ مجموعه‌ای که ظاهراً تخصص، شایستگی و اخلاق حرفه‌ای توش آخرین چیزیه که اهمیت داره.\r\n\r\nاز مدیر شرکت که رفت و خانومی که در بخش دیگری بود و به‌عنوان فرد نزدیک و سوگولی ایشون شناخته می‌شد،\r\nتا هر سرپرست و مسئول بخشی از تولید، برنامه‌ریزی و کنترل کیفی که روابط نزدیکشون با بعضی همکاران زن، روی فضای کاری و نحوه برخورد با بقیه تأثیر زیادی داشت. خانوم می‌شینه روی صندلی، زیرآب می‌زنه و بقیه می‌شن حمالِ سوگولیِ مدیر یا سرپرست اون قسمت.\r\n\r\nمسئله فقط روابط شخصی نیست؛ مسئله جاییه که این روابط وارد محیط کار می‌شن، تبعیض ایجاد می‌کنن، برای بقیه حاشیه درست می‌کنن و محیط کار رو برای سایر کارکنان تبدیل به جهنم می‌کنن.\r\n\r\nاینجا انگار کافی نیست کارت رو بلد باشی؛ باید بلد باشی به آدم درست وصل باشی!\r\n\r\nاگر آدم‌کوتوله و بی‌هنری هستی و دنبال جایی می‌گردی که بتونی با یه عنوان مدیریتی یا سرپرستی عقده‌هات رو خالی کنی و برای خودت جولان بدی، تبریک می‌گم؛ جنگل احتمالاً یکی از بهترین انتخاب‌هاست.\r\n\r\nخصوصاً اگر خانوم باشی و با سرپرست یا مدیر بریزی رو هم! :) اون وقت حسابی می‌تونی عقده‌گشایی کنی؛)\r\nخیلی راحت‌تر می‌تونی از حاشیه امن برخوردار باشی و هرچقدر خواستی برای بقیه حاشیه درست کنی.\r\n\r\nاون‌وقت دیگه نه تخصص باید خیلی مهم باشه، نه اخلاق حرفه‌ای و نه حتی اینکه رفتارت چه اثری روی بقیه کارکنان می‌ذاره.\r\n\r\nتجربه من از جنگل؟\r\n\r\nمحیطی که در بعضی بخش‌ها، بیشتر از آدم‌های توانمند، آدم‌کوتوله‌هایی رو بالا می‌بره که فقط با گرفتن یه صندلی، فکر می‌کنن صاحب دنیا شدن.\r\nاز منابع انسانی گرفته تا برنامه‌ریزی، تولید و کنترل کیفی هم همینطوریه.\r\nاونجا چیزی که بیشتر از همه کمبودش احساس می‌شه، مدیریت حرفه‌ای، شفافیت، شایسته‌سالاری و مسئولیت‌پذیریه.\r\n\r\nدر مورد سجاد و پسرش هم واقعاً یکی از آزاردهنده‌ترین چیزهایی که من در اون محیط دیدم، نحوه صحبت‌کردن و برخوردشون بود. بددهنی و بی‌ادبی در محیط کاری، آن هم از طرف افرادی که جایگاه مدیریتی یا اجرایی دارن، اصلاً قابل توجیه نیست. عباراتی مثل «گوه خوردی» و انواع فحش و ناسزا های \"ک\" دار انگار بخشی از ادبیات روزمره‌شون بود و فحش از دهنشون نمی‌افتاد.\r\nدلم خوش بود بالاخره وارد یک انتشارات و محیط فرهنگی شدم، ولی خیلی زود فهمیدم «انتشارات» بودن لزوماً به معنی بویی از فرهنگ بردن نیست. هیچ ارزش و احترامی برای نیروی کار قائل نیستن؛ کارگرها حتی جایی برای نشستن نداشتن و روی زمین غذا می‌خوردن و کیفیت غذا هم واقعاً افتضاح بود، با این نگاه که انگار «همین هم از سرتون زیادِس».\r\n\r\nفرهنگ فقط چاپ و فروش کتاب نیست؛ رفتار با آدم‌هایی که چرخ همین مجموعه رو می‌چرخونن، خودش نشون می‌ده چقدر فرهنگ توی اون مجموعه جریان داره."
