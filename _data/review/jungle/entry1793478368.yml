description: "تجربه همکاری من با انتشارات جنگل با انتظاری که از یک مجموعه باسابقه و شناخته‌شده داشتم فاصله قابل‌توجهی داشت. مهم‌ترین مشکلاتی که در طول همکاری تجربه کردم، مربوط به منابع انسانی، نحوه مدیریت، شرایط رفاهی و شفافیت سازمانی بود.\r\nمنابع انسانی از نقاط ضعف جدی مجموعه است. در تجربه من، برخورد و نحوه رسیدگی به مسائل کارکنان همیشه در سطح حرفه‌ای مورد انتظار نبود و گاهی خودِ این واحد به جای حل مسئله، باعث نارضایتی بیشتر می‌شد. به نظرم مجموعه‌ای با این ابعاد به یک مدیریت منابع انسانی متخصص، باتجربه و واقعاً حرفه‌ای نیاز دارد.\r\nموضوع دیگر، تفاوت در میزان نفوذ و حمایت مدیریتی از برخی افراد است. این مسئله می‌تواند باعث شود کارکنان احساس کنند برخورد با همه یکسان نیست و مطرح کردن اعتراض درباره بعضی افراد دشوارتر است. در برخی تعاملات با کارکنان خانم نیز نگرانی‌هایی درباره رعایت مرزهای حرفه‌ای و شخصی وجود داشت که از نظر من نیازمند رسیدگی جدی و بی‌طرفانه بود.\r\nاز نظر شرایط رفاهی و مزایا نیز تجربه من چندان مثبت نبود. وقتی از کارکنان انتظار تعهد و عملکرد بالا وجود دارد، شرایط کاری و امکانات رفاهی هم باید متناسب با این انتظار باشد.\r\nیکی دیگر از نقاط منفی، دیده نشدن کافی سابقه و تلاش کارکنان است. فردی که برای مجموعه وقت می‌گذارد و مسئولیت می‌پذیرد، باید احساس کند عملکرد و تجربه‌اش ارزش دارد؛ وگرنه انگیزه و اعتماد به‌مرور از بین می‌رود.\r\nدر مجموع، تجربه من این بود که بین انتظاری که از کارکنان برای عملکرد حرفه‌ای وجود دارد و کیفیت بعضی از فرآیندهای مدیریتی و منابع انسانی، فاصله قابل‌توجهی دیده می‌شود.\r\nاگر قصد همکاری با این مجموعه را دارید، قبل از پذیرش پیشنهاد شغلی حتماً درباره شرح وظایف، مزایا، شرایط رفاهی، مسیر پیشرفت و نحوه رسیدگی به مشکلات کارکنان دقیق سؤال کنید."
