description: "مصاحبه کننده که مدیر ارشد تولید بود، بسیار مودب و محترم بودن، اینقدر مهربان و گرم برخورد کردن که فراموش کردم تعدادی از سوالات اصلی و مهم رو بپرسم. بهتر بود در مصاحبه سوالات کاملتری از سلسله مراتب و نظم کاری میپرسیدم تا برام شفاف بشه و با دانستن روند کاری اونجا قطعا مشغول به کار نمیشدم. وقتی مشغول شدم تازه متوجه شدم مدیر اصلی بخش طراحی در دفتر مرکزی مستقر هستن و ما عملا به ایشون دسترسی نداریم تا با ایشون مشورت کنیم، تجربه کاریم چندان رضایت بخش نبود با توجه به سابقه حرفه ای که داشتم سیستم کاری اونجا باعث شد کارایی کافی رو نداشته باشم، سیستم کامپیوتری که به من داده بودن تا باهاش کار کنم رم ضعیفی داشت و نمیتونستم مراحل و فرایندهای متوالی رو ذخیره کنم چند بار با عدم ذخیره مواجه شدم در حالی که نیرویی که جذب میشه با ابزار درست و قوی عملکردش قوی هست، یک کار بین چند نفر رد و بدل میشد و مدیریت یکپارچه روی کار وجود نداشت، پرسش از روند کاری رو نقد برداشت میکردند و توصیه های دلسوزانه رو عدم تعهد و دخالت در امور مدیریتی، خلاصه که این بی نظمی و بی برنامگی در فرایند انجام کارها فشار زیادی به روح و روان وارد میکنه که باعث میشه چندان به ادامه همکاری با شرکت امیدوار نباشی. "
