description: "یکی از نکات قابل تأمل در این مجموعه، نحوه برخورد مدیر منابع انسانی با افراد است. متأسفانه برخورد این آقا در جلسه مصاحبه با لحنی تند و غیرحرفه‌ای همراه بود؛ رفتاری که با جایگاه و مسئولیتی که بر عهده دارند، همخوانی ندارد.\r\n\r\nمدیریت منابع انسانی پیش از هر چیز باید بر پایه احترام متقابل، حفظ کرامت افراد و رفتار حرفه‌ای باشد. نحوه برخورد مدیر منابع انسانی حتی در جلسات رسمی، می‌تواند نشان‌دهنده نوع نگاه ایشان به تعامل با افراد باشد. این موضوع به‌ویژه در مواجهه با مشکلات و مسائل کارکنان اهمیت بیشتری پیدا می‌کند.\r\n\r\nپیشنهاد می‌شود مجموعه در ارزیابی مدیران خود، علاوه بر تخصص، به مهارت‌های ارتباطی و نحوه رفتار آن‌ها با کارکنان و همچنین افرادی که با هدف آشنایی با مجموعه و شرکت در مصاحبه مراجعه می‌کنند، توجه جدی‌تری داشته باشد."
