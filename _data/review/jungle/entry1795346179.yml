description: "به هیچ‌وجه اصلا و ابدا پاتون رو تو این شرکت نذارید \r\nصاحب شرکت خانواده‌ی سجاد بی‌تربیت و بی‌شخصیت و گدازاده \r\nفضای کاری به شدت سمی هستش هیچ ارزش و احترامی برای پرسنل و کارگران قائل نیستن و حق افراد به راحتی خورده میشه.\r\nبا محاسبه اشتباه از حقوق پرسنل می‌دزدن، حقوق رو یا دیر میدن یا با قسط‌بندی پرداخت می‌کنن یا کلا نمیدن\r\nهیچ مزایایی به پرسنل تعلق نمی‌گیره وضعیت سرویس‌های رفت و آمد افتضاحه \r\nکیفیت غذا فاجعه‌اس هیچ جایی برای استراحت کارگرها نیست و کارگرها کنار دستگاه‌ها روی زمین غذا می‌خورن و صاحبین شرکت چون خانوادگی گدازاده و ندیده هستند و خودشون یک غذای درست درمون در طول زندگیشون نخوردن، تصورشون اینکه با یک پرس غذای آشغال و بی‌کیفیت دادن به پرسنل، افراد باید بنده‌ی اینها و شکرگزار اینها باشن\r\nساعت کاری طولانی و اضافه‌کاری اجباری بدون پرداخت درست حقوق\r\nاگر ذره‌ای عزت نفس دارید و احترام برای خودتون قائلید سمت این شرکت نرید "
