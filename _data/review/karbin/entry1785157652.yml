description: "سلام\r\nاین شرکت یکی از کلاهبردارترین شرکت های مهاجرتی هست و بعنوان کسی که نزدیک به دوسال منو سر دوندن و به بهانه های واهی وقت میخریدن، من رفته بودم آلمان بهشون پیام میدادم من آلمانم مصاحبه معرفی کنین مستقیم برم ولی چون کلاهبردارن اصلا موردی نداشتن، تنها راه گرفتن پولتون هم کاری هست مه من و دوستانم کردیم اگر دفترشون تو زعفرانیه با اگر رفته جای دیگه هست برید با داد و بیداد و شده شکوندن چهارتا وسیله پولتون رو پس بگیرید"
