description: "سلام دوستان، بنده برای پوزیشن طراح گرافیک برای این شرکت اپلای کردم، بعد از دو مرحله مصاحبه، و انجام یک پروژه تست (اسمش یه پروژه تسته در صورتی که یک پروژه تمام و کماله) که نزدیک به یک هفته وقتم رو گرفت و حتی بعد ازینکه مدارک اولیه برای استخدام رو هم فرستادم، بنده رو رد کردن، اونم به دلیل اینکه فکر میکردن شاید همکاری بلند مدت نتونیم داشته باشیم، به نظر میاد دنبال پیش برد پروژه های شرکت از طریق گرفتن ایده و پروژه های تست از کارجو ها هستن، وگرنه چه دلیلی داره بعد از این همه مراحل رد کنن کارجو رو؟؟\r\nاین رو هم خدمتتون بگم ظواهر شرکت اینجوریه که خیلی محترمانه برخورد میکنن، اما هر دو ماه یکبار آگهی جذب گرافیست میذارن، و کل کارکنان بعد از جنگ گویا تعدیل شدن و از اون موقع دنبال گرافیست هستن، توی مراحل مصاحبه فهمیدم کلا تمامی پوزیشن های مرتبط با تبلیغات شرکت خالیه، و یجورایی بار تمامی این موقعیت ها روی دوش شماست. \r\nجدای ازون توی مرحله آخر مصاحبه که بعد از انجام پروژه تست دعوت شده بودم، انواع اقسام سوال های بیربط و متلک های زشت رو شنیدم، متاسفانه به دلیل اینکه به شدت نیازمند کار بودم کنار اومدم و توی مصاحبه متانت خودم رو حفظ کردم، اما باید به حسم اعتماد میکردم و همونجا قید این شرکت رو میزدم! \r\nوضعیت مملکت و فشار فقر این شرکت هارو اینجوری کرده که اینطوری نخواهد موند...\r\nدر مجموع اگر فرد با تجربه ای هستید توی این حوزه، به شما پیشنهاد نمیکنم که حتی رزومه بفرستید :) \r\nارادتمند"
