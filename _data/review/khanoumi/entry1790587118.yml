description: "خانومی برای من اولش یه شرکت خیلی جذاب بود و با کلی ذوق و شوق از محیط کاری قبلیم جدا شدم و به این مجموعه اومدم. یکی از مهم‌ترین سوال‌هایی که قبل از استخدام پرسیدم این بود که اگر شرایط بحرانی مثل جنگ پیش بیاد، تکلیف نیروها چی میشه؟ جواب مشخصی که گرفتم این بود که «ما تحت هر شرایطی نیروهامون رو نگه می‌داریم» و حتی گفتن که توی جنگ دوازده‌روزه هم تعدیلی نداشتیم.\r\n\r\nاما چیزی که بعداً تجربه کردم، با چیزی که قبل از ورود به شرکت گفته شده بود، تفاوت زیادی داشت. شرایط حقوقی و توافقات من در زمان استخدام کامل مشخص شده بود، ولی حدود یک هفته قبل از شروع کار، با رفتن منابع انسانی قبلی، بخش زیادی از توافقاتی که انجام شده بود تغییر کرد و عملاً چیزی که روی آن حساب کرده بودم، دیگر وجود نداشت.\r\n\r\nدر جنگ اخیر هم شرکت خیلی سریع وارد فاز تعدیل شد و تعداد زیادی از نیروها کنار گذاشته شدند؛ بدون اینکه حتی فرصت داده شود شرایط بحرانی کمی مشخص‌تر شود. این اتفاق در حالی افتاد که طبق چیزی که من در مجموعه دیدم، فروش شرکت افت نکرده بود و حتی روند رشد هم داشت. دلیل اصلی که برای این تصمیم مطرح شد، هزینه‌های مربوط به بیمه کارکنان بود.\r\n\r\nچیزی که برای من جالب بود این بود که وقتی شرایط سخت شد، خیلی سریع ساده‌ترین راه یعنی حذف نیروها انتخاب شد. این تصمیم فقط شامل نیروهای جدید نبود و حتی بعضی از آدم‌هایی که مدت زیادی توی شرکت بودند و تجربه زیادی داشتند هم تعدیل شدند.\r\n\r\nبه نظرم اگر قصد دارید به خانومی اضافه بشید، فقط ظاهر جذاب شرکت، اسم برند و فضای اولیه رو نبینید. چیزی که مهمه اینه که بدونید شرکت توی شرایط سخت چطور با نیروهاش رفتار می‌کنه. تجربه‌ای که من داشتم این بود که وقتی شرایط تغییر کرد، خیلی راحت تصمیم گرفته شد که با بعضی از نیروها خداحافظی بشه و بعداً دوباره برای جذب نیروی جدید اقدام بشه.\r\n\r\nدر مورد مزایا و هدیه‌های سازمانی هم، حداقل در مدتی که من اونجا بودم، برای مناسبت‌هایی مثل شب یلدا و عید هیچ هدیه یا برنامه خاصی از سمت شرکت وجود نداشت."
