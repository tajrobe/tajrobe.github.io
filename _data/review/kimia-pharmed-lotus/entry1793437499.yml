description: "این شرکت در سال 1402 با مدیریت عامل قوی وارد مرحله ساخت کارخانه تولید دارو های دامی شد .در ابتدا با وجود مدیر عامل قوی این شرکت به سرعت به مراحل پایانی ساخت خط تولید رسید ولی در ادامه با توجه به اینکه نماینده هیئت مدیره بازنشسته دولتی بود و در کار خود بسیار ضعیف بود با مدیر عامل وقت به توافق نرسیده و مدیر عامل رو تغییر دادن با ورود مدیر عامل جدید که بازنشسته ارگان نظامی بود ، به کلی روند ادامه کار شرکت تغییر کرد و محیط کاری که هر روز یک تجربه گرانقدر بود تبدیل به یک محیط بسیار سمی برای تمامی اعضای شرکت شد و ادامه کار رو برای تمام اعضا سخت کرد حتی نیرو های جدید که با معرفی خود این مدیر عامل به مجموعه اضافه شده بودند هم به مشکلات زیادی برخوردن و هر کدام با ناراحتی از شرکت رفتند .مدیر عامل جدید به شدت بی سواد در کار و به شدت پر حاشیه بدون ثبات .اخلاقی رفتاری ، فاقد شخصیت حرفه ای و به شدت روانپریش هست تمامی اعضا بسیار سعی کردن که با این مدیر عامل کار کنن و بتوانند آینده شغلی خود رو حفظ کنن اما به هیچوجه ممکن ادامه کار با وجود این مدیر عامل در این شرکت ممکن نیست. تا زمانی که این مدیر عامل هست خدا بداد کسی برسه وارد اون شرکت میشه برای کار ."
