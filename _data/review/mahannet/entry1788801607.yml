description: "یکبار با من تماس گرفته شد برای مصاحبه آنلاین با مدیر مجموعه.\r\nلینک جلسه آنلاین و اطلاعات ارسال شد و راس ساعت آنلاین شدم. ۲۰ دقیقه منتظر شدم کسی وارد جلسه نشد. به شماره‌ای که در ارتباط بودم پیغام دادم که من ۲۰ دقیقه منتظر بودم. عذرخواهی کردند که مشکلی پیش اومده بود و گفتند پیگیری می‌کنند لطفا چند دقیقه صبر کنید گفتم باشه عیب نداره.\r\nباز هم گذشت و کسی آنلاین نشد تا ۴۵ دقیقه دیگه مدیر مجموعه بدون عذرخواهی پیغام داد که تشریف دارید؟\r\nمنم جواب دادم که من راس ساعت بودم شما تشریف نداشتید. گفت عیب نداره الان بیا تو جلسه گفتم دیگه امکانش رو ندارم از تاخیر و نوع برخوردتون خیلی موارد گویاست. گفت مگه جلسه ساعت چند بود؟ گفتم ساعت ۴ گفت خوب چیزی نشده که گفتم خداحافظ شما."
