description: "شرکت از نظر امکانات و زیرساخت‌ها شرایط خوبی دارد، اما به نظر من یکی از مشکلات اصلی آن، نبود چابکی سازمانی و تعدد بیش از حد لایه‌های مدیریتی است. تعداد مدیران میانی بسیار زیاد است و در بسیاری از موارد، به دلیل ساختار و بودجه دولتی، حساسیت کافی نسبت به نتیجه تصمیم‌ها، اشتباهات مدیریتی و بهره‌وری وجود ندارد.\r\n\r\nرابطه‌محوری نیز در مجموعه بسیار پررنگ است. اگر فردی ارتباط خوبی با یکی از مدیران داشته باشد، حتی پس از ترک شرکت نیز ممکن است به‌راحتی به مجموعه بازگردد و در مواردی حتی اگر جایگاه مشخصی برای او وجود نداشته باشد، موقعیت جدیدی برایش ایجاد شود.\r\n\r\nدر لایه‌های مدیریتی، شایسته‌سالاری به اندازه کافی دیده نمی‌شود و عواملی مانند روابط شخصی و میزان همسویی با ساختار سازمانی در انتخاب و حفظ مدیران نقش قابل‌توجهی دارند. حتی در مواردی که یک مدیر در ارزیابی‌ها و نظرسنجی‌های داخلی عملکرد ضعیفی دارد، اگر از حمایت لازم برخوردار باشد، احتمال تغییر یا جایگزینی او بسیار پایین است."
