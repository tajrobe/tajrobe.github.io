description: "من برای مصاحبه بخش پشتیبانی امور مشتریان وارد کارخونه شدم. از لحظه ورود جو به شدت متشنج بود، از زمان پر کردن فرم تا اتمام مصاحبه و خروج من حدودا دو ساعت و نیم زمان برد که فقط منتظر بودم تو اون تایم که کارای مصاحبه‌گر اول تموم بشه و من وارد بشم و مصاحبه‌گر دوم از ناهار برگرده و آنتن داخل مجموعه هم قطع بود. نیروهای بخش آزمایشگاه و تولید و بسته بندی و سردخونه با همون لباسایی که باید به نظافتش دقت بشه دائم تو بخش اداری رفت و آمد میکردن و با دستکش به همه جا دست میزدن. تمام سوالا به این منظور پرسیده میشد که به اسم رازداری بتونن بفهمن شما چقدر میتونید مشکلات و شکایات رو پیش خودتون نگهدارید و کاملا این حس رو میداد که اتفاقات بدی در جریانه. موقع خروج از من که به عنوان مصاحبه شونده وارد شده بودم بازرسی بدنی صورت گرفت. البته که لازم میدونم اشاره کنم تجربه من مربوط به دو سه ساعت حضوره و ممکنه با واقعیت متفاوت باشه"
