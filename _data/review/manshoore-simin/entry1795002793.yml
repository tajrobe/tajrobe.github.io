description: "مدیر عامل و پسر روان پریشش که ادعای بیل گیتس بودن دارید؛ به نظرم هر کس این پیامها رو بخونه متوجه میشه که تمام اونا نتیجه خصومت و کدورت شخصی یک نفره نیست.\r\nهر کسی اونجا بوده هم از نظر اعصاب و روان، پدرش رو در اوردید(چون خودتون واقعا مشکل روانی دارید) و هم عمرش، چه مالی و چه یادگیری رو به هدر دادید.\r\nکسی که از اون تیمارستان بیاد بیرون جایش نمی سوزه فقط غصه اینو داره چرا زودتر از اون دیونه خونه بیرون نیومده.\r\nتو چرا یکی نظرشو میده اونجات میسوزه و سوزش انقدر زیاده که دهنت رو باز می کنی و مثل همیشه به دروغ نجس می کنی.\r\nتو دلت به حال کسی نمی سوزه که بیاریش اونجا بهش نون بدی، تو ادم می اری پوستشون رو می کنی که نون خودت رو در بیاری و مدام تو سر اون ادما می زنی که نون بهتون می دم.\r\nبخدا اگه سر سوزن بخوای به کسی مفت نون بدی.\r\nکسی نمی دونه چه مرگی در انتظارت هست و چه جوری می خوای بمیری ولی مطمئن باش که دیگه سر خدا رو اون دنیا نمی تونی کلاه بذاری.\r\nبخداوندی خدا قسم از زمانی که از اون لانه ارواح بیرون اومدم هم پیشرفت مادی ، هم پیشرفت دانش زیادی داشتم و هم از فشار عصبی و روانی که تو برامون می ساختی آزاد شدم.\r\nبعد مثل همیشه نشستی رو صندلی به یه عده نیروی دور و بر خودت که خیلی هاشون فقط گوش می دن و حرفات رو یه دو زاری قبول ندارن می گی هر کی رفته از اینجا داره میسوزه و ما بهترین شرکت هستیم  و هیچکی هیچی نداره و ما فقط پول داریم و حقوق می دیدم و غیره😂😂😂 .\r\nتو که تمام عمرت رو با این چرندیات گذروندی فقط آدم ها و جونای بیشتری رو نابود نکن خواهش می کنم ازت.\r\nدیگه هر چقدر خواستی از ادم های آسیب دیده اقتصادی جامعه تا می تونستی دوشیدی دیگه بسته  بالاخره آهشون می گیردتت.\r\nهم تو و هم اون پسر عقب مونده روان پریشت که بویی از انسانیت هیچکدومتون نبردید.\r\nبترسید از اه این جونای بی گناه."
