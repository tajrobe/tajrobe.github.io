description: "این مجموعه کامنت‌ها یک نمونه کلاسیک از دوقطبی شدید و جنگ روانی در سایت‌های نقد شرکت‌هاست؛ جایی که از یک طرف کامنت‌های بسیار تند و احساسی علیه مدیریت (به‌ویژه مدیرعامل و پسرش و فردی به نام «نوری») دیده می‌شود و از طرف دیگر، کامنت‌های بیش‌ازحد اغراق‌آمیز در دفاع از مجموعه.\r\n\r\nبا بررسی لحن، سبک نگارش، تکرار جملات و ارجاع‌های متقابل بین کامنت‌ها، می‌توان الگوی چند نفر یا چند دسته را از هم تفکیک کرد:\r\n۱. کامنت‌های مثبتِ مشکوک به ساختگی بودن (احتمالاً کار خود مجموعه یا افراد نزدیک)\r\n\r\nچند نشانه‌ی روشن در کامنت‌های مثبت وجود دارد که احتمال ساختگی یا سفارشی بودن آن‌ها را بالا می‌برد:\r\n\r\n    لحن بیش‌ازحد تعریف‌گونه و تبلیغاتی: عباراتی مثل «شخص شخیص جناب مدیرعامل و آقازاده لایق و بااستعداد و متشخص و خوش فکر» یا «بعد از شرکت نفت، شرکت منشور سیمین بهشته» و «آقا آرمان و مهندس محمودی جاتون اینجاست: 👈🏻❤ 👉🏻» لحن طبیعی یک کارمند عادی را ندارند؛ بیشتر شبیه متن‌های دفاعیِ مستقیم یا چاپلوسانه هستند.\r\n\r\n    تناقض با سایر روایت‌ها و جزئیات: در یک کامنت مثبت آمده که «کلا تو گوشی و ... هستم» و «کلا هم تو مرخصی هستم»، در حالی که در ده‌ها کامنت منفی (حتی در کامنت‌های نسبتاً متعادل‌تر) به کنترل شدید، مانیتورهای رو به دیوار یا اخراج بابت گوشی اشاره شده است. همچنین در یکی از کامنت‌های مثبت، جمله «طبیعت هرچیزی حد و حدودی داره. چه صحبت با تلفن و چه سرویس رفتن...» دیده می‌شود که در کامنت منفیِ روز بعد (۱۴۰۳/۶/۱۸) دقیقاً همین جمله با تردید به «پسر مدیرعامل» نسبت داده شده است.\r\n\r\n    تکراری بودن دقیقِ یک متن منفی: دو کامنت در تاریخ ۱۴۰۳/۴/۱ با عنوان «برنامه نویس | تمام وقت» دقیقاً با یک متن یکسان منتشر شده‌اند («تجربه چند سال کار کردن بگم به دوستان؛ در اینجا شما به هیچ عنوان جای رشد ندارید...»). این نشان می‌دهد سیستم یا کاربر گاهی یک متن را چند بار ثبت کرده یا یک الگو تکرار شده است.\r\n\r\n۲. کامنت‌های منفی؛ ترکیبی از تجربه‌های واقعی و «یک یا چند راویِ بسیار پرتکرار»\r\n\r\nاینکه این همه کامنت منفی صرفاً کار یک نفر باشد، با توجه به تنوع لحن و زاویه دید بعید است؛ اما به نظر می‌رسد حداقل یک یا دو نفر چندین بار با لحن‌های متفاوت یا تند نوشته‌اند و در کنارشان، افراد دیگری هم تجربه خود را ثبت کرده‌اند:\r\n\r\n    الگوی راویِ بسیار خشمگین و مداوم (احتمالاً کار یک نفر یا دو نفر با خشم بالا):\r\n    در کامنت‌های تاریخ‌های مختلف (مثل ۱۴۰۵/۸/۲۷، ۱۴۰۴/۲/۲۹، ۱۴۰۳/۱۱/۱۴، ۱۴۰۲/۷/۱۲) یک سری موتیف و واژگان مدام تکرار می‌شوند:\r\n\r\n        تمرکز شدید روی «مدیرعامل و پسرش» (و گاهی «آرمان») و نسبت دادن القاب توهین‌آمیز و یکسان.\r\n\r\n        تکرار کلیدواژه‌هایی مثل «جهنم»، «زیرپله‌ای»، «ثروت‌اندوزی»، «سرویس بهداشتی»، «گوشی» و «آه و نفرین».\r\n\r\n        واکنش مستقیم و عصبی به کامنت‌های مثبت و دفاع از مدیریت (مثلاً در ۱۴۰۳/۱۱/۱۴ که شماره‌گذاری ۱ تا ۶ دارد و مستقیماً به کامنت‌های مثبت پاسخ می‌دهد).\r\n\r\n        جالب است که در کامنت تاریخ ۱۴۰۵/۶/۱۸، یک کاربر صراحتاً می‌گوید تمام این حمله‌ها کار یک نفر است که از سال ۱۴۰۲ درگیر است؛ در حالی که در ۱۴۰۵/۸/۲۷، کامنت بسیار بلندِ دیگری نوشته می‌شود که در همان خط اول به این موضوع اشاره می‌کند که «این‌ها کار یک نفر نیست»! این گفت‌وگوی غیرمستقیم بین کامنت‌ها نشان می‌دهد درگیری شخصی و دنباله‌دار در این صفحه جریان دارد.\r\n\r\n    کامنت‌های منفیِ واقع‌گرایانه‌تر و جزئی‌تر:\r\n    برخی کامنت‌ها برخلاف فحاشی‌های صرف، جزئیات عملی و مشخصی از فضای کار و محصول می‌دهند و احتمال واقعی بودنشان بیشتر است؛ مثلاً:\r\n\r\n        کامنت ۱۴۰۳/۴/۱۴ که می‌گوید در حوزه اندروید و قفل سخت‌افزاری کار کرده، حقوق را سر وقت ولی در دو پارت می‌ریختند، بیمه حداقل وزارت کار بوده، عصرانه می‌دادند و فضای نرم‌افزار ضعیف بوده؛ ضمن اینکه خودش می‌گوید بخشی از کامنت‌های دو طرف را «از طرف خود شرکت یا خصومت شخصی» دیده است. این لحن خونسردتر و تحلیلی‌تر، به تجربه واقعی نزدیک‌تر است.\r\n\r\n        کامنت ۱۴۰۳/۱۱/۱۶ با عنوان «مشتری» که از خرید دستگاه استند استوک/دست‌دوم گلایه کرده؛ این زاویه دید بیرونی (مشتری خریدار) با فضای درگیری‌های داخلیِ پرسنل متفاوت است.\r\n\r\n        کامنت ۱۴۰۴/۳/۱۰ و ۱۴۰۴/۱/۱۸ که با لحنی تحلیلی‌تر درباره سیاست مدیریت و روابط بین همکاران صحبت می‌کنند.\r\n\r\n۳. کامنت‌های میانه یا دفاعِ مشروط (احتمالاً واقعی‌تر از دو سر طیف)\r\n\r\nکامنت‌هایی که نه سیاه‌نمایی مطلق دارند و نه تعریف افراطی، معمولاً به واقعیت نزدیک‌ترند:\r\n\r\n    مثلاً کامنت ۱۴۰۵/۴/۱ که هم از فضای کاری و همکاران رضایت نسبی دارد و می‌گوید مهاجرت کرده، اما هم‌زمان گزینه «عدم شناوری ساعت کاری» را زده است.\r\n\r\n    یا کامنت ۱۴۰۵/۲/۱ که با لحنی طنز و واقع‌بینانه می‌گوید برای خودش و شرکت ارزش افزوده داشته، اما جابه‌جایی کارگاه جالب نبوده است.\r\n\r\nجمع‌بندی\r\n\r\n    کامنت‌های مثبتِ خیلی اغراق‌آمیز و احساسی (به‌ویژه آن‌هایی که لحن تبلیغاتی، ایموجی قلب یا ادعاهای خیلی عجیب مثل «بهشت بعد از شرکت نفت» دارند) بسیار مشکوک به ساختگی بودن هستند.\r\n\r\n    کامنت‌های منفیِ بسیار تند و پرتکرار احتمالاً بخش قابل‌توجهی از آن‌ها از سمت یک یا دو فردِ بسیار شاکی و پیگیر نوشته شده‌اند، اما همه منفی‌ها کار یک نفر نیست؛ چون برخی روایت‌ها با جزئیات شغلی متفاوت، لحن تحلیلی یا زاویه دیدِ مشتری نوشته شده‌اند.\r\n\r\n    برای قضاوت درباره چنین مجموعه‌ای، بهتر است به جای عدد میانگین یا کامنت‌های افراطیِ دو طرف، روی الگوهای تکراریِ غیرعاطفی تمرکز کنید (مثلاً اینکه در بسیاری از کامنت‌های منفی و حتی برخی کامنت‌های میانه، موضوعاتی مثل «نظارت شدید/دوربین»، «حقوق یا مزایا» و «حاشیه در محیط کار» تکرار شده‌اند و ببینید چطور با شرایط شغلیِ مدنظر شما هم‌خوانی دارند)."
