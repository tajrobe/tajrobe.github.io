description: "با سلام و وقت بخیر :)\r\n\r\nمن در سال ۱۴۰۴ روزمه برای این شرکت ارسال کرده بودم و قبل از جنگ یکبار با این شرکت مصاحبه و تایید شده بودم (موردی که خودشون بیان کردند) و بعد از مدت چند ماه هیچگونه خبری و پاسخی اعلام نشد \r\nدوباره در اوایل تابستان با همین پوزیشن کاری روزمه ارسال کردم و بعد از چهار جلسه ارزیابی مجددا بصورت آنلاین و گذشت ۵۰ روز به من گفته شد به منظور روندی کاری شرکت با هزینه خود شرکت میتونید بیاین تهران و اینجا با دیگر کارشناسان تعامل و تایید بشید در نهایت\r\nمن بالغ بر ۴۵۰ کیلومتر (۹۰۰ کیلومتر رفت و برگشت) حرکت داشتم و حدودا ۹.۳۰ صبح به شعبه مرکزی رسیدم و دوباره در ابتدا برگه دادند که فرم اطلاعاتی که من در رزومه از جاب ویژن خیلی خیلی کاملتر از این برگه رو ارسال کرده بودم پر کنید :)\r\nپس از پر کردن فرم مجددا سه بار مورد ارزیابی دیگر دوستان قرار گرفتم و تهش متوجه شدم تقریبا همه افرادی که در مصاحبه های آنلاین با من صحبت داشتند هیچ کاره بودن و فقط زمان من رو هدر دادند\r\n\r\nدر یکی از مصاحبه ها هم یک آقایی که من فامیلی شریفتون رو نمیدونم (فرد اصلی و همه کاره) خیلی سوالات خارج از روندکاری و از همون ابتدا با هدف کوبیدن دانش خودشون به فرد مقابل چطور اینو نمیدونی؟ چرا نمیدونی؟\r\nو کلیت زیر سوال بردن فرد مقابل خودشون \r\n و البته سوالات احمقانه مثلا حوزه سرور بود که خوب اگر کمی آگاهی داشته باشید میدونید حوزه سرور خیلی خیلی وابسته به دفترچه های quicspec خودش هست مگر برای فردی که شبانه روز در این حوزه کار کرده باشه یا به اصطلاح بازاری باشه و منم با صداقت کامل یا به سوالات پاسخ دادم نمی‌دونم یا باید دفترچه رو باید چک کرد .\r\nدر کلیت این روند حقیقتا بخاطر احترام جلسه ای که برگزار شده بود تا آخرین دقیقه منتظر بودم و در پایان هم اعلام شد خوب شما برای ما مناسب نیستید و منم همون لحظه دوباره بلیط گرفتم و ۴۵۰ کیلومتر یا بهتر بگم ۷.۵ ساعت برگشتم \r\nفرداش دوباره دیدم برای همین پوزیشن آگهی قرار دادند ولی ترجیها خانم\r\n\r\nدر کلیت روند استخدامی شرکت فوق کند و البته طولانی هستش و تقریبا کلیه افرادی هم که با شما مصاحبه خواهند کرد جز افراد خاص در این روند هیچ کاره هستند که خوب برای من این فرد بالا بود یا حداقل برداشت من این بود.\r\nاگر هم بخوام پیشنهاد بدم با این روند در یک کلمه هرگز نرین سنگین تر هستید حداقل زمان خودتون رو مثل من به هدر نمی‌دین و مورد تمسخر کورکورانه دیگران قرار نمیدین.\r\n\r\nشاد و پیروز باشید :)"
