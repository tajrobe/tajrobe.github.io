description: "میخوام به اون خانمی که ده ماه پیش اومد مدیر منابع انسانی شد جواب بدم.\r\nشما پارسال اومدین کارشناس بودین چطور یهو مدیر شدین؟ اما برای سایر بخش ها از این کارا نمیکنین؟ باتوجه به اینکه بارها بهتون گفتیم.\r\n\r\nشما یه فرقی با ما دارین، شما خوش رقصی و نازبازی بلدی، منه کارگر از اینا بلد نیستم.\r\nشما بادیگارد شرکتی، اول اومدی اضافه کارها رو کم کردی، بعد حذف کردی، بعد اومدی پیش ما نقش حامی رو بازی کردی.\r\nفکر کردی ما نمیدونیم چه مارمولکی هستی، اگر به روت نمیاریم دستمون بستس.\r\n\r\nخدا با آسانسور زد تو سرت که آدم بشی و نقش بازی نکنی، اما بجای اینکه دست از حق رو ناحق کردن برداری اومدی اینجا نوشتی ما خیلی ناسپاسیم.\r\n\r\nاره حق داری، با نازبازی دو روزه مدیر شدی باید هم بادیگارد خوبی باشی.\r\n#بادیگارد\r\n\r\nبهت تبریک میگم بازیگر\r\nبیا ۵ تا ستاره بهت میدم چون خیلی به ستاره احتیاج دارین."
