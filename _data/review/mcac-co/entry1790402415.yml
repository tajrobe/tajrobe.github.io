description: "به‌عنوان یکی از اعضای مجموعه مبنا کارت که از نزدیک در جریان بخشی از فضای کاری و اتفاقات مجموعه هستم، لازم دیدم در پاسخ به دیدگاه یکی از عزیزان که به عنوان مهندس در مورد مدیر منابع انسانی که بیشتر رنگ و بوی قضاوت شخصی و خصومت فردی هست نه تجربه کاری، چند نکته رو مطرح کنم؛ \r\nاولا، بدون اینکه قصد نادیده گرفتن تجربه شخصی شما رو داشته باشم، فکر می‌کنم برای قضاوت درباره یک مدیر یا یک مجموعه، بهتره موضوع رو فقط از زاویه یک تجربه شخصی نبینیم؛ چون واقعیت محیط کار معمولاً ابعاد و جزئیات بیشتری داره که شاید برای همه افراد قابل مشاهده نباشه؛\r\nدوما، نقد یک مدیر کاملاً طبیعی و حتی لازمه، اما وقتی نقد از بیان عملکرد و اتفاقات مشخص فاصله می‌گیره و به کنایه، تخریب شخصیت و نسبت دادن صفات شخصی می‌رسه، دیگه نمی‌شه صرفاً اسمش رو «تجربه کاری» گذاشت؛\r\nمن به‌عنوان کسی که همچنان در این مجموعه حضور دارم، طبیعتاً ممکنه با همه تصمیمات و عملکردها موافق نباشم؛ اما چیزی که از نزدیک می‌بینم با تصویری که در این کامنت ترسیم شده، تفاوت قابل توجهی داره. بنابراین به نظرم بهتره بین «نقد یک تجربه کاری» و «بیان دلخوری یا اختلاف شخصی در قالب نقد» تفاوت قائل بشیم؛\r\nاینکه اگر قرار باشه درباره مسیر شغلی یک نفر صحبت کنیم، بهتره اطلاعات دقیق باشه. اینکه «ده ماه پیش به عنوان کارشناس اومده و یک‌دفعه مدیر شده» با واقعیت مسیر ورود ایشون به مجموعه همخوانی نداره. ایشون از ابتدا با عنوان سرپرست وارد مجموعه شدن و بعد از طی مسیر مدیریتی، به جایگاه فعلی رسیدن؛\r\nو اینکه واقعاً نمی‌فهمم چرا بعضی‌ها تصور می‌کنن پیشرفت شغلی حتماً باید بر اساس تعداد سال‌های حضور در یک سازمان باشه؟ مگر قرار است همه افراد صرفاً به خاطر سابقه زمانی ارتقا پیدا کنند؟ دانش، تجربه، توانایی مدیریت، مسئولیت‌پذیری، عملکرد و نتیجه‌ای که یک فرد ایجاد می‌کنه هم بخشی از معیارهای رشد شغلیه؛ اما عبارت‌هایی مثل «چاپلوسی»، «نزدیکی به مدیرعامل» یا «شعار دادن» دیگه نقد عملکرد نیستند، بلکه نسبت دادن انگیزه به یک فرد هستند و برای چنین ادعایی باید واقعیت و مصداق وجود داشته باشه.\r\nدر پایان لازمه اینو همیشه مد نظر داشته باشید شما آزاد هستید نقد کنید، حتی جدی و صریح؛ ولی دقیق، مستند و منصفانه؛ نارضایتی از یک مجموعه محترمه، اما تبدیل کردن نارضایتی شخصی به تخریب یک آدم، اسمش نقد حرفه‌ای نیست..."
