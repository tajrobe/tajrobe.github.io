description: "به نظر بنده تمام این مسایل برمی گردد به شخص مدیر عامل حالا چرا؟ چون ایشان دور خودشان را با افراد چاپلوس پر کرده اند منظور بنده اشخاصی است که تنها با چاپلوسی و کمر خم کردن توانسته اند در معاونت های گوناگون شرکت خودشان را حفظ کنند.\r\n\r\nنفر اول معاون محترم منابع انسانی هستند که استراتژی ایشان ترویج ریاکاری است، غافل از یک بار که ایشان تبلیغ گفتن حقیقت را کرده باشند. مدام حرف شان این که هر چیزی به شما گفتند بگویید چشم و انجام دهید. پس اراده انسانی چه می شود؟ شاید حتی برای یکبار مافوق من اشتباه کرد آیا نباید حرف درست را بزنم؟ آیا فقط باید غلام بله قربان گوی مافوق باشم؟\r\n\r\nنفر دوم که به قاتل کارکنان مبنا کارت مشهور است و تاکنون ضرر زیادی را به شرکت زده است و کار منابع انسانی را دو برابر کرده است هیچ کس نیست جز معاون محترم بخش نرم افزار که افراد زیادی را بدون ذکر علت مستقیم و غیرمستقیم از کار برکنار کردند. یک روانپریش است که دائما در حال تسویه حساب شخصی است صرف نظر از اینکه در حال ضرر رساندن به مجموعه است.\r\n بدون اینکه این را در نظر بگیرند که این انسانی که در حال حذف او هستم دارای خانواده است، نان آور خانواده است با قساوت و بی رحمی تمام افراد را حذف می کند. شاید اگر آن کارکنانی که اخراج شدند قبل از جنگ به شرکت دیگری می رفتند مجبور نبودند بعد از جنگ که شرایط استخدام ها سخت شد برای مدتی بیکار شوند. این از برکات شرکت مبنا کارت آریا است. مبنا کارت فرصت بقا را برای آنان سخت کرد.\r\n\r\nنفر سوم که جز بی شعورترین افراد مبنا کارت است، کسی نیست جز معاون محترم زیرساخت شرکت. ایشان خیلی راحت و بدون ترس از کسی حتی مدیرعامل به آلت تناسلی شان اشاره می کنند و باعث عصبانیت دیگران می شوند. این نشان می دهد آن شرکت چقدر بی صاحب، بی اتیکت و رها شده توسط مدیر عاملش است که معاونین اینگونه دارند با سرمایه و آبرویش بازی می کنند.\r\n\r\nمدیرعامل حتی از افراد استخدامی شرکت خبر ندارد. نمی داند که مثلا اسکرام مستر چه نقشی در سازمان دارد. او نمی داند که اسکرام مستر باید زیر نظر مستقیم خودش باشد که گزارش های معاونانش را با گزارش های او مقایسه کند و بداند در سازمانش چه خبر است. اما اما در را به روی تمام افراد جز چاپلوسان بسته است. چاپلوسانی که تاکنون سر چندین و چند اسکرام مستر را زیر آب کرده اند بدون اینکه کسی بپرسد علت چه بود؟\r\n\r\nاکنون با این اوصاف به من اجازه می دهید که انگشت اتهام را به سمت مدیر عامل بگیرم و ادعا کنم که شرکت را به تنی چند چاپلوس سپرده اند که به جای تلاش و سازندگی تنها کمر خم کردن را در دستور کار قرار داده اند. در واقع رگ خواب مدیرعامل را می دانند.\r\n\r\nآیا نباید مدیر عامل محترم علت را جویا شود؟ مطمئنا اگر می خواستند بدانند تاکنون فهمیده بودند که چه جانی های را در شرکت خود راه داده اند که می دانند چگونه دل مدیرعامل شان را به دست آورند."
