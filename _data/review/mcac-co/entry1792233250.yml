description: "تجربه همکاری من با شرکت مبناکارت اریا؛ تفاوت ظاهر حرفه‌ای با مدیریت واقعی\r\nمن به‌عنوان پیمانکار، به مدت دو سال همکاری مستمر با این شرکت داشتم. \r\nواقعیت این است که هیچ شرکتی صرفاً با ساختمان شیک، عنوان‌های مدیریتی و ظواهر حرفه‌ای رشد نمی‌کند. اعتبار واقعی یک سازمان را کیفیت تصمیم‌گیری، عدالت در رفتار با کارکنان، حفظ نیروهای متخصص و شایسته‌سالاری می‌سازد.\r\nتجربه دو سال همکاری من به این نتیجه رسیده است که مدیر منابع انسانی، اگر به‌جای شناسایی و حفظ استعدادها، زمینه خروج نیروهای ارزشمند را فراهم کند، نه‌تنها به رشد سازمان کمک نمی‌کند، بلکه ممکن است ناخواسته بهترین فرصت‌ها را در اختیار رقبای آن قرار دهد.\r\nدر نهایت، امیدوارم مدیرعامل محترم با نگاهی مستقل و بررسی عملکرد واقعی مدیران، میان گزارش‌هایی که می‌شنود و واقعیت‌هایی که در بدنه سازمان جریان دارد، تفاوت قائل شود؛ زیرا گاهی افرادی که بیش از همه از وفاداری و همراهی سخن می‌گویند، لزوماً بیشترین خدمت را به سازمان نمی‌کنند.\r\nدرس بزرگ این تجربه برای من این بود: سازمان‌ها را نیروهای متخصص می‌سازند، اما مدیریت نادرست، نادیده گرفتن شایستگی‌ها و ترجیح روابط بر تخصص می‌تواند همان سرمایه‌های ارزشمند را به سمت رقبای خود سوق دهد.\r\nاین نوشته بازتاب تجربه و برداشت شخصی من از دو دوره همکاری حرفه‌ای است؛ تجربه‌ای که نشان داد برای ارزیابی یک مدیر، نباید تنها به ظاهر و گفتار او توجه کرد، بلکه باید نتیجه عملکرد، کیفیت تصمیم‌ها و تأثیر واقعی او بر آینده سازمان را سنجید."
