description: "با سلام \r\nمتاسفانه منابع انسانی این سازمان نه تنها قلب سازمان به حساب نمیاد برعکس تمام سازمان ها و شرکت ها که رکن اصلی محسوب میشه بلکه معاونت این واحد بسیار بی کفایت هستن و آدم فروشی رو جوری رواج دادن و بابت این حواشی که ایجاد میکنند امتیاز و پاداش میدن که حتی نیروی مستقیم خودشون رو می‌فرستن تو واحد ها که از خودش بدگویی کنه بین پرسنل تا حدی که تصور ایجاد کنه همون نیرو از دستورات معاونت دچار ضعف و ناکامی شده که حرف بشنوه و گاها درد و دل پرسنل رو چهار تا بزاره روش یه حاشیه بزرگ از اون پرسنل واحد دیگه بزاره رو میز معاونت منابع انسانی توسط کارشناس اداری و در نهایت اون همکار رو باعث اخراجش بشوند . همکارانی که چند سال سابقه صداقت و وفاداری دارند و برای شرکت مصرف کننده نبودن بلکه سرمایه بودن اخراج شدن توسط بی کفایت معاونت منابع انسانی . متاسفانه واحد منابع انسانی فقط از دوستان و فامیل جهت استخدام استفاده می‌کنه بدون رزومه و بدون  بررسی کردن  کمیته استخدام با رایزنی فامیل استخدام می‌کنه و افراد پر سابقه قدیمی رو باعث اخراجشون میشود . آقای ر چاه نکن بهر کسی اول خودت دوم کسی .... \r\nدر حال حاضر تمام سازمان از مسئولین دفاتر و خدماتی و کارشناسان و مدیران هیچ کدوم از پرسنل رضایت و دل خوشی از آقای ر معاون منابع انسانی ندارن در اوج روزای جنگ که اضافه کاری و تعطیل کاری پرسنل رو قطع کرد فقط فکر اضافه کردن نرخ حقوقش خودش بود و تنها کسی که به حقوق و مزایاش اضافه شد آقای ر بود  همون روزا که به اسم کاهش هزینه ماشین میلیونی مدیر عامل تبدیل شد به ماشین میلیاردی و در نهایت واحد اداری تو همون ساختمان دو واحد معامله کردن و خریدن و واحد های استیجاره دیگه رو از کف تا سقف کوبیدن و میلیاردی هزینه نوسازی کردن واحد های که حتی مالکیت برای خودشون ندارند. این معنیش چیه کاهش هزینه یا  فقط آسیب روانی و فکری و دقدقه مالی ایجاد کرد برای نیروی های زیر دست که توان و قدرت اعتراض رو ازشون گرفتن و مجبور شون کردن با وضعیت بدی که ایجاد کردن بمانند و ادامه همکاری بدن چون موقعیت خوبی برای جا به جایی هرکسی نیست تو شرایط فعلی کشور و مبنا کارت آریا از این شرایط بر علیه پرسنل سو استفاده می‌کنه هم اکنون . \r\nتو مبنا کارت آریا تمام درخواست ها فوری و فورس هست به هیچ نیرویی قدرت تجزیه تحلیل و فکر کردن و آنالیز برای فراهم کردن بستر اون درخواست نمیدن و در کوتاه ترین زمان بعد از ارسال درخواست با همون همکار برخورد بد میکنند که چرا روند رو زود  اجرا نکردی \r\nعملکرد مدیریت این سازمان خیلی خیلی خیلی ضعیفه . متاسفانه طی چند سال سابقه کاری که تو این شرکت داشتم متوجه شدم که نباید بیشتر از توانم و انرژیم برای کارم تو این سازمان فعالیت میکردم و وقت میزاشتم نباید اینقدر زیاد وجدان کاری میداشتم وصداقت و وفاداری برای این شرکت خرج کردم بدون چشم داشت به حقوق بیشتر و مزایا و حتی بدون لحظه ای که فکر کنم حقمه درخواست تسهیلات از شرکت هیچ وقت نکردم و الان متوجه شدم اشتباه کردم در این سازمان وقت با ارزشم رو که می‌توانستم هر جایی دیگه به رشد و ارتقا و تعالی برسونم اینجا موندم و تلف کردم . این سازمان ارزش فداکاری نداره ارزش داشتن نیرو مفید و اثر گذار ندارد."
