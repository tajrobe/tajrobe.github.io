description: "شرکت مبنا کارت یه شرکت خوب و رو به پیشرفته\r\nمدیرعامل به روز و مدرن،مدیران اکثرا همدل و در شرایط بد اقتصادی تمام تلاششو میکنه تا شرایط معیشت همکاران خوب باشه.\r\nنقاط ضعفی هم مثل هر شرکتی داره ولی تو شرایط سخت همیشه حامی بوده.\r\nمن هم با نظرات رو خوندم و موافقم که معاون سرمایه انسانی آقای (ر) بزرگترین نقطه ضعف شرکت بود.\r\nایشون توهم استاد تمام دانشگاه آکسفورد داره و فکر میکنه باید معلم باشه،مدرک دورهDBA آزاد داره و به همه اینطور جا انداخته که من رو دکتر صدا کنید، بین مدیرانو و پرسنلشون شرکت ایجادتفرقه کرده و نزد مدیرعامل خودش رو فقط بهترین جلوه میده.\r\nایشون مستقیما عامل رفتن چند مدیر و مشاور و کارشناس خوب از شرکت به شکل بدی بودند.\r\nهمه اینها رو هم دانسته انجام میده و اصلا نتایج منفیش برای شرکت مهم نیست.\r\nدوست هم داره هم واحدها زیر مجموعه خودش باشن از نگهبان تا مسول دفتر تا خدمات تا تدارکات و...\r\nمتاسفانه ضعف بزرگ مدیریت عامل میدان دادن به این فرد بی دانش هست که آینده شرکت رو فدای عافیت طلبی خودش کرده.."
