description: "به نظر من که سال های زیادی است در این شرکت حضور دارم، این شرکت در همه زمینه ها از جمله نوع کسب و کار، اعتبار و برند، هیات مدیره، ترکیب مدیران، فضای همدلی بین کارکنان و سطح پرداخت حقوق و مزایا در سطح خوب قرار داره. امنیت شغلی خیلی بالاست چون در شرایط کرونا، تحریم های گسترده، جنگ و ... عیار خودش رو پس داده و محکم و استوار داره کارش رو پیش می بره. \r\nضعف ها و قوت ها، خطاها و اشتباهات در همه شرکت ها وجود دارن و شناختی که از مدیرعامل و تیم تصمیم ساز دارم، هیچ موضوعی بدون ترتیب اثر نمی مونه. \r\n افرادی که در این شرکت حضور دارن به همین راحتی از شرکت خارج نمیشن. از افراد بالای ده سال گرفته تا تازه وارد و این پیام روشنی داره.\r\nبه نظرم تصمیمات در سازمان در همه موضوعات کاری و انسانی از عقلانیت بالایی برخورداره و تصمیمات آنی خیلی به ندرت گرفته میشه. اغلب با فکر، منطق و با حوصله س.\r\n"
