description: "شرکت درست و حسابی و شناخته شده در فینتک، به شخصه سالهاست اینجا کار میکنم. افراد زیادی با حاشیه های مختلف اومدند و رفتند. نظر شخصی من اینه قبل از اینکه دیگران را مقصر بدونیم و اینجا تخریبشون کنیم نیم نگاهی هم به رفتار و عملکرد خودمان داشته باشیم شاید ما کاری کردیم که باعث بی ثباتی و جو منفی در مبنا کارت شده، قاعدتا هر جایی ضعف و قوت خود رو داره اینکه همیشه دیگران را عامل ناکامی خود بدونیم باعث پیشرفت ما نمیشه، هنوزم هستند کسانی که از شرکت رفته اند و آرزوی برگشتن به شرکت را دارند اما شرکت اجازه برگشت بهشون نمیده و اینجا دست به فحاشی و شخصی سازی مسئله میکنند.\r\nشرکت سلسله مراتب سازمانی خودش را دارد و مدیرعامل افراد قابل اعتماد را در معاونت های مختلف قرارداده است چرا ما باید فکر کنیم از مدیرعامل عاقل تریم و دنبال حاشیه سازی برای معاونین باشیم؟ حواشی مشابه الان را قبلا هم دیده ایم و حاشیه سازی افراد کنار گذاشته شده مسئله جدیدی نبوده و نخواهد بود. مهم توجه به این نکته است که ما دنبال چه هستیم شاید بد نباشد دفعه ی بعد خواستیم کسی را تخریب کنیم قبلش کمی به کاری که در حال انجام آن هستیم فکر کنیم."
