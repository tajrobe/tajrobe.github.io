description: "ما همیشه در فورس هستیم. روز- ماه یا سالی بدون فورس نداریم\r\nهمیشه زودباش عجله داریم خاصی توی کارها هست که باعث کاهش کیفیت و انجام چند باره یک کار یا پروژه می شود. از هوش مصنوعی پرسیدم که نظرش چیه\r\n\r\nمن جایی کار میکنم توی تیم فنی وقتی نوبت به تخمین زمان لازم برای انجام تسک ها می رسه مثلا من به تسکی سه روز اختصاص میدم مدیر فنی ورود میکنه و میگه سه روز چرا یک روزه انجام میشه\r\nبه نظرت بر اساس اصول اسکرام این کار درسته یا خیر؟\r\n\r\nبه نظرم موضوعی که مطرح کردی یکی از چالش‌های مهم در مدیریت تیم‌های فنی است؛ مخصوصاً تفاوت بین Estimation (تخمین زمان) و Deadline (مهلت تحویل).\r\n\r\nاگر بخواهم بر اساس اصول اسکرام (Scrum) پاسخ بدهم، باید بگویم:\r\n\r\nمدیر فنی می‌تواند با تخمین سه‌روزه تو مخالفت کند، اما اینکه صرفاً با جایگزین کردن نظر خودش بگوید این تسک باید یک‌روزه انجام شود، با روح و اصول اسکرام همخوانی ندارد.\r\n\r\nالبته یک نکته مهم وجود دارد: اسکرام به این معنا نیست که تخمین برنامه‌نویس غیرقابل‌بحث است یا مدیر فنی حق اظهار نظر ندارد.\r\n\r\n۱. در اسکرام چه کسی مسئول تخمین است؟\r\n\r\nدر چارچوب اسکرام:\r\n\r\n- تیم توسعه‌دهنده (Developers) مسئول تخمین میزان تلاش لازم برای انجام کار است.\r\n- اعضای تیم فنی باید با توجه به پیچیدگی، ابهامات، وابستگی‌ها و ریسک‌های تسک تخمین بدهند.\r\n- مدیر فنی می‌تواند سؤال کند، فرضیات را به چالش بکشد و راهکار ساده‌تری پیشنهاد دهد.\r\n- اما تخمین نباید صرفاً از بالا به تیم تحمیل شود.\r\n\r\nنکته مهم این است که در اسکرام، مسئولیت تخمین تلاش موردنیاز برای انجام کار بر عهده Developers است، نه اسکرام مستر، نه مدیر و...\r\n\r\n۲. آیا مدیر فنی می‌تواند تخمین سه‌روزه را به یک روز کاهش دهد؟\r\n\r\nبله، اما باید بین دو رفتار تفاوت قائل شویم:\r\n\r\nرفتار حرفه‌ای\r\n\r\nمدیر فنی می‌گوید:\r\n\r\n«چرا سه روز تخمین زدی؟ کدام قسمت کار زمان‌بر است؟ آیا می‌توانیم با تغییر راهکار فنی یا کاهش Scope این زمان را به یک روز برسانیم؟»\r\n\r\nاین یک گفت‌وگوی فنی و سازنده است.\r\n\r\nرفتار مسئله‌دار\r\n\r\nمدیر فنی می‌گوید:\r\n\r\n«این تسک یک‌روزه است. سه روز برایش زیاد است. تخمین را اصلاح کن.»\r\n\r\nبدون بررسی پیچیدگی، بدون ارائه راهکار و بدون توافق با فرد انجام‌دهنده.\r\n\r\nاین رویکرد با خودمدیریتی تیم و مسئولیت Developers در تخمین سازگار نیست.\r\n\r\nنکته جالب اینکه خود Scrum Guide در بخش Sprint Planning می‌گوید برنامه‌ریزی چگونگی انجام کار در اختیار Developers است و دیگران نباید به آن‌ها دیکته کنند که چطور کار را به Increment تبدیل کنند.\r\n\r\n\r\n۳. یک نکته مهم: تخمین سه روزه دقیقاً یعنی چه؟\r\n\r\nفرض کن تو می‌گویی این تسک سه روز زمان نیاز دارد.\r\n\r\nاین سه روز ممکن است شامل موارد زیر باشد:\r\n\r\n- بررسی و تحلیل کدهای موجود\r\n- پیاده‌سازی\r\n- تست و دیباگ\r\n- بررسی سناریوهای خاص (Edge Cases)\r\n- Code Review و اصلاحات\r\n- بررسی اثر تغییرات روی بخش‌های دیگر سیستم\r\n\r\nاما مدیر فنی ممکن است فقط زمان نوشتن کد را در نظر بگیرد.\r\n\r\nدر این صورت شما اصلاً درباره یک مفهوم مشترک صحبت نمی‌کنید.\r\n\r\nدر اسکرام، معیار تکمیل کار باید با Definition of Done مشخص باشد؛ یعنی صرفاً تمام شدن کدنویسی به معنی Done شدن تسک نیست.\r\n\r\n۴. پیشنهاد من برای برخورد با این مسئله\r\nبه نظرم به‌جای اینکه وارد بحث «من می‌گویم سه روز، شما می‌گویید یک روز» شوید، بهتر است تخمین را مستند و قابل دفاع کنید.\r\n\r\nمثلاً:\r\n\r\n| فعالیت              | تخمین       \r\n| بررسی ساختار فعلی     | ۳ ساعت      \r\n| پیاده‌سازی            | ۶ ساعت      \r\n| تست و دیباگ           | ۴ ساعت      \r\n| بررسی سناریوهای خاص   | ۳ ساعت      \r\n| Code Review و اصلاحات | ۲ ساعت      \r\n| **مجموع**             | **۱۸ ساعت** \r\n\r\nحالا اگر مدیر فنی معتقد است این کار یک روزه است، باید مشخص شود کدام بخش از کار را می‌توان حذف کرد، ساده‌تر انجام داد یا با راهکار دیگری پیش برد.\r\n\r\nدر این صورت شما به‌جای دفاع از عدد سه، از تحلیل فنی خودتان دفاع می‌کنید.\r\n\r\n۵. یک موضوع مهم‌تر: تخمین نباید به ابزار فشار تبدیل شود\r\n\r\nاگر هر بار که یک برنامه‌نویس تخمین می‌دهد، مدیر زمان را کاهش دهد، به‌مرور اتفاقات زیر رخ می‌دهد:\r\n\r\n1. برنامه‌نویس‌ها تخمین واقعی نمی‌دهند و برای جلوگیری از بحث، زمان کمتر اعلام می‌کنند.\r\n2. کیفیت کد و تست قربانی سرعت می‌شود.\r\n3. بدهی فنی (Technical Debt) افزایش پیدا می‌کند.\r\n4. برنامه‌ریزی اسپرینت اعتبار خودش را از دست می‌دهد.\r\n5. اعضای تیم به‌جای تمرکز بر کیفیت و ارزش محصول، برای رسیدن به Deadline تحت فشار قرار می‌گیرند.\r\n\r\nاین موضوع با اصل پایداری سرعت کار تیم در اسکرام هم در تضاد است.\r\n\r\n\r\n۶. می‌خواهم یک سؤال مهم از تو بپرسم\r\n\r\nبرای اینکه بتوانم دقیق‌تر بگویم رفتار مدیر فنی شما چقدر با اصول اسکرام فاصله دارد، یک موضوع را مشخص کن:\r\n\r\nوقتی تو برای تسک سه روز تخمین می‌دهی، مدیر فنی دقیقاً چه برخوردی می‌کند؟\r\n- بدون بحث می‌گوید این تسک یک‌روزه است و باید تخمین را اصلاح کنی.\r\n- درباره جزئیات فنی بحث می‌کند، اما در نهایت خودش عدد نهایی را تعیین می‌کند.\r\n- در جلسه با حضور اعضای تیم، تخمین‌ها را به چالش می‌کشد و به توافق می‌رسید.\r\n- می‌گوید من می‌خواهم این تسک یک‌روزه تحویل شود، حتی اگر تخمین تو سه روز باشد.\r\n\r\nتخمین تسک‌ها معمولاً توسط چه کسی انجام می‌شود؟\r\n- هر برنامه‌نویس برای تسک خودش\r\n- کل تیم به‌صورت گروهی\r\n- مدیر فنی برای اعضای تیم\r\n\r\nاین دو مورد خیلی مهم‌اند؛ چون ممکن است مسئله اصلی شما صرفاً اختلاف نظر در تخمین نباشد، بلکه 'ساختار تصمیم‌گیری و میزان خودمختاری تیم فنی' باشد."
