description: "من گاهی فکر می‌کنم این دوستانی که باعث خروج نیروها از شرکت می‌شوند آیا با شرکت رقیب قرارداد دارند که اینجا را نابود می‌کنند؟ این آتش زدن به تیم فنی است. شما نیرو می‌آورید، چند ماه آموزش می‌بیند، سیستم را یاد می‌گیرد و کم‌کم روی روال کار می‌افتد، و بعد فراریش می‌دهید. خب، اگر با شرکت رقیب هم دست نیستید و با مبنا دشمنی ندارید، چرا این کار را می‌کنید؟\r\n\r\nوقتی شرکت‌های دیگر حاضرند برای نیروی جونیورتان بیشتر از حقوقی که به سینیورتان می‌دهید پرداخت کنند، پس بدانید که دارید نیرو را فراری می‌دهید.\r\n\r\nنمی‌دانم تا حالا درباره «هزینه فرصت» چیزی شنیده‌اید یا نه. آقا یا خانمی که به شرکت آمده، چه بتوانید از توانایی‌هایش استفاده کنید و چه نتوانید، دارد هزینه فرصت می‌دهد. یعنی تمام وقت کار می‌کند، اما احتمالاً شما در تعریف پروژه و فروش مشکل دارید، یا شاید دندان‌گرد هستید و دنبال مفت می‌گردید و انتظار دارید او مفت کار کند. شرکت دیگری که شعورش می‌رسد، نیروی شما را با قیمت بالاتر استخدام می‌کند، و علی میمونه و حوضش!\r\n\r\nحالا ببینید کی بهتان گفتم: همین‌هایی که باقی مانده‌اند، به محض اینکه آمریکا بگوید حمله نمی‌کنم و شرکت‌ها شروع به استخدام عادی کنند، از شرکت خواهند رفت. آن وقت باید بیفتید توی شهر و ۵۰۰ مصاحبه انجام دهید تا ۱۰ تا هندوانه دربسته پیدا کنید که معلوم نیست کدامشان توانایی دارند و کدامشان خودشان را قالب کرده‌اند!\r\n\r\nعاقل بودن سخت است، اما تلاش کنید، شاید شد!"
