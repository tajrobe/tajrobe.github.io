description: "متأسفانه ضعف مدیریتی باعث شده فضای کاری شرکت به‌شدت سمی و فرسایشی بشه  تو این شرکت حاشیه‌ها و روابط شخصی گاهی بیشتر از خودِ کار و عملکرد حرفه‌ای اهمیت پیدا کرده‌.\r\n\r\nباز بودن همیشگی درِ اتاق مدیر به روی افراد خاص و شنیدن صحبت‌های منفی آن‌ها درباره سایر همکاران، بدون بررسی دقیق و بی‌طرفانه باعث قضاوتهای نادرست شده.\r\nحتی گاهی خود مدیر با دعوت از نیروها و پرس‌وجو درباره دیگران، ناخواسته یا آگاهانه، به این فضای بدگویی و حاشیه‌سازی دامن می‌زنه تا جایی که انگار به‌جای تمرکز بر پیشرفت کار، پرداختن به مسائل و افراد به بخشی از سرگرمی روزمره تبدیل شده\r\nاین رفتارها محیطی ناخوشایند و غیر حرفه ای درست کرده\r\nاز طرفی هیچ پاداش و قدردانی وجود نداره چه بصورت پاداش مالی یا حرکتی نمادین به معنی دیده شدن همین ها باعث سردی و بی انگیزگی شدید شده.\r\n\r\nمدیریت صرفاً داشتن عنوان و جایگاه نیست  به دانش، شایستگی و توانایی ایجاد محیطی سالم برای کار نیاز دارد. کاش قبل از پذیرفتن مسئولیت مدیریت، افراد به‌اندازه کافی برای این جایگاه آماده شوند.\r\n"
