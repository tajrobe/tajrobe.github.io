description: "من برای مصاحبه‌ی Product Owner رفتم این شرکت.\r\n\r\nقبلش خانمی به اسم س. مبهوتی، که ظاهراً از منابع انسانی شرکت بود، تلفنی باهام هماهنگ کرد. برخوردش اصلاً حرفه‌ای نبود. وسط صحبت با من مدام با همکاراش حرف می‌زد، پشت سر بقیه حرف می‌زدن و شوخی و خنده راه انداخته بودن. اصلاً حس نمی‌کردی با واحد HR یه شرکت جدی طرفی.\r\n\r\nروز مصاحبه دم در کلی حراست و نگهبان بود و چندتا مرد که با نگاه‌های هیزشون سرتاپامو برانداز می‌کردن. آخرشم اجازه ندادن برم مصاحبه و گفتن «حجابت مشکل داره». منم کوتاه نیومدم و باهاشون بحثم شد.\r\n\r\nراستش این شرکت اصلاً جای نیروی متخصص نیست.\r\n\r\nیکی از دوستام که اونجا .NET Developer هست از همون اول بهم گفته بود نیا، چون حقوقش خیلی پایینه و هر ماه یه چیزی از پاداش و کارانه‌ت کم می‌کنن.\r\n\r\nچیزی که از حرفای دوستم فهمیدم اینه که هر عددی رو که باهاشون ببندی، به چندتا بخش ریز تقسیمش می‌کنن: هزینه‌ی ورزش، مسافرت، کارانه، پاداش، ناهار و ایاب‌وذهاب. حالا اگه توی ماه حتی یه روز مرخصی بگیری، از همه‌ی این بخش‌ها کم می‌شه. حتی اگه ماه به جای ۳۰ روز، ۳۱ روز باشه هم حقوقت کمتر درمیاد. خلاصه هر ماه که می‌گذره دریافتیت کمتر می‌شه.\r\n\r\nهر وعده ناهار هم ۴۵۰ هزار تومنه و اگه حتی یه بار از ناهار شرکت بخوری، از حقوقت کم می‌شه. کلاً دنبال بهونه‌ان که از حقوقت بزنن. هر سه ماه یه بار هم به اسم «مالیات واحد» و این‌جور چیزا، باز یه مقدار دیگه کم می‌کنن.\r\n\r\nخلاصه دوستم اصلاً پیشنهادش نمی‌کرد. خودمم که رفتم و فضاشو دیدم، حسابی دلزده شدم. انگار نه انگار وارد یه شرکت tech شدی، بیشتر شبیه حسینیه بود. بوی جوراب و گلاب، صدای نوحه، و کلی حراستی که بهت زل زدن و می‌گن «تا کارت ملی ندی، اجازه‌ی ورود نداری."
