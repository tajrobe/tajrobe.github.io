description: "احساس میکنم احمقانه ترین تصمیم برای قشر تحصیلکرده و موفق حضور در این شرکته که بصورت مافیایی کنترل میشه و اگه مورد پسند هریک از این ادما نباشی بهت انگ ناکارامدی میزنند و حذفت میکنند.\r\nمن دوسال تو این مجموعه بودم همه مسائلی که نباید ببینم و تجربه کنم رو دیدم و تجربه کردم\r\nمدیر منابع انسانی محمد فراهانی فردی خانم باز و بی شرف!\r\nمدیر فنی صابری فردی نالایق و تشنه قدرت که از همه جا بیرون انداختنش!\r\nاین وسط حتی رمان جنگ کارای شرکت رو کل اعضای شرکت با همدلی پیش بردند ولی کارمون دیده نشد!\r\n\r\nبه هیچ وجه توصیه نمیکنم تو این فضای کثیف بیاید و من خدارو شاکرم که زود فهمیدم و زدم بیرون!\r\n\r\nضمنا گول پرداخت هزینه ایاب و ذهاب و نهار رو نخورید نمیصرفه از تهران ۱۰۰کیلومتر بیای و خودتو برای این مجموعه تو فشار بندازی اصلا نمیصرفه!\r\n\r\nپرداختاشونم به موقع نیست و هیچ وقت نمیتونی رو پولت حتی برای قسط بانکت حساب باز کنی!\r\n\r\nضمنا هیچ امنیت شغلیم نداری!"
