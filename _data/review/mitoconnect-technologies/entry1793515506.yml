description: "عیب این مجموعه اینه که اشخاص سمی که چند ساله قرار بود به خاطر کار ضعیف فنی و حاشیه های اخلاقی اخراج بشن رو دلشون سوخت به خاطر وضعیت زندگیشون اینکارو نکردن . اخرسر هم به خاطر قرارداد کوتاه مدتی که باهاشون بسته شد تا تلنگری بهشون باشه حرمت نون نمک این چند ساله رو نگه نداشتن . آقایی که میگفتی به تستر هیچ جا انقدر پول نمیدن و به تمام خانم های مجموعه نظر داشتی و دوست هم شدی حالا اینجا بد شد و نسبت هایی که خودت لایقشی به باقی نسبت میدی . ناراحت میشم میبینیم همون ادم هایی امثال پیریایی و صابری که ازشون بد میگین پشتیبانتون بودن که همون اول اخراج نشدید و تا اخر هم بودن .\r\nالبته نیازی به این صحبت ها نبود چون طرز گفتار شما رو هر شخص ثالثی بخونه متوجه میشه که چه آدم سمی هستین .\r\nبنده این مدت نسبتا طولانی که به عنوان کارشناس فنی مشغول به کار هستم صمیمی ترین و بهترین بچه هارو اینجا دیدم . آزادی عمل در فنی . تکنولوژی های به روز . بچهای فنی کاربلد . احترام و دیده شدن کار ها . پرداختی و بن کارت و ایاب و ذهاب خوبی داره . ضعفی هم که در اکثر مجموعه های دولتی وجود داره تغییرات مدیریتی و تصمیم گیران اصلی شرکت که باعث میشه که کسانی که در حال کار کردن توی شرکت هستن و میخوان کار ها پیش بره سرگردون بشن ولی در حال حاضر همه چی رو به بهبود هستش"
