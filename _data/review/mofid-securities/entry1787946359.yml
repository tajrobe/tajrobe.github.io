description: "چندین بار برای فرصت‌های شغلی شرکت کارگزاری مفید رزومه ارسال کرده‌ام. در همه موارد، وضعیت رزومه برای مدت طولانی (حدود ۴۰ روز یا بیشتر) بدون تغییر باقی ماند و سپس در همان روزی که رزومه مشاهده شد، درخواست من رد شد.\r\n\r\nاین اتفاق برای من چند بار تکرار شده و باعث شده این سؤال برایم ایجاد شود که آیا فرآیند جذب برای این موقعیت‌ها واقعاً فعال بوده است یا خیر. به نظر می‌رسد زمان بررسی رزومه‌ها بسیار طولانی است و هیچ بازخورد یا ارتباطی نیز با متقاضی برقرار نمی‌شود.\r\n\r\nپیشنهاد می‌کنم شرکت‌ها در صورت تکمیل ظرفیت یا توقف فرآیند استخدام، وضعیت آگهی را به‌روز کنند تا زمان و انرژی کارجویان هدر نرود."
