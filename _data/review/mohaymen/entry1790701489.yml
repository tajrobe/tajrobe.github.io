description: "اکثر کارمندان شرکت دانشجویان شریف هستن و صرفا برای اینکه بتونن همزمان با تحصیلشون کار هم کنن و یه رزومه ای جمع کنن، مهیمن رو انتخاب میکنن.\r\nاما مهیمن به دلیل اینکه بتونه به اعتبار این دانشجویان، پروژه های ملی رو با رانت و زرنگ بازی بگیره، این افراد رو جذب میکنه.\r\nمدیریت ارشد در این شرکت به شددددت ضعیفه،\r\nنیروی انسانی براشون هیچ ارزشی نداره،\r\nبه همون راحتی که به صورت فله ای نیرو جذب میکنن، به همون راحتی هم از دستشون میدن و سرسوزنی برای مدیریت اهمیت نداره.\r\nمدیریت اصلا دلسوز کارکنانش نیست،\r\nو فقط منافع شخصی و یا برخی منافع ملی براش اهمیت داره.\r\nپارتی بازی و رفیق بازی هم بسیااار زیاده،\r\nفضای کاری در تیم های پروداکت به شدت سمی و سرشار از خاله زنک بازی و زیرآب زنی هست.\r\nمدیران محصول به شدت بی کیفیتی داره که بدون تجربه مناسب و سابقه کاری بالا، بین خودشون عنوان مدیر محصول رو رد و بدل میکنن، درحالیکه اگر همین افراد وارد شرکت دیگه ای بشن، به هیچ وجه این جایگاه رو‌ نمیتونن کسب کنن.\r\nبه هر حال در مقایسه با خیلی از شرکت های در این وسعت و ادعا، به هیچ وجه مهیمن رو به کسی توصیه نمیکنم،\r\nچون ابدا آینده شغلی و امنیت شغلی ای در این شرکت هم وجود نداره،\r\nمیتونید این موضوع رو حتی از کارمندان با سابقه دو یا سه ساله شون هم جویا بشید ..."
