description: "سلام و احترام.\r\nپاییز ۱۴۰۵ از طریق یکی از پلتفرم های کاریابی، برای مصاحبه به این مجموعه دعوت شدم. چیزی که برام مهم بود و بهش دقت زیادی کردم و نظرمو جلب کرد، فرهنگ بالای سازمانی این مجموعه بود. از ورود و حراست مجموعه گرفته، تا کارمندهایی که در مسیرم دیدم و در نهایت مدیرعامل و نیروی منابع انسانی. شاید بپرسید منظورم از فرهنگ بالای سازمانی چیه. اونجا هرکسی سرش به کار خودش گرم بود و اگر بهش مربوط میشد که با شما باید صحبت کنه، این صحبت کاملا محترمانه و در چارچوب تعریف شده وظایف خودش بود. سطح مصاحبه میشد بگی سخت هست، در لحظه برام چالش تعریف کردن که حلش کنم یا مثال بزنم، اما اگر به کارتون مسلط باشید چالش براتون مفهوم جذابی پیدا میکنه. ۳ روز بعد از مصاحبه بهم بازخورد دادن که برم برای استخدام، باز هم واحد منابع انسانی تو فرهنگ و نحوه صحبت ۱۰۰ و محترم بودن، قرارداد محرمانگی باید امضا کنید این روال کاملا طبیعیه مخصوصا تو شرکت های دانش بنیان. حقوق و مزایای شرکت در سطح رو به بالایی قرار داره و اینجا اون جایی هست که پتانسیل های افراد دیده میشه."
