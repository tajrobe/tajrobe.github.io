description: "با سلام و روز بخیر\r\nمن الان ۸ ساله در این شرکت مشغول بکار هستم.\r\nهمه شرکتها بالا و پایین دارند و خیلی از شرکتها حقوث معوقه ۳ یا ۶ ماهه دارند.\r\nاین شرکت خوبیش اینه که حقوق معوقه نداره و سر موقع پرداخت میکنه.\r\nپاداش و توبیخ هم داره. طبیعتا اگر کار رو به موقع برسونی پاداش میگیری و اگر بیخیال بشی توبیخ میشی\r\nتوی جنگ خیلی از شرکتها تعدیل نیرو کردن ولی این شرکت هوای نیروهاش رو داشت و نه تنها بیمه پرسنل رو کامل ارائه کرد بلکه حقوق کامل هم پرداخت کرد.\r\nدر کل من از این شرکت راضی هستم و تمام تلاشم رو میکنم که در این شرکت ماندگار باشم."
