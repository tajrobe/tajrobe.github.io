description: "من خودم در دپارتمان مهندسی بودم همین قسمت را نقد می‌کنم دیگر قسمت ها را نمیدونم بنده.\r\nشرکت در قسمت مهندسی دو بخشه \r\nمهندسان کم سابقه و جوان و مهندسان سابقه دار و کاربلد \r\nکه خداییش این مهندسان سنیور آدمای بسیار خوب و کاربلد و باتجربه هستند که میشه کلی چیز ازشون یاد گرفت.\r\nبا مهندسان سابقه دار عملا نمیتونن بدرفتاری خاصی بکنند چون طرف میزاره میره و دستشون میمونه تو پوست گردو \r\nولی مهندسان کم سابقه را تحت فشار میزارن که البته برای کسی که به دنبال یادگیری هست خوبه بنظرم \r\nولی رفتار بد مدیر میانی با زیر مجموعه خودش زیاد دیدم در این شرکت که غیر قابل قبول هست.\r\nحقوقی که میده در رنج دیگر شرکت های تحقیق توسعه است بیشتر نمیده ولی به موقع پرداخت شد همیشه \r\nبرای مهندسان جوان خوبه بنظرم چون چیزهای زیادی یاد میگیرن در کنار درآمد معقول ولی باید بدونن فشار زیاد میاد بهشون سر مسائل گوناگون .\r\nتجربه بد خودم با این شرکت بخاطر جنگ بود که هیچ تماسی چه به خود بنده چه به شخص دیگری جهت اینکه تعدیل شدیم گرفته نشد تا چند ماه بعد جنگ هم چیزی نگفتن ولی خب من اخلاق مدیریتی این شرکت میدونستم و برنامه آب نمک را خودم بلد بودم\r\nسریع رفتم در شرکت دیگری مشغول شدم و شروع به کار کردم چیزی هم نگفتم بهشون اوناهم چیزی نگفتن هنوز😄\r\nاز تماس با دیگر دوستان فهمیدم همه باهم تعدیل شدیم.\r\nدر کل اگه جونیور هستی برو چیز یاد بگیر یه پولی بگیر بعدشم برو یه شرکت لول بالاتر\r\nاگه از میدر هستی اینجا بدرد نمیخوره برو یه شرکت بهتر تا به غیر از مهندسی اخلاق کار حرفه ای هم یاد بگیری .\r\nاگه سنیور هستی اینا خودشون میان دنبالت پولم بهت میدن احترامم میزارن نگران چیزی نباش کارشون گیرت باشه با اخلاق ترین ادما میشن😄\r\nدر کل اگه رفتی تو این شرکت وفاداری خاصی بهشون نداشته باش چراکه اونا به تو اصلا ندارن \r\nمن مدت زیادی نبودم ولی کسایی دیدم چند سال کار میکردن در این شرکت و بدون حتی یک تماس و توضیح تعدیل شدند.\r\nدوستانی هم که خیلی با به به چه چه تعریف میکنن مشکوک هستن یا خود مدیرا هستن چرا که از این نظرات و سایت کاملا باخبر هستند\r\nیا کلا فضای دیگری کار نکردن و فکر میکنن اینجا بهشت ولی یکمی بگذره متوجه میشن چخبره\r\nالبته درباره نظرسنجی فیک بخوام یه خاطره بگم از این شرکت اونم این بود \r\nبچه های برق دانشگاه آزاد یک نظر سنجی برای بد بودن یک استاد گذاشته بدون در این سایت های نظرسنجی \r\nاون استاد گرامی رفیق مدیر عامل شرکت بوده احتمالا چرا یک روز منشی شرکت میومد بالای سر هر شخص در بخش مهندسی می‌گفت گوشی بردار برو فلان سایت به این نظر سنجی نظر مثبت بده\r\nمهندس مملکت بدون توضیح بدون هیچ حرفی مجبور میکرد چون مدیر عامل دستور دادند نظر بزنید اونم نظر فیک \r\nنظر سنجی چی بود حالا \r\nدرباره خوبی ها و الطاف جناب استاد رفیق مدیر عامل🤦🏻😶\r\nکه بعد من اسم طرف سرچ زدم دیدم بچه های دانشگاه نظر سنجی برای برکناری طرف زده بودند و خود استاد یه نظر سنجی فیک راه انداخته بود و داشت با رفیقاش باند بازی میکرد ضد یه نظرسنجی دانشجویی😶😄\r\nچیپ ترین سطحی ترین غیر اخلاقی ترین چیزی که میشد از یه مدیر عامل و استاد دانشگاه ببینی بنده دیدم در این شرکت پس یا این نظرات گرمابه گلستان از دم ساخت خود جنابان استاد هست یا که ...\r\nخلاصه که برای مهندسان و کارکنان این شکرت طلب عافیت و صبر دارم.\r\nو برای همه مدیران طلب شعور و معرف.\r\n\r\nمن الله توفیق \r\n"
