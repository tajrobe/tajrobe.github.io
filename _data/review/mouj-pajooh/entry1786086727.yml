description: "سلام و روز بخیر\r\nمن الان 2 ساله در این شرکت در بخش مهندسی مشغول هستم و واقعا این حجم از ارائه و درج نظرات ناعادلانه رو درک نمی کنم.\r\nدر مدت زمانی که اینجا هستم و در بخش R&D فعالیت میکنم واقعا مطالب و تجربیات جدیدی رو یادگرفتم. من با اینکه از دانشگاه دولتی فارغ شدم ولی طبیعتا حجم یادگیری مطالب در محل شرکت و کار عملی قابل قیاس با دانشگاه نیست.\r\nلازمه بگم رفتار مدیران میانی و مدیر بخش با بنده بسیار محترمانه بوده و با سعه صدر و زمان بالا برای یادگیری و بروزرسانی علم من وقت گذاشتن.\r\nاین نکته خیلی مهمه که مدیر مربوطه همیشه کارت رو رصد میکنه و پله پله باهات کار و پیشبرد پروژه رو چک میکنه و این برای من خیلی قابل تقدیر و ارزشمند است.\r\nحقوقی هم که میدن به نظرم از عرف شرکتهای همکار بالاتر هست و خوبیش اینه که به موقع میده.\r\nدر زمان جنگ واقعا سنگ تموم گذاشتن و تا جای ممکن به کلیه پرسنل (در بخش تحقیقات و تولید) کمکهای بلاعوض کردن.\r\nاگر کمی تحقیق کنید متوجه میشید که خیلی از شرکتها پس از جنگ بالای 80% پرسنل خودشون رو تعدین کردن ولی این شرکت تا جای ممکن پرسنل خودش رو حفظ کرد.\r\nاون پرسنلی که در بخشهای مختلف مهندسی یا تولید تعدیل شدن واقعا کارایی نداشتن و خیلیهاشون خودشون هم میدونستن که دارن تعدیل میشن.\r\nبالاخره هرکسی خودش را بهتر از دیگران میشناسه که چیکاره است.\r\n\r\nیک نکته ای که برای من حائز اهمیت هست اینکه که این شرکت برای پرسنل با تجربه خودش خیلی اررزش قائله که این موضوع منجر به حسادت پرسنل کم تجربه و تازه وارد شده که میخوان یک شبه ره صد ساله رو طی کنند و مرتب خودشون رو با اون افراد مقایسه می کنند. اگرچه که از نظر سطح سواد و رفتار اصلا قابل مقایسه نیستند.\r\n\r\nیه مورد خیلی جالب هم اخیرا متوجه شدم که برخی از پرسنل (پرسنلی که خودم میشناسم) که در یکی دوسال گذشته از این شرکت به دلایل مختلف اخراج شدن، در این مدت حداقل 2 یا 3 شرکت عوض کردن و اخیرا با مدیران خود در این شرکت تماس گرفتند و التماس برای بازگشت مجدد کردن که پذیرفته نشده.\r\n\r\nیک نکته ای که واقعا تاسف باره و لازمه بگم اینه که این پرسنلی که اخراج میشن و میان نظرات و کامنتهای منفی می نویسن، حداقل برای اینکه توجه مخاطب رو جلب کنند نمیان اول از محاسن و مزایای شرکت بگن و پس از اون موارد منفی رو مطرح کنند و یک راست میرن نظرات منفی میدن که این موضوع باعث میشه مخاطبان خیلی به اونها توجهی نکنند.\r\nمثلا نمیان بگن این شرکت به کلیه پرسنل خودش (اعم از تازه وارد یا سابقه دار) شب عید وام قرض الحسنه میده\r\nنمیان بگن این شرکت به کلیه پرسنل خودش (اعم از تازه وارد یا سابقه دار) هر 3 ماه یکبار ارزاق میده\r\nو ............\r\nبالاخره همین که یک شرکت در این شرایط نامساعد اقتصادی کشور اینجوری هوای نیروهاش رو داره واقعا جای تشکر و قدردانی داره.\r\n\r\nمن از همه دوستان اخراجی و مشغول بکار تقاضا دارم که نظرات خودشون رو نه فقط برای این شرکت بلکه برای همه شرکتها منصفانه بنویسند و همه محاسن و معایب رو بنویسند و فقط به معایب بسنده نکنند.\r\n\r\nدر کل، من از این شرکت و مدیران مربوطه بدلایل مطرح شده راضی هستم و امیدوارم این پرسنل تعدیلی یا اخراجی یک روزی به خودشون بیان (نه پس از استخدام و اخراج شدن در 5 شرکت دیگه) و ایرادات و اشکالات رو در خودشون ببینند و هرچه سریعتر نسبت به اصلاح آنها اقدام کنند.\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n"
