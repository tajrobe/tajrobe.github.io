description: "به نظرم اگر اینحا تجربه میذاریم برای کمک به آدمهایی باشه که میخوان توی این شرکت‌ها کارکنن نه اینکه عقده گشایی کنیم، من توی این شرکت کار کردم، بیشتر از دو سال، نمیشه اشتباه یه سرپرست خط رو پرچم کرد و گرفت بالای سر و توی یه فضای عمومی جارش زد اما به وقتش با یه مدیر رده بالاتر مطرحش نکرد، من دقیقا با این مشکل مواجه شدم، راستش جرات نداشتم که مستقیم مطرحش کنم ولی از یه طریقی به گوش مدیرعامل رسوندم و واقعا اون معضل حل شد. به نظرم حتما مواردی که می بینید و مشکل ساز هست براتون مطرح کنید، پیگیری میشه، نه اینکه هر چی میشه سرتون رو بندازید پایین و تحمل کنید یا اینکه قبولش کنید بعد وقتی اونجا نبودید بیاین پشت یه اکانت مخفی راست و دروغ رو با هم بگین، به نظرم انسانیت از خود ما شروع میشه."
