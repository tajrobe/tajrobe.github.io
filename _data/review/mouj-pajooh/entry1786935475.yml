description: "من در این شرکت مشغول به کارم، تجربه های عجیب و غریب که اینجا نوشته شده توهین به ماهایی هست که داریم توی این شرکت کار می کنیم و بخش مهمی از روز و انرژی و زندگیمون رو اینحا می گذرونیم، یعنی می فرمایید با ما بی ادب و بی احترام رفتار می کنن، حقوق خوبی نمیدن و ما ابلهانه به کارمون ادامه میدیم، من حتی می تونم دقیق اسم دو نفر از این تجربه های بد رو بگم چون میدونم دقیقا چه کار کردن و چه اتفاقی اینجا افتاده و تعجب می کنم چرا شرکت از این آدمها شکایت حقوقی نکرده واقعا، ایکاش این سایت های مسخره جمع بشن و فقط آدمها با کد ملیشون که قابل نمایش نباشه بیان نظر بدن که اگر دروغ گفتن شرکت بتونه ازشون شکایت کنه، در هر صورت به نظرم عاقل باشین و به حرفهای بیهوده این لوزرها توجه نکنید، هیچ شرکتی بهشت برین نیست ولی موج پژوه جزء شرکت‌های خیلی خوبیه که می تونید برای کار انتخابش کنید."
