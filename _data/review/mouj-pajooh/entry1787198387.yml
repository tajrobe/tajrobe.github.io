description: "بسمه تعالی.\r\nسلام به همه عزیزان.\r\nخواستم یک توصیه کنم به تمام عزیزانی که در شرکتهای مختلف با تجهیزات مخابراتی و امواج فرکانس بالا سر و کار دارند. تجربه بنده این بوده است که این امواج به مرور بر نظم و کیفیت خواب من  تاثیر گذاشته و باعث  شده بود خواب دیدن من شبیه به یک فیلم نامربوط بشود. انگار مدام شبکه تلویزیون‌ رو عوض میکنی و این کیفیت بد خواب بر روی اخلاق و تمام زندگی من اثر گذاشته بود. در برخی از افراد تاثیر این امواج می تواند متفاوت باشد. مثل سر درد. یا سرطان و در مواردی که شدت و توان این امواج خیلی بالا باشد می تواند باعث آب مروارید و خارش پوست شود و ناباروی و تاثیر روی حافظه ی افراد . توصیه و تجربه ی بنده این است که سعی کنید برای مدت طولانی با امواج فرکانس بالا کار نکید چون برای خود بده  تاثیر آن بر روی جسم و روانم ثابت شده است. مراقب خودتون باشید. و تا حد ممکن از آنتن های فرکانس بالا که مولد پارازیت هستند فاصله بگیرید. \r\nاحتمالا شرکتهای مخابراتی در دنیا که دارای ثروت و سود زیادی در این زمینه هستند سعی در بی اهمیت جلوه دادن تاثیر این امواج بر سلامتی افراد باشند."
