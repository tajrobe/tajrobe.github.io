description: "با احترام، تجربه شخصی هر فرد قابل احترام است، اما از نظر علمی نمی‌توان صرفاً بر اساس یک تجربه شخصی، رابطه علت و معلولی بین امواج رادیوفرکانسی و اختلال خواب، سرطان، ناباروری، اختلال حافظه یا سایر بیماری‌ها را نتیجه گرفت.\r\nبر اساس ارزیابی‌های علمی سازمان جهانی بهداشت (WHO) و کمیسیون بین‌المللی حفاظت در برابر پرتوهای غیر یون‌ساز (ICNIRP)، اثر شناخته‌شده و اثبات‌شده امواج RF در شدت‌های بسیار بالا، گرم‌شدن بافت و در صورت عبور از حدود ایمنی، آسیب حرارتی است. برای مواجهه‌های پایین‌تر از حدود استاندارد، تاکنون شواهد معتبر و تکرارپذیری که نشان دهد این امواج باعث اختلال خواب، کاهش حافظه، ناباروری یا سرطان می‌شوند، به دست نیامده است.\r\nدر مورد خواب نیز مطالعات زیادی انجام شده و ICNIRP اعلام می‌کند که شواهد موجود، ارتباط معناداری بین مواجهه با RF و کاهش کیفیت خواب نشان نداده‌اند.\r\nهمچنین WHO صراحتاً اشاره می‌کند که برخی افراد علائمی مانند سردرد یا اختلال خواب را به میدان‌های الکترومغناطیسی نسبت می‌دهند، اما در مطالعات کنترل‌شده رابطه مستقیمی بین این علائم و مواجهه با RF اثبات نشده است.\r\nالبته این به معنی بی‌اهمیت بودن ایمنی محیط کار نیست. اگر فردی با تجهیزات RF با توان بالا کار می‌کند، باید شدت میدان در محل کار اندازه‌گیری شود و حدود مجاز مواجهه شغلی رعایت شود. این موضوع کاملاً علمی و قابل اندازه‌گیری است و بهتر است به جای استناد به تجربه شخصی، بر اساس اندازه‌گیری میزان Exposure و استانداردهای ایمنی تصمیم‌گیری شود. ICNIRP برای بازه 100 کیلوهرتز تا 300 گیگاهرتز دستورالعمل‌های مشخصی برای حفاظت کارکنان و عموم مردم ارائه کرده است.\r\nبنابراین بهتر است بین «من بعد از کار با این تجهیزات چنین علائمی پیدا کردم» و «این امواج باعث این بیماری‌ها می‌شوند» تفاوت قائل شویم. اولی یک تجربه شخصی است و می‌تواند کاملاً واقعی باشد؛ اما دومی برای اثبات شدن نیازمند شواهد علمی، اندازه‌گیری میزان مواجهه و مطالعات کنترل‌شده است.\r\nضمناً نسبت دادن مخالفت با این ادعاها به منافع مالی شرکت‌های مخابراتی نیز به‌خودی‌خود دلیل علمی محسوب نمی‌شود. معیار، نتایج مطالعات مستقل و قابل تکرار و رعایت استانداردهای اندازه‌گیری و حفاظت است"
