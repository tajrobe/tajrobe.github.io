description: "تمام نظرات راجع به اشتباه محض بودن نزدیک شدن به این شرکت صحیح است. تمام نظرات مثبت راجع به این شرکت مطمئنا از طرف خود عوامل مجموعه است. اگر میخواهید از یک تیمارستان بازدید کنید حتما به این شرکت سری بزنید. اگر تا به حال یک موجود بد ذات و دزد بالفطره ندیده اید حتما به اتاق مدیر عامل و مدیران میانی این شرکت سر بزنید. اگر دوست دارید اندکی از حقوقتان را با التماس بگیرید و عطای تمام معوقات و طلب هایتان را به لقایش ببخشید به این شرکت بروید. اگر روزی ده بار هوس شنیدن داد و دعوا و توهین و بی احترامی کرده اید جای خوبی ست. اگر دوست دارید با پنحاه نفر دیگر در ده متر جا کار کنید و مثل کرم بلولید جای خوبی ست. اگر سم بدنتان کم شده و تمایل دارید در یک محیط شدیدا سمی تنفس کنید خوش آمدید. اگر میتوانید با چنین محیطی سازگار شوید عالی است، تبریک میگویم، بی شعوری شما از حالت بالقوه به بالفعل درمی آید. ضمنا مدیر این شرکت با پنهان شدن و فرستادن یک جوان بی خبر به یک جلسه نظامی در جنگ او را به کشتن داد."
