description: "امروز داشتم تو جاب ویژن آگهی میزاشتم که اتفاقی اسمشون رو دیدم ... برای تمام فیلد ها آگهی دادن ، یعنی تو این شرکت فقط مدیر عامل و اون خانم عقده ای ثابته ، بقیه هی عوض میشن ! \r\n\r\nتجربه من از اون مرکز تو تمام مدتی که متاسفانه کار کردم : \r\n(اگه تو مصاحبه هم گفتن این نظرات دروغ یا شایعه اس ، امتحانی یکماه کار کنین خودتون با گوشت و استخون میفهمین چی میگم ) \r\n\r\n1- خانم ه.ق.ج.م به شدت عقده ای ، بی ادب و بدون چهارچوب هست ، تو خونه کسی آدم حسابش نمیکنه از خدمتکار و پرسنل توجه میخره و سرکوبشون میکنه تا بقیه جلوش دولا راست بشن تا ایشون عقده هاش که ریشه در کودکی داره رو با 17% سهامی که به صورت ... گرفته جبران کنه ! \r\n2-نیروهای این شرکت هیچکدوم قدیمی نیستن ، جز یکی دو نفر ... نیروها اصلا نمیمونن ، وقتی هم که میرن حق و حقوقشون رو باید به زور بگیرن ، تو حق خوری حرفه ای ان ، چه حق پرسنل چه مشتری ها ، بیشتر تایمشون رو توی اداره کار و کلانتری و دادگاه میگذرونن \r\n3-شرکت هیجانی ای هست، هرروز یکی میاد داد و بیداد میکنه ، پس خونسردی خودتون رو حفظ کنین و از حراست که جدیدا به مجموعه اضافه شده کمک بگیرید ! \r\n4- تایم نهار لقمه هات رو میشمارن ، پشت دوربین مث ... منتظرن لقمه ات رو نخوردی بهت زنگ بزنن کار بگن ، حتی ساعت کاریتم که داره تموم میشه از قبلش یه کار بیهوده بهت میدن که نتونی بری به زندگیت برسی ، چون خودشون زندگی ندارن و مدیر عاملم که دوتا بچه هاش رو رها کرده همسرش داره تو شهریار بزرگشون میکنه این فقط چسبیده به کار و کار و کار و ه \r\n5- نه پاداش داری نه مزایا ، الکی گول نخور ! حتی حقوقتم به موقع نمیدن ، ساعت کاری نزنی حقوق اون روزت رو نمیده ، دیر کنی جریمه میشی اما اضافه کاری بمونی وظیفته هیچی گیرت نمیاد \r\n6-اون خانومه دوس داره یه عالمه حرف بزنه ، میری تو اتاقش حواست باشه کلی حرف میزنه تهش که داری میری خونه نگهت میداره چون کار امروزت رو تموم نکردی ! وسط حرفاش بلند شو بگو کار دارم وگرنه خاطره و تروما کودکی زیاد داره ! \r\n7-اونجا کارخونه نیست ! این بنده خدا یه زمانی به ساختمون 7 طبقه میگفت برج ، الانم به برج میگه کارخونه ! \r\n8-مرخصی به زور باید بگیری ، باید ثابت کنی مرخصی میگیری برای خوش گذرونی نیست چون خیلی حسوده ، بفهمه قراره بهت خوش بگذره مرخصی نمیده هیچ اضافه ترم ازت کار میکشه ! \r\n9-قبلا رو گوشیای شرکتی ریکورد صدا گذاشته بودن ، تو تایم کاری که دوربین چک میکردن و بعد تایم کاری هم که وقتی همه میرفتن تفریحاتشون این بود بشینن مکالماتو گوش کنن ، از توش یه چیزی در بیارن ! \r\n10- یه نیرو همه کاره هم هست اونجا که اگه حتی کسی نباشه اون هم مدیره ، هم فروشنده ، هم منشی ، هم خدمتکار ، هم حسابدار ، همه چی دیگه خلاصه ، خیلی مهارت داره ، خیییییلییییییاااااااا \r\n\r\nقبلا تو سایت دیگه ای تجربه نوشته بودم اما اینجا رو جدید دیدم \r\nحتما لینک سایت رو به بقیه همکارای عزیز سابقم میدم که بیان نظر بزارن "
