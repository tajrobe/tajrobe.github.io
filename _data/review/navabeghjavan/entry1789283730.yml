description: "مدیران جوان و بسیار کم تجربه و غیر حرفه ای دارد، هیچ کاری در این مجموعه روی اصول و قواعد انجام نمیشود. هرروز قانون و تصمیم جدیدی گرفته میشود و پرسنل موظف به اطاعت و انجام بی چون و چرای آن هستند. امنیت شغلی به شدت پایین است و رفتار بی ادبانه دارند و از الفاظ زشتی استفاده میکنند. تایم کاری مشخص نیست، اگر زمان کاملا ازادی دارید این موضوع اذیتتان نمیکند چون در پایان تایم کاری به شما اطلاع میدهند که باید اضافه تر بمانید آن هم بدون دریافت وجه و یا اینکه جلسات غیر ضروری و بسیار طولانی میگذارند. تمام حرکات شما توسط دوربین کنترل میشود و حتی در مورد شما از همکارانتان حرف میکشند. قراردادها یک طرفه و کاملا به نفع کارفرما نوشته شده باید خیلی اشراف داشته باشید و به تمام جملات ریزبینانه نگاه کنید تا بعدا دچار مشکل نشوید. پرداختی ها به کسورات ناعادلانه و بدون برنامه ریزی و با تاخیر پرداخت میشود. \r\nقطعا در برخورد اول متوجه موضوعاتی که در نظرات مطرح شده است نشوید اما بعد از گذشت یک هفته روی اصلی خودشان را نشان میدهند. در کل اگر جایگاه شغلی و پیشرفت و امنیت برایتان مهم هست من نوابغ را پیشنهاد نمیکنم. \r\n"
