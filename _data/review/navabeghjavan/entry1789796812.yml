description: "اگه سلامت روانتون براتون مهمه، واقعاً پیشنهاد می‌کنم قبل از اینکه وارد این شرکت بشید، خوب تحقیق کنید.\r\nتا وقتی که من اونجا بودم این شرکت دو تا مدیر داشت که یکیشون خانم بود و با اینکه سهم زیادی در شرکت نداشت ولی در همه امور دخالت می‌کرد و به نظرم بخش زیادی از کارش این بود که تو کار همه پرسنل دخالت کنه، دوربین‌ها رو چک کنه ببینه کی با کی حرف می‌زنه و چی می‌گه و از دلش یه حاشیه جدید دربیاره و سرگرم بشه (البته بین خود مدیران حاشیه وجود داشت که پرسنل درگیر میشدن)\r\nحریم خصوصی هم عملاً معنی خاصی نداشت. حتی زمان ناهار هم میومد کنار ما می‌نشست که ببینه درباره چی حرف می‌زنیم انگار نگران بود یه وقت علیهش توطئه کنیم و برامون از خاطرات زندگیش در ترکیه تعریف می‌کرد خاطراتی که راستش برای ما جذابیتی نداشت، ولی به هر حال باید می‌نشستیم و گوش می‌دادیم.\r\nخلاصه به هر بهونه ای صدات می‌کرد میرفتی اتاقش صحبت های غیرکاری می‌کرد و تا دیروقت نگهت میداشت چون کارات مونده بود.\r\nکلاً فضای بی‌اعتمادی عجیبی وجود داشت و این حس رو می‌داد که همیشه تحت نظر هستی.\r\nدر کل چیزی که برای من بیشتر از همه آزاردهنده بود، خود حجم کار نبود، فضای روانی و مدیریتی شرکت بود. اینکه مدام احساس کنی زیر نظر هستی، حرف‌هات ممکنه منتقل بشه، روابط بین همکارا کنترل می‌شه و حریم شخصی‌ات چندان جدی گرفته نمی‌شه.\r\nمن اینا رو صرفاً به عنوان تجربه شخصی خودم می‌گم و طبیعتاً ممکنه تجربه بقیه متفاوت باشه، ولی اگر محیط کاری آروم و سالم براتون مهمه، قبل از استخدام حتماً از چند نفر که اونجا کار کردن درباره فضای واقعی شرکت پرس‌وجو کنید."
