description: "این شرکت یکی از عجیب ترین جاهایی هست که میشه کار کرد.\r\nکل پرسنل شرکت کمتر از ۱۰ نفر نیستند اما سه نیروی خدماتی برای ارضای عقده های دو مدیر مشکل دار مجموعه وجود دارد که با اور دادن های خود، حس برتر بینی خودشون رو با تحقیر بقیه ارضا کنند.\r\n مثال آفتابه لگن هفت دست شام و ناهار هیچی میشه شرکت نوابغ ...\r\nمصطفی کاوه با ایران ایران کردن و استراتژیست خوندن خودش فقط دنبال اینه که چه جوری جیب مشتری و کارمند رو بزنه و با رابطه عجیب غریبش با خانم جولقانی مسکن  که انگار برده اش هست مدیریت می‌کنه به اصطلاح!!!\r\n در حالی که این خانم معلوم الحال با ۱۵ هزار تا سهم عنوان رئیس هیئت مدیره رو آورده دنبال اسمش و به کاوه و زنش ریاست می‌کنه!\r\nاین خانم کلی مشکل داره که گاهی برای پرسنل تعریف کرده از داستانهای تجاوز و خفت شدنش و غیره و ذالک که هیچ نیازی نیست مطرح بشه با نیرویی که برای کار کردن اومده\r\n اما چون ایشون عقده های روانی حل نشده از دوران کودکی و بزرگسالی دارند به بازی روانی و سمی کردن محیط و یار کشی و خبر چینی علاقه فراوانی  داره و همیشه دنبال زیر بغل مار هستند. \r\nسرگرمیش هم  اینه که دوربین رو زوم کنه رو صورت پرسنل و در حالی که خودش مسخره ترین شخصیت رو داره بقیه رو دست بندازه\r\nیا مدام در حال دادگاه رفتن و رسیدگی به شکایات مختلفن یا دنبال یه زمین مفت که برن برای خودشون اعتبار بخرن و با اجاره زمین خالی جیبیشون رو پر کنن و چکاشون پاس کنند و همیشه خدا هم هشتشون گروعه نهشونه\r\nالآنم که رفتن تو برج میلاد با قرارداد مشکل دارشون  در حال زدن جیب کسب و کارها هستند.\r\n"
