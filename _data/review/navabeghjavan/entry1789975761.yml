description: "من یک سال توی این شرکت کوچیک زمان و وقت و انرژیم رو هدر دادم. به دلیل اختلافات و برخوردهای شخصی مدیریت که به نظر من روی مسائل کاری هم تأثیر گذاشته بود، ۵ ماه حقوق معوقه داشتم.\r\nخوشبختانه در همون تایمی که توی شرکت کار می‌کردم، همزمان شکایت کردم و از شرکت بیرون نیومدم. ولی در آخر، وقتی دیدن که نمی‌تونن من رو مجاب به استعفا کنن، دسترسی‌هام رو به سامانه ثبت ورود خروج و سامانه‌های کاری قطع کردن و تا جایی که تونستن مانع حضورم شدن!\r\nدر نهایت، بعد از پیگیری‌های مکرر و اقدامات قانونی، تونستم تمام حق و حقوقم رو از مسیر قانونی دریافت کنم \r\nاز نکات مثبت مجموعه می‌شه به این مورد اشاره کرد که کارمند اینجا فرصت خوبی برای یادگیری فرآیندهای اداره کار و پیگیری حقوق قانونی خودش پیدا می‌کنه و در نهایت با دید بازتری برای کار کردن توی شرکت‌های بعدی تصمیم می‌گیره.\r\nو در آخر، قبل از امضای هر چیزی، حتی نقطه و ویرگول متن رو هم چک کنید که معنی جمله‌ها به چند شکل قابل تفسیر نباشه. حتماً از تمام مدارکی که امضا می‌کنید عکس بگیرید و برای خودتون نگه دارید.\r\nو در کل همیشه یادتون باشه کسی نمی‌تونه شما رو مجبور کنه چیزی رو به زور امضا کنید یا کاری رو به زور انجام بدید؛ از حقتون دفاع کنید و این قدرت رو داشته باشید که حتی اگر مدت‌ها طول بکشه، برای گرفتن حقتون پیگیری کنید و کوتاااااااه نیاااااااااید... قشنگیش به همییییییینه :) "
