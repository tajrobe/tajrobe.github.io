description: "اون خانمی که گفته بود منشی بوده اسمش 《《 مهدیه گیلوری 》》 هست\r\nاین خانم فقط از زاویه ی دید خودش داستان رو تعریف کرده\r\nمن جزو کارمندان قدیمی این شرکت هستم\r\nدلیل اخراج ایشون این بود که دست کرده بود توی تنخواه شرکت و با همکاری نظافتچی شرکت که اسمش رو نمی برم چون اینجا نیست و غیبت ممکنه بشه از تنخواه شرکت دزدی کرده بود\r\n\r\nمیومد اسنپ بگیره فاصله رو بیشتر میزد که مثلا خیر بیشتری برسونه به نیروی کارپرداز شرکت\r\nاز جیب شرکت بذل و بخشش می کرد می‌آورد توی تنخواه خودش\r\n\r\nخلاصه دلیل اخراجش دزدی خودش بوده و گر نه جزو نیروهای خوب شرکت بود\r\n\r\nنفر بعدی همدست ایشون خانم مهسا یوسفی هست\r\nایشان با همدستی خانم مهدیه گیلوری اومده بود اسناد مالی شرکت رو به بیرون شرکت لو میداد\r\nو عملا آدم امانت داری نبود\r\nبعد که مچش رو گرفتن اقرار نامه داده بود که طی یکسال و نیمی که کار کرده توی شرکت بخشی از وظایفش رو هم انجام نداده ولی حقوق گرفته بوده\r\n\r\nنفر سومی که اومده انتقال کرده خانم زینب ناصری هست مدیر مالی شرکت\r\nایشون بعد جنگ ۱۲ روزه اسرائیل استعفا داد و طبق مواردی که من شاهد بودم مدیر عامل شرکت با ایشون همکاری کاملی کرد که رضایتش رو هم جلب کنه\r\nدر نهایت ایشون بعد از اینکه هر چی خواست از شرکت گرفت رفت از شرکت شکایت کرد\r\n\r\nاین سه نفر جزو نفراتی بودن که نمک خوردن و نمک دان شکستن و گر نه که از دید خودشون میان در مورد شرکتی که مدیرانش جزو شریف ترین آدم ها هستن خزعبلات نوشتن که کار سختی نیست.!"
