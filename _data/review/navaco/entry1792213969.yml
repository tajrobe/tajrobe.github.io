description: "یک سال انتظار کشیدیم تا سلطه مشاوران و دوستان مسن و متکبر و بازنشسته مدیر عامل قبلی که از شرکت های بانک ملت و یاس ارغوانی و بهسازان و داده پردازی خوارزمی ... آمده بودند و یک سال خوردند و بردند و هیچ کاری هم نکردند تمام شود اما با آمدن مدیر عامل جدید گرچه بیشتر مشاوران رفتند اما این مدیر عامل بی تجربه و بی دانش و بی اعتماد به نفس که توسط فردی با اسم تقریبی خودنویس اداره می شود وضع بدتر از پارسال شد!! اولا یک سری از مشاوران و عوامل آنها باقی مانده اند و کار مثبتی نمی کنند جز خرابکاری! دو سه تا مدیر میانی پروژه زد کور ناواکو و معاونت مربوطه هم که از رفقای مدیر عامل خام و بی دانش هستند مورد حمایت مدیر عامل هستن و حتی یکی که زمان کردبچه به دلیل عملکرد بد در پروژه ئی تی سی اخراج شده بود چون دوست مدیر عامل هست برگشت و یک واحد کامل را دو سه نفری در اختیار گرفتن و حقوق مفت می گیرن در حالی که حقوق پرسنل با تاخیر ۱۵ روزه و با منت پرداخت میشه ...\r\nمدیریت این مدیر عامل بی تجربه و بی تدبیر و رفیق باز منو یاد حکومت قاجاریان میندازه ... تو رو خدا ناواکو را نجات بدید. \r\nاینجا ما زیر سلطه یک سری مستبد و زورگو هستیم. باید مدیر عامل بانک مسکن که در مقابل این همه فساد مدیران ناواکو سکوت کرده پاسخگو باشه وگرنه ما این مسئله را از بیرون و مراجع ذی صلاح پیگیری می کنیم."
