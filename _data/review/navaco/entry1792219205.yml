description: "از آنجائیکه مدیر عامل جدید هیچگونه تجربه مدیریتی ندارد و از کارشناسان ساده و بی تخصص بانک مسکن بوده مشی و هدف خاصی ندارد و تابع نظر دیگران است بخصوص نظر مشاوران بجا مانده از دوران تاریک مدیر عامل قبلی.\r\nالان ۲ نفر از اساتید دانشگاه شریف که فقط تجریه آکادمیک دارن و یک سال هم تجربه پیاده سازی و فنی ندارند میان ناواکو برای آموزش متدولوژی اجایل و آژور ... یک سال گذشته و هنوز مشغول آموزش هستن در حالیکه اولا کل اجایل و آژور را میشه ظرف یک هفته آموزش داد و فقط هم باید به مدیران پروژه و مالکان محصول آموزش داده شود اما چون می خواهند پروسه حضور خود را در ناواکو طولانی تر کنند به مدیر عامل که ذره ای تجربه در زمینه نرم افزار نداره حکم کردن که همه حتی غیر برنامه نویسان هم باید این دوره را بگذرانند. \r\nناواکو نون دانی خوبی برای یک سری شده و تازه قراره بعد از چند سال آموزش باز هم با ناواکو همکاری داشته و هدایت پروژه ها رو چیزی که در آن تخصص ندارند را در دست بگیرند.\r\nآقای مدیر عامل برای تعدیل کردن نیرو راه های بهتری هم وجود دارد و بهترست اول از دوستان خودتان که هر دو سه نفرشون یک واحد کامل را در اختیار گرفته اند و کاری هم نمی کنند شروع کنید ... نمی خوام از حضرات اسم ببرم. از خدا بترس و در کاری که تخصص نداری کنار بکش. "
