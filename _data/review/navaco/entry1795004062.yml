description: "یک دیوانه خانه تمام عیار\r\nیک عده دزد و شارلاتان که جز جیب خودشون اهمیتی به چیزی نمیدن. ریزش شدید از نیروهای باتجربه داره. کسی مجبور برای گذران زندگی باشه محاله توی این دیوانه خانه دوام بیاره.\r\nحقوق الان ۲ ماه یک بار شده، حقوقها نسبت به پارسال نه تنها افزایش نداشته با حذف خیلی از بندها من جمله پاداش کمتر از سال پیش هم شده، خیلی ها از خرداد ماه حتی قرارداد هم ندارن و بدکن قرارداد کار میکنن، امیدوارم اداره کار و بیمه شستش خبردار شه.\r\nالبته برای کارشناسای زحمت کش ولی برای رفاقت بازیها و ادمهای دزد و علافی که اتوبوسی اومدن نه، نون دونیه برای اونها، هیچ نظارتی هم روشون نیس\r\nاگر به فکر سلامت روانتون هستید یا نمیخواید بیگاری ازتون کشیده بشه فرار کنید فقط"
