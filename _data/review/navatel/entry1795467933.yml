description: "امیدوارم هر کی میخواد تو این شرکت استخدام بشه کامل تجربه های کاری رو بخونه بعد اقدام کنه \r\nاین شرکت خونه آخره ینی هر وقت دیگه هیچ جا کار پیدا نشد مرحله آخر آخر برید این شرکت چون : \r\nمحصول شرکت وویپ روی اپ خودشونه بعد اگه زیاد گوشی دستت بگیری بهت ایراد میگیرن 🫪 خوب این اپ لامصبو کجا من ببینم !\r\nواحد منابع انسانی فوق العاده بی سواد (الان سواد به داشتن مدرک دانشگاهی نیست ) مخصوصا سرپرست اونجا خانم (ه. ص ) فوق العاده بی سواد و جالبتر اینکه با اینکه هیچ دانش فنی نداره نظرات فنیش رو تحمیل میکنه ، بقیشونم که خیلی بی ادب و بی فرهنگ . یعنی اگر تو بیای به درستی ماست رو سفید بگیری ، یه نفر بیاد بهش گزارش بده که تو ماست سیاه دراوردی ، از نظر منابع انسانی تو صلاحیت کار کردن نداری \r\n-------\r\nحالا برسیم به بحث آموزشی که تو بوق و کرنا میکنن ، آموزش هایی میدن که در عرض یک ساعت چرخیدن در یوتیوب بهتر از اونارو میتونی ببینیی ، بعد سر همونم منت میزارن که تو اینجا یاد گرفتی حالا میخوای بری جای دیگه \r\n------ \r\nبرای آقای (ح.ف) متاسفم که همچین تیم منابع انسانی رو اصن اجازه میده که کار کنن \r\n-------\r\nمن در بخش فنی سال ها تو این شرکت زحمت کشیدم اما اما دریغ از یک ذره قدرشناسی ، حالا هم در به در دنبال جایگزین منن که به دقت من و دانایی من کار کنه که قطعا پیدا نمیکنن کما اینکه هنوزم آگهی اون موقعیت شغلی فعاله \r\n-------\r\nروال اداری فشل ، \r\nدوست عزیزی که میخوای بری تو نواتل کار کنی ، حتما و قطعا هر ماه تقاضای ریز فیش حقوقی کن و اگر ندادن حتما برو شکایت کن اصلا هم نترس\r\nیه نفر از حسابداری با یه تیکه کاغذ ده سانتی میومد بالا سر همه با عنوان فیش حقوقی 🫪 بالاسرتم وایمیساد که سریع امضا کنی و اجازه عکس گرفتن ازشو‌ نداشتی \r\nبازم تاکید میکنم عزیز جان حتما فیش حقوقی هر ماه بخواه ، ندادنش غیرقانونیه \r\n-------- \r\nعزیزی که داری میری مشغول بشی ، قراردادت رو امضا کن ، اما برگه تعهد کاری بلند مدت رو هرگز ابدا حتی اگه به قیمت از دست دادن کارت باشه \r\nتعهد میگیرن که فلان سال کار کنی اگرم به هر دلیل نخواستی کار کنی باید ضررزیان بدی قشنگ سیرکه \r\n------\r\nیه مالک محصول داشت صدای جیغ جیغوش هنوز تو مخمه ، بهش میگفتی api چیه نمیتونست بگه که چیه بعد در هر کاری اظهار نظر و عقیده داشت ، بنده به شخصه در دوارن حضورم هزاران غلط املایی از ایشون گرفتم در زبان انگلیسی آی تی واقعا روی مخ تک تک پرسنل فنی و توسعه بود \r\n-------\r\nیه اتاق حتی کوچیک برای خوردن ناهار نداره ، همه پشت سیستم میخورن  حالا تو فک کن چه بویی میپیچه تو فضا ، تازه بعضی موقع ها مدیر هوس سبزیجات آبپز میکرد همکار خدمات میزاشت کلم بپزه چه فضای عطرآگینی میشد تو همه طبقات \r\n\r\n\r\n\r\n«««««« و در آخر این نکته فوق العاده مهم »»»»\r\n.....:::: اگر ساعت کاریت ۹ تا ۱۸ هست ، ساعت ۹ صبح انگشت بزن برو تو ، ساعت ۱۸ انگشت بزن برو بیرون ، :::::.....  \r\nبرا این اشخاص و برای این شرکت فشل ، اضافه کاری انجام نده و بیشتر هم نمون \r\n\r\n\r\n\r\nیه بار دیگه بگم که این شرکت فشل رو بزار خونه آخرت ، بدرد نمیخوره وقتتو تلف میکنی \r\n\r\n"
