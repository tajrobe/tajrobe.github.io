description: "من خودم چند وقتیه که دارم توی این شرکت کار می‌کنم و حس کردم لازمه دیدگاهم رو به عنوان کسی که هم تو صنعت FMCG   و هم توصنعت فناوری اطلاعات و دارویی کار کرده بگم؛\r\nمحیط نواتل خیلی قانون‌منده به نسبت بقیه جاها، این یعنی ساعت کاری، انضباط اداری و چارچوب‌های مشخصی داره که شاید برای کسایی که به دورکاری‌های بی‌حساب‌وکتاب  یا روتین‌های سنتی و شلوغ عادت دارند یه کمی سخت یا خشک به نظر برسه اما من فکر میکنم همین نظمه باعث میشه اتفاقا اونی که کاریه دیده بشه، من روزی که اومدم با یه عددی توافق کرده بودم انتهای دوره ازمایشیم مدیرم یه عدد دیگه هم روی حقوقم گذاشت صرف اینکه واقعا داشتم متمرکز کار میکردم ،محصول شرکت (ویپ و ارتباطات ابری) یک محصول تخصصیه و اگه شما بیست چاری بخوای بری تو گوشیت بچرخی خب معلومه کارت رو هوا میمونه، ضمنا دوست گلی که نوشته اپ رو کجا ببینم احتمالا با دسکتاپش کار نمیکرده ، آدم میمونه...\r\n\r\nدر مورد منابع انسانی و مدیریت هم، من شخصاً برخورد غیرحرفه‌ای ندیدم؛ مدیر عامل اتفاقا خیلی محترمانه رفتار میکنه چند بار من اتفاقی دیدمشون خیلی واقعا خوش رو بودن و اتفاقا روی اینکه حقوق آن تایم بدن و ... خیلی تاکید دارن  و مدیر منابع انسانی واقعا خوش روعه و توی جلسه مصاحبه به من گفتن کسی که میاد سرکار باید با حال خوب و باانرژی بیاد و ... من دوست داشتم واقعا چون تجربه کار کردن با منابع انسانی تاکسیک رو داشتم، در مورد حقوق من فیش حقوقی خواستم مدیر مالی خانم (آ) پاسخگوم بود و بهم داد و کلا چالشی ندارم و خودشونم هر وقت سوالی داشتم درجا جواب میدن ، در مورد فضای استراحت یا ناهار خوردن هم شاید در مقایسه با شرکت‌های غول‌پیکر فضای بزرگی نداشته باشه اما عمدتا چون همه پرسنل با یه فیلتر سنجیده میشن شخصیتای خوبی دارن و من باهمه راحت بعد از یک ماه ارتباط گرفتم.\r\n\r\nدر کل به نظرم هر شرکتِ ساختاریافته‌ای سبکِ مدیریتی خاص خودش را داره که شاید با سلیقهٔ همه‌ی افراد جور در نیاد،من 5 شنبه ها هم میام سر کار با اینکه اصن روز کاری نیست دلیلشم معلومه دارم پاداش بهره وری مو میگیرم، ارتقای افقی دارن برام رد میکنن چرا نباید بری اینکه پیشرفت کنم کار بکنم؟اتفاقاً برای کسی که به رشد، نظم و کار در یک حوزهٔ تکنولوژی محور علاقه داره، به نظر من جای خوبی برای یادگیریه و اینکه حقوق و مزایاش هم نسبت به بقیه شرکت یه سر و گردن بالاتره، منکه راضی ام و مشکلی هم با ساختارش ندارم"
