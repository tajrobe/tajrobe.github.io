description: "من چند ماهه که در شرکت آریا سامانه(نواتل) مشغول به کار شدم و این جا رو نسبت به دو تجربه ی قبلی کاریم بسیار بیش تر دوست دارم.\r\n\r\nاولین چیزی که در نواتل به نظرم به شکل واضحی وجود داره فرهنگ کاری خوب و نبود حاشیه است.\r\nو از همه مهم تر رقابت آزاردهنده وجود نداره و همه ی افراد واقعااااااا بهم کمک می کنن و این به نظرم هم جو مثبتی ایجاد کرده و هم واقعا ارزشمنده\r\nنواتل نظم و روتین خودش رو داره اما قوانین خشک، غیر ضروری  یا غیر قابل انعطاف نیستن.\r\nهمچنین آدما فارغ از اینکه چه مدته در سازمان هستن می تونن پیشنهاد بدن و نظراتشون شنیده میشه\r\nنکته ی دیگه اینکه فضای اینجا طوریه که آدم حس می‌کنه بهش اعتماد میشه؛ می‌تونه تصمیم بگیره و کارها رو پیش ببره و این برای من به شخصه تجربه مثبتی بوده.\r\nفرایند آنبوردینگ هم به نظرم تا حد زیادی شفافه و آدما در روزهای اول کاری سرگردان نیستن. انتظارات هم شفافن و سلیقه‌ای نیستن.\r\nتعادل کار و زندگی هم خوبه؛ و اضافه کار به معنای اجباری وجود نداره، \r\nو حجم کار و تلاش آدما هم دیده میشه.\r\n\r\n\r\n تنها چیزی که به نظرم بهتر شدنش به بهتر شدن فضای کاری نواتل کمک می کنه هماهنگی بیش تر بین تصمیمات و واحد هاست و فکر می کنم به مرور هم این اتفاق بیش تر بیفته.\r\n\r\nدر کل من تا به این جا تجربه ی مثبتی از حضور در نواتل داشتم و این جا رو به آدمایی که به دنبال یک محیط کاری بدون حاشیه هستن توصیه می کنم.\r\n\r\n"
