description: "درسته، شرکت اصلاً شرایط ایده‌آلی نداره؛ برخلاف چیزی که در ظاهر نشون می‌ده یا چیزی که می‌خوان از بیرون نشون بدن.\r\nمدیران ارشد خیلی وقت‌ها در جریان مسائل واقعی نیستن و به نظرم بعضی چیزهایی هم که اخیراً گفته شده، یا درست نیست یا اصلاً نباید مطرح می‌شد.\r\nدر مجموع، شرکت از نظر ساختار و فضای کاری خیلی قوی نیست و حاشیه و موارد سمی هم کم نداره. بین نیروها هم متأسفانه تفاوت و تبعیض دیده می‌شه. حتی ممکنه نیرویی که واقعاً کارش رو درست انجام می‌ده، صرفاً به خاطر اینکه مدیر مستقیمش دیدگاه خوبی نسبت بهش نداره، پاداش یا مزایای تشویقی مناسبی دریافت نکنه.\r\nمثلاً یکی از دوستای خودم یه وام تشویقی گرفته بود و خودش باورش نمی‌شد که این وام بهش تعلق گرفته، ولی هم‌تیمی خودش با شرایط خیلی بهتر از این مزیت محروم شده. یعنی واقعاً تفاوت‌ها بعضی وقت‌ها تا این حد محسوسه.\r\nحتی برای خود من هم پیش اومده که بابت روابطم با همکارها سؤال و جواب بشم؛ مثلاً اینکه چرا با فلان همکارت خیلی صمیمی هستی ولی با اون یکی نیستی. یعنی بعضی وقت‌ها واقعاً روی مسائل خیلی جزئی هم حساس می‌شن و مو رو از ماست می‌کشن.\r\nکلاً لیست پاداش و تسهیلات تشویقی ابتدا به مدیر مستقیم می‌ره و اعمال و تأییدش هم تا حد زیادی به نظر همون مدیر بستگی داره. تیم‌بازی و باندبازی هم متأسفانه وجود داره و این موضوع روی تصمیمات مربوط به نیروها بی‌تأثیر نیست.\r\nبین نیروهای قدیمی و جدید هم تفاوت زیاده. البته منظورم از نیروی قدیمی، الزاماً نیروهای خیلی قدیمی نیست؛ حتی کسی که سه چهار سال سابقه داره هم ممکنه مشمول این نگاه بشه. از طرف دیگه، نیروهای جدید معمولاً یه مدت خیلی مورد توجه قرار می‌گیرن، ولی بعد از مدتی که خودشون تبدیل به نیروی قدیمی می‌شن، کم‌کم همون داستان‌ها براشون تکرار می‌شه.\r\nدر مورد مدیرهای مستقیم هم خیلی انتظار نداشته باشید. به‌جز یکی دو نفر، بقیه واقعاً در حدی نیستن که بشه خیلی روی مدیریت یا حمایت‌شون حساب کرد؛ حتی بعضی‌هاشون انتخاب مناسبی برای پست مدیریتی نیستن.\r\nمدیرعامل هم حرف و حدیث کم نداره و درباره عملکرد و تصمیماتش صحبت‌های مختلفی مطرحه.\r\nمنابع انسانی هم عملاً سمت نیروها نیست. بیشتر این حس وجود داره که منافع شرکت و از اون مهم تر مدیر عامل رو دنبال می‌کنن و حرف‌ها و دغدغه‌های بچه‌ها خیلی جدی گرفته نمی‌شه. در نتیجه اعتماد زیادی هم به منابع انسانی وجود نداره."
