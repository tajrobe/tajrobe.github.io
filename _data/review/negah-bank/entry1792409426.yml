description: "نگاه بانک سمی ترین و وحشتناک ترین سازمانی که میتونید کار کنید. بیسواد ترین و بیکارترین مدیر عاملی که دیدید ن. محمدی هست. کلا فقط از صبح نشسته ساعت ورود و خروج چک میکنه . نه پلنی داره نه دنبال پروژه جدیدی واسه سازمان نه تفکر استراتژیکی داره... کلا فقط نشسته تو اتاق دنبال حاشیه هاست، کی چه زمانی اومده؟ کی رفته؟ با کی بوده؟ حجاب داره یا نداره؟ یه آدم ولایتی پرچم به دست که با همین کارا شده مدیرعامل. کلا کسی که کار میکنه و تخصص داره رو نمیخواد ولی کافیه کسی بی‌شعور و بد دهن و عصبی باشه، می‌چسبه به همون\r\nاز مدیرای سازمان هم نگم که یک از یک بی‌شخصیت تر و بی ادب تر و بی‌سواد تر و برای اینکه بی سوادیشون دامن گیرشون نشه فقط با کولی بازی کارارو پیش میبرن.\r\nخروج سازمان فاجعه است. از صبح که میایم فقط خبر استعفای افراد رو میشنویم، به غیر از مدیرا که قدیمی و نیروی رسمی بانک هستند، برای هیچ کسی امنیت شغلی وجود نداره\r\nحقوقشون معلوم نیست چجوری، ده سالم کار کنی نمیفهمدی داری چقدر حقوق میگیری...\r\nخلاصه کلاهتون هم اینجا افتاد سمت نگاه نیاین. من خودم اول به کامت های اینجا توجه نکردم و اومدم دیدم دقیقا همه درست توصیف کردن شرایط رو...\r\nمن که رفتم از شرکت، امیدوارم هیچ وقت دیگه درگیر همچین سمی نشم"
