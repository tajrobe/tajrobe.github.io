description: "مصاحبه هاش که حضوری بود و با توهین آمیز ترین مدل ممکن جلو رفت. در صورتیکه این مصاحبه های آبکی رو راحت میشد آنلاین برگزار کنن. بیشعوری مسئولینش هم با تاخیر تو شروع مصاحبه ها میشه فهمید!\r\nمصاحبه اولیش تکنیکال هستش با یه خانمی به اسم لیلا عبدالملکی که بسیار بی ادب و بی شخصیته و خیلی هم بیسواده, سوالاتی که میپرسید 2 تاش اشتباه بود و بدبخت خودش گیر کرد سریع رفت سوال بعدی...... و اینکه خیلی خوشحال بود شرکت بانکی با اینهمه مشتری محصول اصلیشون یعنی hibank روی ساختار create react app هستش که چند سال منسوخ شده.... دیگه ببین چه شاسکولهایی بودن 🤣\r\nمصاحبه دوم هم با خانمی هستش شبیه بازجوها به اسم شکوفه داودی که فکر کرده هرکول پوآرو هستش و سوالاتی میپرسه که مرغ پخته خندش میگیره. ولی یه عتیقه دیگه هم تو مصاحبه هست به نام پانته آ خطیر که البته تو کامنت های قبلی به زشت بودن قیافه اش اشاره کردن ولی بنظر من نه تنها قیافش زشت بود بلکه رفتار و سیرت زشتی هم داشت!\r\nخیلی جالبه تو مصاحبه حواسشون نیست هنوز استخدام نشدی و مثل سگی که پاچه میگیره بخاطر اضافه کار نموندن تهدید می کنن 🤣\r\nدرکل اون بحث محل شرکت که دسترسی مستقیم نداره و پایین بودن حقوق کاملا درسته. چون اینها به بهانه بانکی بودن یه حقوق کف میدن نزدیک به وزارت کار و با وعده های دروغین میگن اضافه اش می کنیم ولی این هیچوقت اتفاق نمی افته.\r\nوقتم حروم شد. واقعا بی ارزش بود !!!!!"
