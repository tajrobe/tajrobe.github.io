description: "نگاه بانک واقعا اسم برازنده ای داره چون تنها کاری که میکنند نگاه کردن هست. نگاه کردن و هیچ کاری نکردن. نگاه کردن و کنترل کردن ادما اونم از نوع مذهبی طور. خانم ها باید حجاب داشته باشن تو سازمان و جلو مدیر عامل این قضیه جدی تره ولی خود مدیر عامل با دوست دخترش (ف. علیزاده) که تیپ و آرایشش شبیه زن های هرجاییه، میرن ساعت تو اتاق با در بسته .... کلا مدیر عامل یه ادم متظاهر که فقط بلده واسه دیگرون بر اساس امراض ذهنی خودش نسخه بپیچه ولی کسی روی کارها و کثافت کاری های خودش نظارتی نداره...\r\nتعادل کار و زندگی رو کلا وقتی میای تو نگاه باید ببوسی بزاری کنار چون جدا از اضافه کاری های دیوونه کننده، مدیر عامل مریض زنگ میزنه به افراد و پنجشنبه و جمعه میکشونشون شرکت . اگر هم نیای اخراجی- تو اوج جنگ که همه جا دور کار بودن اینا ادما رو میکشوندن شرکت و اگه نمیومدی بازم اخراج بودی\r\nبسیار فرهنگ سوگلی داشتن اینجا رایجه . هر مدیر یه سوگلی داره واسه خودش و به صورت واضح و عیان این رو مطرح میکنه و تبعیض قائل میشه \r\nکلا نگاه به غیر از اینکه اعصاب و روان و جسمتون رو نابود کنه هیچی نداره . حتی اگر یکسال هم تو خونه بیکار بودید باز هم اگر از نگاه آفر گرفتید نیاین . پشت سرتون هم نگاه نکنید"
