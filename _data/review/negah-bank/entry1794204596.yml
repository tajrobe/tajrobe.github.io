description: "من چندین سال در نگاه مشغول کار بودم و تجربه کار کردن با خیلی از مدیرها رو داشتم بنظرم نگاه بیشتر به درد اون دسته افرادی میخوره که توانایی فنی بالایی ندارند ، خیلی تعادل کار و زندگی براشون مهم نیست و به نگاه به عنوان مقصد آخر کاریشون نگاه میکنند \r\nمدیرلن نگاه و حتی کارشناس های ارشد شرکت به شدت سمی و پاچه خوارن ، دانش فنی بالایی ندارن و نمیخوان داشته باشند و چون احتمالا جای دیگه فرصتی نمیبینن هرکاری میکنن که بمونن \r\nاینجا حقوق پایه تون پایینه که اگه خواستن تعدیل کنن با هزینه پایین تری اینکار و کنند و بقیه حقوقتون که ۶۰ درصد اون رو شامل میشه به شکل صدقه و با نظر مدیر و بسته به اینکه چند تا شب رو موندین و پنجشنبه جمعه اومدین بهتون داده میشه . \r\nگول حرف های منابع انسانی رو نخورید چون به جز حقوق پایه در هیچ پرداختی دیگه تعهدی وجود نداره و به راحتی میگن نمیدیم \r\nشناوری دارن ولی شما چندبار بعد از ۹ بیا تا ببینی چه عواقبی داره \r\n\r\nبنظرم تا وقتی ن.م مدیرعامل اونجاست پ.خطیر مدیر ارشد شرکته حتی به رفتن به اونجا فکر هم نکنید و رزومه تون رو خراب نکنید .\r\n"
