description: "فقط اسنپ باید بگیری و دقیقا ته کوچه تو شمال جردن باید برید. دم در مدرک شناسایی میدین و بالا که میری اصلا گم میشی و معلوم نبود کجا باید بری.\r\nنه کسی برای خوش امد گویی اومد و نه پذیرا حتی در حد یک لیوان آب.\r\nادم هاش خیلی عجیب و عصبی یا بهتر بگم افسرده بودن‌.\r\nجلسه کنار اطاق کارمندای hr بود و شنیدم خانمه داد میزد حقوق بالاتر از عدد x نگیرید و سعی کنید پایین بیارید.\r\nنزدیک ۲۰ دقیقه بعد مصاحبه شروع شد و کسیکه برای مصاحبه اومد باور کنید جونیور هم نبود و گفت خودم تنهام اینجا و اسکرام مسترها رفتن از شرکت 😳\r\nخلاصه اسید خالص بود......"
