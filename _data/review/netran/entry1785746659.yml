description: "پروژه ای برای شرکت انجام و تحویل شد و با کلی پیگیری پرداخت هزینه کردن\r\nبعد از آن کلی تعریف که ما سایت فروشگاه داریم و  کلی کارمند داریم. قصد داریم تیم توسعه تشکیل بدیم برای تولید پاره ای محصولات. خلاصه دعوت شد که با مدیرعامل شرکت جلسه داشته باشیم. \r\nدر جلسه به این نتیجه رسیدیم که آگهی استخدام گذاشته بشه و دو نفر برنامه نویس با حداقل حقوق که کارآموز هم باشن جذب بشن.\r\nدرون جلسات مصاحبه با نیروها حضور داشتم و دو نفر از عزیزانی که از دید اونها کارآموز حساب میشدن ولی نیروهای خوش فکر و با سوادی بودن.  جذب شدن\r\nقرارداد با بنده، هی امروز و فردا میشد. دو هفته گذشت و هیچ قراردادی رو تنظیم نکردن. من دیگه درگیر کارهای خودم بودم و طبق قراردادی که باید بسته میشد، هفته سه روز باید عصرها میرفتم حضوری اونجا.\r\nدر طول دو هفته با این که قرارداد نداشتم، ولی خودم رو مسيول اون دو عزیزی میدونستم که با صحبت های من و طبق قول یادگیری که بهشون داده بودم میرفتم\r\nهفته دوم، از سمت یکی از کارمندان پیام عجیبی برام ارسال شد\r\n؛ ما دو هفته هست داریم کار میکنیم، هیچ قراردادی نبستن. تازه در مورد بیمه گفتن باید ۳ ماه باشید و بعد از ۳ ماه بیمه رد میشه. ما بخاطر شما تا کنون حرفی نزدیم و تا آخرش برای تحویل تسکها هم هستیم\r\nخیلی این موارد سنگین بود. اون دو نفر واقعا همه تسکها رو انجام داده بودن. فروشگاه زمین تا آسمون با دو هفته پیشش فرق میکرد. کلا از بیس قالب جدید طراحی شده بود\r\nمن پیگیر شدم، گفتم چرا این طوری هست. همون حرفی که به من میزدن ما در حال تنظیم قرارداد هستیم. هفته دیگه بگید امضا کنن\r\nبعد از گذشت ۴ هفته که باید حقوق میدادن، هنوز قرارداد بسته نشده بود\r\nپیام آخری که اون دو عزیز بهم دادن و من  شرمم شد اصلا بهش جواب بدم این بوده\r\nگفتن مواردی که انجام شده رو چون قرارداد ندارید، میتونیم پروژه ای بهتون پرداخت کنیم\r\nدر آخر همون مبلغ پروژه ای هم بهشون ندادن.\r\nمن دلم اصلا برای اون پول اسنپهایی که دادم نسوخت، اصلا ساعاتی رو که بعد از ساعت ۵ به همراه اون دو عزییز میذاشت برای بررسی پروژه ها به کنار، اون وقت و انرژی و حق و حقوق دو عزیز خیلی دلم سوخت.\r\nخلاصه با این شرکت نه برای کارمندی و نه پروژه به هیچ عنوان پیشنهاد نمیشه."
