description: "ای کاش قبل وارد شدن به این خراب شده این سایت رو میدیدم، نوین چرم رو بواسطه تبلیغاتی که تو تلوزیون داشت میشناختم آگهی رو ک دیدم با خودم گفتم این یه شرکت قدره و رفتم‌مصاحبه اما بی خبر ازینکه برعکس اسم پوشالی که مدیر کلاش و قالتاقش درست کرده این شرکت دست کمی از کارفرما های حق مظلوم‌خور نداره. تمام‌کساییم که اونجا موندن نود درصد مجبورن. حقوق چندرغاز اما کار و بیگاری تا دلت بخواد بدون اینکه کوچکترین امکانات یا مزیتی بهت بدن تازه همون حقوقم با کلی دیرکرد میدن من همین ماه پیش درومدم با کلی کار حمالی ک کردم بدنم هنوز درد میکنه هنوز خستگی از‌تو جونم‌در نیومده اما حقوق ماه پیشمو بهم ندادن گفتن با تسویه میدیم اما تاریخ دقیقی واس تسویه نمیدن خلاصه کلاه بزرگ و تجربه تلخی بود برای من واقعن باورم نمیشه اون حجم کار اما یه لباس کار زورشون میومد بدن مجبور بودیم لباس خونگی بیاریم‌ بپوشیم و ککشونم نمیگزید.\r\nمنابع انسانی عوضیش همه ی اینارو میدونه و باز براحتی در باغ سبز نشون میده مردمم چیکار کنن کار نیست میبینن اسمشو خیلیا  میفتن تو دردسر در صورتی که خبری از حقوق و مزایا نیست.\r\n\r\nمنکه حقوقم ندادن نمیدونم شکایت کنم جوابی میگیرم یا نه ولی امیدوارم یروزی خبر ورشکستگیش و زمین خوردن این شرکتو بشنوم.\r\nعوضیایی که من باهاشون برخورد داشتم:\r\nحیدری کارشناس خاله زنک منابع انسانی که گوشی دستش همیشه آماده وراجی بود، خیلی ژست کاربلدارو میگیره ولی در حقیقت یه بازیچه بیش نیس، سرپرستم خاکسا.ر یه پسر خام جوون که با واسطه شده سرپرست انبار گند زده کلن به اونجا.\r\nاسامی دیگم نمیگنجه ولی همین کارمندای ولد زناشون یکی از عاملای آزار خیلیان صادقانه.\r\nخلاصه اگر یسری چیزارو مراعات نمیکردم بلد بودم حالشون بگیرم ولی خب....\r\nفقط من با این سایت آشنایی نداشتم بنظرم این سایت باید بیشتر ازینا تو چشم باشه تا سر کارجوها کلاه نره ولسلام\r\n"
