description: "اومدم چک کنم تجربه ام ثبت شده که دیدم چه فجایعی داره تو شرکت اتفاق می افته\r\nای کاش حرفای همکارانی که پیش من در این مورد صحبت کرده بودم جدی میگرفتم.\r\nبه یکی از هممارانم که خانم هستند بازگو کردم موضوعو. و متوجه شدم ایشون به عنوان همکار مستقیمم هم این تجربه تلخ رو داشته. کاش زمانی که تو شرکت بودم کاری کرده بودم. کاش حساس تر بودم به حرفایی که فکر میکردمشایعه هستن\r\nاز مدیر محترم منابع انسانی میخوام که یه ماری برای بانوان که هم جنس خودشون هستن انجام بدن تو اون خراب شده. \r\nاینجوری به ما هم ثابت میشه که شایعات پشت سر خودشون هم دروغ بوده\r\n"
