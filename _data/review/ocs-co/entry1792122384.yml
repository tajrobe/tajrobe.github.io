description: "\r\n\r\nدرباره مدیرعامل و مدیر منابع انسانی شرکت موضوعاتی مطرح شده که به نظرم قابل تأمل است.\r\nبر اساس صحبتهایی که شخصا از یکی از اعضای هیات‌ مدیره شنیده‌ام میان مدیرعامل و مدیر منابع انسانی رابطه‌ ای عاطفی وجود دارد که ظاهرا به سالها قبل برمیگردد. همچنین گفته شده که مدیر منابع انسانی در چند مجموعه‌ ای که مدیرعامل پیشتر در آنها فعالیت داشته، همراه او مشغول به کار شده است.\r\nطبق همین اظهارات این موضوع یکی از دلایل مخالفت برخی اعضای هیات‌مدیره با حضور ایشان در شرکت بوده است.\r\nمن درباره سایر مسائل شخصی ایشان اطلاعات موثقی ندارم و نمیخواهم در این خصوص قضاوتی داشته باشم. اما در صورت صحت این موضوع، وجود چنین رابطه‌ای میان مدیرعامل و مدیر منابع انسانی می‌تواند از منظر تعارض منافع، استقلال تصمیم‌گیری و شفافیت در مدیریت منابع انسانی محل پرسش و بررسی باشد.\r\n"
