description: "مدیرعامل شرکت، *** و مدیر منابع انسانی، *** با رفتارها و حواشی ایجادشده، شرایطی را در شرکت به وجود آورده‌اند که گویی محیط کاری را با مسائل و روابط شخصی خود اشتباه گرفته‌اند.\r\n\r\nمتأسفانه، موضوع ارتباط نزدیک و خارج از چارچوب حرفه‌ای این دو نفر، به مسئله‌ای شناخته‌شده در میان معاونان فعلی و برخی مدیران سابق شرکت تبدیل شده است. همچنین گفته می‌شود مدیرعامل، خانم «***» را از محل کار قبلی خود به این مجموعه آورده است؛ انتصابی که از همان ابتدا با مخالفت تعدادی از معاونان فعلی و سابق شرکت مواجه بوده است. دلیل این مخالفت‌ها نیز، به گفته این افراد، نبود تجربه و تخصص کافی برای تصدی جایگاه مدیریت منابع انسانی بوده است.\r\n\r\nنکته نگران‌کننده‌تر، بی‌توجهی به گزارش‌ها و اعتراض‌های مکرر کارکنان، به‌ویژه برخی از بانوان شرکت، درباره رفتارهای نامناسب و آزاردهنده منتسب به مدیرعامل است. متأسفانه مدیر منابع انسانی نیز، با وجود اطلاع از این اعتراض‌ها، اقدام مؤثر و قابل‌توجهی برای پیگیری و رسیدگی به آن‌ها انجام نداده است.\r\n\r\nاین مسائل بارها از طریق گزارش‌های مختلف به مدیرعامل بانک *** منتقل شده‌اند. حتی در برخی موارد، مستندات و شواهد مشخصی نیز ارائه شده، اما تاکنون اقدام مؤثر و روشنی برای بررسی موضوع و برخورد با تخلفات احتمالی صورت نگرفته است.\r\n\r\nانتظار می‌رود بانک به‌جای نادیده گرفتن این گزارش‌ها، با تشکیل یک تیم مستقل و بی‌طرف، موضوع را به‌صورت جدی بررسی کند؛ چراکه شرکت محل فعالیت حرفه‌ای کارکنان است، نه فضایی برای تسویه‌حساب‌های شخصی، روابط خارج از عرف سازمانی یا نادیده گرفتن حقوق و امنیت شغلی کارکنان."
