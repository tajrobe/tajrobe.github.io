description: "پستها رو خوندم و واقعاً نگران‌ کننده است که چنین روایتهایی درباره رفتار با خانم‌های مجرد و متاهل این شرکت مطرح میشه.\r\n\r\nطبق روایتهای دیده و شنیده شده ظاهرا تعدادی از خانمهای شرکت به منزل مدیرعامل رفت‌وآمد داشته‌اند و به برخی از آن‌ها وعده‌هایی مثل عشق، رابطه و ازدواج داده شده.\r\n\r\nفارغ از صحت‌وسقم این روایتها امیدوارم سلامت و امنیت روانی و جسمی هیچ‌کدام از افراد درگیر به خطر نیفتاده باشه.\r\n\r\nاز واحد منابع انسانی انتظار می‌ره امکان دسترسی محرمانه و داوطلبانه کارکنان به مشاوره و آزمایش‌های HIV و هپاتیت رو از طریق مراکز معتبر فراهم کنه.\r\n\r\nسلامت و کرامت کارکنان شوخی‌بردار نیست."
