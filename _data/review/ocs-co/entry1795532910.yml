description: "من به‌عنوان کسی که از نزدیک در این مجموعه حضور داشتم و با هر دو مدیر کار کردم، واقعاً نمی‌تونم در برابر بعضی از این حرف‌ها سکوت کنم.\r\nمدیر منابع انسانی کسی بوده که همیشه پای حرف‌های پرسنل نشسته، دغدغه‌هاشون رو شنیده و تا جایی که تونسته برای حل مشکلاتشون کمک کرده. هم دانش و تخصص این حوزه رو داره و هم واقعاً دغدغه‌مند آدم‌هاست. همیشه رفاه، آرامش و حال خوب کارکنان و حتی خانواده‌هاشون براش اهمیت داشته. حفظ عزت‌نفس و کرامت انسانی تک‌تک پرسنل براش یک اصل بوده و این‌ها چیزهایی نیست که بشه به‌سادگی نادیده گرفت.\r\nدر مورد مدیرعامل هم واقعاً بعضی حرف‌ها دور از انصاف و به‌شدت ناراحت‌کننده‌ست. من در تمام مدتی که ایشون رو شناختم، حتی یک‌بار هم رفتار یا نگاه خارج از چارچوب و غیرحرفه‌ای ازشون ندیدم. همیشه با احترام و شأن انسانی با همکاران، به‌خصوص بانوان مجموعه، برخورد کرده‌اند. چطور به خودمون اجازه می‌دیم بدون سند و صرفاً بر اساس برداشت‌ها و شنیده‌ها، درباره شخصیت و روابط خصوصی آدم‌ها چنین قضاوت‌های سنگینی کنیم؟\r\nدر شرایط سخت جنگ، وقتی خیلی از مجموعه‌ها با بحران‌های جدی مواجه بودند، ایشون با شب‌بیداری، پیگیری و ازخودگذشتگی تلاش کردند شرکت سرپا بمونه. واقعاً انگار شرکت رو مثل فرزند خودشون می‌دونن و با تمام وجود ازش مراقبت می‌کنن. همیشه هم پرداخت حقوق و تعهدات پرسنل رو در اولویت قرار دادند و حقوق‌ها به‌موقع پرداخت شده.\r\nواقعاً جای تأسف داره که زحمات و تلاش‌های این‌چنینی به این راحتی نادیده گرفته می‌شه. چرا باید این‌قدر راحت درباره آدم‌ها، شخصیتشون و روابطشون قضاوت کنیم؟ کمی انصاف، وجدان و قدردانی هم چیز بدی نیستا!!!!!!!!!\r\nقرار نیست هیچ مدیری بی‌نقص باشه، اما انصاف اینه که درباره آدم‌ها بر اساس چیزی که واقعاً ازشون دیدیم قضاوت کنیم، نه شایعات و حرف‌های تأییدنشده. بعضی حرف‌ها فقط یک انتقاد ساده نیستند؛ می‌تونن اعتبار و آبروی انسانی رو هدف قرار بدن. کاش قبل از گفتن چنین حرف‌هایی کمی بیشتر فکر کنیم!!"
