description: "من یه یکی از شعب افق کوروش مراجعه کردم و بهم گفتن که باید بیای ۳ تا ۵ روز رو مجانی کار کنی اگه راضی بودیم میفرستیمت بری دنبال کارات برای قرارداد من روز اول رفتم و بهم گفتن که یکی از قفسه هارو تمیز کنم که تقریبا ۲ ساعت طول کشید بعد کار با صندوق رو یاد گرفتم و کمی هم سفارش آنلاین و آخر شب بهم گفتن که دیگه نیام  صندوق باید سرعت عمل داشته باشی حواست باشه دوبار اسکن نکنی و پلاستیک بدی مشتری خلاصه که دردسر خودشو داره یا اگه نقدی باشه باید وارد کنی که چقدر نقد گرفتی تو قسمت سفارش آنلاین هم هرچیزی رو که برمیداری باید اسکن کنی و اگر بستنی یا کره توشون باشه باید بزاری یخچال و قبل این که پیک بیاد اونارو آماده کنی بدی دستش خلاصه کار خیلی سختی نیست ولی خب نه کمر برات میمونه نه پا من الان دو روزه نرفتم هنوزم پا و کمرم درد میکنه بعدش هم که دیگه گفتن تماس میگیریم باهات که نگرفتن احتمالا اون یکی زیروآب منو زده چون دیدم هی با سرپرست فروشگاه پچ پچ می‌کرد در صورتی که من از اون خیلی بهتر بودم"
