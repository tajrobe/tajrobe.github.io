description: "با سلام و احترام\r\nکار در شرکت افق کوروش بشدت فرسایشی است.\r\n\r\nحجم کار بشدت بالاست.\r\n\r\nخارج از ساعت کاری و در مرخصی ، باید دایما تلفنتون رو پایخ بدید و کار رو پیگیری کنید‌.\r\n\r\nبه هیچ عنوان به زندگی و مسافرت و تفریح نمی رسید.\r\n\r\nبه هیچ عنوان به هیچ عنوان به هیچ عنوان امنیت شغلی ندارید و هر لحظه و به هر دلیل ، ممکنه بهتون علام کنند که بهتون نیاز نداریم و جوانی و عمر و سلامتیتون اهمیت نخواهد داشت.\r\n\r\nدر محیط کار با اعصاب خوردی زیادی روبرو هستید.\r\n\r\nروز تعطیل ندارید و در استراحت و در تفریح و در میهمانی و در ولادت و شهادت ، باید تلفنتون رو پاسخگو باشید.\r\n\r\nفکر و روح و روان و چشم و کمر و سلامتیتون در این شرکت از بین خواهد رفت.\r\n\r\n\r\nاما حقوقتون به موقع پرداخت میشه.\r\nبیمه و بیمه تکمیلی هستید.\r\nوام پرداخت میشه.\r\nکادوی روز کارگر و روز تولد دارید.\r\nکادوی روز ازدواج و فرزندآوری دارید.\r\nارزاق هر سه ماه یکبار دارید.\r\nوام مسکن به افراد بالای ۷ سال سابقه پرداخت میشه که احتمال اینکه شما به ۷سال سابقه برسید ، خیلی کمه.\r\n\r\nدر کل این شرکت بدرد کسانی می خوره هیچ تخصصی ندارند.\r\n\r\nبرای افرادی که صاحب تخصص و مهارت و هنری هستند ، این شرکت رو به هیییییچ وجه پیشنهاد نمی کنم."
