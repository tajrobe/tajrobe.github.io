description: "شرکت رانتی ‌و فاسد که به قبرستون برنامه نویس ها شبیه هستش. موقع جذب کلی استعلام و رفنس چک و مدرک ازت میگیرن که هیچ باید چند صد میلیون سفته جهت حسن انجام کار بدی.\r\nتمام پروژه ها بخاطر فرار نیروهای قبلی نصف و نیمه رها شدن و منابع انسانی یه تیم جدا داره که هر روز تو دادگاه های اداره کار برن جواب پس بدن. چون هر کسی میره حقوقش رو نمیدن و شکایت میکنه.\r\nمزایا صفر و اون هدایا و اراجیفی که وعده اش رو میدن شامل نو چشمی ها میشه فقط.\r\nاینم بگم که محیط شرکت شبیه دفتر پلیس+۱۰ هستش و همه تو هم نشستن و حس کار اداری بهت دست میده تا محیط مناسب کار!\r\nدرکل اگر نیروی برنامه نویس هستی امید تک رو اصلا توصیه نمی کنم."
