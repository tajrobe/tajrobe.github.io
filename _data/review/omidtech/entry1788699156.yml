description: "اگر قصد دارید وارد امیدتک شوید، قبل از اینکه تصمیم نهایی بگیرید، حتماً با چند نفر از نیروهای فعلی و سابق شرکت صحبت کنید. چیزی که در مصاحبه و زمان جذب می‌شنوید، لزوماً چیزی نیست که در ادامه تجربه می‌کنید.\r\n\r\nمشکل من فقط حقوق پایین یا زیاد بودن کار نبود. مسئله اصلی، مدیریت، رفتار سازمانی، نبود شفافیت و وعده‌هایی بود که در عمل پشتوانه‌ای نداشتند.\r\nمن با حقوقی پایین‌تر از چیزی که انتظار داشتم وارد شرکت شدم، با این صحبت که بعد از مدتی شرایط حقوقی اصلاح می‌شود. چند ماه گذشت و خبری نشد. بعد برای افزایش حقوق، شرایط و کارهایی تعیین شد؛ کارها انجام شد، مسئولیت‌ها هم کم نشد، ولی باز هم افزایش حقوقی اتفاق نیفتاد. در نهایت، در تمام مدت همکاری حتی یک ریال هم به حقوقم اضافه نشد.\r\nو این فقط تجربه من نبود. در تصمیم‌های مربوط به حقوق و مزایا، معیار مشخص و شفافی نمی‌دیدم که بدانم اگر خوب کار کنم، دقیقاً چه مسیری برای بهتر شدن شرایط وجود دارد.\r\n\r\nمدیریت:\r\nیکی از جدی‌ترین مشکلات، نحوه مدیریت در سطوح مختلف بود.\r\nدر سطح مدیرعامل، چیزی که من تجربه کردم، فاصله زیاد بین انتظار از کارکنان و توجه به عملکرد واقعی آنها بود. وقتی برای یک موضوع شغلی یا حقوقی مستقیماً صحبت می‌کردی، خیلی وقت‌ها به جای اینکه عملکرد و مسئولیت‌ها واقعاً بررسی شود، مسئله ساده‌سازی یا کم‌اهمیت جلوه داده می‌شد.\r\nحتی مواردی که ماهیت کاملاً شخصی و کاری داشتند، گاهی در جمع مطرح می‌شدند. برای من این رفتار اصلاً حرفه‌ای نبود و حس احترام و امنیتی که باید در یک محیط کاری وجود داشته باشد را از بین می‌برد.\r\nدر مورد معاونت توسعه محصول هم تجربه من این بود که وقتی مشکلی بین مدیران یا در مورد شرایط کاری یک نیرو وجود داشت، انتظار داشتم معاونت بالاتر وارد شود و موضوع را مدیریت کند؛ اما در عمل بارها شاهد پاس‌کاری مسئولیت بین مدیران بودم.\r\nمثلاً موضوعی را از مدیر یک واحد پیگیری می‌کردی، می‌گفت تصمیم از معاونت بوده. به معاونت مراجعه می‌کردی، ارجاع می‌دادند به مدیرعامل. از طرف مدیر عامل هم ممکن بود پاسخ متفاوتی بشنوی. آخرش هم مشخص نبود دقیقاً چه کسی مسئول تصمیم است.\r\n\r\nمنابع انسانی:\r\nتجربه من از مدیریت منابع انسانی هم یکی از نقاط منفی جدی بود.\r\nبرای من HR باید جایی باشد که کارمند بتواند بدون ترس و نگرانی مسئله‌اش را مطرح کند. اما چیزی که من تجربه کردم این بود که صحبت‌هایی که با تصور محرمانه بودن به مدیر HRمطرح می‌شدند، همیشه محرمانه باقی نمی‌ماندند.\r\nکه این خود باعث بیشتر شدن تنش بین همکاران میشد.وقتی کارمند احساس کند هر چیزی که به HR می‌گوید ممکن است خیلی سریع در مجموعه پخش شود، طبیعی است که دیگر نتواند با خیال راحت مشکلش را مطرح کند.\r\nاز طرف دیگر، در بسیاری از موارد احساس من این بود که HR بیشتر در نقش دفاع از تصمیمات مدیریتی ظاهر می‌شود تا اینکه واقعاً بین کارمند و مدیریت نقش میانجی و حامی داشته باشد.\r\n\r\nمدیران واحدها و فضای داخلی:\r\nتجربه با مدیر مستقیم هم کاملاً به خود فرد بستگی داشت. در این مجموعه، رفتار مدیر می‌توانست تفاوت خیلی زیادی در تجربه کاری ایجاد کند؛ من هم مدیرانی دیدم که همکاری با آنها خوب و حرفه‌ای بود و هم مدیرانی را تجربه کردم که فضای کاری را واقعاً فرسایشی کرد.\r\nمشکل زمانی جدی می‌شود که رفتار نامناسب یک مدیر، با وجود اطلاع مدیران بالاتر، اصلاح نشود.\r\nدر چنین شرایطی، کارمند کم‌کم یاد می‌گیرد که به جای تمرکز روی کار، باید مراقب روابط، حاشیه‌ها و برداشت‌های افراد از خودش باشد. این دقیقاً همان چیزی است که یک محیط کاری سالم نباید باشد.\r\n\r\nافزایش حقوق و وعده‌های شغلی:\r\nاگر بخواهم فقط یک نکته به کسی که می‌خواهد وارد این شرکت شود بگویم، این است:\r\nبه وعده شفاهی اعتماد نکنید.\r\nاگر گفتند «بعداً حقوقت را درست می‌کنیم»، «بعداً ارتقا می‌گیری»، «اگر فلان کار را انجام بدهی شرایطت بهتر می‌شود» یا «فعلاً با این شرایط بیا و بعداً اصلاحش می‌کنیم»، حتماً بپرسید دقیقاً چه زمانی، بر اساس چه معیاری و با چه تعهدی.\r\nچون تجربه من این بود که انجام دادن کار بیشتر، قبول کردن مسئولیت بیشتر و صبر کردن برای «بعداً»، الزاماً باعث بهتر شدن شرایط نمی‌شود.\r\n\r\nخروج نیروها:\r\nموضوع دیگری که به نظرم باید برای نیروهای جدید جدی باشد، تعداد نیروهایی است که در طول زمان از مجموعه جدا می‌شوند.\r\nدر دوره‌ای که من آنجا بودم، تعداد قابل‌توجهی از نیروها، از متخصص و کارشناس گرفته تا مدیر، از شرکت جدا شدند. وقتی خروج نیروهای باتجربه زیاد می‌شود، به نظرم ارزش دارد قبل از ورود به شرکت از خودتان بپرسید:\r\nچرا؟\r\n\r\nدر نهایت، تجربه من از امیدتک تجربه خوبی نبود و خاطره مثبتی از آن دوران برایم باقی نماند.\r\nممکن است تجربه افراد در واحدها و تیم‌های مختلف متفاوت باشد، اما اگر قصد پیوستن دارید، پیشنهاد می‌کنم قبل از قبول پیشنهاد شغلی فقط به حرف‌های جلسه مصاحبه اکتفا نکنید. با چند نیروی فعلی و سابق صحبت کنید، درباره حقوق و افزایش حقوق، سبک مدیریت، رفتار HR، امنیت شغلی و دلیل خروج نیروها سؤال کنید.\r\nقبل از اینکه وارد شوید، تحقیق کنید.\r\nچون اگر قرار باشد بعداً بفهمید بعضی از چیزهایی که در مصاحبه به شما گفته شده فقط «حرف» بوده، هزینه فهمیدن این موضوع ممکن است چند ماه یا حتی چند سال از زندگی حرفه‌ای‌تان باشد."
