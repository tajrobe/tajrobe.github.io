description: "می‌خوام درباره پست قبلی چند نکته بگم تا دیگران فقط با شنیدن یک روایت یک‌طرفه قضاوت نکنن.\r\nاول اینکه نویسنده این پست خودشون مدتی مدیر کال‌سنتر اتاقک بودن، بنابراین شاید بد نباشه در کنار نقد سازمان، درباره نتیجه عملکرد مدیریتی خودشون در اون دوره هم صحبت بشه. اون دوره با خروج قابل‌توجه نیروها، تعارض‌های مدیریتی و نارضایتی جدی در تیم همراه بود و بخشی از نیروهایی که از کال‌سنتر خارج شدن، بعد از تغییر مدیریت برای بازگشت به اتاقک درخواست دادن.\r\nاز طرف دیگه، اینکه بگیم اتاقک برای نیروی انسانی ارزشی قائل نیست، با تجربه خیلی از همکاران فعلی و سابق همخوانی نداره. بخشی از همکاران سابقه چندین‌ساله دارن، تعدادی از مدیران امروز مسیرشون رو از کارشناس یا کارآموزی در همین شرکت شروع کردن و حتی تعدادی از افرادی که از شرکت جدا شده بودن، بعدها با میل خودشون برگشتن.\r\nدرباره ماجرای پایان همکاری هم یک نکته قابل تأمله: فردای اعلام عدم تمدید قرارداد، همسر ایشون به شرکت مراجعه کردن و درباره ادامه پرداخت حقوق ایشون مطالبه‌ داشتن. این شرکت تقریبا اپن آفیسه و باعث خنده همه همکاران شد! اینکه چنین موضوعی توسط همسر یک مدیر سابق پیگیری بشه، خودش درباره مرزهای حرفه‌ای رابطه کارمند و سازمان جای تأمله!\r\nاتاقک قطعا بی‌نقص نیست و نقد کردنش حق هر همکاریه؛ اما نقد منصفانه زمانی ارزشمنده که تجربه شخصی یک نفر به کل سازمان تعمیم داده نشه و نقش خود فرد در اتفاقات دوره مدیریتش هم فراموش نشه"
