description: "پیرو پیام خانم اچ آر خواستم مطالبی رو عرض کنم خدمتتون و برخی حقایق شفاف سازی بشه.\r\nایشون درمورد خروج قابل توجه نیرو ها از بخش کال سنتر فرموندند ولی به نرخ خروج بقیه واحد ها اشاره نکردند.\r\nیا نگفتند دلیل خروج نیروهای خانم درواقع مدیرعامل این شرکت هست.\r\nایشون نگفتند کسانی که برگشتند درواقع به طمع حقوق بالاتر جدا شدند از شرکت ولی وقتی فهمیدند در شرکت های دیگه با زیر آب زنی نمیشه موفق شد و واقعا باید کار کنند برگشتند اتاقک تا از مهارت های زیرآب زنیشون شرکت بهرمند بشه.\r\nاشخاص کارآموزی هم که فرموندند مدیر شدند لطفا توضیح بدند چطور در مدت مجموعا کمتر از یک سال سابقه کار و با سن کم تونستند موقعیت های مدیریتی بگیرند.\r\nاتاقک جزئیات زیادی دارد. هر اتفاقی میوفتد همه از آن اطلاع دارند ولی تظاهر میکنند نمیدانند چه شده. قبول کنید شرکت مزخرفی دارید و بجای باند بازی و پارتی بازی سعی در بهتر کردن اوضاع شرکت کنید."
