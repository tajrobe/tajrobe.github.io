description: "به شدت شرکت بی نظمی هست و عملکرد منابع انسانی به شدت ضعیف هست خانم ق در منابع انسانی حتی نمیتونه یک جلسه مصاحبه رو برنامه ریزی کنه \r\nاگر مدیرعامل مجموعه صرفاً به‌عنوان یک فرد عادی و با رزومه‌هایی متفاوت، برای چند موقعیت شغلی رزومه ارسال کند و فرآیند جذب خانم ق را از ابتدا تا انتها تجربه کند، احتمالاً تصویر بسیار متفاوتی از نحوه عملکرد منابع انسانی و نحوه بررسی رزومه‌ها خواهد دید.\r\n\r\nحتی در شرایط بسیار شلوغ و بحرانی، از افراد برای مصاحبه دعوت می‌ شود، اما در نهایت عملاً خبری از جذب نیست. نکته عجیب‌تر اینکه رزومه‌هایی که کاملاً مرتبط با موقعیت شغلی هست نیز با عنوان «نامرتبط بودن سابقه کاری» رد می‌شوند؛ در حالی که فرد سال‌ها دقیقاً در همان حوزه فعالیت کرده بود.\r\nمدیر عامل اگه روی کار منابع انسانی تمرکز بیشتری داشته باشه متوجه میشه که اکثر رزومه ها رد شده یا در حالت بررسی و اصلا جذبی ندارند"
