description: "این شرکت ۴ بار با من تماس گرفتن برای مصاحبه، بار اول که از طرف خود شرکت مصاحبه کنسل شد ، گفتند فرد مصاحبه کننده مشکلی براشون پیش اومده، و چند بار بعدی هم باز کنسل کردن و بار اخر که تماس گرفتند این قدر شخصیت نداشتند،هرجا تماس میگیرن برای مصاحبه میگن این روزها امکان پذیر هست شما چ روزی میتونید تشریف بیارید؟چون بالاخره طرف هم برنامه داره ،فقط منتظر نشسته که شرکت شما تماس بگیره، به من گفتن امروز میتونین بیاین؟\r\nامروز؟کدوم شرکتی تماس میگیره برای مصاحبه بگه الان بیاید مصاحبه؟\r\nکه شرایط کشور هم جنگ بود و من بهشون گفتم شما ساعت رو ببینید ساعت ۵ بعدازظهر و شرایط کشور هم جنگی هست و خطرناک هست و رد رزومه زد و نوشت رد رزومه به دلیل نداشتن دانش کافی \r\n\r\nمتاسفم برای همچین شرکتی و منابع انسانی"
