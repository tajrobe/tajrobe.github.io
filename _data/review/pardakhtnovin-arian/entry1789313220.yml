description: "بعد از خواندن کامنت‌های دیگران، واقعاً به این نتیجه رسیدم که اگر برای آرامش، امنیت و شأن حرفه‌ای خود ارزش قائل هستید، قبل از ورود به این مجموعه حتماً درباره فضای کاری آن تحقیق کنید.\r\nاز ما که گذشت،بخاطر قسط مجبور شدیم بمونیم و در این حد محیط بی بند و بار و اشفته ای که هست رو تحمل کنیم\r\nتا این حد که در واحد فناوری اطلاعات درگیری فیزیکی شدیدی بین دو نفر از همکاران اتفاق افتاد؛ درگیری‌ای که با فحاشی شدید، کتک کاری، کندن دسته صندلی و پرتاب آن به سمت طرف مقابل همراه بود و حتی در مقطعی یکی از افراد روی همکار دیگر نشسته و او را کتک می‌زد. نکته بسیار عجیب‌تر این بود که برخی افراد به جای جلوگیری از درگیری، ایستاده بودند و می‌خندیدند. \r\n\r\nبعداً از همکاران شنیدیم که یکی از همکاران خانم که پیش از آن باردار شده بود، پس از آن اتفاق دچار خونریزی شدید و سقط جنین شده است. ما از این موضوع با تأخیر مطلع شدیم و طبیعتاً نمی‌توانیم درباره علت پزشکی آن اظهارنظر قطعی کنیم؛ اما اینکه چنین اتفاقات و درگیری‌هایی در محیط کار رخ دهد، به‌تنهایی بسیار نگران‌کننده است. \r\n\r\nانتظار طبیعی این است که در هر سازمانی، درگیری فیزیکی و خشونت در محیط کار به‌شدت پیگیری شود و بدون توجه به اینکه چه کسی شروع‌کننده بوده، با رفتار خشونت‌آمیز برخورد جدی و فوری صورت بگیرد. اما در این مجموعه، نه‌تنها برخورد مؤثری مشاهده نشد، بلکه فیلم‌های درگیری بین افراد دست‌به‌دست می‌شد و حتی شنیده شد که برخی مدیران ارشد نیز فیلم‌ها را می‌دیدند و به آن می‌خندیدند. این موضوع برای من یکی از عجیب‌ترین بخش‌های این تجربه بود. \r\n\r\nاز طرف دیگر، ضعف مدیریت در واحد فناوری اطلاعات کاملاً محسوس است. این سؤال پیش میاد که مدیران ارشد و معاونت فناوری اطلاعات تا چه اندازه از اتفاقاتی که در واحدهای زیرمجموعه‌شان رخ می‌دهد اطلاع دارند و چرا در چنین شرایطی نظارت و برخورد مؤثری صورت نمی‌گیرد. انتظار می‌رود مدیر شبکه و مسئولان مربوطه بابت نحوه مدیریت نیروها و ایجاد چنین فضایی پاسخ‌گو باشند.\r\nواحد منابع انسانی هم که مترسکی بیش نیست این واحد در بسیاری از موارد نقش مؤثری در حل مشکلات و ایجاد نظم سازمانی ندارد. همچنین در مورد برخی مدیران در واحد منابع انسانی، رفتار و رویکردی که قبل از گرفتن سمت سرپرستی از آنها دیده می‌شد، بعد از گرفتن سمت کاملاً متفاوت به نظر می‌رسید. \r\n\r\nاگر قصد پیوستن به این شرکت را دارید، توصیه می‌کنم حتماً قبل از تصمیم‌گیری درباره فرهنگ سازمانی، نحوه مدیریت و امنیت محیط کار تحقیق کافی انجام دهید.\r\n\r\n"
