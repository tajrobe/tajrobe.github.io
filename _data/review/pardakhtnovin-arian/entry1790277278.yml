description: "\r\nبه‌تازگی وارد این شرکت شدم و هنگام امضای قرارداد، هیچ نسخه‌ای از قرارداد به من تحویل داده نشد. \r\n\r\nوقتی موضوع را پیگیری کردم، گفتند اگر نسخه قرارداد را می‌خواهم، باید درخواست کتبی بدهم و دلیل درخواست را هم ذکر کنم. \r\n\r\nاز چند نفر از همکاران هم پرسیدم گفتند این موضوع قبلاً هم همین‌طور بوده و حتی در مواردی که درخواست کتبی همراه با ذکر دلیل داده‌اند، باز هم نسخه قرارداد را تحویل نداده‌اند و پاسخ این بوده که «مدیرعامل این‌طور خواسته است». \r\n\r\nبرای من سؤال است که مگر داشتن یک نسخه از قراردادی که خودم امضا کرده‌ام، حق قانونی کارمند نیست؟ چرا باید برای دریافت نسخه قرارداد، دلیل ارائه کنم؟ \r\n\r\nتا جایی که اطلاع دارم، بر اساس قانون کار، قرارداد کار در چند نسخه تنظیم می‌شود و یک نسخه باید در اختیار کارگر/کارمند قرار گیرد؛ بنابراین مطالبه نسخه قرارداد، اصولاً نباید نیازمند ارائه دلیل خاصی باشد. \r\n\r\nدوستانی که تجربه کار در شرکت‌های دیگر را دارند، آیا با چنین رویه‌ای مواجه شده‌اید؟\r\nآیا در شرکت شما هم برای تحویل نسخه قرارداد، درخواست کتبی یا ذکر دلیل لازم بوده؟ و اگر کسی اطلاعات حقوقی دقیق‌تری دارد، ممنون می‌شوم بگوید از نظر قانون کار، خودداری از تحویل نسخه قرارداد به کارمند قابل قبول است یا خیر.\r\n\r\n"
