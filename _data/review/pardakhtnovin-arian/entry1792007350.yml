description: "قبل از هر چیز، باید بگم، این شرکت عملاً واحد منابع انسانی مؤثری نداره. چند نفر نیروی اداری حضور دارن که بیشتر فعالیتشون به برگزاری جشن‌ها و اهدای هدایای سازمانی محدود می‌شه اقداماتی که به‌تنهایی نمی‌تونن جایگزین رسیدگی واقعی به مشکلات کارکنان، حمایت از نیروها و ایجاد محیط کاری سالم بشن.\r\n\r\nمدیرعامل هم، بیشتر به سرکشی‌های مقطعی و توجه به افرادی که مورد علاقه‌ اش هستن بسنده می‌کنه. در مقابل، به نظر می‌رسه کارکنانی که شناخت یا ارتباط مستقیمی با ایشون ندارن، به‌راحتی نادیده گرفته می‌شن.\r\n\r\nدر مورد مدیران واحدها هم، این تصور وجود داره که روابط و آشنایی‌ها نقش پررنگی در انتخاب بعضی از افراد داشته موضوعی که باعث می‌شه شایسته‌سالاری و تخصص در انتصاب‌ها زیر سؤال بره. متأسفانه، برخورد برخی مدیران نیز رضایت‌بخش نبوده و از نظر احترام، رفتار حرفه‌ای و نحوه تعامل با کارکنان، انتقادهای جدی به این مجموعه وارده.\r\n\r\nبرگزاری جشن‌ها و مناسبت‌های مختلف شاید در ظاهر نشون‌دهنده توجه سازمان به کارکنان باشه، اما وقتی مشکلات اصلی محیط کار حل نمی‌شن، چنین اقداماتی تأثیر چندانی در رضایت واقعی نیروها ندارن.\r\n\r\nیکی از جدی‌ترین انتقادها هم مربوط به وضعیت تسویه‌حساب کارکنانیه که از شرکت جدا شدن. طبق تجربه‌ها و مواردی که مشاهده شده، بعضی از نیروهای سابق برای دریافت مطالبات و تسویه‌حسابشون مدت زیادی منتظر می‌مونن موضوعی که می‌تونه تجربه خروج از شرکت رو به‌شدت ناخوشایند کنه.\r\n\r\n این مجموعه به‌جای تمرکز بر ظواهر سازمانی، جشن‌ها و اقدامات نمایشی، باید روی شایسته‌سالاری، پاسخ‌گویی مدیران، احترام به کارکنان، رسیدگی واقعی به مسائل نیروی انسانی و تسویه‌حساب به‌موقع با نیروهای جداشده تمرکز کنه. رضایت کارکنان با هدیه و جشن به دست نمیاد بلکه نتیجه مدیریت حرفه‌ای، عدالت سازمانی و احترام در محیط کاره."
