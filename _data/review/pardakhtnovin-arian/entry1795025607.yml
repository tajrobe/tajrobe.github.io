description: "من تا حالا همچین حیات وحشی رو ندیدم تو زندگیم که در اینجا دیدم . فوق العاده بی ادب و بی شخصیت .در حدی که معمولا مجبور هستن دوست و رفیقاشونو که شبیهشون باشن بیارن داخله قبیله بدویشون. انسان نرمال سر چند روز فرار میکنه. با کسایی که جزو قبیلشون نیستن رفتارهایی میکنن که غیر قابل باوره …. \r\nمنم که دارم اینو مینویسم در حال تلاش برای فرار کردن از این شرکت سم هستم…تویی که داری اینو میخونی و اگر برای اعصاب و روانت ارزش قائلی مصاحبه هم نرو….مگر اینکه بخوای یک مشت سیکل و دیپلمه بهت امر و نهی کنن و داد بزنن سرت و بهت فحش بدن…\r\nحیف این همه وقت و زحمتی که برای این شرکت گذاشتم"
