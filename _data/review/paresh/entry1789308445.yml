description: "از همین اول بهتون بگم که اگر روز مصاحبه کمتر از حقوق پیشنهادی‌تون رو گفتن، اصلا قبول نکنید و سریع از اونجا فرار کنید. چون هیچوقت قرار نیست افزایش حقوق داشته باشید و الکی بهتون وعده وعید میدن که دو سه ماه کارشون راه بیفته و خودتون خسته شید و از اونجا برید. همکاراتون زیرآبتونو پیش مدیر میزنن و مدیر الکی میگه من خودم اینا رو توی دوربین دیدم. روزای پنجشنبه دو ساعت بیشتر بمونید ساعت کاریتون یه روز کامل میشه. جالبه که ساعت کاری از وزارت کار خیلی بیشتر و تقریبا هفته ای ۵۱ ساعت هستش و حقوق رو کف وزارت کار در نظر میگیرن. ممکنه یه دفعه روز جمعه ساعت ۷ صبت بهتون زنگ بزنن بگن بیا سر کار، چون توی قرارداد قید شده که شرکت هر زمان بخواد میتونه برای اضافه کاری کارمند رو بکشونه محل کار. تو این چند ماهی که اونجا بودم اصلا نفهمیدم زندگیم چطور گذشت. واقعا وقتم تلف شد."
