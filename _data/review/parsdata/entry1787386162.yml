description: "من سال گذشته به‌دلیل شرایط زندگی، علی‌رغم میل باطنی‌ام، بعد از ۶ سال همکاری از پارس دیتا جدا شدم. اخیراً برای بررسی فرصت‌های کاری جدید، تجربه‌ها و نظرات مربوط به شرکت‌های مختلف را مطالعه می‌کردم و با بعضی نظرات درباره پارس دیتا مواجه شدم که چون خودم سال‌ها در این مجموعه کار کرده‌ام، احساس کردم بی‌انصافی است اگر تجربه شخصی خودم را بیان نکنم.\r\nیکی از مهم‌ترین دلایلی که باعث شد ۶ سال در این شرکت بمانم، محیط کاری سالم، امنیت شغلی و ثبات مجموعه بود. در تمام این مدت شخصاً با مشکل یا حاشیه‌ای مواجه نشدم.\r\nمدیریت شرکت نیز از نظر من یکی از نقاط مثبت مجموعه بود. مدیرعامل و مدیریت داخلی، تا جایی که من تجربه کردم، نسبت به کارکنان دلسوز، همراه و حمایتگر بودند و هر زمان مشکلی داشتیم یا کمکی نیاز بود، تا حد امکان همکاری می‌کردند؛ حتی در مواردی خارج از چارچوب صرفاً کاری.یکی دیگر از نکات مثبت مجموعه، ماندگاری بالای کارکنان بود. میانگین سابقه همکاری بسیاری از پرسنل طولانی بود و به نظرم همین موضوع خودش می‌تواند نشانه‌ای از ثبات و امنیت شغلی در یک مجموعه باشد.از طرفی، شرایط همکاری، شرح وظایف و موارد مربوط به پرداخت حقوق از همان ابتدای کار به‌صورت شفاف مطرح می‌شد و حقوق نیز در طول مدت همکاری من، به‌صورت منظم و ماهانه پرداخت شد.\r\nمن در مجموع از ۶ سال همکاری با پارس دیتا خاطره بدی ندارم و تجربه شخصی من از این مجموعه، برخلاف بعضی نظراتی که اخیراً خواندم، مثبت بوده است.البته به نظرم در هر محیط کاری، نحوه رفتار و تعامل دو طرف اهمیت زیادی دارد. اگر کارمند وظایف و اصول حرفه‌ای را رعایت کند و در زمان پایان همکاری نیز با احترام و اصولی جدا شود، حتی قطع همکاری هم می‌تواند به شکل کاملاً محترمانه و بدون حاشیه انجام شود.حتی امروز، اگر شرایطش فراهم باشد، یکی از جاهایی که با افتخار دوست دارم دوباره در آن کار کنم، پارس دیتا است؛ فقط متأسفانه در حال حاضر برای رشته و تخصص من جذب نیرویی ندارند.این نظر صرفاً بر اساس تجربه شخصی من در ۶ سال همکاری با این مجموعه است"
