description: "داشتم نظرها درباره شرکتا میخوندم که اون نظر مثبتی که درباره پارس دیتا نوشته شده توجهمو جلب کردش\r\nکسی که اینا رو نوشته حتما یا مدیرعامل هست یا کسی که توی شرکت نبوده ، والا ما تاجایی که کار کردیم و بقیه رو دیدم تنها مزیت این شرکت حقوق کم با یک ماه بیشتر تاخیرشه برای همه اون پاداش و کارانه که نوشته از کجاش آورده واقعا با دروغ چرا مردمو گول می‌زنید. \r\nتوی شرکت تنها چیزی که نیست امنیت شغلی که هیچ هرچی از دهنشون میاد بهت میگن تهشم کلی پولتو میخورن از بس بی شرفه مدیرش \r\nفساد جنسی واقعا زیاده خودم دیدم که الان نوشتم یک بار موقع ناهار برو اشپزخونه میفهمی روابط نامشروع اقای تحصیلدار اسمش دشتیه با خانمای متاهل شرکت که اوناهم شانسش همه دوست دارن اکی میدن بهش .\r\nخوب نیست مدیر یه شرکت باشی و بیایی از خودت چرت و پرت و نظر خوب بنوسی\r\nواقعا خجالت داره 🙄🙄😠😠😠 حداقل یه شرکت معمولی اینه که حقوق رو ۱۵ ام بده ولی برای خود من باید حتما به حسابدار میگفتم اونم چندروز بعد حقوق میداد یعنی اگه نمیگفتم کلا حقوق نمیداد کلا تعهد پرداخت حقوق نداشت تهش بگم چیزی که دیدم و سرم اومد پول حداقل ۴ تا همکارو کامل خوردن \r\nتوی لیست داخلی نگاه کنی کل ادمای شرکت هر ۴ ماه عوض شدن\r\nخدا میبینه و کارما هست و خودم برای مدیر داخلی نوشین معصومی و زهره اسماعیلی امیدوارم بدترین بلاها سر خودشون و خونوادشون بیاد که اینقدر از کارمندا دزدی میکنن کلی پول منو خوردن سر اون تک پسرشون بلا بیاد بفهمن خدایی وجود داره"
