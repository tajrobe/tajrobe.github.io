description: " استخدام پارسیان حساب روش کلاهبرداری مهندس فیک شرکت مهندس جلیلی است که آدم شیادی است و با دام برای مردم بدبخت که می‌خوام بهتون کار بدم و حقوق سی ملیونی روزانه ملیون ها تومن برای خودش درآمد درست کرده و جیب مردم رو خالی می‌کنه آخه کدوم جایی می‌تونه روزی ده ها نفر رو استخدام کنه ؟؟چرا مردم کمی فکر نمی کنند من از اولش هم فهمیدم کلاهبرداری است طرف یه ادم عیاش است که  کارش سواستفاده است وقتی وارد دفتر میشی هزار جور فریون صدقه ات می رن که تو برای استخدام ما انتخاب شدی و ماه بعدی ملیون ها تومن درآمد داری آخرش که حسابی بازیت دادن می فهمی چه رکبی خوردی یه ادم چقد باید بی وجدان باشه که تو این وضعیت اقتصادی کشور با سرمایه مردم بازی کنه فکر کنم پنجاه سالشم هم باشه خجالت نمی کشه از این کارش احتمالا میخواد جیب بچه هاشو پر کنه دختراشو شوهر بده .بیچاره به سر بچه هات میاد این پول ها خوردن نداره "
