description: "گاهی یک متن که در چند دقیقه نوشته می‌شود، می‌تواند سال‌ها روی اعتبار و زندگی یک انسان اثر بگذارد. به عنوان کسی که در این مجموعه کارآموز بوده‌ام، از همه خواهش می‌کنم قبل از انتشار هر مطلبی، کمی به مسئولیت کلماتمان فکر کنیم.\r\n\r\nانتقاد کردن حق هر کسی است و هیچ‌کس نباید از بیان تجربه واقعی خود منع شود. اما بین «بیان تجربه» و «قضاوت درباره شخصیت افراد» تفاوت بزرگی وجود دارد. وقتی از روی ناراحتی یا عصبانیت، بدون اینکه همه واقعیت را بدانیم، درباره دیگران با قطعیت حرف می‌زنیم یا به آن‌ها برچسب می‌زنیم، ممکن است به کسی آسیب بزنیم که فرصت دفاع از خودش را ندارد.\r\n\r\nمن در مدت حضورم به عنوان کارآموز، تجربه متفاوتی داشتم. شاید همه افراد تجربه یکسانی نداشته باشند و این کاملاً طبیعی است؛ اما هیچ تجربه شخصی، به‌تنهایی حقیقت کامل را نشان نمی‌دهد. به همین دلیل بهتر است هر کس فقط از آنچه خودش دیده و تجربه کرده صحبت کند، نه اینکه درباره نیت، شخصیت یا زندگی دیگران قضاوت کند.\r\n\r\nاز همه کسانی که این نظرات را می‌خوانند هم خواهش می‌کنم، هر مطلبی را بدون فکر نپذیرند و تنها بر اساس یک نوشته درباره افراد یا مجموعه‌ها تصمیم نگیرند. همان‌طور که یک تعریف اغراق‌آمیز می‌تواند گمراه‌کننده باشد، یک انتقاد تند و بدون انصاف هم می‌تواند تصویری نادرست ایجاد کند.\r\n\r\nبیایید اگر نقدی داریم، آن را با احترام، صداقت و انصاف بیان کنیم. اعتبار هر حرفی، فقط به محتوای آن نیست؛ به شیوه بیان آن هم بستگی دارد. شاید با چند جمله نسنجیده، آبروی کسی خدشه‌دار شود؛ چیزی که بازگرداندنش بسیار سخت‌تر از نوشتن همان چند جمله است."
