description: "من هم مدتی به عنوان کارآموز در این مجموعه حضور داشتم و بعد از خواندن این نظر، احساس کردم لازم است دیدگاه خودم را بنویسم.\r\n\r\nراستش چیزی که برای من عجیب بود، این نبود که یک نفر از تجربه خودش ناراضی بوده؛ بلکه این بود که چطور می‌شود با این اطمینان درباره شخصیت، نیت و زندگی یک انسان قضاوت کرد. هیچ‌کدام از ما از تمام واقعیت‌های پشت یک ماجرا خبر نداریم و به همین دلیل، بهتر است بین «نقد» و «تخریب» تفاوت قائل شویم.\r\n\r\nدر مدت حضورم، من هم مثل هر کارآموز دیگری با سؤال و تردید وارد مجموعه شدم، اما چیزی که یاد گرفتم این بود که هر همکاری ممکن است برای یک نفر مناسب باشد و برای شخص دیگری نباشد. این موضوع، به‌تنهایی مجوزی برای زیر سؤال بردن آبرو و شخصیت افراد نیست.\r\n\r\nامروز فضای مجازی به جایی تبدیل شده که یک جمله می‌تواند در چند ساعت توسط هزاران نفر دیده شود. خیلی از افرادی که این نوشته‌ها را می‌خوانند، هیچ شناختی از ماجرا ندارند و بر اساس همان چند خط قضاوت می‌کنند. به همین دلیل، مسئولیت کلماتی که می‌نویسیم کمتر از مسئولیت کارهایی که انجام می‌دهیم نیست.\r\n\r\nاگر قرار باشد هر کس بعد از یک تجربه ناموفق، با عصبانیت درباره دیگران هر چیزی بنویسد، دیگر هیچ اعتباری برای نظرات باقی نمی‌ماند. ارزش یک انتقاد زمانی مشخص می‌شود که بر پایه احترام، انصاف و واقعیت باشد، نه بر اساس احساسات لحظه‌ای.\r\n\r\nمن قصد ندارم کسی را قانع کنم که نظر من درست است؛ فقط می‌خواهم یادآوری کنم که پشت هر نامی که در فضای مجازی نوشته می‌شود، یک انسان، یک خانواده و سال‌ها تلاش وجود دارد. قبل از اینکه چیزی منتشر کنیم، خوب است فکر کنیم آیا اگر همین متن درباره خودمان نوشته می‌شد، آن را منصفانه می‌دانستیم یا نه.\r\n\r\n— یکی از کارآموزان سابق"
