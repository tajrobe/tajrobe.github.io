description: "متاسفانه تجربه مثبتی در پارسیان حساب نداشتم .روزی که به این شرکت مراجعه کردم مدیر شرکت خودش را مردی لایق و کارآفرین معرفی کرد و گفت برند معتبر حسابداری است و افراد زیادی با شرکت ایشون وارد بازار کار شدند بعد چند تا مدرک تقلبی و فیک بهم نشون داد و از من درخواست بیست ملیون کرد تا به عنوان وجه التزام به کار منو وارد بازار کار کنه و کلاس مختصری برای ما گذاشتند از سند نویسی و دفتر روزنامه و..که تمام بچه های ترم یک حسابداری خودشون خیلی حرفه ای تر این ثبت ها رو میزنند بعد از یک ماه به موسسه برای کار مراجعه کردم و پرسنل شرکت مرا بازی دادند متوجه شدم که این شرکت کاملا فیک است و استخدامی ندارند چون بارها و بارها به این شرکت مراجعه کردم و با افرادی که اونجا بودند صحبت کردم و دیدم حتی حقوق پرسنل رو هم پرداخت نکرده بودند متاسفانه این طور شرکت ها دامی برای کارجویانی است که به امید کار مراجعه می کنند و زخمی هم می شوند از نظر اخلاقی هم مدیر شرکت آقای جلیلی شخصیت دو رویی داره زمان پول گرفتن خوش برخورد و زمان ارائه کار توهین می کنند و می گویند دلم نمی خواد استخدام بشی این جوابشون هست و اکثرا شرکت محلی برای خوش گذرانی آقای مدیر است با خانم ها .این شرکت کلا صحنه سازی است و قبلا هم اکباتان بوده ظاهراً جمع شده "
