description: "سلام ممنونم که این سایت تجربه رو برای کارهای استخدامی قرار دادید که بچه ها بتونند بیاین تجربیات خودشون رو بگن . اول از همه تشکر میکنم از مدیریت سایت محترم برای ایجاد این بستر نظر سنجی شغلی\r\n\r\nمن در زمینه حسابداری درس خوندم و می‌دونم شأن یک حسابدار بیشتر از این هست که یک آقایی بیاد شرکتی بزنه به اسم برند حسابداری معتبر که هیچ رزومه و اعتباری ازش در هیچ جایی پیدا نمی کنی\r\n\r\nوقتی تو گوگل سرچ می کنی پارسیان حساب فقط یک شرکت میاد در اصفهان نه در تهران ..ایشون میاد با نام مشابه یک شرکت معتبر کار می‌کنه و این حرکتش بسیار زشت هست چشم مردم بدبین می شده \r\n\r\nدر مورد نحوه فعالیت ایشان این رو باید بگم وقتی یک شرکتی هرروز داره آگهی استخدام حسابدار می زنه چطور می‌تونه این همه شخص رو استخدام کنه \r\n\r\nاین که شرکتی بیاد شرط بگذاره پول بدهید تا استخدام شوید خیلی رفتار غیر عاقلانه ای است \r\nدر مورد اخلاق مدیر شرکت  شخصا خودم چیزی نمی دونم ولی به هر حال ایشان را به وجدان کاری دعوت می کنم یکی از دوستانم رفته بود این شرکت و بعدش به قدری اذیت شد که دیگه چشمش از سیاه و سفید می ترسه از بس اونجا دروغ دید بازی دید\r\n\r\nلطفاً وقتی یک دفتری می زنید مراقب حق الناس باشید "
