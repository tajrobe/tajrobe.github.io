description: "تجربه شخصی من از مراجعه به این مجموعه مثبت نبود. برای استخدام حسابدار مراجعه کردم و در ابتدا وعده‌ها و قول‌های زیادی درباره معرفی کار و استخدام داده شد، اما در نهایت کاری معرفی نشد. بعد از پرداخت هزینه و انجام مراحل، چندین بار پیگیری کردم ولی پاسخگویی مناسبی دریافت نکردم.\r\n\r\nدر طول این روند، مواردی ارائه شد که برای من قابل بررسی و اعتماد نبود و باعث ایجاد تردید شد. همچنین در زمان پیگیری، برخوردی بسیار نامناسب و پرخاشگرانه با ما صورت گرفت که تجربه ناخوشایندی ایجاد کرد.\r\n\r\nاین نظر را برای آگاه کردن افرادی می‌نویسم که قصد مراجعه دارند؛ پیشنهاد می‌کنم قبل از پرداخت هرگونه هزینه، درباره سابقه مجموعه، قرارداد، مجوزها و تجربه افراد دیگر تحقیق کنند.\r\nاین مجموعه افراد زیادی را قربانی کرده پشت هر کلاهبرداری بزرگ سواستفاده از اعتماد مردم به مجموعه هایی که وعده های فریبنده می دهند"
