description: "موسسه پارسیان حساب موسسه ای فیک است که مدیر شرکت خودش رو یک فرد برند معرفی می‌کنه در حالی که هیچ رزومه موفقی در این رشته ندارند و تحقیق که کردم هیچ جایی ایشون رو نمی شناخت . متاسفانه وجدان کاری صفری هم دارند روزی که به موسسه مراجعه کردم خانمی تند تند با گوشی کار می کرد و نوبت دهی داشت و از خودم می پرسیدم چطور ممکنه بتواند این همه شخص رو استخدام کنه وارد اتاق مدیر که شدم برای مصاحبه کاری سوالات پیش پا افتاده ای پرسیدند و با چرب زبانی سعی کرد که مخ منو بزنه شخصیت هولی داره این آقا و فکر کرد فریب می خورم و ده ملیون برای استخدام هزینه میدم و مدام قسم میخورد به سر مادرم قسم استخدام می کنم و...خدا رو شکر که ثبت نام نکردم الان که دیدم موسسه کلا تغییر مکان و اسم داده خدا رو شکر میکنم که در دام این افراد نیوفتادم دوست عزیز هرجایی که برای استخدام بهت گفتن پول بده بدون که کلاهبرداری است همیشه یادمون باشه ناموس مردم حرمت داره و بازی با زندگی ناموس مردم کمتر از قتل نفس نیست جمع کنید این موسسه کلاهبرداری خانم بازی رو "
