description: "بیست سال پیش دخترم برای کار به شرکت پارسیان، نزد مهندس جلیلی، رفت. متأسفانه در طول این سال‌ها، به گفته و تجربه‌ای که ما از نزدیک داشته‌ایم، مبالغی از دخترم دریافت شد و وعده‌هایی درباره کار و سرمایه‌گذاری به او داده شد که سرانجام آن چیزی نبود که انتظار داشتیم.\r\n\r\nحتی سیستم‌ها و تجهیزات ما نیز گرفته شد و در مقابل، کیس خالی تحویل داده شد. سال‌ها وعده و انتظار ادامه پیدا کرد و در نهایت احساس می‌کنیم بیست سال از جوانی، فرصت‌ها و زندگی دخترم از بین رفت.\r\n\r\nآنچه بیشتر از همه ما را ناراحت می‌کند، آسیبی است که از نظر روحی و مالی  و سرنوشتی به دخترم وارد شد و اینکه بهترین سال‌های جوانی او با امید به این وعده‌ها سپری شد.\r\n\r\nما این موضوع را به خدا واگذار می‌کنیم .امیدوارم هیچ شخصی این تجربه را نداشته باشه دیگه چیزی جبران نمیشه فقط امیدوارم خدا جواب این ادم را بده \r\n\r\nخداوند خودش شاهد تمام این سال‌هاست. واگذارشان می‌کنم به حضرت فاطمه زهرا (س).\r\n"
