description: "تجربه من از این مجموعه که قبلاً با نام «پارسیان حساب» فعالیت می‌کرد و اکنون با نام «پیشگامان» شناخته می‌شود، بسیار تلخ و قابل تأمل است.\r\n\r\nمن با وعده استخدام در بخش حسابداری مراجعه کردم. بابت فرآیند استخدام و تحت عنوان «وجه التزام» از من مبالغی دریافت شد و بعد از آن نیز یک آموزش ناقص ارائه شد، اما در نهایت استخدامی صورت نگرفت و مدت‌ها بلاتکلیف ماندم.\r\n\r\nبعداً متوجه شدم افراد دیگری نیز تجربه مشابهی داشته‌اند؛ افرادی که با وعده استخدام جذب می‌شوند، مبالغی از آنها دریافت می‌شود و مدت‌ها منتظر می‌مانند، اما در نهایت استخدامی انجام نمی‌شود.\r\n\r\nدر مورد یکی از دوستان من نیز پیشنهاد همکاری به‌عنوان منشی مطرح شد و از او خواسته شد برای مجموعه نیرو جذب کند. حتی آگهی‌های استخدامی با **شماره تلفن شخصی دوستم** منتشر می‌شد و متقاضیان از طریق شماره او با مجموعه ارتباط می‌گرفتند. دوست من برای مجموعه فعالیت و جذب نیرو انجام داد، اما در نهایت حقوقش پرداخت نشد. وقتی برای دریافت حقوقش پیگیری کرد، به او گفته شد: «اسکول، من که باهات قرارداد نداشتم.»\r\n\r\nاین در حالی است که آگهی‌ها با شماره دوست من منتشر شده بود و او عملاً درگیر جذب متقاضیان و انجام کارهای مربوط به استخدام شده بود.\r\n\r\nدر مورد خود من نیز زمانی که موضوع را پیگیری کردم، مدیر شرکت در پاسخ گفت: «برو هر کاری دوست داری بکن، دستت به جایی بند نیست.»\r\n\r\nمن این موارد را بر اساس تجربه شخصی خودم و اتفاقاتی که برای دوستم افتاده بیان می‌کنم و مدارک پرداخت، پیام‌ها، آگهی‌ها و مستندات مربوط به پیگیری‌ها را نیز نگهداری کرده‌ام.\r\n\r\nتوصیه جدی من به سایر کارجویان این است که قبل از پرداخت هر مبلغی تحت عنوان استخدام، آموزش یا «وجه التزام»، حتماً قرارداد کتبی، شرایط بازگشت وجه و واقعی بودن موقعیت شغلی را بررسی کنند.\r\n\r\nوقتی استخدام واقعی است، چرا باید از کارجو بابت استخدام پول دریافت شود؟ چرا افراد ماه‌ها منتظر بمانند؟ و چرا کسی که برای مجموعه کار و جذب نیرو انجام داده، در نهایت برای دریافت حقوقش با این برخورد مواجه شود؟\r\n"
