description: "به عنوان عضو سابق پارتوفیکس و بعد از سال ها فعالیت با این مجموعه باید بگم که در این مجموعه همیشه باید در حال رشد باشید و خودتون‌رو به روز کنید.\r\nاتفاقا این مجموعه به آدم های قوی و پر تلاش نیاز داره و جایی برای افراد ضعیف و ناکارآمد در این مجموعه وجود نداره.من به شخصه آدم های زیادی رو دیدم که اومدن و یک هفته آزمایشی رو طی کرده یا نکرده عذرشون و خواستن چون در حد مجموعه نبودن.\r\nمتاسفانه به خاطر خدمت سربازی نتونستم‌با این مجموعه ادامه بدم ولی همیشه دوست دارم این شرایط تموم بشه و مجدد به این شرکت برگردم.\r\nدر مورد آگهی استخدام هم چیزی که همیشه در پارتوفیکس جریان داره استخدامه... دلیلش هم جذب بهترین هاست و همیشه اینو تو جلسه ها به ما تذکر میدادن که باید خودمون و رشد بدیم.\r\nمن ۳ سال باهاشون کار کردم تقریبا و در طول این ۳ سال همیشه به نیروهاشون توجه کردن و هر وقت چیزی از ابزار یا اکانت و نرم افزار لازم داشتیم برامون فراهم می‌شد اما نتیجه رو هم از ما میخواستن و عملکرد محوری در شرکت جریان داشت.\r\nبه نظرم کارکردن تو پارتوفیکس ترکیبی از مهارت و دانش و سرعت عمل لازم داشت که خب هیجان زیادی رو هم به آدم میداد.اگه هر کدوم از اینا رو نداشتی باید میرفتی در یکی از بخش ها و یاد میگرفتیش.این به نظرم کمک زیادی میکرد که بتونی با مفاهیم فنی و تخصصی این حوزه بهتر آشنا بشیم و البته با روند کار بخش ها هم آشنا باشیم.\r\nدر کل من راضی بودم از زمانی که داخل این شرکت بودم"
