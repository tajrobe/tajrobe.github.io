description: "با سلام و وقت بخیر \r\nمن با نظر اون دوستمون که گفتند بیگاری کشیدین این مجموعه کاملا موافق هستم چون سر من هم اومد \r\nمن پس از ارسال رزومه برای پوزیشن فروش مراجعه داشتم اول که شدم کارگر انبار پیش یکی به فامیلی نادیان چند روز کارگر و عمله انبار پس از چند روز حقیقتا اعصابم دیگه نکشید تهش دیدم وایسم شدم کارگر انبار اینا مدیریت هم که به پشمش هست رسما تو نیای بقیه میان در این حد با صحبت هم باهاشون به نتیجه نرسیدم تهش این شد منم خارج شدم .\r\nجلسات هم درست میگند ادعا 100 عمل با زور 5 درصد همش هم عامل تهدید رو میارن که کار نکنید اخراج میشید و... الا مشالله ادعا که من صفر بودم الان شدم اینو از این جور چرندیات (جزو همون روند های زرق و برقدار مجموعه هست )\r\nنه نیرویی نیاز دارند عملا و نه اصلا کسایی که در این روند هستند و قدیم تر هستند  در این مجموعه کسی رو به جمع خودشون راه میدن درنهایت همچی گل و بلبل هست ولی وقتی میرین تازه میفهمید چقدر واقعیت پشت کار متفاوت هست\r\nبرداشت منم از این نظر مثبت پایین این هستش که یکی واقعا دلش نمیخواد شما واقعیت رو بدونید دیگه خودتون احتمالا باید متوجه بشید کی ؟\r\nحالا دوست دارین تجربه من و اون دوست پایینی رو تجربه کنید بسم الله"
