description: "تجربه کار در این مجموعه‌ به طور کلی بد نیست و عزیزه تا حدودی و به ابزار های آموزشی افراد خیلی اهمیت داده میشه ، اما مشکلات و موانعی هست که به هیچ عنوان به عنوان نیرو نمیتونید از جلوی مسیرتون بردارید و در نهایت به فرسایش جسمی و روانی می رسید.\r\n\r\nوظایفی و مسئولیت هایی که در مصاحبه براتون تشریح میشه ساده و مشخصه اما در واقعیت روز کاری شما نه هیچ شباهتی به پوزیشنی که براش استخدام شدید داره و نه هیچ اشتراکی با توافق های شما.\r\n\r\nمقدار حقوقی و مزایایی که در شروع توافق میکنید باهاشون با مقدار حقوقی که در واقعیت پرداخت میکنن تفاوت فاحش و بسیاری داره .\r\nحتی ساعت کاری که شما در روز های اول توافق می‌کنید بابتش با ساعت کاری که در واقعیت باید بمونید و انجام بدید هم خیلی متفاوت هست .\r\n\r\nبه نیرویی که بابت انجام کاری استخدام شده ، اجازه داده نمیشه که وظیفه اش رو انجام بده فقط و به اسم آموزش و ... ماه ها سرگردانه بین بخش ها\r\n\r\nمدیریت دو تکه متضاد و ناکارآمده که کارمند ها باید دو انتظار مختلف رو راضی کنن و همزمان به دو نتیجه متفاوت برسن برای هر مسئله و دوبرابر بیشتر تلاش کنن تا به کمترین نتیجه برسند\r\n\r\n آقای مدیری که سنشون بیشتر هست آنچنان مودب و محترم نیست.\r\nهیچ مرز و منطقی داخل مکالمه هاشون ندارن و کارمند ها را توالت شخصی خودش برای تخلیه خشم و اضطراب و افکار زردش میدونه و در ریز ترین جزئیات کار همه کارمندان دخالت مداوم دارن و انتظار دارن شما هیچ کاری جز راه انداختن کار ایشون تو زندگیتون و شبانه روزتون نداشته باشید.\r\n\r\nبرعکس آقای مدیری که سنشون کمتره بسیار محترم و مودب با کارمند ها برخورد میکنن و سعی قابل ارتباط تر هستن .\r\n\r\nجلسات متعدد در مورد برنامه ریزی و مدیریت زمان برگزار کردن که فقط باعث از دست دادن زمان شد و نقش خودشون در بهم ریختگی برنامه زمانی کارمندان را کاملا نادیده می‌گیرند.\r\n \r\n\r\n\r\n\r\n\r\n\r\n"
