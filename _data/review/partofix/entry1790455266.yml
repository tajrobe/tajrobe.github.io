description: "با سلام\r\nحقیقت امر من در سایت دیوار باهاشون آشنا شدم که در همه بخش ها هم همیشه نیرو می‌خوان ظاهرا که ماجرا بعدش هست\r\n\r\nبعدا از دوستان و مواردی که دیگر دوستان اینجا قرار دادن \r\nمتوجه شدم متاسفانه این مجموعه مثل یکسری از دیگر مجموعه های داخل اصفهان صرفا از شما بیگاری میکشند به این صورت که 10 روز کار رایگان براشون به عنوان شناخت کار کارفرما انجام بدین یا با یک بهونه مثل این که شما کارتون رو درست انجام نمیدین یا حقوقی پایین تر از مبلغ توافق شده یا یک کاری میکنند که خودتون خارج بشید پایان پیدا میکنه\r\nدر نهایت چون توافق کردید اگر قرارداد ببندید اون ده روز بهتون پرداخت میشه و غیر هیچی بدون هرگونه حقی خارج میشید با پای خودتون\r\n\r\nشما باشید چه کلمه ای برای اینکار در نظر می‌گیرید ؟"
