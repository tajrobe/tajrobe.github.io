description: "باسلام، ادب و احترام \r\nمن در دو بازه زمانی مختلف در مجموعه پارتوفیکس مشغول به کار بوده‌ام. شخصیت دو مدیر این مجموعه برایم قابل احترام بود و بیشتر با مدیری در ارتباط بودم که با واحد حسابداری همکاری داشت. محیط آن مجموعه امن بود و برای پذیرش کارمندان بسیار سخت‌گیر بودند. در آن محیط، رشد کارمندان اهمیت زیادی داشت و تلاش می‌کردند کارمندان نسبت به قبل آموزش ببینند و هر کس در جایگاه خودش رشد کند و یاد بگیرد.\r\n\r\nبا این حال، به خاطر دارم که فردی از آن مجموعه که چند سال در آنجا کار می‌کرد، دچار خطا و اشتباهی شد که از آن چشم‌پوشی کردند, در حالی که می‌توانستند از او شکایت کنند و آینده شغلی‌اش را در سایر موقعیت‌ها خراب کنند.\r\n\r\nمن به‌طور کلی آن مدیران-به‌ویژه مدیری که با واحد حسابداری در ارتباط بود، را قابل احترام می‌دانم. مدتی است که در آنجا نیستم، اما همیشه آن‌ها را به نیکی یاد می‌کنم. درست است که موارد بسیار کوچکی هم بود که برایم ناراحت‌کننده بود، ولی آن مجموعه برایم از مجموعه‌های نیک‌رفتار و نیک‌گفتار بود. چون در موقعیت تحصیلی هستم و نمی‌توانم با آن‌ها همکاری کنم، در آن مجموعه نیستم، وگرنه اگر فرصتی پیش بیاید، برای همکاری مجدد در آن مجموعه اقدام می‌کردم.\r\n\r\nو من الله التوفیق \r\nبا نهایت احترام و ارادت \r\n موفق و تندرست باشید "
