description: "با سلام و وقت بخیر\r\n\r\nمن پس از پایان دوره تعمیراتی که گذرانده بودم دنبال یک مجموعه بودم که کار کنم داخلش حقیقت این مجموعه خیلی بیشتر از اون چیزی که در واقعیت هست بزرگ شده\r\n\r\nپس از مراجعه مدیریت خیلی قشنگ گفتند 10 روز شما باید بیاین برای من کار رایگان انجام بدین تا شما و من از شما به یک دیدی برسم و در صورتی که قطع همکاری هم در این چند روز شکل بگیره بدون هرگونه حق و حقوقی شما از مجموعه خب خارج میشید و سوالی هم بابت حقوق بپرسید پاسخ درست و قطعی دریافت نمیکنید هی توپ رو میندازند طرف شما  (والا کلا سبک هست این حرکت و بهش میگم حالت منگنه ، اخه منی که هیچی دیدی از مجموعه و تعداد دستگاه دریافتی روزانه برای تعمیر ندارم چه حقوقی باید اعلام کنم ؟ )\r\n\r\nساعت کاری هم فوق چرت (9 صبح تا 9 شب و یک میان تایم استراحت که اگر مسیرتون دور باشه که اصلا صرف نمیکنه از مجموعه بخواین خارج بشید)\r\n\r\nپس از خارج شدن از مجموعه با اینکه ادعا واردات کالا دارند دیدم که تعدادی جعبه از مجموعه \"افق کامپیوتر\" دارند خالی میکنند که این سایتو دوستان تعمیر کار باهاش آشنایی کامل دارند \r\nhttps://iranfso.com\r\n\r\nبا توجه به تجربه های منفی که برای این مجموعه ثبت شده و البته با پرس و جو از دیگر واحد های تعمیراتی که دوستان قدیمی این مجموعه قبلا بودند و یا رفت و امد داشتند صحبت ها و کامنت های ابتدایی از این مجموعه صحت کامل دارند این دوستانی هم که کامنت فوق مثبت میان ذکر میکنند حدس من این هستش خود مدیریت مجموعه اقای صیادی هستند که فکر میکنند با این کار میتونند واقعیت رو پنهان کنند.\r\nجمع بندی هم بخوام بگم اگر برای زمان خودتون ارزش قائل هستید که همین مواردی که من ذکر کردم با دیگر دوستان در ابتدای همین برگه برای تنیجه گیری نهایی شما کافی هستش"
