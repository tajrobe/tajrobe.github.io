description: "با درود \r\nمتاسفانه مدیران این شرکت خانوادگی بسیار غیر حرفه ای هستند و به هر ابزاری سر مشتری را سرکار میگذارند و به دروغ با وعده و وعیدهای مختلف آنها رو سر میدوانند و نهایتا هنگام تحویل و دلیور کردن پروژه هم عملا چیزی دستگیر مشتری نمیشود. بالطبع همین باعث میشه که کارمندان و همکاران داخل شرکت نسبت به تعهدی که دارن سرد شده و عملا ورود و خروج داخل این شرکت خیلی بالاست. به همین دلیل دعاوی حقوقی زیادی هم علیه شرکت در حال اجراست و برای مدیریت هم اهمیتی ندارد. \r\nمحیط جذابی به واسطه رفتارهای غیر حرفه ای مدیران شرکت (خانم ن. ج و همسرشون آقای پ. ن) ندارد و باور دارم که به زودی این شرکت (دورهمی بی قاعده) جمع خواهد شد. "
