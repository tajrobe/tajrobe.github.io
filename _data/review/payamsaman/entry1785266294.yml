description: "بی‌برنامگی: برنامه‌ها، اولویت‌ها و وظایف کاری به صورت لحظه‌ای و بدون هیچ منطق مشخصی تغییر می‌کنند. هیچ چشم‌انداز کوتاه‌مدت یا بلندمدتی در پروژه‌ها وجود ندارد.\r\nبدقولی و عدم پایبندی به وعده‌ها: صحبت‌ها، قول‌ها و قرارهایی که مدیریت یا بخش منابع انسانی با پرسنل می‌گذارند (چه در زمان مصاحبه و چه در طول کار)، بارها زیر پا گذاشته می‌شود و تعهد حرفه‌ای وجود ندارد.\r\nنادیده گرفتن نیروی انسانی: به سلامت روان، انگیزه و تلاش نیروها اهمیتی داده نمی‌شود. سیستم ارزیابی عملکرد عادلانه‌ای وجود ندارد و زحمات پرسنل دیده نمی‌شود.\r\nخستگی مفرط و فرسودگی شغلی به دلیل سوءمدیریت و آشفتگی در فرآیندها، فشار کاری بی‌هوده‌ای به تیم تحمیل می‌شود.\r\nتوصیه به کارجویان:\r\n\r\nاگر به دنبال ثبات کاری، آرامش فکری، احترام به تعهدات و یک مسیر رشد شفاف هستید، این شرکت گزینه مناسبی برای شما نیست"
