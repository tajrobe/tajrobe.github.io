description: "سلام و وقت بخیر\r\nمن از سال ۱۴۰۲ تا ۱۴۰۵ به مدت سه سال در شرکت پیوست مشغول بودم و در تمام این مدت صادقانه و با تمام وجود براشون کار کردم(به گواه تمام مدیران و همکاران). همیشه به بهانه اینکه ما یه خانواده هستیم بیشترین کار رو از نیروها میگرفتن و ماهم خودمون رو گول زده بودیم که چون خانواده ایم حتی اگه بیش از حد هم کار انجام بدیم، ایرادی نداره و فایده اش به خودمون برمیگرده. اما ذات اصلی مدیران شرکت با شروع جنگ و سخت شدن اوضاع مشخص شد. اونها مثل زباله با نیروهاشون رفتار کردن و به بدترین شکل ممکن و با بی احترامی و بی ارزشی تمام، خیلی هارو تعدیل کردن (۲۰ روز و ۱۵ روز حقوق در ماه میدادن) و حتی مدیرعامل شرکت که تصور میکرد چون شرایط جنگی هست و نیروها مجبور هستند شرایط رو تحمل کنند شروع کرده بود به سوءاستفاده از این وضعیت و تحقیر کردن کارمندان شرکت. \r\nافرادی هم که تمام وقت بودن رو ساعات اضافه کاری‌شون رو بهشون حقوق نمیداد(گرچه بعضی از این افراد هم صرفا به خاطر اینکه چاپلوسی مدیرعامل رو کرده بودن تمام وقت شده بودن)\r\nدر کل این شرکت به سبب مدیریت بسیار ضعیف و روبه افولی که داره دیر یا زود از مارکت حذف میشه و اگر هم خواستید اونجا کار کنید راز موفقیت‌ش در اینه که دائما برای مدیرعاملش چاپلوسی و چرب زبونی کنید تا بتونید جایگاه خودتون رو تثبیت کنید و ارتقا بگیرید"
