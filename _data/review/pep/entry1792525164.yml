description: "پرداخت پاسارگاد شرکت خوبی بود تا قبل از ورود مدیر عامل م.آ  \r\nالان تبدیل شده به یه محیط پر از حاشیه ها چرت و پرت ، \r\nمدیرعامل با خودش یه اتوبوس از آدمهای بله قربان گو وارد کرد \r\nو به افرادی که هیچ لیاقتی و دانشی نداشتند مشابه  س.ذ سمتهایی داد که در سطحش نبودن و فضای شرکت و‌افراد با سابقه و با دانش شرکت یا مجبور کردن برن یا همه استعفا دادن و الان یکسری افراد کوته مغز نادان در سمتهای بالای شرکت هستن که همه به خاطر ماشین  لوکانو  گرفتن و حقوق هایی دارن میگیرن به هر کار کثیفی دست میزنن و‌دنبال هر جور حاشیه مسخره ای میگردن که فقط سمت خودشون حفظ کنن \r\nواقعا حیف اون همه آدمهای با دانش و سالمی که تو شرکت بودن و مجبور شدن برن\r\nالان پاسارگاد اینجور شده که شما هیچ امنیت شغلی نداری و هر لحظه ممکنه از فرداش دیگه اجازه ورود نداشته باشی \r\n"
