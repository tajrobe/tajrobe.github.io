description: "شریف زندگی کردن در این روزگار مطاع گرونی شده!\r\nیا باید خون دل بخوری یا باید تاوان شرافتت رو پس بدی...\r\n\r\nنقل قولی از یک وزیر به پادشاهش:\r\n\r\nدر شهری، تاجری ثروتمند زندگی می‌کرد که حساب‌وکتابش با کارگران همیشه به سود خودش تمام می‌شد. هر جا می‌توانست، از دستمزدشان کم می‌کرد و هر حقی را که می‌شد انکار کرد، انکار می‌کرد. او هر سال ثروتمندتر می‌شد و گمان می‌کرد زرنگ‌تر از دیگران است.\r\nدر همان شهر، مردی فقیر زندگی می‌کرد که حتی برای تأمین غذای خانواده‌اش به‌سختی تلاش می‌کرد؛ اما هرگز حاضر نمی‌شد لقمه‌ای ناحق به سفره‌اش ببرد.\r\n\r\nروزی کسی به او پیشنهاد کرد که با یک دروغ ساده، پولی هنگفت به دست آورد؛ پولی که می‌توانست زندگی خانواده‌اش را زیرورو کند.\r\n\r\nمرد لحظه‌ای سکوت کرد و گفت:\r\nمن سال‌ها برای نان شبم زحمت کشیده‌ام، اما نمی‌خواهم روزی برسد که وقتی به چهره فرزندانم نگاه می‌کنم، مجبور باشم چشم‌هایم را بدزدم.\r\n\r\nپیشنهاد را رد کرد و با همان دست‌های خالی به خانه برگشت.\r\n\r\nسال‌ها گذشت. تاجر ثروتمند، با وجود تمام دارایی‌اش، دیگر کسی را نداشت که به او اعتماد کند. مردم از ترس منفعت‌طلبی‌اش با او معامله می‌کردند، نه از روی احترام، و نزدیکانش نیز در انتظار سهم خود از ثروتش بودند.\r\n\r\nاما آن مرد فقیر، با وجود زندگی ساده‌اش، چنان اعتباری میان مردم داشت که هرگاه نامش برده می‌شد، همه از درستکاری‌اش سخن می‌گفتند.\r\n\r\nوزیر رو به پادشاه کرد و گفت:\r\nپادشاه من! آن تاجر تمام عمرش را صرف جمع کردن چیزی کرد که با مرگش از دست می‌داد؛ اما آن مرد فقیر چیزی را حفظ کرد که حتی پس از مرگش هم از یاد مردم نمی‌رود: شرافتش را.\r\n\r\nپادشاه پرسید: پس وجدان چیست؟\r\n\r\nوزیر پاسخ داد:\r\nوجدان، قاضی‌ای است که نه می‌توان فریبش داد، نه با پول ساکتش کرد و نه از حکم نهایی‌اش گریخت. شرافت نیز آن چیزی است که انسان، وقتی هیچ‌کس نگاهش نمی‌کند، حاضر نیست آن را بفروشد."
