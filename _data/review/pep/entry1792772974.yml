description: "اینجا رو برحسب اتفاق پیدا کردم قبلا که ویکی‌تجربه بود درباره وضعیت داغون این شرکت خونده بودم، ولی با این حال رفتم برای مصاحبه. الان دیگه بیشتر برام مسجل شد که اوضاع از چیزی که فکر می‌کردم خراب‌تره!\r\nطرف از تکنولوژی حرف می‌زد، ولی معلوم بود خودش هم چیز زیادی بارش نیست؛ انگار دو تا مطلب خونده یا از AI گرفته و فکر کرده متخصص شده! دو تا سؤال می‌پرسید و جواب می‌گرفت، ولی وقتی من یه سؤال فنی ازش می‌پرسیدم، بکس و باد می‌کرد و نمی‌دونست چی بگه! واقعاً خاک بر سر شرکتی که وضعیتش به اینجا رسیده و هنوز فقط ادعا داره.\r\nاز همه بدتر، اون رفتار از بالا به پایین و اعتمادبه‌نفس کاذبش بود؛ آقا، یه کم شعور و اخلاق داشته باش! اینکه یکی به خاطر شرایط کشور دنبال کاره و تو فعلاً سر کاری، دلیل نمی‌شه فکر کنی از دماغ فیل افتادی و با کارجو هرطور دلت می‌خواد رفتار کنی.\r\nاز کجا معلوم فردا ورق برنگرده و خودت بیکار نشی؟ اون موقع دوست داری باهات همین‌طوری رفتار کنن؟\r\nخدا به داد آینده این شرکت برسه با این مدیرها و این سطح از تخصص و اخلاق! ظاهراً ادعا زیاده، ولی دریغ از دانش و شعور حرفه‌ای!\r\n"
