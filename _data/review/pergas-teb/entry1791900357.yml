description: "من مدتیه از پرگاس طب جدا شدم و یه کسب‌وکار کوچیک برای خودم راه انداختم. چند روز پیش اتفاقی نظرات اینجا رو خوندم و دیدم بعضیها تجربه خوبی نداشتن. گفتم منم تجربه خودم رو بنویسم چون برای من شرایط یه مقدار متفاوت بود.\r\n\r\nمن در مجموع از کار کردن توی پرگاس طب راضی بودم. محیط کاریش رو دوست داشتم، هم فضای حرفه‌ای و جدی‌ای داشت و هم روابط بین همکارها خوب و دوستانه بود. البته این تجربه من از واحدی بود که توش کار می‌کردم و طبیعتاً نمی‌تونم درباره همه بخش‌ها نظر بدم اما جو غاللب بنظرم همینه.\r\n\r\nاز نظر مدیران هم من تجربه خوبی داشتم. اتفاقاً بعضی از مدیرانی که اینجا اسمشون مطرح شده، جزو کسانی بودن که من ازشون چیزهای زیادی یاد گرفتم. حداقل چیزی که خودم دیدم این بود که به توانایی و عملکرد افراد اهمیت داده می‌شد و برای رشد کردن هم فرصت وجود داشت.\r\n\r\nدر مورد حقوق هم تا جایی که از همکارهای سابقم شنیدم، وضعیت نسبت به قبل خیلی بهتر شده و پرداخت‌ها تقریباً منظمه.\r\n\r\nنمی‌خوام بگم شرکت بی‌نقصیه یا بقیه اشتباه می‌کنن. قطعاً مشکلاتی هم وجود داشت، ولی تجربه من در مجموع مثبت بود و هنوز هم با خیلی از همکارهای اون دوره در ارتباطم"
