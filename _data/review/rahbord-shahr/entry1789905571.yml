description: "من با عنوان شغلی مارکتینگ وارد این شرکت شدم؛ در شرایطی که عملاً نه زیرساخت درست‌وحسابی برای مارکتینگ وجود داشت، نه فرآیند مشخصی و نه حتی نگاه جدی به این حوزه. از روز اول سعی کردم خیلی از این زیرساخت‌ها را از صفر ایجاد کنم، اما تقریباً برای هر کاری با مقاومت، بهانه و «نمی‌شود» مواجه شدم.\r\n\r\nدر مدت حضورم دو نمایشگاه را برای شرکت اجرا کردم و واقعاً می‌توانم بگویم یکی از بدترین تجربه‌های کاری من بود. برنامه‌ریزی ضعیف، همکاری حداقلی، تغییرات لحظه‌ای، دخالت‌های مداوم و نظرات شخصی افرادی که بعضاً نه تجربه کافی داشتند و نه مبنای مشخصی برای تصمیم‌هایشان، بخش زیادی از انرژی تیم را هدر می‌داد. در چنین فضایی به‌جای اینکه افراد متخصص بتوانند مسئولیت کارشان را انجام دهند، باید دائماً پاسخگوی دخالت‌های بی‌مورد و تصمیم‌های سلیقه‌ای باشند.\r\n\r\nمشکل بزرگ‌تر برای من فرهنگ خود شرکت بود. برداشت من این بود که کیفیت کار و نتیجه‌ای که ایجاد می‌کنید الزاماً چیزی نیست که باعث دیده‌شدن شما شود. در مقابل، نزدیکی به افراد، تأییدکردن دائمی مدیران و بلدبودن بازی‌های سازمانی بعضی وقت‌ها خیلی بیشتر از تخصص و عملکرد ارزش دارد. حتی درباره بعضی از جایگاه‌های مدیریتی واقعاً برای من سؤال بود که معیار انتخاب افراد دقیقاً تخصص و عملکرد بوده یا چیز دیگری.\r\n\r\nپاس‌کاری مسئولیت هم در این شرکت کاملاً عادی است. خیلی‌ها بیشتر از اینکه دنبال حل مسئله باشند، دنبال این هستند که مسئولیت از روی میز خودشان برداشته شود. اگر اهل همین مدل رفتار نباشید، بخش قابل‌توجهی از زمان و اعصاب‌تان صرف پیگیری کارهایی می‌شود که اساساً نباید این‌قدر پیچیده باشند.\r\n\r\nدر مجموع، تجربه من این بود که این محیط برای کسی که بخواهد واقعاً کار کند، مسئولیت بپذیرد، چیزی بسازد و براساس تخصصش اثر بگذارد، محیط فرسایشی‌ای است.\r\n\r\nاگر تخصص، زمان و آرامش روانی‌تان برایتان اهمیت دارد، پیشنهاد من این است که قبل از پیوستن به این شرکت خیلی جدی تحقیق کنید. من شخصاً حاضر نیستم دوباره چنین تجربه‌ای را تکرار کنم و حضور در این مجموعه را یکی از بدترین تجربه‌های کاری خودم می‌دانم.\r\n"
