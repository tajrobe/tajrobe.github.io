description: "من اینجا رفتم مصاحبه‌ی مدیر محصول، سه نفر از مدیران این شرکت شروع کردن به سوال پرسیدن، جالبه که این افراد حتی شعور کافی برای معرفی خودشون در ابتدای مصاحبه نداشتن، سوالات بی‌ربط و چرندیات رفتاری و سوالات فنی برنامه‌نویسی پرسیده شد، در سطحی که انگار بنده برای موقعیت شغلی تک‌لید یا CTO اقدام کردم! من سوالات رو جواب دادم، وسط مصاحبه متوجه شدم محصولی که براش آگهی دادن یک پنل پیامکی هست که اگر از اول گفته بودن اصلا حتی رزومه نمی‌دادم. بیش از یک ساعت وقت من رو تلف کردند؛ اگر کسی عملکردش در مصاحبه بد باشه، نباید اون جلسه یک ساعت و ربع طول بکشه. در نهایت از شرایط کاری و میزان حقوق پرسیدم، که گفتن باهاتون تماس می‌گیریم.\r\nدوزاری بودن یک شرکت رو از نحوه‌ی رفتار مدیرانش در جلسه مصاحبه می‌تونید متوجه بشید. به هیچ عنوان پیشنهاد نمی‌کنم رزومه بفرستید."
