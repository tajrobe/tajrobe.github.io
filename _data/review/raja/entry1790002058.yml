description: "عارضم خدمتتون گفته بودم باز می نویسم الوعده\r\nوفا\r\n\r\n\r\n\r\nاین حیون عنزاده ( شفیعی ) باباش از سفره انقلاب\r\nمی خوره اینم از سفره های کارمنداش و حق و حقوق این و اون ، \r\nنه از خدا می ترسه نه ازکسی \r\nهر کاری بلده برای خوردن حق مظلوم دریغ نداره موقع مصاحبه قول وام و ارزاق می\r\nده بعد استخدام هیچ کدوم که نمیده هیچ حقت رو هم نمی ده نیرو رو راضی نمی کنه اذیت\r\nمی کنه زور می گه در نهایتم می خواد طرف نره و با زور بمونه و اگر نمونه حق و حقوق آخرش رو نمی ده.\r\nقبلا خودش این زور گویی ها رو به کارمندش می گفت  الان یه دستیار عنترتر از خودش آورده گویا اون اینا\r\nرو می گه که خود عنزاده ش کمتر فحش بخوره. خلاصه عن تو عن که می گن همین خرابشده ی رجاست \r\n\r\nضمنا دخترا دهه هشتادی و سبزه اصلا ریسک اومدن اینجا رو نکنید این تایپش همین ، سبزه و هشتادی، که قطعا با آزار های جنسی این گرگ رو به رو می شید.\r\n\r\nبه شخصه آرزو می کنم یه روز یه خایه داری این عن رو از تخماش آویزونش کنه که تمام ظلم هایی که کرده و حق هایی که خورده از جلو چشماش رد شه  و عذاب بکشه تاعبرتی شه برای تمام عنزاده هایی که به اسم آقازاده خون این ملت می مکن\r\n\r\nاینم مخصوص خود عنت شفیعی \r\nجوز رقیب داری ولی این\r\nبرا بیماری اسکیزوفرنیت شرکت های it  تو رو به تخما سگشونم حساب نمی کنن و می دونن همین اخلاق وشخصیت عنت برای از بین بردنت کافیه پ گهت بخور که نابودیت نزدیک\r\nباز هم خواهم نوشت...."
