description: "این آخرین تجربه را که خواندم انگار داغ دلم تازه شد. خیلی وقته از اون شرکت اومدم بیرون. این فردی رو هم که نوشتند تازه آورده نمی‌شناسم. ولی ظاهرا اوضاع این شرکت به سمت دارک تر شدن است. \r\nمن چند شرکت رقیب اینها را میشناسم. خودم الان از آی تی اومدم بیرون و کسب و کار خودم رو دارم. ولی اینها به خاطر این اقداماتی که م.ش میکنه همونطور گنجشک روزی موندند. شرکتهای رقیب الان ۲۰۰ نفر نیرو دارند و عدد فروش چند صد میلیاردی و رجاء فکر کنم نهایتا ۲۰ نفر نیرو داره و ادعاهای گنده. علت هم همین فرد است که با خساست تمام فکر میکنه یک ریال به نیروش نباید بده. اونجا برای خرید خودکار هم باید منتظر باشی تا رییس دستور بده. بعد که خودکار میخره برات بنویسی تا کار شرکت راه بیفته کلی منت میزاره سرت. کلی فحاشی میکنه جلوی جمع. همه بچه ها دعا می‌کردند صبح که میاد حالش خوب باشه و الا با فحش و دعوا و .. موجه بودند. غیر از این مسایل خلاف اخلاق که خب بر ای تازه به دوران رسیده ها عادی است و شاید هیچ محکمه ای هم بهش رسیدگی نکنه، این بی ثباتی و بی اخلاقی و بی شعوری مدیرعامل بیشترین آزار و اذیت را برای بقیه داشت. باز وضع پسرهای شرکت از ماها بهتر بود. اگه با با ایشان لاس نمی‌زدیم که کارمان تمام بود. یک دختری اومد دیگه خیلی هم بهش راه داد،‌به اون هم رحم نکرد و جلوی همه همیشه دعوا و فحش و ... . \r\nشاید باور نکنید بچه های دفتر آبان آرزو داشتند برند فنی. فقط به خاطر اینکه دفتر رشت شرکت که واحد فنی در آنجاست، از شفیعی دور بود و تنش عصبی نداشتند. البته اونجا هم مسایل خودش رو داشت. حکومت پلیسی و نظامی بود. حجاب اجباری و ممنوعیت پخش آهنگ و نماز جماعت و ... انگار وارد پایگاه بسیج می‌شدیم ولیکن ما که دفتر مرکزی بودیم آرزو داشتیم از دست این فرد در بریم، به اون خفت تن بدیم ولی نزدیک بهش نباشیم. \r\nخدا کنه ایران از شر اینها راحت بشه. اصلا توصیه می‌کنم دخترا سراغ این شرکت نرند. "
