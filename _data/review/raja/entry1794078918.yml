description: "واقعاً جای تأسف داره که شرکتی با این حجم از مسافر و مسئولیت، حتی در ثبت اطلاعات اولیه بلیت هم دقت کافی نداره! تاریخ سفر و اطلاعات مسافرین رو اشتباه ثبت کردید و حالا ما به‌عنوان مسافر باید تاوان این بی‌دقتی و اشتباه شما رو بدیم. انتظار داریم حداقل اطلاعاتی که روی بلیت درج می‌کنید درست و قابل اعتماد باشه، نه اینکه خودتون اشتباه کنید و بعد مسافر رو درگیر دردسر کنید.\r\n\r\nاز همه بدتر، برخورد غیرمسئولانه و نبود پاسخگویی شماست. وقتی برای پیگیری تماس می‌گیریم، به‌جای اینکه کسی مسئولیت موضوع رو بپذیره و راه‌حلی ارائه بده، خیلی راحت می‌گید برید تیکت ثبت کنید! مگر مسافر چقدر باید وقت و انرژی صرف اشتباهات مجموعه شما کنه؟ لطفاً به‌جای پاس‌کاری کردن مردم بین واحدهای مختلف، یک نفر مسئولیت این موضوع رو قبول کنه و هرچه سریع‌تر مشکل رو برطرف کنه. واقعاً این سطح از خدمات و پاسخگویی در شأن یک شرکت حمل‌ونقل ریلی نیست.\r\n"
