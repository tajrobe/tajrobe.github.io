description: "سلام تویی که داری اینو میخونی،به والله قسم دارم این نظر رو با صداقت تمام مینویسم پس گوش کن.\r\n\r\nخیلی دوس داشتم اینا رو یکی هم به خوده من میگفت👇 \r\nاولا که داخل تجربیات اگر یکسری افراد رو میبینی که در مورد شرکت رجا راه آهن دارن نظر میدن، بدان که این نظرات کاره مدیر(م.ش) شرکت فناوری اطلاعات رجاء هست چون میخواد که این نظرات منفی رو به شرکت راه آهن نسبت بده و بگه دروغه! و اخلاق بد خودش و سازمانش رو توجیح کنه. \r\nآقا و خانم عزیزی که داری این متن رو میخونی اگر برای استخدام در شرکت فناوری اطلاعات رجاء رفتی و جلوت سفته گذاشتن جون مادرت امضاء نکن و بیا بیرون. \r\nبه پیر به پیغمبر بدبخت میشی حالا چرا؟!\r\nچون تا قبل از امضا کردن قرارداد و سفته باهات با نهایت احترام برخورد میکنن بعدش که سفته و قرارداد رو امضا کردی هرکاری که بخوان هر توهینی که بخوان و هر چور که دوست داشته باشن برخورد میکنن استعفا هم بخوای بدی باهمون سفته تهدیدت میکنن.\r\nپس سفته جلوت گذاشتن امضا نکن. (نمیذارن که بنویسی برای حسن انجام کار).\r\nاز من هم میشنوی یه لطفی در حقه خودت بکن این متن رو چند بار بخون و به من آدم ناشناس اعتماد کن. بی منطق که حرف نزدم 👈قرارداد یکطرفه و سفته جلوت گذاشتن امضا نکن👉 و بیا بیرون .\r\nاز لحاظ کاری به نسبت شرکت های تو این حوزه که من شناخت پیدا کردم هم از لحاظ حقوق و هم از لحاظ مزایا و بیمه خیلی پایین تره. مثال سادش : برای مثلا تبریک تولد هنوز کارت هدیه ۵۰۰ تومنی یا ۱ تومنی (ساله ۱۴۰۴-۱۴۰۵)میدن در حالی که جوری که من از اطرافیانم شنیدم جاهای دیگه مبالغ بالاتری مثل ۵ تومن یا ... دادن.\r\nمنت هومن ۵۰۰تومن یا یک تومن هم تازه میشنوی. \r\n\r\nبیشتر ماه ها هم برای دریافت حقوق به مشکل میخوردیم چون شرکت پول نداشت.\r\n\r\nاگر میخوای ببینی من راست میگم یانه یکاری کن:\r\nاگر گفتن بیا باهم همکاری کنیم بگو باشه اما قرار داد موقت ۲ماهه آزمایشی ببند به همراه قرارداد nda(حفظ اسرار) .  \r\nبهت قول میدم که تو همون ماه اول متوجه میشی چه خبره.\r\nاگرم گفتن نمیشه پس حرفه منو باور کن که این شرکت جای مناسبی برای تو نیست . اگر جای خوبی بود با قرارداد آزمایشی موافقت میکردن چون الآن بیشتر شرکت های خوب اول قرارداد آزمایشی میبندن اگر هر دو طرف راضی بودن تمدید می کنن.\r\n\r\nخلاصه : شرکت فناوری اطلاعات رجاء جای مناسبی برای شما نیست."
