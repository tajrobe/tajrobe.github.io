description: "سلام دوستان امیدوارم این تجربه برای افرادی که می خوان تو این شرکت کار کنن مفید باشه \r\nشرکت رستافن چندین بخش داره که یکیش رادیو، تولید سیستم های مخابراتی هستش من از تجربه خودم میگم ،خوب شرکت رستافن شرکت بزرگیه و لایه های مدیریتی زیادی داره اول مدیر عامل یا مدیر کل شرکت ،مدیر بخش،مدیر قسمت و در آخر مدیر مستقیم، رابطه بچه ها و مدیران مستقیم با هم  رابطه صمیمی بود تو بخش ما، ولی خوب بعضا برخی قسمت ها ممکنه مدیرشون زیاد اخلاق خوبی هم نداشته باشه ولی مدیر من از حق نگذریم واقعا آدم با سواد و خوبی بود.\r\nمن مزایا و بدی های شرکت رو با صداقت میگم چون دیگه تو اون شرکت کار نمی کنم بدلیل جنگ ما رو تعدیل کردن ،شاید برا دوستانی که در آینده اینجا استخدام شدن مفید باشه.\r\nمحیط شرکت کاملا مذهبی هستش بدرد کسایی که حجاب ندارن نمیخوره و حتی تو مصاحبه از تتو و نماز و ...میپرسن\r\nگوشی همراه هوشمند تو ساختمان قسمت های تولید شرکت ممنوعه و فقط برا مدیران مجازه\r\nتو این شرکت اضافه کاری اجباریه و حتما باید بیای براشون تو مهم نیستی اگر بگن تا ساعت ۷/۳۰ شب هم باید بمونی،قیمت اضافه کاری هم با همون ساعت قرارداده.\r\nتو شرکت هر سه ماه یبار کارانه میدن که برا افراد فرق میکنه بستگی به راضی بودن مدیر مستقیم از شما داره ولی ممکنه سر وقت ندنش هر سه ماه بن خرید هم داره برنج و روغن میدادن میان وعده هم میدادن هر روز.\r\nاین سود سازمانی و پاداش اینا رو هر وقت دلشون بخواد میدن سالانه نیست \r\nشرکت بزرگیه حقوق سر وقتش میدن.\r\nحقوق ساعتیه، روزای تعطیل حقوق نداری رسمی و غیر رسمی هم نداره،میزان حقوق برا کسایی که تو قسمت R&D کار میکنن خوبه و برا بقیه قسمت ها معمولی واقعا نسبت به شرکتهای مشابه\r\nمرخصی سخت میدن ۲۷ روز سالانه.\r\nبیمه تکمیلی رایگان و پزشک سازمانی سالی یه بار هم داره\r\n\r\n"
