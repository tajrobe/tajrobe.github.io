description: "من چند سال تو شرکت رستافن کار کردم. فضای شرکت بسیار مذهبی و بسته ست. همانطور که بقیه گفتن مرتبا دوربین ها بررسی میشه و رصد میشید و سر مسائل بی اهمیت تذکر میدن. فضای دوستانه وجود نداره. فضای کار تیمی به هیچ عنوان وجود نداشت. فضای آموزش و رشد به هیچ عنوان وجود نداشت. مدیران به شدت کنترلگر و غیر حرفه ای هستن و برخلاف شعارشون که میگن اصل بر شایستی سالاری باشه، اصل رشد شما تو این شرکت فقط و فقط پاچه خواری و چاپلوسیه. این توی همه گروه ها و تیم های شرکت به وفور وجود داره و بازخورد خیلی از همکاران بود. هیچ شفافیتی در خصوص موارد مالی ندارن و همه چیز محرمانه ست و اگه بگید توبیخ میشید و ممکنه اخراج هم کنن. اصلا فضای شاد و دلچسبی نداره.\r\nمقدار حقوق پرداختی به نسبت بازار بالا بود و تا ۸-۹ ام هر ماه پرداخت میشه. پاداش و سود داشتن که خیلی عدد خوبی بود. اگر چاپلوسی میکردید افزایش حقوق خیلی خوبی میگرفتید و اگر نقد میکردید سرکوب میشدید. مدیر تیم به شدت بازی روانی رو خوب بلده. رفتار کاملا مغرورانه و ارباب رعیتی دارن و اگر بهشون فضا بدی توی همه چیزت دخالت میکنن. اکثر ادما بسیجی ان و حین جنگ ۶۰ درصد نیرو هارو فقط با ارسال یک پیامک تعدیل کردن. همه رو مجبور کردن چک بیارن تا سنواتشون رو بدن و اگر کسی چک نداشت طلبکارانه باهاش برخورد میشد و بی احترامی میکردن. اکثر نیروهای خوب و باسوادی که میشناختیم به مرور یا حذف شدن یا استعفا دادن و رفتن. سطح سواد تیم های آیتی بسیار ضعیفه. تمرکز اصلی روی نخوه مدیربت کارها با هدف کنترل ‌پرسنله و اولویت پیشرفت کار نیست. به شدت پر حاشیه و منفیه\r\nامکانات ورزشی و غذایی خوبی داره. منابع انسانی خیلی ضعیف عمل میکنه. نیروی انسانی برای این شرکت اصلا اهمیتی نداره و صرفا شعار میدن\r\nمدیران نالایقی دارن که اکثر نیروها ازشون ناراصی هستن اما مدیریت ارشد هیچ کاری برای بهبود وضعیت نمیکنه و این مدت شاهد استعفاهای زیادی بودم.\r\nبا توجه به شرایط جنگ، امنیت شغلی هم دیگه وجود نداره."
