description: "با سلام\r\nمن 6 سال سابقه کار در این شرکت رو داشتم. اوایل یادمه همه چی خوب بود. قبل اینکه وارد مجوعه بشم حس خوبی نسبت بهش داشتم و کلا با انرژی بسیار بالایی وارد شرکت شدم. به شدت تلاش می کردم که خودم رو بالا بکشم. فکر میکردم مدیرهای اونجا خیلی آدم‌های قوی هستن و کاربلدی هستن.\r\nدر حالی که برعکس... به شدت آدم‌های دو رو، ریاکار و بی تمرکزی بودن و سوتی‌های وحشتناکی می‌دادن. هر جا هم گند کار در می اومد با نهایت رذالت تو رو سیبل می کردن!\r\nفضای شرکت سنگین بود، آدم های بسیجی-مذهبی به شدت رومخی داشت. شما اگر کوچکترین زاویه ای با سیستم داشته باشین به معنای واقعی کلمه اونجا زجر می کشین.\r\nتقریبا تو همه چیز سلیقه مدیر و روابط بیشترین تاثیر رو داره تا توانایی فنی و ارزیابی حرفه‌ای. این در حالی هستش که مدیرها ادعای حرفه‌ای بودن دارن.\r\nاوج هنر شرکت هم رفتارش بعد از جنگ بود. من تا قبل شروع جنگ همواره ارزیابی‌هام خوب بود، هر سال نسبت به سال قبل بهتر شده بودم، کارانه ای که میگرفتم معمولا از بقیه دوستام بیشتر بود، هر سال پروژه‌های مهم‌تر و سخت‌تری برام در نظر گرفته می‌شد. اما یهو بعد جنگ نمیدونم چی شد که ما رفتیم تو لیست سیاه! به قدری بد و ناجوانمردانه بیرون گذاشته شدیم که بعد 7-8 ماه به شخصه هنوز نتوستم با تبعات اون رفتاری که باهام شد کنار بیام.\r\nبه جز یکی دو گروه و مدیر خاص تقریبا تو همه جای شرکت شما با یک عده مدیر نالایق سر و کار دارین که حاضرن برای اینکه خدشه‌ای بهشون وارد نشه به راحتی زیرآب شما رو بزنن و همه تقصیرها رو بندازن گردن نیروی زیردستشون. اگر هم کاری به نتیجه رسید کل اعتبار اون کار رو به اسم خودشون میزنن.\r\nدر کل به عنوان جمع‌بندی، اگه ارزشی نیستین اصلا سمت این شرکت نرید.\r\n"
