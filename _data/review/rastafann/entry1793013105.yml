description: "بعد ها یه تجربه جامع تر مینویسم\r\nاز وب سایت خواهش میکنم حتما تجربه منو منتشر کنن تا بلایی که سر من و همکارانم اومد سر بقیه نیاد\r\nبه دوستان علاقه مند به همکاری با شرکت توصیه میکنم علت تحریم شدن شرکت رو در اینترنت جست و جو کنن. \r\nشرکت معمولاً تا روز اول همکاری از شما پنهان می‌کنه ماهیتش چی هست و چه عواقبی برای مهاجرت شما می‌تونه داشته باشه. \r\nطی جنگ ۴۰ روزه بیشتر ساختمان های شرکت بمباران شد و شرکت اعلام کرد با کل پرسنل حتی مدیران ارشد قرارداد نمیبنده و همه تعدیل شدن ولی بعداً با تعداد محدودی از همکاران تقاضای ادامه همکاری به صورت قراردادهای ماهانه تا خرداد ماه با واریز بیمه ولی بدون پرداخت حقوق کرد! به جای پرداخت حقوق ۳ ماه به شما مبلغ تسویه حساب رو میداد! ولی بعد خرداد شروع به پرداخت حقوق کرد بدون حتی ۱ درصد افزایش حقوق! شما میتونید با تورم فعلی با حقوق سال قبل تون زندگی کنید؟! مخصوصا اینکه پرداختی به صورت ساعتی هست و تو روز های تعطیل و شرایط بحرانی که شرکت تعطیل می‌کنه هم حقوقی دریافت نمیکنید! الان که دارم این تجربه رو مینویسیم شرکت بعد تعدیل گسترده آگهی استخدام front end و c# و تکنسین شبکه داده، در صورتیکه این نیروها  رو قبلاً داشتن ولی تعدیل کردن، به کلیه دوستانی که احتمالا قصد همکاری دارن توصیه میکنم قبلش یه فکر راجع به عواقب همکاری کنند مثل ریسک ریجکت شدن درخواست ویزای مهاجرت. مخصوصا تو شرایط جنگی الان که هر لحظه ممکنه اتفاق جدیدی رخ بده ریسک تعدیل یا عدم پرداخت حقوق رو دارید، و شرکت براش اصلا مهم نیست که شما خرج خانواده باید بدید یا اجاره و قسط دارید راحت پولی بهتون نمی‌ده. \r\nاین توصیه من بود برای دوستانی که شاید قصد همکاری اونم شرایط فعلی رو دارن، توصیه من اینه اصلا تو شرایط فعلی همکاری نکنید چون ممکنه چندین ماه درگیر مشکلات مالی بشید و شرکت هم هیچ اهمیتی ندارد براش."
