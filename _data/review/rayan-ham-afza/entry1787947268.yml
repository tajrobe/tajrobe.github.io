description: "با دعوت منابع انسانی برای مصاحبه تماس گرفته شد. زمان پیشنهادی فردای همان روز بود که متأسفانه برای من مقدور نبود، بنابراین خواستم تاریخ دیگه‌ای هماهنگ بشه. گفتن که \"باشه، می‌پرسم و خبر می‌دم\". از اون لحظه تا الان که حدود یک ماه گذشته، هیچ خبری ندادن. نه تماسی، نه پیامی، نه حتی یک رد یا تأیید ساده.\r\nاین بی‌پاسخ گذاشتن نه‌تنها غیرحرفه‌ایه، بلکه حس خوبی به آدم منتقل نمی‌کنه. حتی اگر تصمیمی برای ادامه همکاری نداشتن، حداقل انتظار می‌رود اطلاع داده بشه. متأسفانه از این رفتار چنین برداشت می‌شه که بخش منابع انسانی یا فرآیند مشخص و حرفه‌ای نداره یا اینکه به وقت و احترام متقابل اهمیتی نمی‌دهد.\r\nامیدوارم در آینده این شیوه برخورد با کارجو ها اصلاح بشه."
