description: "من یکسال به عنوان نیروی تست در این شرکت کار کردم\r\nمحیطش اصلا جای پیشرفت نداره و وظایف کاملا تکراری هستش\r\nشرکت خیلی تخصص محور نیست و براش تعداد سالی که کار کردید اهمیت بیشتری داره - افرادی که تو شرکت قدیمی تر هستن (هیچ تخصص جدیدی ندارند و اخرین مطالعاتشون دوران دانشجوییشون بوده) اولویت بیشتری دارند.\r\nحقوقش در حد یه کارگر ساده شاید یکم بیشتر هستش\r\nنحوه ی مشخص شدن حقوق هر کسی دلخواهه و هرچیزی که در ابتدای استخدام بتونید بگیرد هستش و هیچ فریم ورک حقوقی ندارند.\r\nکسایی که دیر از شما وارد شرکت میشن با توجه به تورم حقوق بیشتری درخواست میکنن و همواره کسایی که ابتدای سال وارد شدن کمتر از جدید تر ها میگیرند\r\nهر زمان که برای افزایش حقوق اقدام کنید از شما ایراد هایی میگیرن که توجیح کنن شما رو (مثلا دانشجویی ، کارت خیلی خوب نیست و ...) در صورتی که با کسی مشکل داشته باشن نگهش نمیدارند.\r\n\r\nمن تمام یکسالی که تو این شرکت بودم بجز زمان جنگ یک روز هم اجازه ی دورکاری نداشتم (در صورتی که سایر همکار ها هفته ای یکروز به انتخاب دورکار بودن)\r\nساختار تیم رفاقتی هستش کسایی که دوستی با مدیر واحد داشتن موفق تر بودن\r\n\r\nدسترسی های کامپیوتر های شرکت به اینترنت ازاد محدود هستش و خبری از هوش مصنوعی ها و ابزار های هوش مصنوعی نیست و برای یه سرچ ساده هم باید کلی دردسر رو تحمل کنید و به یک سرور دیگه ریموت بزنید\r\nبه هر شخصی یک مانیتور بیشتر نمیدن ، کسایی که دولوپر هستن کار کردن با یک مانیتور عذاب آور خواهد شد براشون.\r\nخبری از مزایا نیست و تنها چیزی که شرکت میده حقوق خیلی کم هستش\r\nکارانه هم طبق چیزی که خودشون میگن هر 6 ماه پرداخت میشه ولی انجام این مورد رابطه ی مستقیم با وضعیت مالی شرکت داره ، هر دوره که بررسه دوست داشته باشن میدن من توی یکسالی که اونجا بودم ندادن.\r\nرفت و امد توی تیم ها بالاست و افراد بیشتر از یکسال نمیمونن\r\nاین شرایطی که گفتم عمدتا بین همه ی تیم ها یکسان بوده و خیلی فرق نمیکنه کدوم تیم باشید\r\nعمدتا کسایی هم که همین الان مشغول هستن از شرایط کاری و شرکت راضی نیستن و بعضا باهام تماس میگیرن برای اینکه معرفیشون کنم به شرکت های دیگه\r\n\r\nمعمولا خروج از شرکت با اتفاق های خوبی همراه نیست و حاشیه سازی میشه ، مثلا برای خود من گفتن که ما بهت یاد دادیم که به اینجا رسیدی که بری جای بهتر ، در صورتی که توی اون یکسال توی ساعت های غیر کاری دوره شرکت کرده بودم.\r\n\r\nدر کل به کسایی پیشنهاد میکنم کار کردن توی رایورز رو که:\r\n1.سابقه ی زیادی دارن (مثلا 10 سال) و خیلی حوصله ی مطالعه ی جدید ندارن و میخوان یه جای بمونن تا بازنشسته بشن\r\n2. دانشجو هستن و چیز زیادی بلد نیستن و میخوان یه تجربه ی کاری و یه حقوق دانشجویی داشته باشن (در حد خرج های دانشگاه)\r\n\r\nبه چه کسایی پیشنهاد نمیکنم:\r\n1. کسایی که پیشرفت و سطح کاری براشون مهمه\r\n2. کسایی که حقوق دریافتی براشون مهمه و حداقل حقوق بازار کار رو میخوان\r\n"
