description: "کل فرایند استخدام این شرکت یک شوی بزرگ برای نمایش جذب هست ولی جذب نیرو در کار نیست. مصاحبه اول فنی و آنلاین بود و به خوبی انجام شد، برای مصاحبه‌ی دوم گفتن حضوری، یک بار تماس گرفتن و من نتونستم پاسخ بدم، نه ایمیلی نه اطلاع‌رسانی درستی و نه حتی شماره داخلی که آدم بتونه بهشون زنگ بزنه. بعدش هم ریجکت کردن. و الان بعد از چند ماه همون عنوان مالک محصول بام دوباره آگهی شده. مرغ پخته خنده‌اش می‌گیره از حجم دلقک بودنتون. همه جا رو تبدیل به مافیا کردید و چون کوتوله و بی‌سواد هستید و شرافت فردی و شرافت کاری ندارید می‌ترسید با کسی قوی‌تر از خودتون کار کنید. در نتیجه فقط از مسیرهای دلالی نیرو می‌گیرید و کوتوله‌پروری می‌کنید. به هیچ عنوان اینجا رزومه نفرستید."
