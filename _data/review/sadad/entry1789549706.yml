description: "شرکت سداد واقعا یکی از بدنام ترین ها تو ایران هستش. مدل مصاحبه و روال جذب بیمار و سادیسمی دارن. تو مصاحبه ای که مثلا شما قراره برای برنامه نویسی فراند اند انتخاب بشید سوالاتی میپرسن که از میزان بیمار بودن فرهنگ کاری و اشتباهات فنی مطلع میشید.\r\nمصاحبه کننده (خانم م.ن) بقدری عاجز و قدیمی با دانش منسوخ و بیسواد هستش که دست به دامن یک لیست دانلودی از گوگل میشه و سناریوهایی که ازت میپرسه مثلا اینجوریه که 10 دقیقه یک چیز پرت و غیر واقعی رو برات توضیح میده بعد میگه تو عالم برنامه نویسی قراره چطوری اجراش کنی؟\r\nخوب این رو به هوش مصنوعی هم بدی چند صفحه باید برات بنویسه!\r\nبعد اینکه من از پرس و جو متوجه شدم شرکت حقوق اصلی شمارو نمیده و دلیل اصلی ریزش نیرو سداد همینه و مثلا اگر بهت وعده میده 60 میلیون چیزی حدود 35 میلیون پرداختی شما هستش و بقیه با پکیج و این مسخره بازیا پرداخت میشه و شاید حقوق به 40 تومن برسه!\r\nحالا موقع تسویه هم همون وزارت کاری رو میگیره و مشکلی بود برو شکایت کن.\r\nبله عزیزان دلیل اصلی اینکه سداد اینهمه آگهی استخدام برای سامانه بام یا بقیه جاهای شرکت داره همینه و هر کسی میاد بعد 1-2 ماه فرار می کنه.\r\nاین تجربه صادقانه بود حالا برو وقتت رو حروم کن تا این آدمای مریض استخدامت کنن.\r\nموفق باشید"
