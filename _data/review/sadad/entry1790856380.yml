description: "من بعنوان برنامه نویس سنیور جاوا رزومه دادم. 3 مرحله مصاحبه دارن. اولین مصاحبه انلاین و سوالاتی که پرسیده میشه همگی شبیه سوالات که از گوگل پیدا کردن. مرحله دوم حضوری بود که با تاخیر نزدیک 30 دقیقه شروع شد و قبلش باید فرم پر میکردم. بعدش یک مصاحبه منابع انسانی و آخرش هم یکسری استعلامات. در تمام طول مدت مصاحبه هیچ حرفی از حقوق نمیزنن و آخرش در کمال ناباوری مبلغ 50 میلیون که با پکیج کارانه و این مزخرفات مثلا به 60 برسه که اگر مدیر تایید کنه.\r\nدوستان من رو باور داشته باشید. سداد یک سیستم \"\"\"فاسد\"\"\" و الکی هستش. تا میتونید از این شرکت فاصله بگیرید."
