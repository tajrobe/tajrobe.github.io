description: "من چند سال پیش اینجا کار میکردم ولی با چیزایی که الان خوندم مشخصه که همون روال قبلی الانم پابرجاست.\r\nیه عده ای از یه شهری به نام غروه اومدن یه شرکت زدن که همشون فامیل هم هستن و اگر فامیلشون نباشی کلا هیچ اهمیتی توی این مجموعه نداری.\r\nحداقل حقوق ممکن رو بهت میدن.\r\nساعت کاری بیشتر از موظفی ماهانه داری و همیشه هم ازت طلبکارن.\r\nاصلا معلوم نیست چی میگن و چی میخان. لهجه های افتضاح داشتن. مخصوصا مدیر پشتیبانیشون.\r\nیه مشت آدم زیرآب زن و پاچه خار هستن که فقط بلدن توی کار و زنذگی دیگران سرک بکشن و اگر براشون پاچه خاری نکنی جواب سلامتم نمیدن.\r\nکلا جای مخوفی هست.\r\nمن که نجات پیدا کردم امیدوارم شرایط جوری باشه که افرادی مثل اینا نتونن حق و حقوق بچه های مردمو بخورن."
