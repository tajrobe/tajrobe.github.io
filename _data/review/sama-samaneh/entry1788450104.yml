description: "یک سال برنامه نویس این شرکت بودم. همکارانی خوب و عالی، جوی مناسب. \r\nولی از مسئولین این شرکت، ضعف شدید مدیریت، خودخواه، دروغ گو، دو رو، لجباز، من من کردنای الکی، مدیرم من و فلان. از زمانی که بخواین با منابع انسانی یا مدیریتش برخورد داشته باشین اینا رو می بینین و دیگه رنگ آرامش نخواهید داشت. به هیچ وجه به فکر پرسنل خودشون نیستن تا جایی که براشون امکان داشته باشه از حقوقت می زنن. عیدی سنوات و قوانین وزارت کار رو به سخره گرفتن می گن ما قوانین خودمونو داریم البته این موضوع رو به محض ورود به شرکت متوجه میشین ولی وعده های الکی زیاد میدن البته در صورتی که کارتون خوب باشه که دروغی بیش نیستن بنابراین به نظرم تا می تونید اینجا مشغول به کار نشین."
