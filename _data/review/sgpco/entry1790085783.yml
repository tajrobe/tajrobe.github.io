description: "تجربه کار در واحد تبلیغات این مجموعه را دارم. متأسفانه فضای کاری مجموعه بسیار سنتی، غیرحرفه‌ای و به‌شدت مردسالارانه بود و در بسیاری از موارد، تخصص و عملکرد افراد معیار اصلی تصمیم‌گیری نبود.\r\n\r\nاز آنجا که مجموعه ساختار خانوادگی دارد، ثبات شغلی نیز تا حد زیادی تحت تأثیر تصمیمات اعضای خانواده قرار می‌گیرد و ممکن است بدون وجود دلیل مشخص و حرفه‌ای، درباره ادامه همکاری با یک فرد تصمیم‌گیری شود.\r\n\r\nمدیران اصلی مجموعه، که از سهامداران اصلی نیز هستند، در بسیاری از مواقع تحت تأثیر نظرات اطرافیان قرار می‌گرفتند و تصمیمات و مواضع مدیریتی ثبات لازم را نداشت.\r\n\r\nدر سطح مدیریت میانی نیز تجربه من با رفتارهای غیرحرفه‌ای و حاشیه‌سازی‌های مداوم همراه بود. سرپرست واحد ما در مواردی رفتارهای غیراخلاقی و غیرحرفه‌ای داشت و به جای ایجاد یک فضای کاری سالم، خود نیز در شکل‌گیری و گسترش حاشیه‌ها نقش داشت. مواردی از ارتباطات و رفتارهای خارج از چارچوب حرفه‌ای نیز در مجموعه مطرح و آشکار شد، اما با وجود این مسائل، به دلیل روابط و سیاست‌های داخلی، همچنان به همکاری خود ادامه می‌دهد.\r\n\r\nدر مجموع، تجربه من از این مجموعه نشان‌دهنده محیطی سنتی، رابطه‌محور و دور از استانداردهای حرفه‌ای بود و به نظرم افرادی که تخصص، شفافیت و شایسته‌سالاری برایشان اهمیت دارد، بهتر است پیش از همکاری، درباره فرهنگ سازمانی و ساختار مدیریتی مجموعه تحقیق کافی داشته باشند."
