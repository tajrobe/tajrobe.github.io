description: "من در واحد دیگری از شرکت مشغول به کار بودم، من در واحد دیگر مشغول هستم ولی متاسفانه این موضوعات رو به عینه میدیدم و وقتی برای برخی امور به واحد تبلیغات می رفتیم کاملا میدیدیم این اتفاقات روابط سرپرست صفاتی با مدیر و دیگر کارمندان واحدی پرتنش پرحاشیه که واقعا ارزش کار کردن نداره.  رفتارها و حاشیه‌های مربوط به صفاتی به‌قدری گسترده شده بود که آثارش به واحد ما هم می‌رسید. این فرد با استفاده از روابط و واسطه‌هایی که داشت، ظاهراً از حاشیه امنی برخوردار بود و با وجود حرف‌وحدیث‌های متعدد درباره تخلفات و رفتارهای غیرحرفه‌ای‌اش، برخورد جدی با او صورت نمی‌گرفت. از طرفی، به نظر می‌رسید اطلاعاتی از مسائل و نقاط ضعف افراد مختلف در اختیار داشت و همین موضوع باعث می‌شد خیلی‌ها ترجیح بدهند سکوت کنند و وارد درگیری با او نشوند. برای من عجیب بود که چطور یک نفر می‌توانست تا این اندازه فضای اطرافش را تحت تأثیر قرار دهد، بدون اینکه کسی مسئولیت رسیدگی به وضعیت را بپذیرد. به‌مرور، این شرایط اعتماد کارکنان به مدیریت و عدالت در محیط کار را از بین برده بود و این تصور را ایجاد می‌کرد که روابط و ترس، بیشتر از قانون و شایستگی تعیین‌کننده هستند."
