description: "ممد صفاتی تو هنوز آدم نشدی، فکر کردم بعد این همه سال بالاخره خودتو درست کردی، چه موجود عجیبی هستی اونجا هم رفتی داری به همون گندکاری های همیشگیت ادامه میدی، ممددد \r\nبعضیا رو آدم فکر می‌کنه با گذشت زمان عوض می‌شن، ولی ظاهراً زمان فقط سنشون رو می‌بره بالا، نه سطح شعورشون رو!\r\nبعضی آدما واقعاً یه استعداد خاص دارن؛ سال‌ها می‌گذره، سنشون بالا می‌ره، موهاشون سفید می‌شه، ولی دریغ از یه ذره رشد فکری و شخصیتی! 😂 آدم فکر می‌کنه بالاخره یه جایی شعور و شخصیت هم به آدم اضافه می‌شه، ولی انگار برای بعضیا این دو تا جزو امکانات اختیاریه و از اول هم توی پکیجشون نبوده! 🤣 جالب‌تر اینکه معمولاً همین آدما بیشتر از همه ادعای فهم و شخصیت دارن، در حالی که هنوز فرق بین بزرگ شدن و بزرگوار شدن رو نفهمیدن. خلاصه رفیق قدیمی، سال‌هاست می‌شناسمت و باید اعتراف کنم که تو یه چیز رو واقعاً ثابت کردی: برای بی‌شعوری و بی‌شخصیتی، نه استعداد خاصی لازمه، نه تلاش زیادی؛ فقط کافیه آدم تصمیم بگیره هیچ‌وقت تغییر نکنه!"
