description: "من مدتی که توی این شرکت کار می‌کردم، چیزی که بیشتر از همه به چشمم می‌اومد این بود که وضعیت بخش‌های کارگری نسبتاً بهتر بود، اما مشکل اصلی شرکت توی مدیریت و نحوه اداره کردن قسمت‌های مختلف بود. انگار شرکت دیگه اون شرکت قدیمی با نظم و هماهنگی سابق نبود. هر واحد برای خودش یه جزیره شده بود و هر مدیری ساز خودش رو می‌زد. هر بخشی قانون و روابط خودش رو داشت و عملاً کسی هم نظارت درست‌وحسابی روی عملکردشون نمی‌کرد.\r\nمتأسفانه همین وضعیت باعث شده بود زمینه برای رانت، رابطه‌بازی، تبعیض و بعضی سوءاستفاده‌ها فراهم بشه. خیلی از کارها به‌جای اینکه طبق ضابطه و به نفع شرکت پیش بره، تحت تأثیر روابط و منافع بعضی افراد انجام می‌شد. از همه عجیب‌تر اینکه به نظر می‌رسید مدیران اصلی شرکت یا از خیلی از اتفاقات خبر ندارن یا گزارش‌هایی که بهشون می‌رسه با واقعیت داخل مجموعه فرق داره.\r\nشرکت عملاً افتاده بود دست بعضی از بخش‌ها و هر کسی در محدوده خودش هر طور که می‌خواست عمل می‌کرد. و گاها منافع مالی فردی توی تصمیمات اثر می گذاشت.\r\nبه نظرم مشکل اصلی این شرکت کمبود امکانات یا نیروی انسانی نیست؛ مشکل اینه که مدیریت واحد و نظارت واقعی از بین رفته. شرکتی که هر قسمت اون برای خودش تصمیم بگیره و کسی هم پاسخ‌گوی عملکردش نباشه، دیر یا زود از داخل دچار مشکل می‌شه. حیفه مجموعه‌ای که قبلاً اعتبار و انسجام خوبی داشته، به خاطر مدیریت جزیره‌ای و بی‌توجهی به وضعیت داخلی، به این روز بیفته."
