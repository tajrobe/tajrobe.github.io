description: "من نزدیک به 5 سال توی این شرکت کار کردم. صادقانه میگم مدیر قبلی شرکت خیلی خانم خوب و متشخصی بودن\r\nبه معنای واقعی کلمه \"مدیر\" بودن\r\n\r\nاما متاسفانه بعد از ایشون، کار به یه آدم بسیار عقده ای و بی سواد سپرده شد\r\n\r\nکلا این شخص به حدی عقده ای هست که با هرکسی که از خودش بیشتر بدونه یا مدرک تحصیلیش بالاتر باشه نمیسازه :))\r\nچرا ؟\r\nچون خودش با مدرک فوق دیپلم ردَی، مدیر شده و در جایگاه مناسب خودش نیست\r\n\r\nالبته که همه میدونن که این پست مدیریت رو هم با گریه زاری و قهر کردن از پسرعموی خودش به زور گرفته و اگر عدالتی توی این دنیا وجود داشت، در بهترین حالت ناظم یک مدرسه میبود در شهر خودش\r\n\r\nیه چیزی دارن به اسم \"ناهماهنگی سیستمی\"... که ته حروم خوریه\r\n\r\nتوی هر بیلدی که میدن عمدا به صورت رندوم توی برنامه ی یه سری از مشتریا این مشکل رو درست می کنن و برنامه مشتری رو قفل میکنن.. در نهایت هم از مشتری باج میخوان چیزی حدود 20 میلیون وگرنه اطلاعات مشتری دیگه هیچوقت بالا نمیاد\r\n\r\nواقعا اگر زندگی و آینده تون براتون مهمه عمرتون رو توی این خراب شده نابود نکنید\r\nاین شرکت کلا 70 درصدش فقط اقوام خودشون هستن و صرفا برای صله رحم میان سر کار، اون 30 درصد مابقی هم افرادی هستن که به ناچار مجبورن بمونن و کارها رو هم در واقع همون 30 درصد انجام میدن... که اگر یک روز نباشن .. فقط یک روز! اون روزه که مدیرش مثل بچه ها میزنه زیر گریه و متوجه فاجعه میشه و یادش میره که صداش رو هم کلفت کنه!!\r\n\r\nعملا دو تا باند وجود داره توی این شرکت\r\nباند سمنانی ها\r\nباند مشهدی ها\r\n\r\nاما اون 30 درصد دیگه واقعا شریف هستن و امیدوارم زودتر رها بشن از اون اسارت"
