description: "حدودا 3 سال اینجا کار کردم و به توصیه ی یکی از دوستان که قصد استخدام توی این شرکت رو داشتن، این نظر رو ثبت میکنم تا به سایر عزیزانی که در آینده ممکنه توی دام این شرکت بیفتن کمکی شده باشه.\r\n\r\nنظرات سایر دوستانی که قبل از من درج شده رو کاملا تایید میکنم؛ متاسفانه تموم مواردی که عنوان شده عین واقعیت هستش\r\n\r\nتوی این شرکت، نه تنها چیزی به دانش شما اضافه نمیشه، بلکه اگر خودتون هم قصد پیشرفت و حتی کمک به شرکت رو داشته باشید، مانعتون میشن، چون شخصی که سواد و دانش کافی نداره در راس اون قرار داره و همیشه ترس این رو داره که نکنه سایرین ازش جلو بزنن!\r\n\r\nدر مورد خود فضای شرکت کلا 70-60 متر جا هست که عین کتابخونه همه روی همدیگه نشستن\r\nحس اتوبوس BRT بهتون دست میده\r\nصندلی ها همه داغون و وصله پینه شده...\r\nمیزها رو هم شک ندارم زیر قیمت از کتابخونه های ورشکست شده خریداری کردن\r\n\r\nعلاوه بر این ها، لازمه بدونید روز اول که برای مصاحبه میرید به دروغ بهتون میگن که نیم ساعت شناوری دارن، اما به محض این که قرارداد بستین، برای 10 دقیقه اینور اونورتر از حقوقتون کسر میکنن و کلا میگن توهم زدی! ما شناوری نداشتیم!\r\n\r\nاز اونور تایم کاری که تموم میشه و به خاطر بی مبالاتی مدیر پشتیبانی وقتی کارها ناتموم میمونن و مشتری به شدت شاکی هست، سریع تلفنت رو میگیرن که چرا نشستی ؟؟؟؟؟ ما اضافه کار نمیدیم هاااا پاشو داری برق رو هدر میدی!! برو خونه کار مشتری رو راه بنداز! (وقاحت در این حد)\r\n\r\nروز مصاحبه تایم ناهار رو نیم ساعت اعلام میکنن، اما توی این نیم ساعت اگر ببینن ناهارتون تموم شده سریع ازتون میخوان که برگردین پشت میزتون، چون مدیریت بهشون فشار میاد ببینن کسی حتی توی حق قانونی خودش داره استراحت میکنه!\r\n\r\nیه روز میگن پشت میز غذا بخورید یه روز میگن نه باید برید توی آشپزخونه 1*2 که براتون تدارک دیدیم! فرداش میگن چرا رفتی توی آشپزخونه خانم فلانی ناراحت شده!!!\r\n\r\nآهان این رو هم بگم تا یادم نرفته، تمامی کارمندهای خانم شرکت در انحصار مدیریت هستن، به این معنا که یکی از همکارهای خانم و آقا که بعد از شرکت با هم از شرکت خارج میشدن توسط خبرچین شماره 1 بخش فروش (که همه میشناسنش)، تعقیب شدن و ازشون فیلمبرداری کردن و روز بعد به دلیل خیانت به احساسات پاک مدیرعامل اخراج شدن!\r\n\r\nدر مورد خط مشی شرکت هم، جز پول زور گرفتن از مشتری ها چیزی نیست، یه وقتایی هست که به خودت میای و میبینی حقوقی که داری میگیری صرفا از پول حرومی هست که از مشتری های نگون بخت به بهانه های مختلف به زور گرفته شده\r\nچیزی که توی هیچ شرکت نرم افزاری درست حسابی مشاهده ش نمیکنی\r\n\r\nدر مورد باندبازی هم کاملا تایید میشه، مثلا اگر شما اصالتا همشهری یکی از مدیران میانی باشید دیگه میتونید به راحتی سریال تاسیان و شهرزاد و ... رو توی گوشی یا حتی سیستم شرکت تماشا کنید و بقیه موظفن کارهاتون رو انجام بدن (این یه دستوره!)\r\n\r\nاز بی سوادی این مدیر میانی همین بس که صرفا کدهای مدیر قبلی بخش پشتیبانی (که بسیار فرد با دانش و باسوادی بودن) رو به اسم خودش سرقت کرده، روتین روزانه ش اینه که قدم زنان، دست در جیب، مانیتور بقیه رو چک میکنه یا به غذای کارکنان شرکت ناخنک میزنه (هیچوقت برای خودش غذا سفارش نمیده!)\r\n\r\nاین رو هم تا یادم نرفته بگم که 2 سال پیش، زمانی که گندش در اومده بود که چه محصول مزخرفی تولید میکنن و به قیمت های گزاف به مشتریان ناآگاه قالب میکنن، مجبورمون کردن بریم توی صفحات مجازی مختلف مثل گوگل، کامنت های به به و چه چه کنان بذاریم... پس حواستون باشه هر کامنت و نظر مثبتی که جایی در مورد این شرکت و نرم افزارش دیدید، همگی جعلی هستن و کارکنان شرکت رو با تهدید مجبور کردن که به عنوان مشتری براشون کامنت مثبت بذارن!\r\n\r\nسفته های سفید امضا با مبالغ بالا میگیرن... (حواستون رو خیلی جمع کنید که اصلا قبول نکنید)\r\n6 ماه اول بیمه تامین اجتماعی تون رو میخورن و یه آبم روش!\r\nبه اسم این که آزمایشی بودید!\r\nدر صورتی که حتی نیروی آزمایشی هم حقوق داره و نهایتا بعد از 3 ماه باید بیمه بشه! پس به حق و حقوق خودتون آگاه باشید!\r\n\r\nمتاسفانه شرکت به حدی چیپ و سطح پایین هست که اصلا منابع انسانی نداره، اصلا تعریف منابع انسانی رو نمیدونن چی هست، در این حد که خود مدیرعاملش حکم منابع انسانی رو داره... از اون طرف حتی ارسال صورتحساب های مودیان رو هم خودش انجام میده! (در این حد چیپ!!) \r\n\r\nشاید گفتن این حرف خنده دار باشه اما باید بدونید که حتی برای قند و چای هم سرتون منت میذارن، دستمال توالت داخل سرویس بهداشتی نایاب هست و بعد از کلی سر و کله زدن شاااااااید مدیریت خسیسش قبول کنه که دستمال رو شارژ کنه البته باید صبر کنید تا توی ترب تخفیف خورده پیدا کنن !\r\n\r\nسرتون رو درد نیارم، مخلص کلام اینکه اگر حتی از بیکاری و بی پولی در حال نابودی هم بودین، سمت این شرکت نرید چون نه تنها روانتون، بلکه آینده ی شغلی تون هم نابود میشه\r\n\r\nپ.ن : مدیر بخش نرم افزار و مدیر بخش CRM به شدت انسان های با دانشی هستن و جا داره از همینجا بهشون درود بفرستم؛\r\nافسوس که بهشون اجازه ی ابتکار و نوآوری نمیدن و عملا با تفکرات پوسیده مدیرعامل حیف شدن"
