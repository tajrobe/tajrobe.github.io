description: "وارد این شرکت که میشین دقیقا آهنگ \"گودبای پارتی جعفر\" توی سرتون پلی میشه.. فکر میکنید همش یه شوخی کثیفه... اما جدیِ جدیه!\r\n\r\nدفتر شرکت توی یه ساختمون خفه ست با راه پله های تنگ و تاریک ..\r\nآسانسور؟ آره داره اما اگرم بخواین ازش استفاده کنید خونتون پای خودتونه!\r\nمدیر زپرتی شرکت هم به جای این که به فکر تعمیرش باشه، حتی بهتون میتوپه که چرا سوار آسانسور شدی و بقیه رو انداختی توی زحمت که بیان درت بیارن!؟\r\n\r\nمحیط داخلی شرکت هم نگم براتون دو تا واحد شصت متری رو مثلا کردن شرکت.. خجالت میکشی به بقیه بگی کجا کار میکنی...\r\nبه عنوان مشتری میاین داخل نفستون میگیره، دیگه فرض کن مجبور باشی چند ساعت توی همچین محیط خفه ای کار کنی!\r\nیه لحظه تصور کن داری کانتر بازی میکنی و کمین زدی... یه گوشه نشستی... آفرین حالا یه کیس و مانیتور هم بذار جلوت.. چند نفر دیگه هم کنارت و روبروت همین حالتو دارن... به \"خفه سیستم\" خوش اومدی!\r\n\r\nسرویس بهداشتی بخش عادی که نصف سال خرابه و فاضلابش که بزنه بالا بازم مجبورتون میکنن بمونید و توی همون کثافت کار کنید... بالاجبار باید برید واحد VIP تا بتونید از سرویس بهداشتی استفاده کنید... البته اگر مشغول نباشه... حتما می پرسید چرا ؟ چون خانم س.ر دوباره آرایش لازم شدن و سرویس بهداشتی خانما رو مشغول کردن و همکارای خانم بخت برگشته مجبورن بیان همون یدونه سرویس بهداشتی آقایون واحد VIP!\r\n\r\nشاید الان براتون سوال شده باشه که مگه میشه ؟ مگه داریم ؟ مگه شرکت مدیر نداره ؟ \r\nچرا مدیر داره... اتفاقا مدیرش خیلی هم لاته :)) عین لات و لوتای چاله میدون... منتها فقط باید هر روز صبح که میاد یادش باشه صداش رو کلفت کنه که کسی نفهمه هیچ پخی هم نیست..! شوربختانه از بخت بد ما ایشون از مدیریت کلا همین چیزا رو یاد گرفته... \"اخم کردن\"، \"صدا کلفت کردن\"، \"مخالفت کردن و البته مقاومت در برابر فهمیدن!\" و از همه مهم تر این که اگر کسی با فکت و برهان چیزی رو بهش اثبات کنه... در نهایت برگرده بگه \"پیش بیار!!!\" (با صدای کلفت کرده)\r\n\r\nبواسطه مدیریت ایشون شرکت همیشه درهم ریخته و آشفته ست... توی آگهی استخدام به دروغ مینویسن پاداش و مزایا و کوفت و زهرمار، اما به دامشون که افتادین تازه میفهمین چه دروغای کثیفی بهتون گفتن.\r\n\r\nاز پارسال شب یلدا و عیدی نگم براتون که دلمون خونه... امسال هم فقط 2 میلیون افزایش حقوق داد گدای بدبخت... آخه یکی نیست بگه اگه نیومده بودی تهران که روی نقشه وجود خارجی هم نداشتی!\r\n\r\nاز رابطه بین واحدها هم نگم براتون... اون نیروهایی که سرشون به تنشون می ارزه و وجدان کاری دارن و واقعا دلشون میسوزه اگر بخوان هم کاری از پیش نمیبرن، چون مدام به خاطر این ناهماهنگی بین واحدها همیشه دعواست... نیرویی که ادعاش میشه سایبر جواب میده، پِیرول جواب میده، وب سرویس جواب میده، ووکامرس جواب میده و کلا همه فن حریفه.. حتی دلفی میزنه! کارش رو میندازه رو دوش بقیه ... همین میشه که همه باید جور آغازاده ها (عن زاده ها) رو بکشن...\r\n\r\nختم کلام... کلا تو این شرکت شعار همیشه اینه: \"یا فامیل باش، یا بمیر!\"\r\n\r\n"
