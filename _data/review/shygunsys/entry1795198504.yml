description: "\r\n*\r\nتکنولوژی ها قدیمی هست و از بازار کار عقب می‌مونید\r\nنه اسکیبیلتی سرشونه نه استیبیلیتی\r\nمشتری که تماس میگیره بهتون میگن تماس رو طولش بدید تا اشتراکش تموم بشه و دوباره ازش چند میلیون پول بگیرن. هر تیکت مشتری با ضریب 7.8 از اشتراکش کسر میکنه\r\nبرنامه پر از باگ و ایرادات وحشتناک\r\nمشتریا هم که زنگ میزنن دست به سرشون میکنن.آخرش هم میگن بگو دوباره پول بده تا برنامه رو درست کنیم اونم برنامه ای که خودش باگ سرخود داره\r\n\r\nاضافه کار اجباری هستش و باید هر روز با تنش و استرس از شرکت برید.\r\nمرخصی نمیدن و حتی استفاده نکنی پولش هم نمیدن بهت.\r\nنه میذارن درست ناهار بخوری نه میذارن بری سرویس بهداشتی \r\nشرکت هیچ مزایا نداره و تو جلسه مصاحبه دروغ میگن بهتون."
