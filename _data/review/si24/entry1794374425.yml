description: "سلام. برند سامان نیازی به معرفی نداره. مجموعه ای بزرگ و خوشنام. من در بیمه سامان مشغول به کار بودم. خاطرات شیرین زیادی از مجموعه دارم. گرچه مثل همه شرکتها و سازمانها ضعفهایی داره، اما در مجموع در شرایط اقتصادی فعلی، علیرغم تمام چالشها، پرداخت به موقع حقوق، بسته ها و هدایا و همچنین سایر مزایا، از اولویتها و حساسیتهای آقای ضرابیه، مدیرعامل محترم مجموعه ست. فقط دو ضعف عمده در مجموعه وجود داره، یکی طولانی بودن اکثر فرآیندهاست. یعنی گاهی برای یه کار ساده اداری، مدتها باید منتظر باشی که اینم بخاطر حجم بزرگ سازمانه. اشکال دیگه، ضعف شدید پاسخگویی در منابع انسانیه. به خصوص مدیریت جبران خدمات. تماسها پاسخ داده نمیشه و رفتاهار گاها در حد و اندازه منابع انسانی که باید پناه و گوش شنوای پرسنل باشه، نیست. بنظرم این دو موضوع اگر عارضه یابی بشه، رضایتمندی شغلی پرسنل خیلی بالاتر میره. در نهایت من از کار تو این شرکت خیلی راضی بودم. خانم آرا، آقای فروغی؛ خانم فرهادفر،آقای فراهانی، خانم سمیعی، آقای عطائی، خانم غیاثی فرد، و...از بهترینهای سامان هستن. امنیت شغلی تو سامان بالاست. اگر مشکل حاشیه ای نداشته باشی، میتونی مدت زمان زیادی در مجموعه کار و براحتی پیشرفت کنی."
