description: "تجربه بسیار نامناسب و بدی از فرآیند استخدام این شرکت داشتم. این تجربه مربوط به امسال نیست، اما برخوردی که در آن زمان با من شد، باعث شد دید مثبتی نسبت به فرآیند استخدام این شرکت نداشته باشم.\r\n\r\nپس از ارسال رزومه، برای مصاحبه حضوری دعوت شدم. با وجود اینکه مسیر بسیار طولانی را طی کردم، به محض ورود از من خواسته شد فرم استخدام را تکمیل کنم و سپس منتظر بمانم تا مصاحبه‌کننده بیاید. \r\n\r\nوقتی وارد جلسه مصاحبه شدم، اولین سؤال مصاحبه‌کننده این بود که «برای چه موقعیت شغلی آمده‌اید؟» پس از اینکه عنوان شغلی را گفتم، در کمال تعجب پاسخ داد: «چند روز است که برای این موقعیت نیرو جذب کرده‌ایم.» \r\n\r\nاز او پرسیدم اگر جذب انجام شده، چرا اصلاً من را برای مصاحبه دعوت کرده‌اید و این همه مسیر را آمده‌ام؟ متأسفانه مشخص بود که هیچ هماهنگی‌ بین واحد منابع انسانی و تیم فنی وجود ندارد و بدون اطلاع از وضعیت جذب، افراد را به مصاحبه دعوت می‌کنند. \r\n\r\nاین موضوع نشان‌دهنده بی‌توجهی به وقت و هزینه متقاضیان است. پس از آن نیز موضوع را با مدیر تیم مطرح کردم، اما پاسخ ایشان این بود که «مگر چه اتفاقی افتاده؟» در حالی که دعوت کردن یک متقاضی به مصاحبه، پس از تکمیل شدن ظرفیت استخدام، به‌تنهایی اتفاق کوچکی نیست و نشان‌دهنده ضعف جدی در فرآیند جذب و هماهنگی داخلی شرکت است. \r\n\r\nامیدوارم شرکت‌ها پیش از دعوت افراد به مصاحبه، از باز بودن موقعیت شغلی و هماهنگی بین منابع انسانی و تیم فنی اطمینان حاصل کنند تا وقت و انرژی متقاضیان بی‌دلیل هدر نرود."
