description: "چند سال از بهترین روزهای عمر رو تو این شرکت تلف کردم. مدام شرکت شرایط کار رو برات سخت میکنه، مدام باگ داره نرم افزارشون و اصلا قسمت های مالی شون رسیدگی نداره و کلا کارشناس رو آدم حساب نمیکنن. سختگیرا و ایراد گرفتنا فقط برای کال سنتره و کلا ربات حسابت میکنن. اگه میخوایین آرامش و روح و روانتون رو از بین ببرید این شغل رو انتخاب کنید . فقط اعصاب خوردگی و انرژی منفی و سرکوفت سرپرست ها میمونه براتون. هیچی هم قرار نیست یاد بگیرید. کمپین هاشونم بالای ۱۲ ساعت باید سرکار باشید و انواع مدل سردرد و خستگی ها رو تجربه کنید.\r\nاستراحت هم که وقتی من بودم دوتا ۱۰‌دقیقه حق استراحت داری و بیشتر شه باید مرخصی بزنی این تایم رو.\r\nمشکل قطعی برق هم گردن ماست برق بره باید اضافه بمونیم از انتها یا مرخصی بزنیم. سایر موقعیت های کاری این شرکت شاید ارزش داشته باشه اما شغل کارشناس مرکز تماس سم خالصه. "
