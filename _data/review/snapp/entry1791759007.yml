description: "با شناختی که از عملکرد تیم های مختلف دارم باید بگم که کمترین امتیاز رو به تیم کانتنت اسنپ شاپ پایدار داد.\r\n\r\nتیم از درون حال خوبی نداره، ترغیب گرفتن اعضای تیم بر اساس میزان خوب بودن رابطه با مدیر تیم ن.آ و دو تا نوچه هاش اتفاق میفته. برعکس چیزی که از بیرون دیده میشه هیچ صمیمیت واقعی بین اعضای تیم نیست و خیلی ها ناراضین، توی گروه شخصی شون بچه ها رو مسخره میکنن و فقط باید چاپلوسی کنی تا دیده شی، حتی جرات اعتراض هم ندارن که حداقل برن با منابع انسانی صحبت کنن ولی تا دلتون بخواد با هم جلسات الکی میرن و کار نمیکنن. اگه شخصی از تیم بخاطر خام بودن و ننوشتن داستان بره پیش منابع انسانی تیم رو براش جهنم میکنن همگی تیم میشن و اون به نفر رو اذیت میکنن. مدیر تیم و دو دوست عزیزش فقط روی کمیت تمرکز کردن، کیفیت کار کیلو چند؟\r\nسرپرستشون ن.ی هم که اینقدر درگیر دختربازی و پیام دادنه که وقت نمیکنه رسیدگی کنه به این تیم!!!!\r\nاگر قصد ورود به تیم کانتنت رو دارید باید صبر ایوب داشته باشین و میزان پاچه خواری‌تون از سطح بالایی برخوردار باشه وگرنه تو دو ماه اول شمارتو میدن بیرون. ماه اول هم میتونین اینکار رو کنین ولی خوب ظاهری رو حفظ میکنن.\r\n\r\n\r\n\r\n"
