description: "امتیاز ۱.۵ فقط بخاطر حقوق به موقع و بیمه (که قاعدتا وظیفه هر شرکتیه)\r\nدیدم در کامنت ها به خانوم ی ش اشاره شده. خواستم من هم اشاره کنم به مدیریت بینظیر و چاله میدونی ایشون. یک لات بی سر و پا، یک انسان به شدت عقده ای و علاقمند به تحقیر و توهین به هر انسانی با رتبه پایین تر از خودشون. از روزی که ایشون پاشون رو به اسنپ فود گذاشتن که همه چیز هزار برابر بدتر شد. کاری نداریم. یه سری چیزا هم روال کلی کار کردن در اسنپ فوده. مثل اینکه کلی بیشتر از ساعت کاری کار کنی و اضافه کاری های اجباری داشته باشی ولی در انتهای ماه که فیش حقوقیت میاد ببینی کلی کسر کار خوردی و حقوقت کم شده. هر چقد کار کنی انقدرررر زیر ذره بین میبرنت و ازت ایراد میگیرن و بهت میگن کافی نیست کاری نمیکنی که تبدیل به یه آدم هیستریک روانی میشی. همیشه اینسیدنت و باگ هست و تو باید با یه سری مشتری و فروشنده عصبانی سر و کله بزنی و حتی اگر بخوای پیگیری کنی هم مدیرا بهت میگن بپیچونشون یا ایرادی نداره فحش بخوری به تو فحش نمیدن که به شرکت فحش میدن. سیاستشون هم اینه که از ایرانسل و دیجی کالا و هر جای دیگه مدیر بگیرن ولی خدایی نکرده کارشناسشون نره بالا و همیشه کارشناس بمونه و همه کار به زور یادش بدن که هر موقع خودشون صلاح دونستن جابجاش کنن بنا به نیازشون. چیزی برای یادگرفتن مطلقا نداره. اسمش اینه که پاداش عملکرد داره ولی انقدر اذیتت میکنن و تارگت های عجیب غریب میذارن و کیوسی و کیو ای میکنن که خدایی نکرده پاداشی نگیری. قرارداد ها کوتاه بسته میشه که در صورت صلاحدید خودشون سریعا قطع همکاری کنن. فقط در صورتیکه دارید از گشنگی میمیرید برید اینجا کار کنید. در غیر این صورت سند بردگی خودتون رو امضا میکنید"
