description: "اسنپ فود فقط از دور قشنگه همه دوسدارن جوین بشن اما در بدو ورود روز دوم کاری متوجه اشتباهی که کردید میشید،\r\nانقد ازتون کار میکشن که یجایی به خودتون میاید میبینید مغز،چشم،گردن،مچ دست و گوش ندارید چون باید مدام هدست روی گوشتون باشه،اخر هفته و تعطیلی ندارید هر لحظه ممکنه اضافه کار اجباری بهتون بدن و در کل باید قید دوست و خانواده و مهمونی رو بزنید و مثل یک ربات کارگر کار کنید.\r\nاگر شخصیتتون براتون مهمه وارد این کار نشید چون اسنپ فود برای ۱ میلیون کمیسیون از یه مغازه ۲۰ متری در خط صفر مرزی حاضره شمارو قربانی کنه ، انقدر باگ داره که هر لحظه باید به وندورا بگی ببخشید عذر میخوام مشکل سراسریه در حال بررسیه در حالیکه وندور داره پشت تلفن به شما و خانواده و جد و ابادتون فحش میده (حق داره چون باگ هیچوقت تموم نمیشه هرروز یه بخش جدید به مشکل میخوره)\r\nاونقدر بی احترامی میشنوید که هیچوقت تمومی نداره و هیچ خط قرمزی تعیین نشده که درست صحبت بشه با کارشناس فقط یه جمله دارن میگن ایراد نداره وندور به شما فحش نمیده که به اسنپ فود فحش میده:))\r\nمورد بعدی چاپلوسی ، اگر ادمی هستید که سرتون تو کار خودتونه نباید اینجارو انتخاب کنید در عوض اگر انسان چاپلوس، زیر اب زن و نون مردم اجر کنی هستید بالاترین مقام ها برای شماست\r\nکار به هیچ عنوان دیده نمیشه ولی اگر با مدیرِ زن و بچه دار خوب صحبت کنی و عشوه بیای و براش لقمه بگیری و با مدیر تصمیم به ترک سیگار بگیری تبریک میگم تو تیم لید شدی... هیچ قانونی برای انتخاب تیم لید و سینیور نیست جز موارد بالا\r\nتا جایی که میتونی از کار کردن زیاد فقط ضربه میخوری و روانت رو بهم میریزه و از تعهد کاری تا ابد پشیمون میشی\r\nخانم ی.ش هم که دیگه قندعسل سازمان ، فکر میکنم غرق تروما هستن چون این حجم از عقده ای بودن از یه مریض فقط بر میاد\r\nتوی کامنت های قبلی هست و بنده حاضر نیستم نظر بدم راجع بهشون چون دلم میسوزه امیدوارم درمان بشن\r\nبه هرحال\r\nتا ابد\r\nهیچوقت قرار نیست ذره ای فکر برگشت به این سازمان به سرم بزنه\r\n"
