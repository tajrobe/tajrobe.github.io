description: "اگر می‌خواهید یک محیط حرفه‌ای-آرام-دوستانه و قابل پیشرفت رو تجربه کنید هیچ وقت سمت این شرکت نرید ❌❌❌❌❌\r\nبله درست شنیدین . سروشان محل تخریب شخصیت و آرامش و آینده شغلی شماست . مدیرانی که از مدیر بودن فقط اسمش رو به دوش میکشن . مدیرانی بی کفایت ، خانم باز و خاله زنک . اگر خانم هستید و توانایی لاس زدن با انسان های بی شرف رو دارید قطعا سروشان جای شماست . مدیرانی که داخل خود سازمان هم اوازه دختر بازی ان ها پیچیده است . \r\nهر کسی با هر سمتی خاله زنک هست و برای دستیابی به مقام زیراب شما رو به نا حق میزنه . کل قرارداد های این سازمان دو دفتره هست برای فرار مالیاتی و شما رسما عروسک خیمه شب بازی هستید که با هر تخصصی کارمند ثبت می شین . بعد از استخدام تو سروشان از نظر مالی هیچ نظمی در زنگی نخواهید داشت . قطعا اگر ....مال یا دختری هستید که توانایی لاس زدن با بی شرف ها را دارید در سروشان پیشرفت خواهید کرد . \r\nکامنت های مثبت برام جالبه چون همگیش توسط مدیران نوشته شده . در کل اگر از زندگی سیر شدین قطعا سروشان گزینه مناسبی خواهد بود . این بود تجربه کاری من "
