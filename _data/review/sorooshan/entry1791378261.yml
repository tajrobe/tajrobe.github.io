description: "پیام کسانی که میگن و تعریف میکنن از این شرکت، دروغ محضه و نورچشمی آقای قایم مقام مینویسه.\r\n\r\nشرکتش افتضاحه؛ قایم مقام و معاونت با همه دخترهای اینجا ارتباط برقرار کردن و به کسانی که بهشون سرویس بدن، پاداش و مزایا میدن.\r\n\r\nنمونه‌ش به خود من گفتن اگه تو هم میخوای مثل فلانی ۲۰۷ بخری، باید هفته‌ای یه سرویس بدی دیگه بالاخره هر پیشرفتی یه زحماتی داره.\r\n\r\nنکته جالب‌تر، پورسانت گرفتن این آقا از دوست‌دخترهاشه. هر پاداشی که براشون رد میکنه، یه بخشی هم برای خودش برمیداره و خب اینجوری هر دو نفر راضین.\r\n\r\nیه نفر تو امور قراردادها هست که دوست‌دختر این آقای مدیر قایم هست و باید همیشه جلو چشمش باشه. یه اکیپ هم درست کرده و بقیه رو میبره کافه تا اخبار شرکت به گوش مدیرش برسه، حقوق هم مثل گوشت قربانی اینجا داده میشه، مثال بزنم باید حسینی وار کار کنی یا باید مثل یک کشاورز زحمت بکشی تا بچشمشون مثل یه نگین بدرخشی تا جویای پول باشی.\r\nخلاصه بگم، اینجا نیاین یا برید با کسانی که از اینجا رفتن صحبت کنید که چجوری باهاشون تسویه میکنن\r\n"
