description: "زنگ زدن برای مصاحبه من رفتم یک ساعت اونجا وایسادم.تو اون تایم اصلا بی نظمی کل پرسنل و شرکت رو دیدم. چند تا از پرسنل اونجا داشتن به هم دیگه اشکال +18 نشون میدادن . اصلا جا خوردم\r\nکلی از خودشون تعریف کردن . بعد موقع تایم کاری رسید انتظار داشتن کل هفته دو شیفت از 8 صبح تا 6 عصر می‌رفتی براشون کار میکردی با حقوق 40 تومن . بهشون گفتم اصلا شما تعیین کنید من کی بخوابم و کی بیدار شم .\r\nگفتند قرارداد اداره کار نمی‌بندیم. حقوقهارو طی چند مرحله انجام میدیم براتون . یه چندتا دختر اونجا بود که تو نگاه اول فهمیدم چکارن اونجا.\r\nخدا میدونه چندتا پرونده دارن توی اداره کار. من انصراف دادم و همونجا بلند شدم.\r\nبدبخت اون تازه کاری که می‌ره اونجا"
