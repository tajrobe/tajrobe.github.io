description: "در تمام مدتی که در سوپرپایپ مشغول به کار بودم، چیزی فراتر از یک محیط کاری را تجربه کردم. فرهنگ سازمانی غنی، روابط انسانی محترمانه و حس همراهی که واقعا کمتر جایی دیده ام.یکی از ویژگی های این شرکت برای من، نوع نگاه به سرمایه انسانی بود .در دوره ای که نرخ دلار نوسان زیادی داشت و هر روز افزایش پیدا می کرد، شرکت تصمیم گرفت در کنار سایر بسته های حمایتی، پرداخت حقوق را نیز برمبنای دلار انجام دهد.تصمیمی که در آن شرایط، نشان از درک درست مدیریت از وضعیت معیشتی کارکنان و تلاش برای حفظ آرامش و انگیزه آن ها بود.\r\nدر شرایط جنگی، زمانیکه بسیاری از سازمان ها و کارخانه ها  تعطیل شدند، شرکت ما به علت حفظ ایمنی و آرامش خانواده ها ، فعالیتش را متوقف کرد اما حقوق همکاران، مثل همیشه در اول هر ماه پرداخت شد. در روزهایی که هر لحظه خبر تعدیل نیرو در سازمان های مطرح به گوش می رسید، شاید باورش سخت باشدکه ما حتی پاداش پایان سالمان را هم دریافت  کردیم.\r\nحمایت های شرکت فقط به مسائل مالی محدود نمی شد. برای همکاران، سمیناری با حضور یکی از روانشناسان مطرح کشور برگزار شد;فردی که دسترسی به او چندان آسان نیست. علاوه بر آن، برای همکاران وقت مشاوره اختصاص داده شد و هزینه جلسات مشاوره نیز توسط شرکت پرداخت شد. در کنار آن، برنامه های رفاهی و شاد شرکت، لحظات خوشی را برای همه ما رقم زد.\r\nمن افتخار حضور در دوران کرونا را در این مجموعه نداشتم اما از سایر همکاران شنیدم که شرکت دستگاه اکسیژن ساز تهیه کرده بود تا خانواده هایی که به آن نیاز داشتند، از آن استفاده کنند.حتی ویلچر هم تهیه شده بود تا برای خانواده هایی که نیاز داشتند، بصورت امانت در اختیارشان قرار بگیرد. در کنار بیمه تکمیلی، شرکت، پزشک سازمانی دارد که هر هفته برای ویزیت و مشاوره به سازمان مراجعه می کند. \r\nاما چیزی که سوپرپایپ را برای من از بسیاری از شرکت ها متمایز می کند فقط خدمات رفاهی نیست، بلکه فرصت رشد، یادگیری و دیده شدن است. در این مجموعه ، آدم آنقدر درگیر پروژه های متنوع و چالش های واقعی می شود که عملا هر روز در حال یاد گرفتن است. بنظرم سوپرپایپ از آن  دسته جاهایی است که اگر کسی با انگیزه و اهل یادگیری باشد می تواند در آن برای خودش یک برند حرفه ای بسازد.\r\nواقعا برام سخت بود که مجبور شدم از این شرکت جدا شوم. در تمام مدتی که در سوپرپایپ بودم ، نه برای جای دیگری رزومه فرستادم و نه حتی رزومه ام را به روزرسانی کردم، چون واقعا خودم را عضوی از این خانواده می دانستم و اگر شرایط موجود مرا مجبور به مهاجرت نمی کرد، تا زمانی که شرکت به حضورم نیاز داشت، می ماندم و هرگز استعفا نمی دادم.\r\nباتمام وجود از این مسیر و از تمام مدیران و همکارانم و از تمام چیزهایی که در این سال ها یاد گرفتم سپاسگزارم.\r\nسوپرپایپ برای من فقط یک محل کار نبود، بخشی مهم و ارزشمند از مسیر زندگی حرفه ای ام بود و خاطره فرهنگ، حمایت و انسانیت آن را همیشه با خودم به همراه خواهم داشت.\r\n "
