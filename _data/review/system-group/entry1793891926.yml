description: "۶ سال و نیم مشغول به کار بودم و میخوام نظر کاملی درباره این تجربه کاری در  شرکت اطلاعات مدیریت همکاران سیستم رو بنویسم.\r\nرنج حقوقی خیلی کمتر از میانگین بقیه شرکت ها هست. پرداخت حقوق ها به موقع هست اما خبری از پاداش نیست. موقع استخدام و شاید اوایل کار بهتون پاداش بدن، که خیلی ناچیز و کمتر از ۵ تومان در ماه میشه، و بعدش همین هم قطع میشه. کمک هزینه ناهار میدن.\r\nمحیط کارمندی ای داره و نگاه بالا به پایین از سمت مدیران وجود داره. اکثر مدیر تیم ها بچه های کم سنی هستن که توی صحبت و پاچه خواری تجربه بیشتری دارن تا کارشون. شما فقط سالی یک بار ارزیابی میشید که بر اساس شایستگی هم نیست! و حقوقتون هم در کل سال ثابته که با توجه به تورم، نیمه دوم سال عملا با حمالی فرقی نداره. از نظر فنی هم خیلی از تکنولوژی هاشون قدیمی هست و رشدی ندارید.\r\nپیشنهاد میکنم اصلا سمت این شرکت نرید. تعادل کار و زندگی نداره و بالای ۹ ساعت در روز باید کار زیاد کنید."
