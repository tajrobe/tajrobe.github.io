description: "شرکت و محیطش شبیه این کاروانسراهای ارباب رعیتی هست. مدیر عامل و برادر خواهرش  اون بالا نشستن تو اتاقهاشون و بقیه پشت میزهای هشتاد سانتی. از هر فرصتی برای اینکه یه چند میلیونی از حقوق شما پایمال شه استفاده می شه. کلی کار بی فایده که زیر فشار انجام می شه می ره بالا و بی نتیجه می مونه.  چیزی به نام ساعت کاری، آسایش محیطی و احترام بی معنیه. از اون شرکتهاییه که استثمارتون کنه و زمان و فرصت هر پیشرفتی رو از شما بگیره. همه چیز وابسته به اینه که در چاپلوسی برای مدیر عامل موفق باشید یا نه. رفتارهای خیلی زشتی می کنن. شما صدای بلند و دعوا رو به کرات می بینین.  بعضی از افراد سم خالصن. سیستم پر باگه.  مدیر منابع انسانی که نسبت خانوادگی هم داره از هر فرصتی برای سو استفاده از شما استفاده می کنه. کلا با آدمهای حوزه نرم افزار از زمین تا آسمون فرق دارن. حقوق دیر و زوده و خیلی آدما رو آزار می دن. این کامنت های خوبی هم که اینجا گذاشته شده رو به احتمال خیلی قوی خود خانواده یا یکی دو تا از بچه هایی که اونجا بهشون نزدیکن گذاشتن. :)"
