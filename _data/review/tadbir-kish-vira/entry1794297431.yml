description: "یه (م ع ) دارن که ادعا می کنه شریف درس خونده، دانشجوی سهمیه ای بوده. اینا آقا زاده های سهمیه ای ان که با آقا زاده هایی از قماش خودشون لابی می کنن.\r\nدروغگو هستن به شدت، سو استفاده چی هستن، حلال و حروم کن هستن. و یه سری آدم شبیه خودشون هم دور خودشون جمع کردن. قدیمی های اونجا همه شکل خودشونن که یه هسته سمی درست کردن، همه کثیف کاری ها در همه زمینه ها کار اون هسته سمیه، جمع کردنش کار بقیه.\r\nهر آدم باسوادی می یاد اونجا یه جوری در می ره که دیگه سایشم دیده نمی شه.\r\nحتی اگر هیچ جایی کار گیرتون نیومد هم این شرکت رو برای کار انتخاب نکنین.  \r\n"
