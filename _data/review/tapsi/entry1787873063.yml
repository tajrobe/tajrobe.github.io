description: "به مدت سه سال اونجا مشغول کار بودم\r\nاگر بخوام از اتفاقاتی که اونجا به چشم دیدم بگم ممکنه منو بکشن\r\nبه قدری جم‌تی‌وی طور بود که یادش میفتم پنیک میشم\r\nفقط ادمای بی سواد و چاپلوس روی کار میان هیچکس بابت کار خوب تشویق نمیشه ولی بابت دیت رفتن و حرمسرا زدن برا مدیرا به یه لول بالاتر میری\r\nاگرم بخوای صحبت کنی پیش اچ ار چون مدیر یکی از کله گنده های مملکته خیر سرش کسی حرفتو باور نمیکنه\r\nیه روز اگه به تریبون داشته باشم تک تک اون ادمایی که سرشون قسم میخوردن و توی اتاقشون نماز میخوندن رو با اسم و جزییات میگم تا همه بفهمن چه ادمای کثیفی اونجان\r\nهیچوقت دلم نمیخواد حتی نزدیک اون شرکت بشم حال بهم زن ترین روابط غیرکاری در محیط مثلا کاری رو به چشم دیدم متاسفانه"
