description: "من اخیراً برای این شرکت رزومه ارسال کردم و بلافاصله پیام رد شدن درخواست را دریافت کردم. دلیل اعلام‌شده «نداشتن سابقه کار کافی در این حوزه» بود.\r\nبا توجه به سابقه کاری من، تجربه‌ای که در این حوزه دارم و تطابق قابل‌توجه سوابقم با نیازمندی‌های اعلام‌شده برای این موقعیت شغلی، این پاسخ برام تا حدی غیرمنتظره بود.\r\nطبیعیه که هر شرکت معیارهای خودش را برای انتخاب افراد داشته باشه، با این حال، سرعت پاسخ و دلیل اعلام‌شده این تصور را ایجاد میکنه که احتمالا ارزیابی رزومه چندان دقیق نبوده.\r\n"
