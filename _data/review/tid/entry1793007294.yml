description: "به معنی کامل افتضاح \r\nهمه چی نمادین و رانتی \r\nلپ مطلب اونجا حتی منشی هاش و قسمت های مختلف (بجز تک و توک که واقعا با شخصیت هستند ) ادعا ریاست دارند و از بالا باهمه صحبت میکنند \r\nولی واقعا مدیران ارشد حرفه ای دارند(بجر منابع انسانی ) ولی مدیران میانی واقعا بی تجربه هستند چون از کارمندی این شرکت با پارتی رانت مسئول شدند\r\nشرکت بدلیل اینکه برخی مدیران ارشد بخصوص منابع انسانی و کارمنداش همگی خانم هستند جوو فمینیستی شدید حاکم است و به زبان ساده خانمها (آنهایی که با منابع انسانی دوست هستند ) حکومت میکنند و حتی جواب مدیران ارشد رو سربالا میدهند ، \r\nخلاصه یه سری واحد ها یا بشدت مشغول کارند و همزمان چندین پروژه سنگین دستشونه \r\nیه سری کلا یه قسمت از یه پروژه دستشونه و همش دنبال برنامه های جانبی که منابع انسانی میذاره هستند \r\n و نکته اخر این رفتار باعث شده جو کارشناسان بیشتر حسادتی و رقابتی شده چون ممکنه منابع انسانی تصمیم بگیره حتی پاداش و کادو های مناسبتی رو دلبخواه کمتر یا بیشتر تقسیم کنه "
