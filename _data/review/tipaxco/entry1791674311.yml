description: "مدیر عامل خوبی داره\r\nاما نگم از مدیرای ۵ سال اخیر که کاملا بی تجربه و با مشکلات روانی واضح هستن و تست اعتیاد داروییشونم مثبته و\r\nهمه تلاششون رو‌میکنن نیروهای قدیمی رو اخراج کنن و بجاش دوست و رفیقایی که هیچ سابقه ای توی کار ندارن و اخراجی شرکت های دیگه هستن رو بیارن سرکار تا با ai براشون کارای بی کیفیت توی هرزمینه انجام بدن\r\nو چون سواد کافی ندارن به به و چه جه میکنن\r\nممکنه یه نیرویی بخاطر ارتباط نزدیک غیرمنطقی با مدیرش بره اعتراض کنه و اخراج بشه\r\nممکنه یه نیرویی چون ارایش نداره اخراج بشه\r\nیا حتی چون مدیرش حس میکنه این زیادی کار بلده یا قبل از من اینجا بوده و آتو زیاد ازم داره، اخراج بشه\r\nحالا موارد اخلاقی و غیر اخلاقی هم شاید سلیقه ایه و برای هرکس یه تجربه متفاوت رقم بزنه\r\nمدیرا بیشتر از طریق مشاور مدیرعامل میان اونجا و بخاطر همین عیب و ایرادشون زود لاپوشونی میشه\r\nخروج نیروهای قدیمی و عدم ماندگاری نیروهای جدید توی یسری واحدا دیگه خودش نشون میده شرایطو\r\nسرپرستس و ریاست و مدیریت هم فقططططط با ارتباطات قوی با مدیر منابع انسانی و مشاور مدیر عامل امکانپذیره\r\nواحد داریم که قدینی ترین نیروش پاییز ۱۴۰۴ اومده و مدیرش پاداشم میگیره\r\nواحد دارم مدیرش رفیقاشو اورده دورش چیده که به چرت و پرتاش بخندن و از رفتارای زننده ش به کسی چیزی نگن\r\nواحد داریم که چون به مدیرش نمره عملکرد کامل نداده نیروی قدیمی درجا اخراج شده\r\nو مثالای زیاااااااد که کاش موقع قطع همکاری دستیار مدیرعامل نطلع میشد و دلایل خروج رو‌مستقیم از افراد میپرسید\r\nچون منابع انسانی اونجا خیلی کثیفه و کارش لاپوشونی و اخراجه"
