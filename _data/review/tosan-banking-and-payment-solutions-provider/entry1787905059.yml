description: "من اینجارو اتفاقی دیدم و انصافا نظرات ناب و درست که درباره طبقه ۳ نوشته شده رو دست بوس هستم.\r\nجدای کارمندان بی نظمش مدیران شوت و بی اصالتی دارند امثال م.ر تو لاین core و ر.و تو تیم چک که اندازه یک جونیور فهم ندارن و فقط ادعا هستن و تو کار دیگران هم سنگ اندازی می کنن.\r\nشما اگر مدیریت بلد بودین چرا نیروهاتون فرار میکنن و بلد نیستید کار رو تو بازه های مشخص شده توسط برنامه ریزی تحویل بدید تا سبد کامل تحویل بشه؟ چرا همیشه سر خروجی این لاین ها چالش داریم؟\r\nجدیدا هم که تو شرکت پیچیده این آقای م.ر برای نگهداشتن آشناش تو تیم یه نیروی با تجربه رو فراری داده که مثلا ریشه کنه و کسی هم نفهمه.\r\nامیدوارم راس مدیریت نظارت بیشتری روی تیم ها و نحوه عملکرد این اشخاص داشته باشه تا دهنشون هم ببندن و برای دیگر بخش های شرکت ایده پردازی نکنند.\r\nشما اگر بیل زن هستید باغچه خودتون رو بیل بزنید. ادمای بیسواد و کار نابلد شدن بلای جون توسن و باعث افت خروجی بقیه تیم ها هم شدن."
