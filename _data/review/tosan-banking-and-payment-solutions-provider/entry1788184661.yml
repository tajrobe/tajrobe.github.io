description: "تو یکی از نظرات نوشته شده منابع انسانی هویج. جالبه.... ولی صد رحمت به هویج که کیلویی ۱۵۰ هزار تومان است.\r\nکمترین ارزشی در توسن و زیر مجموعه ها نداری. نیروی کار همکار نیست و فقط یک عدد است.\r\nرفت و آمد در شرکت بالاست و این اعداد کم بشوند اهمیتی نیست و سریعا جایگزین می شوید.\r\nتیم منابع انسانی روزانه چندین مصاحبه دارند تا این اعداد را جایگزین کنن و زنده یا مرده شما اهمیتی ندارد."
