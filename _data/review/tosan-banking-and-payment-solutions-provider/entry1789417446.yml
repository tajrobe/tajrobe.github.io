description: "من خودم مدتی با توسن کار کردم و بعد کرونا از این شرکت جدا شدم. زیاد از شرکت ها رانت دار مثل توسن انتظار نداشته باشین.\r\nاینا بودجه و پروژه براشون میاد و چون نگران مخارج نیستن نیروی انسانی براشون پشیزی ارزش نداره و بخاطر بی برنامگی و سو مدیریت همون سالها چه بچه های متخصص و دلسوزی از تیم به معنا واقعی فرار کردن..\r\nپروژه ها همه جلو میرن بعد متوقف میشن یا کارها تو پایین ترین سطح ممکن انجام میگیره ‌و وقتی کاربلدها با نارضایتی رفتن کاسه لیس ها تو راس قرار گرفتن.\r\nچند وقت پیش هم چند مرتبه هک شدن و دلیلش همین فرار متخصصین واقعی از توسنه.\r\nاز من به شما نصیحت اگر دنبال محیط کاری سالم و به دور از حاشیه هستی با شرکت های کوچیک با حقوق کم کار کن ولی نزدیک توسن نشو."
