description: "سلام،\r\nمن موقعی که توسن کار میکردم تو ساختمون ارمغان بودم و بعدش اومدیم ساختمون جدید که مصادف شد با دورکاری و اینا، دور کار بودم و بعدشم رفتم از توسن.\r\nبرای من تجربه خوبی بود، روزهای بد هم داشتم ولی در مجموع بخوابم بگم، تجربه خییلی با ارزشی بود و خاطرات خیلی خوبی دارم. من متاسفانه نتونستم با سرپرستم مچ بشم، سرپرستمون که عوض شده بود، سرپرست جدید با من اوکی نبود، یکی دو تا از بچه ها هم شخصیت منفیشون خیییلی تو تیم قوی بود و جو تیم رو شکل میدادن که موقع سرپرست اول، به خاطر شخصیت خوب و قوی اون، فرصتی برای عرض اندام نداشتن!!! یا شاید سرپرست اول به اونجور رفتارها و ادا و اطوارها اجازه ابراز نمیداد، ولی خب متاسفانه سرپرست دوم، حسابی از نظر شخصیتی تاثیرپذیر بود، منم ترجیح دادم از گروه برم.\r\n\r\nخلاصه بگم خیلی دوست دارم باز برگردم توسن، البته با آدم های خوب مثل آدمهای اولی کار کنم.\r\nامیدوارم توسن، برای بچه هایی که مجبور شدن  به خاطر شرایط بد شرکت رو ترک کنند، یک فرصت بذاره و دعوتشون کنه که بتونن برگردن، چون با بیزینس و جو و فرهنگ کاریش آشنا هستند و میتونند برای شرکت مفید باشند."
