description: "نظرات رو دیدم ولی بنظرم در مورد توسن جا داره درباره عدم صمیمیت بین همکارا و فرهنگ زشت زیر آب زنی یا باندبازی هم صحبت کنیم. وقتی بین تیم ها یک چالشی پیش میاد و حضوری صحبت می کنی متوجه میزان نفرت همکارا از همدیگه میشید.\r\nیک جوری با شما رفتار می کنن که انگار قاتل پدرشون هستی. هیچکس چشم دیدن همکاران دیگه رو نداره. همه با خاله زنکی از حقوق همدیگه باخبر هستن و همین باعث ایجاد حسادت بیشتر میشه و اونقدر برات سنگ اندازی می کنن که خسته بشی.\r\nمتاسفانه منابع انسانی هم هیچ دخالتی نداره و بدتر باعث ایجاد چالش های بیشتر در داخل تیم ها یا بین واحد های مختلف میشه.\r\nیک مورد دیگه هم بحث دورکاری هستش. خیلیا با همون باندبازی که گفتم امکان دورکاری دارن و معلوم نیست شغل دومی دارن یا مشغول کار برای شرکت هستن یا نه؟ اصلا به پیام های داخل اسکایپ یا ایمیل ها پاسخگو نیستن و بخاطر حمایت های سرپرستان سمی پر رو تر هم میشن و باعث ایجاد درگیری های بیشتر در تیم ها شدن.\r\nولی کاملا قبول دارم. واحد hr توسن شرکت رو رها کرده و سیاست خروج بیشتر و استخدام انفجاری رو پذیرفته.\r\nمحیط بد شرکت هم قبول دارم. بخش راه پله ها و کافه شبیه پاتوق اراذل و اوباش شده. یکسری آدم معلوم الحال با وضعیت و پوشش حال بهم زن دارن سیگار میکشن انگار نه انگار شرکت بانکی هستش و اگر تابلو رو نبینی احساس می کنی وارد چاله میدان شدی!\r\nشرکت درحال حاضر هم موفق به گرفتن پروژه های جدید نشده و خدا میدونه بعد یک مدت چقدر تعدیل نیرو خواهیم داشت. بنظر من فرهنگ کاری توسن مناسب همه نیست و شاید بخاطر همین هستش که همکاران جدید هر ماه به مجموعه اضافه میشن.\r\nامیدوارم هر چی سریعتر با عوض شدن مدیر منابع انسانی و تغییر سیاست های شرکت افراد سمی از شرکت خارج بشن و نیروهای بهتری به تیم ملحق بشن.\r\nباید یک فکری به حال محیط شرکت بشه. اینکه شرکت شبیه شهرنو باشه تاثیری در کیفیت کارها نداره و آزادی بیشتر بدتر باعث درجا زدن میشه."
