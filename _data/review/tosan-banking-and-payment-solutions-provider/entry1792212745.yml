description: "اگر قصد کار تو شرکت توسن رو دارید این تجربیات امیدوارم کمکتون کنن.\r\nبحث دورکاری که میگن وجود خارجی نداره و تو یک تیم شاید 2 نفر کلا دورکار باشن و بقیه شامل نمیشه چون آدم های دستمال کش نبودین که دورکار بشید.\r\nچیزی به اسم ناهار ندارن و یک کافه داغون پایین ساختمان داره که غذاهای فوق العاده چرت و گرون درست می کنن.\r\nشرکت اپن افیس هستش که دردسرهای خودش رو داره و معمولا طبقه ها شلوغ و مثلا طبقه 4 روی میزی که 6 نفر باید بشینن 12 نفر میشینن.\r\nصمیمیت بین بچه ها نیست و قبلا هم کسایی دیگه اینجا گفتن زیرآب زنی وحشتناک زیاده.\r\nرزومه ات خراب میکنی معمولا بعد یه مدت کوتاه باید فرار کنی از توسن.\r\nگرید بندی دارن که معمولا حق خوری هستش. من یه پاورپوینت عالی با کلی توضیحات کامل داخلش نوشتم و ارائه دادم ولی آخرش با حق خوری گفتن اگر بمونی سال بعد حقوقت رو افزایش میدیم که بیشرفی مدیر مستقیم و hr رو نمایان کرد.\r\nالان خیلی وقت از تسویه گذشته و هیچ تماسی نگرفتن احتمالا باید اداره کار شکایت کنم.\r\nتوسن از بیرون قشنگه بیای داخل میبینی مستراحی بیش نیست."
