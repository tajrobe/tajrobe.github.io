description: "کار تو توسن اینجوریه که بعد هفت خان رستم و جور کردن یه گونی مدرک با منت استخدامت می کنن بعد تو محیط گم میشی، دیگه نه کسی هوات رو داره نه براش مهمه تو شرکت هستی؟ نیستی؟ میمونی؟ نمیمونی؟\r\nمشکلی هم باشه مدیرت شفاها میگه «به تخمم» بله اینقدر بد دهن، بیشعور و فاسد هستن. میگن خوشت نمیاد استعفاء بده و برو.\r\nاین دقیقا سناریویی هست که چند سال تو توسن داره پیاده میشه.\r\nاون بحث تعداد بالای آگهی های استخدام هم همینه. خیلیا فکر می کنن توسن جای خوبیه و این نظرات دروغه بعد میان میبینن حقیقت محض بوده میزارن میرن.\r\nبازم میگم اگر رزومه و روانت برات مهمه توسن رو بیخیال بشو وگرنه خودت هم میای بعد خروج یدونه تجربه منفی اینجا مینویسی! از من گفتن بود 🖐️"
