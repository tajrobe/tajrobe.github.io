description: "مصاحبه ها همگی حضوری بودن که بنظر من خیلی راحت می تونستن آنلاین برگزار کنن.\r\nتو مصاحبه خیلی پر ادعا و گنده گویی می کردن و می خواستن خودشون رو بزرگ و خفن نشون بدن. در کل همین شرایط فضای جلسه مصاحبه رو خیلی مسموم کرده بود.\r\nنهایتا با بهانه های الکی نصف سابقه من رو نمی خواستن قبول کنن که با نقشه قبلی گرید 4 که حقوق واقعا کمی رو داشت بهم بدن. من هم قبول نکردم!\r\nاین رو هم اضافه کنم محیط شرکت چنگی به دل نمیزد و داخل راهرو یا طبقات مملو از آدم بود.\r\nاین رو هم گفتن که بعد قرارداد اول مجدد باید آزمون و مصاحبه بدی که ببینیم حقوقت ثابت می مونه یا کاهش میدیم! فکر کن دوزار حقوق هم میخواستن کاهش بدن.\r\nتجربه خوبی نبود."
