description: "سلام؛\r\nمن چند ماهی است که از توسن خارج شدم ولی حقوق ماه آخرم کامل پرداخت نشده و خبری از تسویه حساب نیست.\r\nچند مرتبه هم تماس گرفتم ولی هیچ خبری نیست و هر سری با یک بهانه تلفن رو قطع می کنن.\r\nشخصا تصمیم گرفتم اقدام قانونی کنم و از طریق اداره کار پیگیر بشم.\r\nچندین بار هم پنجشنبه و جمعه روز کاری کامل کار کردم ولی علی الرغم وعده های داده شده هیچ پاداشی ندادن و اضافه کاریش هم محاسبه نشده.\r\nباتشکر"
