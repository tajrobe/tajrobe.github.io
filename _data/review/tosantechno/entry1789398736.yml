description: "بنده به عنوان کسیکه در توسن تکنو مشغول بکار بودم باید بگم فقط ویترین خوبی ساختن و بین رقبا اسم در کردن به محض اینکه وارد شرکت و سازمان میشی هیچ خبری از ادب و احترام بین همکاران و مدیران وجود نداره،به شدت بی ادب و بی فرهنگ هستن، مدبر منابع انسانی یک فرد به شدت بی ادب و بی مسئولیت و... و منابع انسانی به شدت ضعیف و بی سواد که حتی بلد نیستن مصاحبه انجام بدن. یک مدیر چاق کچل تپل زشت بی ادب و بی فرهنگ که واقعا بیرون ببینمش آشغال دستش نمیدم و سواد هم نداره شده مدیر حتی رفتار سازمانی هم بلد نیست و دنبال حاشیه و مسائل دیگریست، مدیر عامل که هم فقط بلده خوب حرف بزنه و هیچ عمل نکنه، بقیه همکارا هم که زیرآب می‌زنن و رفتار نامناسب و خارج از سازمان دارن و یکسری آقایون متاهل هوول و خانم های متاهل و مجرد هوول تر. در کل اگر می‌خوای وارد توسن تکنو بشی قبلش حتما تحقیق کن.\r\nتوسن تکنو اصلا جای مناسبی برای کار کردن نیست.در آخر برای تسویه باید ۶ ماه بدویی که بتونی حق و حقوقتو بگیری.\r\nمزخرف خرین شرکتی که دیدم.\r\n"
