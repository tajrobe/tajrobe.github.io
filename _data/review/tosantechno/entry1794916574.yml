description: "اگه قراره تو این شرکت استخدام بشی قبلش نظر منو بخون.من حدودا 5 سال تو این شرکت کار کردم چیزایی که اینجا مینویسم تجربه هایی هست که شاهد اتفاق افتادنش برای خودم و همکارا بودم .شرکتی که بیرون همه فکر میکنن خفن ترین شرکته ولی مزخرف ترینه یکسری مدیرهای اجرایی داره که شرط گزینششون میزان هول بودنشون بوده فکر کنم موقع استخدام.منابع انسانی اونجا بیشتر نقش هویچ داره انقد که بدردنخورن از مدیر منابع انسانی گرفته آقای م.ع تا مابقی تیمشون. شرکتی که حتی به قراردادی که خودش میبنده هم پایبند نیست.یهو ممکنه وسط قرارداد بهت بگن دیگه نیا یا اینکه تسویه تو نزنن که کار به شکایت برسه. یا ممکنه یهو بهت انگ دزدی(کاری که دقیقا خودشون انجام میدن رو به تو نسبت بدن) بزنن که بخوان با روح و روانت بازی کنن و اسمتو خراب کنن  تو مجموعه.و قاعدتا همین موضوع باعث میشه که توی استخدام بعدیت هم به مشکل بخوری. تمام جلساتی که میذارن آنقدر توش چرت و پرت گفته میشه شاید کل جلسه 3 ساعته 10 دقیقه کلا تایم مفید داشته باشه بقیش مديريت داره راجب زندگی شخصیش با همسرش صحبت میکنه."
