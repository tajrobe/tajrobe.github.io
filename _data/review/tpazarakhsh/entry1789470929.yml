description: "حقوق رو به موقع پرداخت نمیکنن و همش وعده های پوچ و توخالی میدن،\r\nشرکت خانوادگی هست و محیط کاملا غیرحرفه ایی ، از تو دوربین همه چیو کنترل میکنن و گیر الکی به کارمندا میدن ، مزایا هیچی نداره و همون بیمه رو هم درست حسابی رد نمیکنن واست. \r\nمدیرعاملش سفرهای 15 روزه به کربلا میره ولی حقوق کارمنداش رو نمیده و میگه بودجه نداریم.(بودجه نداری خب نیرو نگیر)\r\nاحترام به حق و حقوق کارمند رو اصلا بلد نیستن و کل مدیرها فامیلیشون شیبانیه که این خودش نشون دهنده اینه که این شرکت چجوری اداره میشه.\r\nپول برای درست کردن استخر و گلدون و سفر دارن ولی برای حقوق کارمند و راحتی کارمند پول ندارن و هزارجور بهونه میارن\r\n\r\nهر ایرادی که فکرش رو بکنید، این شرکت داره. از مدیریت غیرحرفه‌ای و پرداخت نامنظم حقوق گرفته تا کنترل بیش از حد، نبود مزایا و بی‌احترامی به کارمند.\r\n\r\nدر کل اگر دوست دارید هم سلامت روانتون رو از دست بدید و هم بی پول بشید این شرکت گزینه خوبیه"
