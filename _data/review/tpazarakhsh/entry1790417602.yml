description: "مشکل اصلی، نبود نظم و شفافیت در تقسیم کار و ارزیابی عملکرده؛ به‌طوری که تفاوت روشنی بین تلاش افراد دیده نمی‌شه و ارزیابی‌ها لزوماً بر اساس نتیجه‌ی کار نیست. همچنین، تصمیم‌های مدیریتی گاهی به افراد نزدیک به مدیریت بیشتر امتیاز می‌ده. فضای ارتباطی هم همیشه حرفه‌ای نیست و گاهی حاشیه و صحبت‌های پشت سر، احساس آرامش و اعتماد در محیط کار رو کم می‌کنه. شرایط کاری، از امکانات و تجهیزات گرفته تا وضعیت دما و نظافت، در بیشتر مواقع مطلوب نیست. پرداخت حقوق هم همیشه منظم نبوده و تأخیرها برای بعضی کارکنان فشارساز شده. درباره مزایا هم بین آنچه گفته می‌شه و تجربه‌ی عملی بعضی کارکنان فاصله وجود داره. در مجموع، مجموعه‌ای از این عوامل می‌تونه محیط کار رو فرسایشی کنه.\r\n\r\nاز طرف دیگه، یکی از نکاتی که به نظرم برای کسی که قصد داره وارد این مجموعه بشه مهمه، اینه که صرفاً به امید سابقه و سال‌ها موندن، آینده‌ی کاری خودش رو تضمین‌شده ندونه. نمونه‌هایی بوده از افرادی که سال‌ها برای مجموعه وقت گذاشتند و پروژه جلو بردند، اما در نهایت سابقه و زحماتشون جلوی کنار گذاشته شدنشون رو نگرفته. بنابراین اگر اینجا کار می‌کنید، تصور نکنید که فقط با سال‌ها موندن و تلاش، جایگاهتون در مجموعه حتماً تضمینه.\r\n\r\nنکته‌ی دیگه اینه که جمله‌ای مثل «اگر جای دیگه‌ای بیشتر از اینجا بهت حقوق می‌دن، می‌تونی بری» بارها از مدیریت شنیده می‌شه. وقتی چنین حرفی حتی درباره نیروهایی مطرح می‌شه که سال‌های زیادی برای مجموعه کار کردند، این برداشت ایجاد می‌شه که سابقه، تجربه و زحمات چندین‌ساله‌ی یک نیرو لزوماً ارزش یا جایگاه بیشتری برای اون فرد ایجاد نمی‌کنه. این موضوع می‌تونه این حس رو به وجود بیاره که موندن یا رفتن یک نیروی قدیمی تفاوت چندانی برای مجموعه نداره و تلاش و سابقه‌ی افراد آن‌طور که انتظار می‌ره دیده و قدردانی نمی‌شه."
