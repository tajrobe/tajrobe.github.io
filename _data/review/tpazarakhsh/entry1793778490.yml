description: "یکی از بدترین تجربه‌های کاری من بود. کمتر از یه سال تو این شرکت کار کردم، ولی همون چند ماه کافی بود که بفهمم چه خبره.\r\n\r\nبی‌نظمی تو این شرکت بیداد می‌کرد. حقوق‌ها نامنظم، تقسیم کار افتضاح، هیچ‌کس وظیفه خودش رو نمی‌دونست. همه تو کار هم دخالت می‌کردن، همه ادعای همه‌چی‌دونی داشتن، ولی وقتی پای مسئولیت وسط می‌اومد، هیچ‌کس نبود. خلاصه همه همه‌کاره بودن و هیچ‌کاره!\r\n\r\nمن رفتم اونجا که یه چیزی یاد بگیرم و به تجربه کاریم اضافه بشه، ولی چیزی که بیشتر از همه یاد گرفتم این بود که چطوری زیرآب همدیگه رو می‌زنن، چطوری برای هم حاشیه درست می‌کنن و چطوری اشتباهات خودشون رو می‌ندازن گردن بقیه. واقعاً از نظر یادگیری و پیشرفت، چیز خاصی برای ارائه نداشتن.\r\n\r\nپرستیژ کاری شرکت هم که دیگه نگم! اصلاً حس نمی‌کردی تو یه محیط کاری هستی. بیشتر شبیه یه جمع فامیلی پر از خاله‌زنک‌بازی و حرف پشت سر این و اون بود. به‌جای اینکه سرشون به کار خودشون باشه، بیشتر دنبال این بودن که ببینن کی چی گفته، کی با کی خوبه، کی با کی بده و چطوری یکی رو پیش بقیه خراب کنن.\r\n\r\nاز نظر من ۹۹ درصد این وضع برمی‌گشت به مدیریت به‌شدت ضعیف شرکت. مدیریتی که نه بلد بود درست کار تقسیم کنه، نه می‌تونست بین کارمنداش حد و مرز بذاره، نه جلوی حاشیه‌ها رو می‌گرفت. اتفاقاً بعضی وقتا خودش هم به این داستان‌ها دامن می‌زد. وقتی خود مدیریت نتونه یه محیط رو جمع کنه، دیگه از بقیه چه انتظاری می‌شه داشت؟\r\n\r\nیه چیز دیگه که واقعاً رو مخم بود، رفتار بعضی از کارمندا با نیروی جدید بود. یه عده انگار فکر می‌کردن چون تازه اومدی، حق دارن هرجوری دلشون خواست باهات برخورد کنن، تو کارت دخالت کنن، دستور بدن و خودشون رو بالاتر از تو بدونن. جالب اینجا بود که این اجازه عملاً بهشون داده شده بود. هیچ‌کس هم نبود بگه هرکسی حد خودش رو بدونه. انگار احترام گذاشتن و درست رفتار کردن تو اون مجموعه یه چیز اضافی بود.\r\n\r\nبدتر از همه اینکه اگه آدم اهل زیرآب‌زنی و باندبازی نبود و فقط می‌خواست سرش به کار خودش باشه، باید مدام مراقب می‌بود وارد چه حاشیه‌ای می‌شه. واقعاً مسخره‌ست که آدم بره سر کار که پول دربیاره و چیزی یاد بگیره، ولی آخرش بیشتر وقت و اعصابش صرف یه مشت داستان بچگانه بشه.\r\n\r\nتو مدتی که اونجا بودم، چیزی که من دیدم این بود که بعضیا بیشتر از اینکه دنبال درست انجام دادن کارشون باشن، دنبال این بودن که خودشون رو به مدیریت نزدیک کنن یا بقیه رو خراب کنن. این وسط هم کسی که واقعاً می‌خواست کار کنه و تجربه به دست بیاره، عملاً چیزی گیرش نمی‌اومد جز اعصاب‌خردی.\r\n\r\nمن قبلاً هم محیط کاری دیده بودم، ولی این حجم از بی‌نظمی و رفتارهای غیرحرفه‌ای واقعاً برام عجیب بود. یه شرکت حداقل باید یه چارچوبی داشته باشه، یه مدیریتی داشته باشه که بشه روش حساب کرد، یه حد و مرزی بین آدما باشه. اینجا از نظر من هیچ‌کدوم درست‌وحسابی وجود نداشت.\r\n\r\n**در کل اگه دنبال جایی هستین که چیزی یاد بگیرین، پیشرفت کنین و تو یه محیط درست کار کنین، من با تجربه‌ای که داشتم اصلاً این شرکت رو پیشنهاد نمی‌کنم.** مخصوصاً اگه اول راهین و می‌خواین تجربه کسب کنین، به‌نظرم وقتتون رو یه جای بهتر بذارین.\r\n\r\nمن از اونجا نه با تجربه کاری خاصی اومدم بیرون، نه با یه خاطره خوب. تنها چیزی که برام موند این بود که فهمیدم چه محیط‌هایی ارزش وقت و انرژی آدم رو ندارن.\r\n\r\nآخرش هم اینو بگم که مشکل اصلی از نظر من خود مدیریت بود. وقتی مدیریت ضعیفه، هرکسی واسه خودش یه رئیس می‌شه، هیچ‌کس حدش رو نمی‌دونه و شرکت به‌جای اینکه محل کار باشه، می‌شه محل حاشیه و زیرآب‌زنی. دقیقاً چیزی که من تو این مجموعه دیدم."
