description: "سلام دوستان، در حال حاضر بیشتر از یکسال هست که اینجا مشغولم، متاسفانه نمیتونم بگم کدوم قسمت، و تجربه این مدت رو خدمتتون میگم. این رو هم بگم خودم دنبال اینم که بتونم بیام بیرون و دنبال کار جدیدم.\r\nبزارید خیالتون رو راحت کنم، محیط ازین سمی تر و خاله زنک تر قابل تصور نیست، مدیریت ذهنیتش کلا اینه که نیرو هارو باید جایگزین کرد و هیچ ارزشی قائل نیست برای نفرات، شما فقط کافیه اشتباه بکنید تا کلا مرخصتون کنن، رفت و آمد نیرو ها به شدت توی شرکت بالاست یعنی تقریبا هر ماه ما نفراتی رو داریم که اخراج میشن و ماه بعد جاشون دوباره نیرو میاد، و این نشان دهنده مدیریت فاجعه وار شرکته، رسما هیچ مدیریتی وجود نداره.\r\nاین رو راحت از آگهی های استخدام شرکت میتونید بفهمید که هر یک ماه یا دوماه یکبار تکرار میشن.\r\nفضا کاملا طوریه که انگار همه مشغول زیرآب زدنن، دنبال اینن که بتونن با خودشیرینی ارتقا بگیرن، اولش برای خودم باورش سخت بود و اما متاسفانه واقعیت داره.\r\nچیزی که واقعا زجر دهنده هست اینه که فکر میکنن انسان ها رباتن، حجم زیاد کار رو به شما میدن، توقع دارن که این کار رو به نحو احسن انجام بدید و در صورتی که در کار اشتباهی صورت بگیره یا نتونید به ددلاین برسونید کاررو، شدیدا بازخواستتون میکنن، و هیچ بازخوردی هم به شما نمیدن که اشتباهتون کجا بوده، تا زمانی که اخراجتون کنن، چون اصن براشون نگهداشتن نیرو مهم نیست.\r\nبیمه وزارت کار رد میشه، اسمش اینه که شما اگر مدتی در شرکت بمونید بهتون سهام تشویقی میدن، اما در اکثر موارد نزدیک موعد دادن سهام که میشه، شخص رو با بهانه های واهی اخراج میکنن. \r\nقراردادی با پرسنل امضا نمیشه، فقط 6 ماه یکبار قرارداد بسته میشه، تا بتونن نیرو هایی که تازه اومدن رو راحت اخراج کنن.\r\nهمین الان واسه چندین تا پوزیشن دارن جذب میکنن، که ماه پیش نیرویی که در اون پوزیشن بود رو اخراج کردن.\r\nبه امید روزی که اینجور شرکت ها بفهمن که سرمایه انسانی، یه چیز بی ارزش نیست که اینطوری باهاش برخورد میکنن، و این برخورد هم بهای سنگینی داره. \r\n\r\nدر کل اگر میخواید واقعا به لحاظ ذهنی تا مرز فروپاشی تحت فشار قرار بگیرید، بابت هر موضوعی تحقیر بشید، بهتون پیشنهاد میکنم که واسه این مجموعه حتما رزومه بفرستید :)\r\n"
