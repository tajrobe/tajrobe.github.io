description: "در وطن زرین در ابتدا وعده‌ها و تصویر مثبتی از محیط کار ارائه می‌شود که متأسفانه همیشه با واقعیت در ادامه کار مطابقت ندارد.\r\n\r\nدر طول همکاری، مواردی از تحقیر و بی‌احترامی گرفته تا پشت سر کارکنان صحبت کردن و شایعه‌پراکنی دیده می‌شود. این مسائل فقط در سطح کارکنان نیست و در نحوه مدیریت و رهبری نیز مشکلات جدی وجود دارد.\r\n\r\nدر مدیریت، گاهی اعتمادبه‌نفس کافی برای تصمیم‌گیری مستقل و ظرفیت پذیرش انتقاد دیده نمی‌شود. همچنین این احساس وجود دارد که تأیید و حمایت برخی افراد، به‌خصوص در روابط داخلی و در میان برخی از اعضای روابط عمومی، بیش از حد اهمیت پیدا می‌کند.\r\n\r\nبخش روابط عمومی در بسیاری از مواقع به جای اینکه یک بخش حرفه‌ای و سازنده باشد، به محل ایجاد حاشیه و انتشار شایعات تبدیل شده است. برخی از کارکنان این بخش در انتشار شایعات و ایجاد حاشیه نقش دارند و به نظرم بهتر است آقای وطن‌دوست شناخت دقیق‌تری از عملکرد و رفتار این افراد داشته باشند و به گزارش مدیران و مسئولان بدون بررسی مستقل اعتماد نکنند.\r\nبه افرادی که انگیزه، انرژی، اعتمادبه‌نفس و روحیه پیشرفت دارند توصیه می‌کنم پیش از پیوستن به این شرکت، فرهنگ سازمانی و نحوه برخورد مدیریت با کارکنان را با دقت بررسی کنند.\r\nاین مجموعه برای من به محیطی بسیار فرسایشی و ناسالم تبدیل شد و به نظرم برای ایجاد یک محیط کاری سالم، نیاز به تغییرات جدی در فرهنگ سازمانی، مدیریت و نحوه برخورد با کارکنان دارد"
