description: "کاش همه نظر واقعیشونو بدون غرض ورزی بزارن تا این محیط قابل استفاده باشه، صرفا کسایی که از شرکت ها اخراج میشن یا بهشون برمیخوره که شرکته ادامه همکاری نداده باهاشون میان کامنت میزارن خب طبیعیه اکثر افرادی که راضیه ن معمولا وقت نمیزارن بیان مطلبی بنویسن. من شرکت های مختلفی بودم واسه همشونم این صفحه رو چک کردم و بدترین چیزارو نوشتن اما به توصیه دوستانم که گفتن اینا داستانشون چیه رفتم  و همه چی عکس مطالبی بود که نوشته بودن، خدایی درست نیست اینکاراتون یکی واقعا به کار نیاز داره این چیزا ممکنه باعث تصمیم اشتباهش بشه و ماه ها و سال ها بیکار بمونه!\r\nوب وان واقعا در زمان من و حتی در گذشته طبق گفته بچه های خیلی قدیمی تر تاحالا حقوق ها رو عقب ننداخته  و نه مشکل خاصی داشته تست این چیزا هم کاری نداره هرجا بری دوره ازمایشی داره از پرسنل قدیمی بپرسید و اگر اون شرکت هم پرسنل قدیمی نداره ینی مشکل داره. \r\n"
