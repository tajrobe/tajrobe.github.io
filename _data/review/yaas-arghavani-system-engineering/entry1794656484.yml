description: "تجربه من از فرایند استخدام در این مجموعه اصلاً رضایت‌بخش نبود. مصاحبه کاملاً حضوری برگزار می‌شود و علاوه بر آن، برای شرکت در تست‌های هوش و شخصیت‌شناسی باید از طریق پنل مربوطه هزینه پرداخت کنید؛ آن هم در شرایطی که هنوز مشخص نیست اصلاً در فرایند استخدام پذیرفته می‌شوید یا خیر، حقوق و مزایا چقدر است و آیا پیشنهاد شغلی مشخصی در انتظار شماست یا نه! \r\n\r\nسؤال اصلی اینجاست: چرا باید هزینه ارزیابی نیروی انسانی که بخشی از فرایند استخدام شرکت است، از جیب کارجو پرداخت شود؟ \r\n\r\nاگر سازمانی برای استخدام نیرو به تست‌های هوش و شخصیت‌شناسی نیاز دارد، منطقی است که خودش هزینه این خدمات و پنل مربوطه را تأمین کند و لینک آزمون را در اختیار متقاضی قرار دهد؛ نه اینکه کارجو را مجبور کند پیش از مشخص شدن نتیجه استخدام، برای شرکت در آزمون پول پرداخت کند. \r\n\r\nاز طرف دیگر، وقتی هنوز درباره حقوق، شرایط همکاری و حتی نتیجه مصاحبه شفافیتی وجود ندارد، دریافت هزینه از متقاضی چه توجیهی دارد؟ کارجو برای پیدا کردن شغل مراجعه کرده، نه اینکه برای شرکت در مراحل نامشخص استخدام، هزینه‌های جداگانه بپردازد. \r\n\r\nاین شیوه دست‌کم این شائبه را ایجاد می‌کند که فرایند استخدام به فرصتی برای کسب درآمد از متقاضیان تبدیل شده است. برای مثال، اگر روزانه چندین نفر برای مصاحبه مراجعه کنند و هرکدام مبلغی بابت آزمون بپردازند، درآمد قابل‌توجهی ایجاد می‌شود؛ بدون اینکه لزوماً استخدامی صورت گرفته باشد. \r\n\r\nارزیابی متقاضی برای استخدام، مسئولیت سازمان استخدام‌کننده است و هزینه آن نباید بدون شفافیت و توجیه مشخص به کارجو تحمیل شود. اگر این آزمون‌ها برای سازمان ضروری هستند، هزینه‌شان را خود سازمان پرداخت کند. \r\n\r\nتوصیه می‌کنم پیش از ورود به چنین فرایندی، درباره هزینه آزمون‌ها، علت دریافت وجه و شرایط استخدام سؤال کنید و با آگاهی کامل تصمیم بگیرید. فرایند استخدام باید شفاف، حرفه‌ای و محترمانه باشد؛ نه اینکه کارجو در کنار صرف وقت و هزینه رفت‌وآمد، مجبور به پرداخت هزینه‌های اضافی برای آزمون‌هایی شود که نتیجه آن‌ها و تأثیرشان بر استخدام مشخص نیست.\r\n\r\n"
