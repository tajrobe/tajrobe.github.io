description: "تجربه کاری من در زفتا، حداقل در بخشی که با آن درگیر بودم، در مجموع تجربه مثبتی نبود.\r\n\r\nبزرگ‌ ترین مشکل از نظر من، عملکرد واحد منابع انسانی است. متاسفانه فرایندهایی مثل جمع‌ بندی اضافه‌ کاری، مرخصی و موارد مرتبط با پرسنل که قاعدتا باید جزو ساده‌ ترین و روتین‌ ترین وظایف منابع انسانی باشند، تقریبا هر ماه با یک مسئله و حاشیه جدید همراه هستند. پیگیری و اعتراض هم معمولا به جای اینکه منجر به اصلاح فرایند شود، با برخورد طلبکارانه‌ ای مثل «ما که کسی را به زور نگه نداشتیم» مواجه می‌ شود.\r\n\r\nاز طرف دیگر، فضای حاکم بر منابع انسانی را چندان سالم و حرفه‌ ای ندیدم و متاسفانه حاشیه، زیرآب‌ زنی و بعضا رفتارهای سمی در محیط کاری به چشم می‌خورد. چیزی که بیشتر از خود مشکلات آزاردهنده است، این است که احساس می‌شود اراده جدی برای اصلاح این شرایط وجود ندارد.\r\n\r\nدر مورد بخش فنی و همکاران قطعا نکات مثبت هم وجود دارد، اما از نظر فرهنگ سازمانی و نحوه مدیریت منابع انسانی، تجربه من به اندازه‌ ای منفی بود که در نهایت امیدی به بهتر شدن شرایط نداشتم و تصمیم گرفتم از مجموعه جدا شوم.\r\n\r\nاگر قرار است نیروی متخصص در مجموعه حفظ شود، صرفا با حقوق و عنوان شغلی نمی‌ توان این کار را انجام داد؛ محیط کاری سالم، فرایندهای درست منابع انسانی و احترام به نیروی انسانی هم به همان اندازه اهمیت دارند."
