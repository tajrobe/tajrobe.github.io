description: "چند سال توی مجموعه زفتا بودم و هدفم آگاهی رسانی بیشتر برای انتخاب هست و نه تخریب یا تمجید؛ دوست داشتم به انتخاب افراد جدید الورود کمک کرده باشم:\r\n\r\n- شرکت در کل برای بانک تجارته و فرهنگ و پالیسی رو از بانک میگیره ولی در قالب شرکت خصوص هست دیگه.\r\n- حقوق و مزایا توی فیلدی که من بودم و انگار در کل با نرم بازار قابل رقابته ولی مزایای بانک رو نداره دیگه؛ پرداختی ها هم تا الان سر وقت بود.\r\n- تیم های فنی عملا توی بانک و فناوری اطلاعات مستقر هستن و مهمونن، رابطه کارگر و کارفرما کاملا مشهوده و اذیت کننده؛ این موضوع رو دیدم همه ازش ناراحتن.\r\n- محیط فیزیکی تیمی که من بودم داغون بود، تهویه بد و دستشویی و محیط فیزیکی و نظافت در حد ترمینال جنوب.\r\n- موضوعات سیاسی و ارتباطات سیاسی که گاها اصلا نمیفهمی چه خبره، توی تیم ها و آدمای بانک هست.\r\n- تیم امنیت که شامل SOC و NOC و ... هست تا این لحظه ذیل یه مدیر بودن، مدیرای تازه کار و میز حفظ کن! \r\n- تیم ما شامل مدیر و کارشناسان به تبع مدیریت بی سواد بانک، فضای سمی داشت و توی هیچ موضوعی کسی ورود نمیکرد که مشکلات رو حل کنه؛ منظور ورود مدیران بانک یا زفتا توی مشکلات فنی و ستادی تیم."
