description: "روز چهارشنبه ۲۸ مرداد فرصتی داشتم تا در فرآیند مصاحبه زرین پخش ‌شرکت کنم.\r\nخواستم این بار برخلاف بسیاری از تجربه‌هایی که معمولاً در پلتفرم‌ها درباره فرآیندهای استخدامی به‌صورت انتقادی مطرح می‌شوند از یک تجربه مثبت و حرفه‌ای قدردانی کنم.\r\nاز برخورد حرفه‌ای و اجرای باکیفیت فرآیند مصاحبه توسط مدیر منابع انسانی سرکار خانم گلشنی و مدیر جذب استعداد ها جناب آقای فاتح تشکر می‌کنم.\r\nبا توجه به اینکه حوزه تخصصی من جذب و استخدام است طبیعتاً نسبت به نحوه اجرای فرآیندهای جذب حساسیت و دقت بیشتری دارم. از مرحله دعوت و هماهنگی مصاحبه تا نحوه برخورد در زمان ورود، شروع مناسب جلسه، فضای گفت‌وگو و در نهایت ارزیابی تخصصی و شایستگی‌ها، بصورت ‌حرفه‌ای صورت گرفت.\r\nبرای من نگاه توسعه‌محور و حمایت‌گرایانه مدیریت منابع انسانی و توجه به کیفیت فرآیند جذب، ارزشمند بود.\r\nفارغ از نتیجه این مصاحبه معتقدم تجربه‌های حرفه‌ای شایسته دیده‌شدن و قدردانی هستند و خوشحال شدم این تجربه مثبت را ثبت کنم"
