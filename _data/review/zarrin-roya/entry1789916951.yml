description: "زرین پخش در بعضی دپارتمان ها مدیران بیسوادی داره که ریشه دوانده‌اند . مخالف سواد هستند و صرفا با رابطه‌ای که با کارفرما دارن اونجا موندگار شدن و باندبازی راه انداخته‌اند. شایسته سالاری وجود نداره و احتمال موفقیت و پیشرفت صرفا برای ادمهایی که از نظر کاری پایین هستند و به حاشیه ها دامن میزنند و فساد اخلاقی دارن بیشتره. حداقل تو واحدی که من بودم عینا همین بود.اما در کل به خاطر درایتی که آقای میزبان داره شرایط جنرال حقوق و مزایا خوبه"
