description: "برای مصاحبه در شرکت زرین پخش با من تماس گرفتند و صحبت کردند.ابتدای مکالمه با توجه به سمت شغلی ایشان که مدیر استخدام معرفی کردند خودشان را،خیلی برای من عجیب بود که گویا آداب مکالمه و مصاحبه تلفنی رو رعایت نمیکردند. \r\nاما بااین حال برای اینکه قضاوت زودهنگام نداشته باشم مصاحبه حضوری را شرکت کردم تا اطلاعات بیشتری برای تصمیم گیری داشته باشم.\r\nو ای کاش شرکت نمیکردم. توهین به خودم و سابقه ام بود\r\nدر طول جلسه هیچ سوال و رفتاری حرفه ای نبود \r\nمدیر واحدی که با من مصاحبه می کردند نه علم مصاحبه داشتند نه حتی  یک معاشرت حرفه ای بین ما اتفاق افتاد \r\nدر اواسط جلسه مصاحبه کاملا مطمئن شدم که انتخاب اینجا برای من اشتباه هست \r\nو در پذیرش من نبود که ایشان را به عنوان مدیر آینده خودم بپذیرم \r\nعلم \r\nرفتار \r\nمدیریت جلسه \r\nسوالات درست \r\nبیان انتظارات و شرح آنچه توقع هست\r\nهیچکدام اصولی نداشت \r\nحتی سوال های بنده را هم جواب های سرسری می دادند  \r\nفقط با لبخند های ظاهری سعی می کردند تظاهر کنند که خیلی فرد راحت و پایه ای هستند و شرکت شان مدینه فاضله هست اما کاملا مشخص بود این رفتارها الگوبرداری شده از شنیده هاشون هست نه خود واقعی ایشان و تجربه من از صحبت باایشان چه در خصوص شغل و سازمان و چه درباره ارتباط با خودشان بنده رو مطمئن کرد که وقتی سازمانی که تیم مهم انتخاب و استخدام را به ایشان سپرده  حتما استانداردهای پایین و‌ متفاوتی داردو برای من مناسب نیست.\r\nباعث تاسف هست که چنین شرکت هایی که بیس و اساس قوی ای دارند مدیران واحدهاشون خصوصا در واحد مهمی که مباحث استخدام رو مدیریت می کنند بااین سطح در حال فعالیت هستند\r\n"
