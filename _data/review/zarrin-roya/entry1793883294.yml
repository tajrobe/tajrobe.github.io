description: "زرین پخش به جایی که الان رسیده نمیرسید اگه پشتیبانی آقای میزبان رو نداشت \r\nآقایان میزبان بسیار شریف و حرفه ای هستند و کرامت انسانی رو همیشه مدنظر دارند \r\nاما باعث تاسف هست که زرین پخش رو به حال خودشون رها کردند تا بعضی افراد هر کاری و رفتاری که میخوان بکنند \r\nتوی زرین پخش همه چی با زرین رویا متفاوته و از زیر مجموعه زرین رویا بودن فقط جایی که به نفعشون هست رو استفاده می کنند اما جایی که به نفع کارمندها باشه رو حذف میکنند \r\nهمه چی تیم بازیه توی زرین پخش یا باید پاچه خواری کنی و برده باشی که رشد کنی و دووم بیاری یا اگه بخوای سالم و استاندارد کار و رفتار کنی کاری میکنن که پشیمون شی از انتخابت\r\nتوی بعضی واحدها مدیرها به حدی بیسوادن که خنده تون میگیره ادم شک میکنه این افراد دقیقا چطوری اونجا نشستن قطعا با کاربلد بودن و شایسته سالاری نبوده \r\nتوی اینجور شرایط وقتی موضوع و مشکلی باشه منابع انسانی مرجع سالم و درستیه همیشه \r\nاما بقول یه مثلی وای به روزی که بگندد نمک!\r\nمدیرهای بچه و بیسواد و سطح پایین معلومم نیست کی اینا رو گذاشته تو اون سمت ها\r\n فعلا کار دارن تا خودشونو پیدا کنند چه برسه بخوان کاری برای سازمان کنند فقط شعار و بچه بازی و تظاهر! \r\nکاش همه واحدها رو مدیر فروش هاشون اداره میکردن ادم های سالم و خوب و حرفه ای و سطح بالا\r\nحداقل سواد و تجربه دارن و انسانیت سرشون میشه"
